name: Physio Knee OA template design gate

on:
  push:
    branches:
      - design/physio-referral-knee-oa-template-v1-2026-09-11
  pull_request:
    paths:
      - 'clinic_utilities/physio_referral_product/KNEE_OA_TEMPLATE_DESIGN_V1.md'
      - 'clinic_utilities/physio_referral_product/contracts/knee_oa_template_contract_v1.yaml'
      - 'clinic_utilities/physio_referral_product/contracts/knee_oa_template_fixtures_v1.yaml'
      - 'clinic_utilities/physio_referral_product/validate_knee_oa_template_contract_v1.py'
      - '.github/workflows/physio-knee-oa-template-design.yml'

jobs:
  validate-template-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependency
        run: python -m pip install 'PyYAML>=6.0'
      - name: Validate Knee-OA template contract
        run: python clinic_utilities/physio_referral_product/validate_knee_oa_template_contract_v1.py
