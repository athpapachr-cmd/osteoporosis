name: Clinical Learning L0 canonical closeout

on:
  push:
    branches:
      - design/clinical-learning-l0-contract-freeze-2026-09-07

permissions:
  contents: write

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/clinical-learning-l0-contract-freeze-2026-09-07
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply L0 canonical closeout
        run: python scripts/clinical_learning_l0_closeout.py
      - name: Validate closeout diff
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only
      - name: Commit canonical closeout
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SLICE_PLAN_CURRENT.md CURRENT_OPERATIONAL.md TODO.md osteoporosis-change-log.md
          git diff --cached --check
          git commit -m 'Close Clinical Learning L0 canonicals after independent review'
          git push origin HEAD:design/clinical-learning-l0-contract-freeze-2026-09-07
