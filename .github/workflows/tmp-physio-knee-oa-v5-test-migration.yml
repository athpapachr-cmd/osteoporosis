name: Temporary Knee OA v5 test migration

on:
  push:
    branches:
      - fix/physio-knee-oa-v5-optional-refinement-prose-2026-09-12
    paths:
      - '.github/workflows/tmp-physio-knee-oa-v5-test-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/physio-knee-oa-v5-optional-refinement-prose-2026-09-12
      - name: Update inherited test paths only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          def rep(path, old, new):
              p=Path(path); text=p.read_text(encoding='utf-8'); n=text.count(old)
              assert n==1, f'{path}: {n} matches for {old[:80]!r}'
              p.write_text(text.replace(old,new,1), encoding='utf-8')

          rep('clinic_utilities/physio_referral_product/prototype/test_browser.py',
              "    def clinical(self,kind):\n        self.page.locator(f'[data-clinical-v4={kind}]').click();expect(self.page.locator('#sheet')).to_be_visible()\n        return self.page.locator('#sheet')",
              "    def clinical(self,kind):\n        control=self.page.locator(f'[data-clinical-v4={kind}]')\n        if kind in {'pain','stiffness','weakness'} and control.get_attribute('aria-pressed')!='true':\n            control.click();expect(control).to_have_attribute('aria-pressed','true')\n            self.assertFalse(self.page.locator('#sheet').evaluate('el=>el.open'))\n        control.click();expect(self.page.locator('#sheet')).to_be_visible()\n        return self.page.locator('#sheet')")

          q='clinic_utilities/physio_referral_product/prototype/test_browser_qualifiers.py'
          rep(q,
              "    def open_clinical(self, kind):\n        self.page.locator(f'[data-clinical-v4={kind}]').click()\n        expect(self.page.locator('#sheet')).to_be_visible()\n        expect(self.page.locator('#sheetTitle')).to_have_text({'pain':'Πόνος','stiffness':'Δυσκαμψία','weakness':'Αδυναμία','function':'Λειτουργικότητα'}[kind])",
              "    def open_clinical(self, kind):\n        control=self.page.locator(f'[data-clinical-v4={kind}]')\n        if kind in {'pain','stiffness','weakness'} and control.get_attribute('aria-pressed')!='true':\n            control.click(); expect(control).to_have_attribute('aria-pressed','true')\n            self.assertFalse(self.page.locator('#sheet').evaluate('el=>el.open'))\n        control.click()\n        expect(self.page.locator('#sheet')).to_be_visible()\n        expect(self.page.locator('#sheetTitle')).to_have_text({'pain':'Πόνος','stiffness':'Δυσκαμψία','weakness':'Αδυναμία','function':'Λειτουργικότητα'}[kind])")
          rep(q,
              "        quad=self.page.locator('#sheet [data-q-weakness=quadriceps_exam]')\n        expect(quad).to_have_text('Τετρακέφαλος στην εξέταση'); quad.click()\n        self.page.locator('#sheet [data-q-atrophy]').click()\n        expect(self.page.locator('#v4AtrophyLocation')).to_be_visible()\n        self.page.locator('#sheet [data-q-atrophy-location=quadriceps]').click()",
              "        quad=self.page.locator('#sheet [data-q-weakness=quadriceps_exam]')\n        expect(quad).to_have_text('Αδυναμία τετρακεφάλου στην εξέταση'); quad.click()\n        self.page.locator('#sheet [data-v4-atrophy-quadriceps]').click()")

          m='clinic_utilities/physio_referral_product/prototype/test_browser_more_v3.py'
          rep(m,
              "        # v4 activates the reported weakness parent through its compact clinical\n        # sheet. Merely opening/closing that sheet must not invent an objective\n        # examination finding, preserving the original More-v3 invariant.\n        self.page.locator('[data-clinical-v4=weakness]').click()\n        expect(self.page.locator('#sheetTitle')).to_have_text('Αδυναμία')\n        self.assertEqual(self.page.locator('#sheet [data-q-weakness][aria-pressed=true]').count(),0)\n        self.page.locator('#closeSheet').click()",
              "        # v5 first selects generic reported weakness without forcing refinement.\n        # Merely activating that parent must not invent an examination finding.\n        self.page.locator('[data-clinical-v4=weakness]').click()\n        expect(self.page.locator('[data-clinical-v4=weakness]')).to_have_attribute('aria-pressed','true')\n        self.assertFalse(self.page.locator('#sheet').evaluate('el=>el.open'))")
          PY
          python -m py_compile clinic_utilities/physio_referral_product/prototype/test_browser.py clinic_utilities/physio_referral_product/prototype/test_browser_qualifiers.py clinic_utilities/physio_referral_product/prototype/test_browser_more_v3.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add clinic_utilities/physio_referral_product/prototype/test_browser.py clinic_utilities/physio_referral_product/prototype/test_browser_qualifiers.py clinic_utilities/physio_referral_product/prototype/test_browser_more_v3.py
          git commit -m 'Migrate inherited browser tests to optional v5 refinement'
          git push origin HEAD:fix/physio-knee-oa-v5-optional-refinement-prose-2026-09-12
