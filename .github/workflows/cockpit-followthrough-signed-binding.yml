name: Follow-through signed Pending binding (synthetic)

on:
  push:
    paths:
      - "clinical_followthrough_signed_pending_synthetic.py"
      - "test_clinical_followthrough_signed_pending_synthetic.py"
      - "test_clinical_followthrough_postgres.py"
      - "test_clinical_followthrough_pg_binding.py"
      - ".github/workflows/cockpit-followthrough-signed-binding.yml"
  pull_request:
    paths:
      - "clinical_followthrough_signed_pending_synthetic.py"
      - "test_clinical_followthrough_signed_pending_synthetic.py"
      - "test_clinical_followthrough_postgres.py"
      - "test_clinical_followthrough_pg_binding.py"
      - ".github/workflows/cockpit-followthrough-signed-binding.yml"

permissions:
  contents: read

jobs:
  qualified-signed-pending:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install isolated clinical-model dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Compile exact bridge and fixture
        run: python -m py_compile clinical_followthrough_signed_pending_synthetic.py test_clinical_followthrough_signed_pending_synthetic.py
      - name: Signed clinical Pending and no-chart synthetic proof
        run: pytest -q test_clinical_followthrough_signed_pending_synthetic.py test_clinical_followthrough_durable_synthetic.py
      - name: Enforce OFF-production and no real identifiers
        run: |
          python - <<'PY'
          from pathlib import Path
          code = Path("clinical_followthrough_signed_pending_synthetic.py").read_text()
          app = Path("main.py").read_text()
          assert "clinical_followthrough_signed_pending_synthetic" not in app
          assert "clinical_followthrough_durable_synthetic" not in app
          assert "clinical_followthrough_signed_pending_synthetic" not in Path("clinical_synthetic_161.py").read_text()
          assert "create_all(" not in code
          import re
          for forbidden in ("imaplib", "httpx.", "requests.", "send_sms", "send_email",
                            "DATABASE_URL", "ICLOUD_CLINICAL_APP_PASSWORD"):
              assert forbidden not in code, forbidden
          # SELECT ... FOR UPDATE is a row-locking READ, not a SQL UPDATE.
          # Match actual SQL write constructors rather than a substring of
          # with_for_update(), otherwise the safety gate false-positives.
          assert not re.search(r"\b(?:insert|update|delete)\s*\(", code)
          assert "db.add(" not in code
          assert "db.commit(" not in code
          assert "pending_ids" in code and "synthetic_scenario" in code
          PY
      - name: Diff hygiene
        run: git diff --check HEAD^ HEAD


  durable-postgres17:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: synthetic_followthrough_ci
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d synthetic_followthrough_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      FOLLOWTHROUGH_PG_SYNTHETIC: "ci-postgres17"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install disposable PostgreSQL-only dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Syntax
        run: python -m py_compile test_clinical_followthrough_postgres.py test_clinical_followthrough_pg_binding.py clinical_followthrough_durable_synthetic.py clinical_followthrough_signed_pending_synthetic.py
      - name: Real PostgreSQL 17 transaction concurrency and source-ownership tests
        run: pytest -q test_clinical_followthrough_postgres.py test_clinical_followthrough_pg_binding.py
      - name: Production OFF and localhost-only contract
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("test_clinical_followthrough_postgres.py").read_text()
          actual = Path("main.py").read_text()
          assert "127.0.0.1:5432/synthetic_followthrough_ci" in source
          assert "FOLLOWTHROUGH_PG_SYNTHETIC" in source
          assert "clinical_followthrough_durable_synthetic" not in actual
          assert "clinical_followthrough_signed_pending_synthetic" not in actual
          assert "DATABASE_URL" not in source
          PY
      - name: Diff hygiene
        run: git diff --check HEAD^ HEAD
