name: Follow-through signed Pending binding (synthetic)

on:
  push:
    paths:
      - "clinical_followthrough_signed_pending_synthetic.py"
      - "test_clinical_followthrough_signed_pending_synthetic.py"
      - ".github/workflows/cockpit-followthrough-signed-binding.yml"
  pull_request:
    paths:
      - "clinical_followthrough_signed_pending_synthetic.py"
      - "test_clinical_followthrough_signed_pending_synthetic.py"
      - ".github/workflows/cockpit-followthrough-signed-binding.yml"

permissions:
  contents: read

jobs:
  qualified-signed-pending:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install isolated clinical-model dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Compile exact bridge and fixture
        run: python -m py_compile clinical_followthrough_signed_pending_synthetic.py test_clinical_followthrough_signed_pending_synthetic.py
      - name: Signed clinical Pending and no-chart synthetic proof
        run: pytest -q test_clinical_followthrough_signed_pending_synthetic.py test_clinical_followthrough_durable_synthetic.py
      - name: Enforce OFF-production and no real identifiers
        run: |
          python - <<'PY'
          from pathlib import Path
          code = Path("clinical_followthrough_signed_pending_synthetic.py").read_text()
          app = Path("main.py").read_text()
          assert "clinical_followthrough_signed_pending_synthetic" not in app
          assert "clinical_followthrough_durable_synthetic" not in app
          assert "clinical_followthrough_signed_pending_synthetic" not in Path("clinical_synthetic_161.py").read_text()
          assert "create_all(" not in code
          for forbidden in ("imaplib", "httpx.", "requests.", "send_sms", "send_email",
                            "DATABASE_URL", "ICLOUD_CLINICAL_APP_PASSWORD", "insert(", "update("):
              assert forbidden not in code, forbidden
          assert "pending_ids" in code and "synthetic_scenario" in code
          PY
      - name: Diff hygiene
        run: git diff --check HEAD^ HEAD
