name: RF v2 review hardening patch

on:
  push:
    branches:
      - feat/clinic-utilities-rf-v2-native-2026-09-05

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/clinic-utilities-rf-v2-native-2026-09-05
          fetch-depth: 0

      - name: Apply review hardening
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          api_path = Path('clinic_utilities/rf/api.py')
          api = api_path.read_text(encoding='utf-8')
          old = '    parsed = parse_medications(draft.full_medication_text)\n    nsaid = [x.model_dump() for x in draft.nsaid_trials]\n    other = [x.model_dump() for x in draft.other_analgesic_trials]\n    return (nsaid or parsed["auto_selected_nsaids"])[:3], (other or parsed["auto_selected_others"])[:3]\n'
          new = '    parsed = parse_medications(draft.full_medication_text)\n    nsaid = ([x.model_dump() for x in draft.nsaid_trials] or parsed["auto_selected_nsaids"])[:3]\n    other = ([x.model_dump() for x in draft.other_analgesic_trials] or parsed["auto_selected_others"])[:3]\n    if len(nsaid) != 3 or len(other) != 3:\n        raise HTTPException(\n            status_code=422,\n            detail="Το A.1 απαιτεί 3 ΜΣΑΦ και 3 άλλα αναλγητικά με τεκμηριωμένη αγωγή.",\n        )\n    return nsaid, other\n'
          if old not in api:
              raise SystemExit('api medication anchor not found')
          api_path.write_text(api.replace(old, new, 1), encoding='utf-8')

          persistence_path = Path('clinic_utilities/rf/persistence.py')
          persistence = persistence_path.read_text(encoding='utf-8')
          start = persistence.index('def record_application(engine: Engine, data: dict[str, Any]) -> str:')
          end = persistence.index('\ndef list_procedure_history', start)
          replacement = '''def _minimal_application_payload(data: dict[str, Any]) -> dict[str, Any]:
    persisted = dict(data)
    persisted.pop("full_medication_text", None)
    persisted.pop("physio_dates_text", None)
    for key in ("nsaid_trials", "other_analgesic_trials"):
        trials = persisted.get(key)
        if isinstance(trials, list):
            persisted[key] = [
                {item_key: item_value for item_key, item_value in item.items() if item_key != "source_text"}
                if isinstance(item, dict) else item
                for item in trials
            ]
    return persisted

def record_application(engine: Engine, data: dict[str, Any]) -> str:
    application_id=str(uuid4())
    row=RFApplicationORM(id=application_id,patient_identity_key=normalize_identity(data["identity_number"]),patient_name=str(data["patient_name"]).strip(),gesy_number=str(data["gesy_number"]).strip(),patient_age=int(data["age"]),pathway=str(data["pathway"]),indication_code=str(data["indication_code"]),site_key=str(data["site_key"]),laterality=str(data.get("laterality") or "none"),exact_location=str(data["exact_location"]).strip(),product_key=str(data["product_key"]),payload_json=_minimal_application_payload(data),created_at=utcnow())
    with Session(engine) as session:
        session.add(row); session.commit()
    return application_id
'''
          persistence_path.write_text(persistence[:start] + replacement + persistence[end:], encoding='utf-8')

          test_b64 = ''
          Path('test_rf_v2_release_hardening.py').write_bytes(base64.b64decode(test_b64))

          workflow_path = Path('.github/workflows/rf-v2-native-tests.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          workflow = workflow.replace('            test_rf_v2_native.py\n', '            test_rf_v2_native.py \\\n            test_rf_v2_release_hardening.py\n', 1)
          anchor = '      - name: Run native RF v2 UI integrity regression\n'
          if anchor not in workflow:
              raise SystemExit('workflow anchor not found')
          workflow = workflow.replace(anchor, '      - name: Run RF v2 release hardening regressions\n        run: python -m unittest -v test_rf_v2_release_hardening.py\n\n' + anchor, 1)
          workflow_path.write_text(workflow, encoding='utf-8')
          PY

      - name: Commit review corrections
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add clinic_utilities/rf/api.py clinic_utilities/rf/persistence.py test_rf_v2_release_hardening.py .github/workflows/rf-v2-native-tests.yml
          git diff --cached --check
          git commit -m 'Harden RF v2 medication and persistence invariants'
          git push origin HEAD:feat/clinic-utilities-rf-v2-native-2026-09-05
