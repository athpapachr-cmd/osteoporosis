name: CU-1 focused tests

on:
  push:
    branches:
      - feat/cu1-physio-referral-runtime-v1-2026-08-27
      - fix/cu1-greek-human-referral-formatting-2026-08-28
  pull_request:
    paths:
      - 'clinic_utilities/**'
      - 'static/clinic-utilities/**'
      - 'static/baseline-audit/calendar-link.js'
      - 'main.py'
      - 'requirements.txt'
      - 'test_cu1_physio_referral.py'
      - 'test_cu1_formatter_el.py'
      - 'test_cu1_gateway_guard.py'
      - 'test_cu1_gateway_registry.py'
      - 'test_cu1_safety_trust_boundary.py'
      - '.github/workflows/cu1-tests.yml'
  workflow_dispatch:

jobs:
  cu1-focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile CU-1 runtime and tests
        run: python -m py_compile clinic_utilities/physio_referral_runtime.py clinic_utilities/physio_referral_api.py clinic_utilities/physio_referral_formatter_el.py test_cu1_physio_referral.py test_cu1_formatter_el.py test_cu1_gateway_guard.py test_cu1_gateway_registry.py test_cu1_safety_trust_boundary.py main.py
      - name: Run CU-1 focused tests
        run: python -m unittest -v test_cu1_physio_referral.py test_cu1_formatter_el.py test_cu1_gateway_guard.py test_cu1_gateway_registry.py test_cu1_safety_trust_boundary.py
