name: Clinical Learning L1 regression gate

on:
  push:
    branches:
      - feat/clinical-learning-l1-challenge-foundation-mvp-2026-09-07
  pull_request:
    paths:
      - 'clinical_learning/**'
      - 'static/clinical-learning/**'
      - 'main.py'
      - 'test_clinical_learning_l1_*.py'
      - '.github/workflows/clinical-learning-l1-tests.yml'
      - 'SLICE_PLAN_CURRENT.md'
      - 'CURRENT_OPERATIONAL.md'
      - 'TODO.md'
      - 'osteoporosis-change-log.md'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Python syntax
        run: |
          python -m py_compile \
            clinical_learning/__init__.py \
            clinical_learning/models.py \
            clinical_learning/privacy.py \
            clinical_learning/contracts.py \
            clinical_learning/persistence.py \
            clinical_learning/service.py \
            clinical_learning/api.py \
            main.py \
            test_clinical_learning_l1_runtime.py \
            test_clinical_learning_l1_hardening.py \
            test_clinical_learning_l1_ui_contract.py

      - name: Browser JavaScript syntax
        run: node --check static/clinical-learning/app.js

      - name: L1 runtime and hardening tests
        run: python -m unittest discover -v -p 'test_clinical_learning_l1_*.py'

      - name: Inherited L0 contract regression
        run: python -m unittest -v test_clinical_learning_l0_contract.py test_clinical_learning_l0_boundary.py

      - name: Scope and adjacent-owner guard
        run: |
          set -euo pipefail
          base="$(git merge-base origin/main HEAD)"
          changed="$(git diff --name-only "$base" HEAD)"
          printf '%s\n' "$changed"

          if printf '%s\n' "$changed" | grep -E '^(clinic_utilities/physio_referral_|clinic_utilities/contracts/cu1_|static/clinic-utilities/physio-referral/|clinic_utilities/rf/|static/clinic-utilities/rf/)' ; then
            echo 'L1 must not mutate physiotherapy/CU-1/RF owners.' >&2
            exit 1
          fi

          if printf '%s\n' "$changed" | grep -Ev '^(clinical_learning/.*|static/clinical-learning/.*|main\.py|test_clinical_learning_l1_.*\.py|\.github/workflows/clinical-learning-l1-tests\.yml|SLICE_PLAN_CURRENT\.md|CURRENT_OPERATIONAL\.md|TODO\.md|osteoporosis-change-log\.md)$' ; then
            echo 'Unexpected file outside frozen L1 implementation owners.' >&2
            exit 1
          fi

      - name: Diff hygiene
        run: |
          set -euo pipefail
          base="$(git merge-base origin/main HEAD)"
          git diff --check "$base" HEAD
