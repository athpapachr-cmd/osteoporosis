name: Fictional summary provider proof (never merge)
on:
  workflow_dispatch:
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install httpx playwright
      - name: Fictional extract only, no Save
        env:
          CLINICAL_DATA_KEY: ${{ secrets.CLINICAL_DATA_KEY }}
        run: python scripts/fictional_summary_proof.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fictional-summary-proof
          path: |
            fictional-summary-proof.json
            complete-live-chart.png
