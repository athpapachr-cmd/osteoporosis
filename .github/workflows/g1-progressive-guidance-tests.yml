name: Fictional purpose audio proof (never merge)
on:
  workflow_dispatch:
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install httpx
      - name: Synthetic audio draft only, no Save
        env:
          CLINICAL_DATA_KEY: ${{ secrets.CLINICAL_DATA_KEY }}
        run: python scripts/purpose_provider_proof.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: purpose-provider-proof
          path: purpose-provider-proof.json
