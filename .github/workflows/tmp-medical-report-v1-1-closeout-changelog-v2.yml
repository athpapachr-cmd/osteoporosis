name: Temporary Medical Report V1.1 closeout changelog builder v2

on:
  push:
    branches:
      - docs/medical-report-v1-1-production-closeout-2026-09-16

permissions:
  contents: write

jobs:
  append-closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append durable closeout event
        shell: bash
        env:
          ENTRY_B64: 
        run: |
          set -euo pipefail
          git config user.name "athpapachr-cmd"
          git config user.email "athpapachr@gmail.com"
          python -c 'import base64,os; from pathlib import Path; p=Path("osteoporosis-change-log.md"); marker="## 2026-09-16 — Medical Report V1.1 production lifecycle closed"; s=p.read_text(encoding="utf-8"); entry=base64.b64decode(os.environ["ENTRY_B64"]).decode("utf-8"); p.write_text(s if marker in s else s+entry, encoding="utf-8")'
          git diff --quiet osteoporosis-change-log.md && { echo 'Closeout marker already present; nothing to append.'; exit 0; }
          git add osteoporosis-change-log.md
          git commit -m "Record Medical Report V1.1 production closeout"
          git push origin HEAD:docs/medical-report-v1-1-production-closeout-2026-09-16
