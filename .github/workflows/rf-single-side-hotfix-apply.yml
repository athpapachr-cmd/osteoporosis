name: Apply RF unilateral target hotfix

on:
  push:
    branches:
      - fix/rf-single-side-autolocation-2026-09-06

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rf-single-side-autolocation-2026-09-06
          fetch-depth: 0

      - name: Apply bounded source and regression patch
        run: |
          python - <<'PY'
          from pathlib import Path

          # Backend contract: only one unilateral target per application.
          p = Path('clinic_utilities/rf/api.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('    laterality: str = "none"\n', '    laterality: Literal["left", "right"]\n', 1)
          s = s.replace('    laterality: str = Field(default="", max_length=40)\n', '    laterality: Literal["left", "right"]\n', 1)
          s = s.replace(
              '                    "requires_intervention": bool(item.get("requires_intervention")),\n',
              '                    "requires_intervention": bool(item.get("requires_intervention")),\n                    "location_labels": dict(item.get("location_labels") or {}),\n',
              1,
          )
          s = s.replace(
              '            "category": "A",\n',
              '            "category": "A",\n            "application_target_rule": "single_unilateral",\n',
              1,
          )
          s = s.replace(
              '                if draft.laterality not in {"none", prior.get("laterality") or "none"}:\n',
              '                if draft.laterality != prior.get("laterality"):\n',
              1,
          )
          p.write_text(s, encoding='utf-8')

          # Browser: explicit side selection and deterministic location suggestion.
          p = Path('static/clinic-utilities/rf/app.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              "    Object.entries(c.laterality).forEach(([key, label]) => $('lateralitySelect').add(new Option(label, key)));\n    $('lateralitySelect').value = 'none';\n",
              "    const sideSelect = $('lateralitySelect');\n    sideSelect.replaceChildren(new Option('Επιλέξτε…', ''));\n    Object.entries(c.laterality).forEach(([key, label]) => sideSelect.add(new Option(label, key)));\n    sideSelect.value = '';\n",
              1,
          )
          s = s.replace(
              "    state.selectedHistoryId = '';\n    $('historyChoices').replaceChildren();\n    updateSummary();\n  }\n\n  async function parseMedication()",
              "    applySuggestedLocation();\n    state.selectedHistoryId = '';\n    $('historyChoices').replaceChildren();\n    updateSummary();\n  }\n\n  function applySuggestedLocation() {\n    const code = $('indicationSelect').value;\n    const side = $('lateralitySelect').value;\n    const item = state.contract?.indications?.[code];\n    let suggested = '';\n    if (item && (side === 'left' || side === 'right')) {\n      suggested = item.location_labels?.[side] || '';\n      if (!suggested && code === 'OTHER_CUSTOM') {\n        const area = $('otherArea').value.trim();\n        if (area) suggested = `${side === 'left' ? 'Αριστερά' : 'Δεξιά'} — ${area}`;\n      }\n    }\n    $('exactLocation').value = suggested;\n    updateSummary();\n  }\n\n  async function parseMedication()",
              1,
          )
          s = s.replace(
              "    if (!$('identityNumber').value.trim() || !item) {\n      showError('Συμπλήρωσε ταυτότητα και ένδειξη πριν την αναζήτηση.');\n",
              "    if (!$('identityNumber').value.trim() || !item || !['left','right'].includes($('lateralitySelect').value)) {\n      showError('Συμπλήρωσε ταυτότητα, ένδειξη και μία πλευρά (δεξιά ή αριστερά) πριν την αναζήτηση.');\n",
              1,
          )
          s = s.replace(
              "  async function createPdf() {\n    const file = $('imagingReport').files[0];\n",
              "  async function createPdf() {\n    if (!['left','right'].includes($('lateralitySelect').value)) {\n      showError('Επίλεξε μία πλευρά: δεξιά ή αριστερά.');\n      return;\n    }\n    if (!$('exactLocation').value.trim()) {\n      showError('Απαιτείται μία ακριβής εντόπιση RF.');\n      return;\n    }\n    const file = $('imagingReport').files[0];\n",
              1,
          )
          s = s.replace(
              "    $('indicationSelect').addEventListener('change', indicationChanged);\n",
              "    $('indicationSelect').addEventListener('change', indicationChanged);\n    $('lateralitySelect').addEventListener('change', applySuggestedLocation);\n    $('otherArea').addEventListener('input', () => {\n      if ($('indicationSelect').value === 'OTHER_CUSTOM') applySuggestedLocation();\n    });\n",
              1,
          )
          p.write_text(s, encoding='utf-8')

          # UI language: one application = one side = one target.
          p = Path('static/clinic-utilities/rf/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('type="number" min="0" max="130"', 'type="number" min="1" max="130"', 1)
          s = s.replace(
              '<h2>Ένδειξη & ακριβής εντόπιση</h2><p>Μόνο οι επιλογές της πραγματικής σου χρήσης.</p>',
              '<h2>Ένδειξη & ακριβής εντόπιση</h2><p>Μία αίτηση = μία πλευρά και μία εντόπιση. Μόνο δεξιά ή αριστερά.</p>',
              1,
          )
          s = s.replace(
              '<label>Πλευρά<select id="lateralitySelect"></select></label><label>Ακριβής εντόπιση<input id="exactLocation" placeholder="π.χ. Αριστερός ώμος"></label>',
              '<label>Πλευρά<select id="lateralitySelect"><option value="">Επιλέξτε…</option></select></label><label>Ακριβής εντόπιση<input id="exactLocation" placeholder="Συμπληρώνεται από ένδειξη + πλευρά · μπορείς να εξειδικεύσεις"></label>',
              1,
          )
          s = s.replace('Paste όλη την αγωγή → αυτόματα έως 3 ΜΣΑΦ + 3 άλλα αναλγητικά.', 'Paste όλη την αγωγή → αυτόματα 3 ΜΣΑΦ + 3 άλλα αναλγητικά· αν δεν τεκμηριώνονται, η αίτηση σταματά.', 1)
          s = s.replace('ΜΣΑΦ <span class="muted">(έως 3)</span>', 'ΜΣΑΦ <span class="muted">(απαιτούνται 3)</span>', 1)
          s = s.replace('Άλλη αναλγητική αγωγή <span class="muted">(έως 3)</span>', 'Άλλη αναλγητική αγωγή <span class="muted">(απαιτούνται 3)</span>', 1)
          p.write_text(s, encoding='utf-8')

          # Focused backend regression.
          Path('test_rf_v2_unilateral.py').write_text('''from __future__ import annotations\n\nimport unittest\n\nfrom pydantic import ValidationError\n\nfrom clinic_utilities.rf.api import RFApplicationDraft\nfrom clinic_utilities.rf.catalog import INDICATIONS, LATERALITY_LABELS\n\n\ndef draft(**overrides):\n    data = {\n        "pathway": "A1",\n        "patient_name": "Synthetic Patient",\n        "identity_number": "SYN-UNI",\n        "gesy_number": "GESY-SYN",\n        "age": 67,\n        "product_key": "medikey",\n        "indication_code": "KNEE_OA_KL34",\n        "laterality": "left",\n        "exact_location": "Αριστερό γόνατο",\n    }\n    data.update(overrides)\n    return RFApplicationDraft(**data)\n\n\nclass RFUnilateralContractTests(unittest.TestCase):\n    def test_only_left_and_right_are_valid_lateralities(self):\n        self.assertEqual(LATERALITY_LABELS, {"left": "Αριστερά", "right": "Δεξιά"})\n        self.assertEqual(draft(laterality="left").laterality, "left")\n        self.assertEqual(draft(laterality="right").laterality, "right")\n\n    def test_bilateral_none_and_midline_are_rejected(self):\n        for value in ("bilateral", "none", "midline", ""):\n            with self.subTest(value=value), self.assertRaises(ValidationError):\n                draft(laterality=value)\n\n    def test_knee_location_suggestion_is_side_specific(self):\n        labels = INDICATIONS["KNEE_OA_KL34"]["location_labels"]\n        self.assertEqual(labels["left"], "Αριστερό γόνατο")\n        self.assertEqual(labels["right"], "Δεξί γόνατο")\n        self.assertEqual(set(labels), {"left", "right"})\n\n    def test_all_fixed_indications_expose_only_single_side_location_labels(self):\n        for code, item in INDICATIONS.items():\n            labels = item.get("location_labels", {})\n            if code == "OTHER_CUSTOM":\n                self.assertEqual(labels, {})\n            else:\n                self.assertEqual(set(labels), {"left", "right"}, code)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')

          # Focused browser-source regression.
          Path('test_rf_v2_unilateral_ui.js').write_text('''\'use strict\';\n\nconst fs = require(\'fs\');\nconst assert = require(\'assert\');\n\nconst app = fs.readFileSync(\'static/clinic-utilities/rf/app.js\', \'utf8\');\nconst html = fs.readFileSync(\'static/clinic-utilities/rf/index.html\', \'utf8\');\n\nassert(app.includes(\'function applySuggestedLocation()\'), \'RF UI must derive exact location from indication + side\');\nassert(app.includes("lateralitySelect\').addEventListener(\'change\', applySuggestedLocation)"), \'side change must refresh exact location\');\nassert(app.includes("item.location_labels?.[side]"), \'RF UI must use server-provided location labels\');\nassert(app.includes("![\'left\',\'right\'].includes($(\'lateralitySelect\').value)"), \'RF UI must fail closed unless side is left/right\');\nassert(html.includes(\'Μία αίτηση = μία πλευρά και μία εντόπιση\'), \'RF UI must explain one-side/one-target rule\');\nassert(html.includes(\'Συμπληρώνεται από ένδειξη + πλευρά\'), \'exact-location field must explain automatic suggestion\');\n\nconsole.log(\'RF unilateral target UI regression: PASS\');\n''', encoding='utf-8')
          PY

      - name: Commit source-only hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add clinic_utilities/rf/api.py static/clinic-utilities/rf/app.js static/clinic-utilities/rf/index.html test_rf_v2_unilateral.py test_rf_v2_unilateral_ui.js
          git diff --cached --check
          git commit -m 'Enforce unilateral RF target and auto-fill location'
          git push origin HEAD:fix/rf-single-side-autolocation-2026-09-06
