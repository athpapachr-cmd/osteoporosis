name: Clinical Learning L1C challenge transport gate

on:
  push:
    branches:
      - feat/clinical-learning-l1c-challenge-completion-transport-2026-09-09
      - feat/clinical-learning-l1d-clipboard-handoff-2026-09-10
  pull_request:
    paths:
      - 'clinical_learning/challenge_completion_protocol.py'
      - 'clinical_learning/chatgpt_project_instructions_v1.txt'
      - 'static/clinical-learning/project-setup.html'
      - 'static/clinical-learning/chatgpt-project-instructions-v1.txt'
      - 'static/clinical-learning/l1b.js'
      - 'test_clinical_learning_l1_ui_contract.py'
      - 'test_clinical_learning_l1c_*.py'
      - '.github/workflows/clinical-learning-l1-tests.yml'
      - '.github/workflows/clinical-learning-l1b-tests.yml'
      - '.github/workflows/clinical-learning-l1c-tests.yml'
      - 'CLINICAL_LEARNING_CHAT_TRANSPORT_V1.md'
      - 'SLICE_PLAN_CURRENT.md'
      - 'CURRENT_OPERATIONAL.md'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Python syntax
        run: |
          python -m py_compile \
            clinical_learning/challenge_completion_protocol.py \
            test_clinical_learning_l1c_challenge_completion_transport.py

      - name: L1C focused tests
        run: python -m unittest discover -v -p 'test_clinical_learning_l1c_*.py'

      - name: Inherited L1B tests
        run: python -m unittest discover -v -p 'test_clinical_learning_l1b_*.py'

      - name: Inherited L1 tests
        run: python -m unittest discover -v -p 'test_clinical_learning_l1_*.py'

      - name: Frozen owner guard
        run: |
          set -euo pipefail
          base="$(git merge-base origin/main HEAD)"
          git diff --quiet "$base" HEAD -- \
            schemas/clinical_learning_core_v1.yaml \
            schemas/clinical_learning_l1_boundary_v1.yaml \
            schemas/clinical_learning_contract_manifest_v1.yaml \
            schemas/clinical_learning_design_fixtures_v1.yaml \
            schemas/osteoporosis_foundation_map_v1.yaml

      - name: Scope guard
        run: |
          set -euo pipefail
          base="$(git merge-base origin/main HEAD)"
          changed="$(git diff --name-only "$base" HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -E '^(clinic_utilities/|static/clinic-utilities/)' ; then
            echo 'L1C/L1D must not mutate Clinic Utilities / RF / physio owners.' >&2
            exit 1
          fi
          if printf '%s\n' "$changed" | grep -Ev '^(clinical_learning/challenge_completion_protocol\.py|clinical_learning/chatgpt_project_instructions_v1\.txt|static/clinical-learning/project-setup\.html|static/clinical-learning/chatgpt-project-instructions-v1\.txt|static/clinical-learning/l1b\.js|test_clinical_learning_l1_ui_contract\.py|test_clinical_learning_l1c_.*\.py|\.github/workflows/clinical-learning-l1-tests\.yml|\.github/workflows/clinical-learning-l1b-tests\.yml|\.github/workflows/clinical-learning-l1c-tests\.yml|CLINICAL_LEARNING_CHAT_TRANSPORT_V1\.md|SLICE_PLAN_CURRENT\.md|CURRENT_OPERATIONAL\.md)$' ; then
            echo 'Unexpected file outside bounded L1C/L1D continuation owners.' >&2
            exit 1
          fi

      - name: Diff hygiene
        run: |
          set -euo pipefail
          base="$(git merge-base origin/main HEAD)"
          git diff --check "$base" HEAD
