name: Clinical Learning L1 handoff reconciliation

on:
  push:
    branches:
      - feat/clinical-learning-l1-challenge-foundation-mvp-2026-09-07

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/clinical-learning-l1-challenge-foundation-mvp-2026-09-07
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply L1 handoff canonical reconciliation
        run: python scripts/clinical_learning_l1_handoff_reconcile.py
      - name: Validate handoff diff
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only
      - name: Commit canonical handoff state
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_OPERATIONAL.md SLICE_PLAN_CURRENT.md TODO.md osteoporosis-change-log.md
          git diff --cached --check
          git commit -m 'Record Clinical Learning L1 handoff checkpoint'
          git push origin HEAD:feat/clinical-learning-l1-challenge-foundation-mvp-2026-09-07
