name: Temporary fix atomic builder scope collector

on:
  push:
    branches:
      - chore/atomic-canonical-checkpoints-2026-09-15

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix untracked-file scope collection and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "athpapachr-cmd"
          git config user.email "athpapachr@gmail.com"
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/tmp-atomic-canonical-checkpoints-builder.yml')
          s=p.read_text(encoding='utf-8')
          old="mapfile -t changed < <(git diff --name-only | sort)"
          new="mapfile -t changed < <({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)"
          assert s.count(old)==1, s.count(old)
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
          rm -f .github/workflows/tmp-fix-atomic-builder.yml
          git add .github/workflows/tmp-atomic-canonical-checkpoints-builder.yml .github/workflows/tmp-fix-atomic-builder.yml
          git commit -m "Fix atomic builder scope collector"
          git push origin HEAD:chore/atomic-canonical-checkpoints-2026-09-15
