name: Temporary authenticated Knee OA V5 live smoke

on:
  push:
    branches:
      - ops/physio-knee-oa-v5-live-smoke-2026-09-13

permissions:
  contents: read

jobs:
  authenticated-live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_URL: https://ortho-reception-backend.onrender.com
      CLINICAL_DATA_KEY: ${{ secrets.CLINICAL_DATA_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify protected V5 production state
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLINICAL_DATA_KEY:-}"

          unauth_code=$(curl --retry 3 --retry-delay 2 -sS -o /tmp/unauth.json -w '%{http_code}' \
            "$BASE_URL/clinical/clinic-utilities/physio-referral/api/product/bootstrap")
          test "$unauth_code" = '401'

          bootstrap_code=$(curl --retry 3 --retry-delay 2 -sS -o /tmp/bootstrap.json -w '%{http_code}' \
            -H "X-Clinical-Key: ${CLINICAL_DATA_KEY}" \
            "$BASE_URL/clinical/clinic-utilities/physio-referral/api/product/bootstrap")
          test "$bootstrap_code" = '200'
          jq -e '.synthetic_only == false' /tmp/bootstrap.json >/dev/null
          jq -e '.deployment_context == "clinical_excellence_cockpit"' /tmp/bootstrap.json >/dev/null
          jq -e '.jurisdiction_profile.profile_id == "CY_GESY"' /tmp/bootstrap.json >/dev/null
          jq -e '.jurisdiction_profile.selection_source == "explicit_account_configuration"' /tmp/bootstrap.json >/dev/null

          package_version=$(jq -r '.package_version' /tmp/bootstrap.json)
          draft_id=$(python - <<'PY'
          import uuid
          print(uuid.uuid4())
          PY
          )
          jq -n \
            --arg draft_id "$draft_id" \
            --arg package_version "$package_version" \
            '{
              draft_id: $draft_id,
              revision: 0,
              package_version: $package_version,
              synthetic_only: false,
              state: {
                laterality: "right",
                formal_assertion_state: "yes",
                findings: [],
                functional_impairments: [],
                rehab_directions: ["therapeutic_exercise","progressive_strengthening","education_and_self_management"],
                adjunct_options: [],
                goals: [],
                phenotype: {},
                qualifiers: {},
                explicit_restrictions: [],
                clinician_free_text_optional: "",
                safety_flags: []
              },
              dismissed: []
            }' > /tmp/request.json

          project_code=$(curl --retry 3 --retry-delay 2 -sS -o /tmp/project.json -w '%{http_code}' \
            -H "X-Clinical-Key: ${CLINICAL_DATA_KEY}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/request.json \
            "$BASE_URL/clinical/clinic-utilities/physio-referral/api/product/project")
          test "$project_code" = '200'
          jq -e '.gate.allowed == true and .gate.blocked == false' /tmp/project.json >/dev/null
          jq -e '.jurisdiction_profile.profile_id == "CY_GESY"' /tmp/project.json >/dev/null
          jq -e '.evidence.acupuncture.evidence_state == "guideline_conflict_or_mixed"' /tmp/project.json >/dev/null
          jq -e '.evidence.acupuncture.jurisdiction.local_direction == "against"' /tmp/project.json >/dev/null
          jq -e '.evidence.acupuncture.jurisdiction.relationship_to_core == "local_position_within_international_conflict"' /tmp/project.json >/dev/null
          jq -e '.evidence.manual_therapy.evidence_state == "guideline_conflict_or_mixed"' /tmp/project.json >/dev/null
          jq -e '.evidence.manual_therapy.jurisdiction.local_direction == "conditional_for"' /tmp/project.json >/dev/null
          jq -e '.evidence | has("electrotherapy") | not' /tmp/project.json >/dev/null
          jq -e '.state.rehab_directions == ["therapeutic_exercise","progressive_strengthening","education_and_self_management"]' /tmp/project.json >/dev/null
          jq -e '.text | contains("δεξιού γόνατος")' /tmp/project.json >/dev/null
          jq -e '.text | (contains("Κύπρ") | not)' /tmp/project.json >/dev/null
          jq -e '.text | (contains("ΓεΣΥ") | not)' /tmp/project.json >/dev/null

          clinical_code=$(curl --retry 3 --retry-delay 2 -sS -o /tmp/clinical-sheet.js -w '%{http_code}' \
            "$BASE_URL/static/clinic-utilities/physio-referral/product-clinical-sheet-v4.js")
          more_code=$(curl --retry 3 --retry-delay 2 -sS -o /tmp/more-v3.js -w '%{http_code}' \
            "$BASE_URL/static/clinic-utilities/physio-referral/product-more-v3.js")
          test "$clinical_code" = '200'
          test "$more_code" = '200'
          grep -q "v4Option('Μυϊκή αδυναμία στην εξέταση'" /tmp/clinical-sheet.js
          grep -q "v4Option('Αδυναμία τετρακεφάλου στην εξέταση'" /tmp/clinical-sheet.js
          ! grep -q "Ατροφία τετρακεφάλου" /tmp/clinical-sheet.js
          grep -q "data-v3-atrophy-quadriceps" /tmp/more-v3.js
          grep -q "Ατροφία τετρακεφάλου" /tmp/more-v3.js
          ! grep -q 'localStorage' /tmp/clinical-sheet.js
          ! grep -q 'sessionStorage' /tmp/clinical-sheet.js
          ! grep -q 'localStorage' /tmp/more-v3.js
          ! grep -q 'sessionStorage' /tmp/more-v3.js

          echo 'AUTHENTICATED KNEE OA V5 LIVE SMOKE PASS'
          echo 'Only a generated UUID and non-identifiable smoke state were sent; no secret value was printed.'
