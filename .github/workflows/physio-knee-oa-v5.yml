name: Physio Knee OA V5 integration gate

on:
  push:
    branches:
      - feat/physio-knee-oa-v5-integration-2026-09-13
      - feat/physio-knee-oa-v5-1-exam-discoverability-2026-09-13
  pull_request:
    paths:
      - 'clinic_utilities/physio_referral_product/**'
      - 'static/clinic-utilities/physio-referral/**'
      - 'commercial_products/physio_referral/**'
      - 'CURRENT_OPERATIONAL.md'
      - 'SLICE_PLAN_CURRENT.md'
      - 'osteoporosis-change-log.md'
      - 'test_physio_knee_oa_cockpit_browser.py'
      - 'test_physio_knee_oa_cockpit_integration.py'
      - '.github/workflows/physio-knee-oa-v5.yml'
      - '.github/workflows/physio-knee-oa-v4.yml'
      - '.github/workflows/physio-knee-oa-prototype.yml'
      - '.github/workflows/physio-knee-oa-cockpit-integration.yml'
      - '.github/workflows/physio-knee-oa-jurisdiction-v1.yml'

permissions:
  contents: read

concurrency:
  group: physio-knee-oa-v5-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v5-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify bounded v5 integration scope
        run: |
          python - <<'PY'
          import subprocess
          base=subprocess.check_output(['git','merge-base','origin/main','HEAD'],text=True).strip()
          paths=subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines()
          exact={
            'CURRENT_OPERATIONAL.md','SLICE_PLAN_CURRENT.md','osteoporosis-change-log.md',
            'test_physio_knee_oa_cockpit_browser.py','test_physio_knee_oa_cockpit_integration.py',
            '.github/workflows/physio-knee-oa-v5.yml',
            '.github/workflows/physio-knee-oa-v4.yml',
            '.github/workflows/physio-knee-oa-prototype.yml',
            '.github/workflows/physio-knee-oa-cockpit-integration.yml',
            '.github/workflows/physio-knee-oa-jurisdiction-v1.yml',
          }
          prefixes=(
            'clinic_utilities/physio_referral_product/',
            'static/clinic-utilities/physio-referral/',
            'commercial_products/physio_referral/',
          )
          bad=[p for p in paths if p not in exact and not p.startswith(prefixes)]
          assert not bad,bad
          assert not any('__pycache__' in p or p.endswith('.pyc') for p in paths),paths
          print('Knee OA v5/v5.1 bounded scope PASS:',len(paths),'files')
          PY

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'playwright==1.55.0'

      - name: Syntax
        run: |
          python -m py_compile \
            clinic_utilities/physio_referral_product/knee_oa_presentation_v4.py \
            clinic_utilities/physio_referral_product/prototype/qualifier_overlay.py \
            clinic_utilities/physio_referral_product/prototype/test_v5_postuse.py \
            clinic_utilities/physio_referral_product/prototype/test_v5_1_exam.py \
            clinic_utilities/physio_referral_product/prototype/test_browser_v5.py \
            clinic_utilities/physio_referral_product/prototype/test_browser_v5_1.py \
            clinic_utilities/physio_referral_product/prototype/test_browser.py \
            clinic_utilities/physio_referral_product/prototype/test_browser_qualifiers.py \
            clinic_utilities/physio_referral_product/prototype/test_browser_more_v3.py \
            test_physio_knee_oa_cockpit_browser.py \
            test_physio_knee_oa_jurisdiction_overlay.py \
            test_physio_knee_oa_cockpit_integration.py
          node --check clinic_utilities/physio_referral_product/prototype/clinical_sheet_v4.js
          node --check clinic_utilities/physio_referral_product/prototype/more_v3.js
          node --check clinic_utilities/physio_referral_product/prototype/qualifiers.js
          node --check clinic_utilities/physio_referral_product/prototype/v5_1_exam.js
          node --check static/clinic-utilities/physio-referral/product-clinical-sheet-v4.js
          node --check static/clinic-utilities/physio-referral/product-more-v3.js
          node --check static/clinic-utilities/physio-referral/product-qualifiers.js
          node --check static/clinic-utilities/physio-referral/product-v5-1-exam.js

      - name: V5 and V5.1 prose, server and jurisdiction regressions
        run: |
          python clinic_utilities/physio_referral_product/prototype/test_v5_postuse.py
          python clinic_utilities/physio_referral_product/prototype/test_v5_1_exam.py
          python clinic_utilities/physio_referral_product/prototype/test_server.py
          python clinic_utilities/physio_referral_product/prototype/test_qualifiers.py
          python -m unittest -v \
            test_physio_knee_oa_jurisdiction_overlay.py \
            test_physio_knee_oa_cockpit_integration.py

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: V5.1, V5, inherited and CY_GESY browser acceptance
        run: |
          python clinic_utilities/physio_referral_product/prototype/test_browser_v5_1.py
          python clinic_utilities/physio_referral_product/prototype/test_browser_v5.py
          python clinic_utilities/physio_referral_product/prototype/test_browser.py
          python clinic_utilities/physio_referral_product/prototype/test_browser_qualifiers.py
          python clinic_utilities/physio_referral_product/prototype/test_browser_usability_v2.py
          python clinic_utilities/physio_referral_product/prototype/test_browser_more_v3.py
          python test_physio_knee_oa_cockpit_browser.py

      - name: Adjacent-owner isolation smoke
        run: |
          python -m unittest -v test_clinical_learning_l1_ui_contract.py
          node test_g4_workspace_ergonomics.js
          node test_rf_v2_ui.js

      - name: Package closure
        run: python clinic_utilities/physio_referral_product/prototype/build_bundle.py

      - name: Publish screenshots and prototype package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physio-knee-oa-v5-integration-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
