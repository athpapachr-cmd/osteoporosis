name: Materialize RF v2 official template

on:
  push:
    branches:
      - feat/clinic-utilities-rf-v2-native-2026-09-05

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and verify exact official RF v2 template
        run: |
          set -euo pipefail
          mkdir -p clinic_utilities/rf/templates
          cat tmp/rf-v2-template/chunk-*.b64 > /tmp/rf-form.xz.b64
          base64 -d /tmp/rf-form.xz.b64 > /tmp/rf-form.xz
          xz -dc /tmp/rf-form.xz > clinic_utilities/rf/templates/rf_official_form_v2.pdf
          test "$(stat -c%s clinic_utilities/rf/templates/rf_official_form_v2.pdf)" = "310238"
          echo "998e99e6b0a51d4a19431dd2e31e595282d7adf17eb29f5f91eeab94e3647252  clinic_utilities/rf/templates/rf_official_form_v2.pdf" | sha256sum -c -

      - name: Commit exact binary template
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clinic_utilities/rf/templates/rf_official_form_v2.pdf
          git commit -m "Package authoritative RF v2 form template"
          git push origin HEAD:feat/clinic-utilities-rf-v2-native-2026-09-05
