name: Clinical Learning L0 final status reconciliation

on:
  push:
    branches:
      - design/clinical-learning-l0-contract-freeze-2026-09-07

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/clinical-learning-l0-contract-freeze-2026-09-07
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply final L0 status reconciliation
        run: python scripts/clinical_learning_l0_finalize.py
      - name: Validate final status diff
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only
      - name: Commit final status reconciliation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_OPERATIONAL.md SLICE_PLAN_CURRENT.md TODO.md osteoporosis-change-log.md
          git diff --cached --check
          git commit -m 'Mark Clinical Learning L0 frozen and record PR hold'
          git push origin HEAD:design/clinical-learning-l0-contract-freeze-2026-09-07
