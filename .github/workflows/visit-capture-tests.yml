name: Visit Capture tests

on:
  push:
    paths:
      - "clinical_visit_amendments.py"
      - "test_cockpit_visit_amendments.py"
      - "clinical_data.py"
      - "clinical_capture_cp1.py"
      - "clinical_prepared_note.py"
      - "test_clinical_prepared_note.py"
      - "test_purpose_focused_capture.py"
      - "clinical_visit_audio.py"
      - "test_clinical_visit_audio.py"
      - "clinical_pending_one_tap.py"
      - "test_cockpit_cp2.py"
      - "test_pending_signed_write_integrity.py"
      - "test_cockpit_appointment_chart.py"
      - "clinical_visit_brief.py"
      - "test_cockpit_patient_entry.py"
      - "static/cockpit/patient-entry.js"
      - "static/cockpit/patient-chart.js"
      - "test_cockpit_cp1.py"
      - "static/cockpit/index.html"
      - "static/cockpit/visit-capture/**"
      - "local_visit_audio/**"
      - "test_visit_capture.py"
      - "test_visit_capture_ui.py"
      - "test_visit_capture_smoke_ui.js"
      - "test_visit_capture_local_audio_ui.js"
      - "test_local_audio_launcher_lifecycle.js"
      - "test_local_visit_audio.py"
      - "test_cockpit_home.py"
      - ".github/workflows/visit-capture-tests.yml"
  pull_request:
    paths:
      - "clinical_visit_amendments.py"
      - "test_cockpit_visit_amendments.py"
      - "clinical_data.py"
      - "clinical_capture_cp1.py"
      - "clinical_prepared_note.py"
      - "test_clinical_prepared_note.py"
      - "test_purpose_focused_capture.py"
      - "clinical_visit_audio.py"
      - "test_clinical_visit_audio.py"
      - "clinical_pending_one_tap.py"
      - "test_cockpit_cp2.py"
      - "test_pending_signed_write_integrity.py"
      - "test_cockpit_appointment_chart.py"
      - "clinical_visit_brief.py"
      - "test_cockpit_patient_entry.py"
      - "static/cockpit/patient-entry.js"
      - "static/cockpit/patient-chart.js"
      - "test_cockpit_cp1.py"
      - "static/cockpit/index.html"
      - "static/cockpit/visit-capture/**"
      - "local_visit_audio/**"
      - "test_visit_capture.py"
      - "test_visit_capture_ui.py"
      - "test_visit_capture_smoke_ui.js"
      - "test_visit_capture_local_audio_ui.js"
      - "test_local_audio_launcher_lifecycle.js"
      - "test_local_visit_audio.py"
      - "test_cockpit_home.py"
      - ".github/workflows/visit-capture-tests.yml"

jobs:
  visit-capture:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: p2
          POSTGRES_PASSWORD: synthetic-p2-only
          POSTGRES_DB: p2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U p2 -d p2_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Python syntax
        run: python -m py_compile clinical_data.py clinical_pending_one_tap.py clinical_visit_audio.py local_visit_audio/*.py test_cockpit_cp2.py test_visit_capture.py test_visit_capture_ui.py test_clinical_visit_audio.py test_local_visit_audio.py test_cockpit_home.py
      - name: Visit Capture JavaScript syntax
        run: |
          node --check static/cockpit/visit-capture/app.js
          node --check local_visit_audio/launcher.js
          node --check test_visit_capture_local_audio_ui.js
          node --check test_local_audio_launcher_lifecycle.js
          node --check static/cockpit/patient-entry.js
          node --check static/cockpit/patient-chart.js
          node --check static/cockpit/visit-capture/entry.js
      - name: Visit Capture no-patient browser simulation
        run: |
          node test_visit_capture_smoke_ui.js
          node test_visit_capture_local_audio_ui.js
          node test_local_audio_launcher_lifecycle.js
      - name: Visit Capture focused tests
        run: pytest -q test_visit_capture.py test_visit_capture_ui.py test_local_visit_audio.py test_cockpit_home.py
      - name: CP1 browser dependency
        run: |
          pip install playwright
          if ! command -v google-chrome && ! command -v chromium; then
            python -m playwright install --with-deps chromium
          fi
      - name: CP1 natural summary and persistent chart
        run: pytest -q test_purpose_focused_capture.py test_clinical_prepared_note.py test_cockpit_cp1.py test_cockpit_cp2.py test_cockpit_patient_entry.py test_cockpit_appointment_chart.py test_cockpit_visit_amendments.py test_clinical_visit_audio.py
      - name: Pending signed-source SQLite and PostgreSQL transaction integrity
        env:
          P2_TEST_POSTGRES_URL: postgresql+psycopg://p2:synthetic-p2-only@127.0.0.1:5432/p2_test
        run: pytest -q test_pending_signed_write_integrity.py
      - name: Diff hygiene
        run: git diff --check HEAD^ HEAD
