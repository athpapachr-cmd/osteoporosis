name: C2 server-authoritative patient workspace

on:
  push:
    branches:
      - feat/module01-c2-server-authoritative-patient-workspace-2026-09-01
    paths:
      - 'clinical_data.py'
      - 'static/baseline-audit/patient-registry.js'
      - 'static/baseline-audit/pilot-completion.js'
      - 'static/baseline-audit/whole-form-progress.js'
      - 'test_c2_server_authoritative_workspace.py'
      - 'test_c2_workspace_wiring.js'
      - 'test_baseline_finish_browser.js'
      - 'test_baseline_finalization_api.py'
      - 'static/baseline-audit/osteoporosis-longitudinal-summary-core.js'
      - 'static/baseline-audit/progressive-guidance-ui.js'
      - 'test_g3_guidance_summary_node.js'
      - 'test_g3_guidance_summary_wiring.js'
      - 'test_g2_guidance_contract.py'
      - 'test_g2_evidence_guidance_node.js'
      - 'test_g2_guidance_live_state.js'
      - 'test_g2_evidence_guidance_wiring.js'
      - 'test_progressive_guidance_node.js'
      - 'test_progressive_guidance_wiring.js'
      - 'test_progressive_guidance_ui_state.js'
      - 'test_progressive_guidance_why_now_ui.js'
      - '.github/workflows/c2-server-authoritative-workspace-tests.yml'
  pull_request:
    paths:
      - 'clinical_data.py'
      - 'static/baseline-audit/patient-registry.js'
      - 'static/baseline-audit/pilot-completion.js'
      - 'static/baseline-audit/whole-form-progress.js'
      - 'test_c2_server_authoritative_workspace.py'
      - 'test_c2_workspace_wiring.js'
      - 'test_baseline_finish_browser.js'
      - 'test_baseline_finalization_api.py'
      - 'static/baseline-audit/osteoporosis-longitudinal-summary-core.js'
      - 'static/baseline-audit/progressive-guidance-ui.js'
      - 'test_g3_guidance_summary_node.js'
      - 'test_g3_guidance_summary_wiring.js'
      - 'test_g2_guidance_contract.py'
      - 'test_g2_evidence_guidance_node.js'
      - 'test_g2_guidance_live_state.js'
      - 'test_g2_evidence_guidance_wiring.js'
      - 'test_progressive_guidance_node.js'
      - 'test_progressive_guidance_wiring.js'
      - 'test_progressive_guidance_ui_state.js'
      - 'test_progressive_guidance_why_now_ui.js'
      - '.github/workflows/c2-server-authoritative-workspace-tests.yml'
  workflow_dispatch:

jobs:
  c2-workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check pyyaml
      - name: Check syntax
        run: |
          python -m py_compile clinical_data.py test_c2_server_authoritative_workspace.py
          node --check static/baseline-audit/patient-registry.js
          node --check static/baseline-audit/pilot-completion.js
          node --check static/baseline-audit/whole-form-progress.js
          node --check test_c2_workspace_wiring.js
          node --check test_baseline_finish_browser.js
      - name: Run C2 server concurrency regressions
        run: python -m unittest -v test_c2_server_authoritative_workspace.py
      - name: Run C2 browser workspace wiring regressions
        run: node test_c2_workspace_wiring.js
      - name: Preserve authoritative Finish browser regression
        run: node test_baseline_finish_browser.js
      - name: Preserve server finalization lifecycle regression
        run: python -m unittest -v test_baseline_finalization_api.py
      - name: Preserve G3 salience and longitudinal summary regressions
        run: node test_g3_guidance_summary_node.js
      - name: Preserve G3 wiring and ownership regressions
        run: node test_g3_guidance_summary_wiring.js
      - name: Preserve frozen G2 evidence contract
        run: python test_g2_guidance_contract.py
      - name: Preserve G2 evidence core regressions
        run: node test_g2_evidence_guidance_node.js
      - name: Preserve G2 live-state regressions
        run: node test_g2_guidance_live_state.js
      - name: Preserve G2 wiring and ownership regressions
        run: node test_g2_evidence_guidance_wiring.js
      - name: Preserve G1 core regressions
        run: node test_progressive_guidance_node.js
      - name: Preserve G1 wiring regression
        run: node test_progressive_guidance_wiring.js
      - name: Preserve G1 UI-state regressions
        run: node test_progressive_guidance_ui_state.js
      - name: Preserve G1 WHY-NOW regression
        run: node test_progressive_guidance_why_now_ui.js
