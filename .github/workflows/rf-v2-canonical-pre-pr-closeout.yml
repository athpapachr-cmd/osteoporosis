name: RF v2 canonical pre-PR closeout

on:
  push:
    branches:
      - feat/clinic-utilities-rf-v2-native-2026-09-05

permissions:
  contents: write

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/clinic-utilities-rf-v2-native-2026-09-05
          fetch-depth: 0

      - name: Reconcile RF v2 canonicals
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          def dec(value):
              return base64.b64decode(value).decode('utf-8')

          # TODO roadmap reconciliation.
          p = Path('TODO.md')
          s = p.read_text(encoding='utf-8')
          old_summary = "C1, G-1, G-2 and G-3 are **implemented / tested / merged / deployed / production-smoke-verified**. G-4 is **merged/deployed with workspace smoke passed**, but its RF authorized workflow is not production-smoke-verified until the tested gateway hotfix is separately released/configured/smoked. Real-clinic usefulness/refinement remains distinct from production smoke and is not `PILOT-VALIDATED`."
          new_summary = dec('')
          if old_summary not in s:
              raise SystemExit('TODO summary anchor not found')
          s = s.replace(old_summary, new_summary, 1)
          start = s.index('## 1.6 G-4 Workspace ergonomics + RF utility navigation')
          end = s.index('## 1.7 Heidi-first capture', start)
          s = s[:start] + dec('�') + s[end:]
          p.write_text(s, encoding='utf-8')

          # Slice design closeout.
          p = Path('SLICE_PLAN_CURRENT.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              '> **STATUS:** APPROVED / FROZEN — IMPLEMENTATION AUTHORIZED / ACTIVE',
              '> **STATUS:** APPROVED / FROZEN — IMPLEMENTED / RELEASE-CANDIDATE TESTED / EXACT-HEAD REVIEW PASS — PR AUTHORIZED / PRE-PR HOLD',
              1,
          )
          s = s.replace(
              '> **Implementation authority:** YES — bounded to this frozen slice.',
              '> **Implementation/test authority:** CONSUMED — release-candidate phase closed.\n> **PR authority:** GRANTED — bounded native RF v2 release PR only.',
              1,
          )
          s = s.replace(
              '→ automatically select up to 3 NSAID trials\n→ automatically select up to 3 other analgesic trials',
              '→ automatically resolve/select exactly 3 NSAID trials\n→ automatically resolve/select exactly 3 other analgesic trials\n→ fail closed if 3 + 3 cannot be resolved without invention',
              1,
          )
          s = s.replace(
              '→ persist as `legacy_manual` / retrospective provenance',
              '→ persist as `clinician_manual` actual-procedure provenance',
              1,
          )
          if '# Release-candidate closeout — 2026-09-05' not in s:
              s = s.rstrip() + '\n\n' + dec(', production config/secret, deploy and production smoke remain separately gated.
