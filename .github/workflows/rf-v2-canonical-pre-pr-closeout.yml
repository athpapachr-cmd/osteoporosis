name: RF v2 canonical docs closeout

on:
  push:
    branches:
      - feat/clinic-utilities-rf-v2-native-2026-09-05

permissions:
  contents: write

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/clinic-utilities-rf-v2-native-2026-09-05
          fetch-depth: 0
      - name: Reconcile RF v2 canonicals
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          dec=lambda x: base64.b64decode(x).decode('utf-8')
          p=Path('TODO.md'); s=p.read_text(encoding='utf-8')
          old="C1, G-1, G-2 and G-3 are **implemented / tested / merged / deployed / production-smoke-verified**. G-4 is **merged/deployed with workspace smoke passed**, but its RF authorized workflow is not production-smoke-verified until the tested gateway hotfix is separately released/configured/smoked. Real-clinic usefulness/refinement remains distinct from production smoke and is not `PILOT-VALIDATED`."
          new="C1, G-1, G-2 and G-3 are **implemented / tested / merged / deployed / production-smoke-verified**. G-4 workspace ergonomics are merged/deployed with workspace smoke passed. The old RF gateway/auth leg also reached production and later returned `200`, but full old-form create/PDF smoke was deliberately stopped when the authoritative RF form changed. The replacement native RF v2 Clinic Utility is **implemented / release-candidate tested / exact-head reviewed**, but is not merged, deployed, production-smoke-verified or pilot-validated."
          if old not in s: raise SystemExit('TODO summary anchor not found')
          s=s.replace(old,new,1)
          start=s.index('## 1.6 G-4 Workspace ergonomics + RF utility navigation'); end=s.index('\n## 1.7 Heidi-first capture',start)
          todo_section=dec('')
          s=s[:start]+todo_section+s[end:]
          s=s.replace('- [x] G-4 RF authenticated-gateway hotfix implemented/tested/reviewed with server-only credential and POST-only local history transport.\n- [ ] G-4 RF hotfix PR / merge / production config / deploy / end-to-end production smoke.','- [x] G-4 authenticated-gateway hotfix released through PR #73; later auth/form production leg returned `200`.\n- [x] Native RF v2 replacement implemented/release-candidate-tested after authoritative form change.\n- [ ] Native RF v2 PR / merge / production config verification / deploy / end-to-end production smoke.',1)
          s=s.replace('- [ ] Radiofrequency utility **engine/runtime migration** into this repository beyond the bounded gateway; the existing RF service remains source of truth.','- [x] Native RF Clinic Utility ownership migration implemented/release-candidate-tested; remaining release lifecycle is tracked in §1.6.',1)
          s=s.replace('5. G-4 workspace ergonomics — released/deployed/workspace-smoked; RF auth hotfix implemented/tested, release/config/smoke pending','5. G-4 workspace ergonomics + gateway — released; native RF v2 replacement implemented/release-candidate-tested, PR/merge/deploy/smoke pending',1)
          p.write_text(s,encoding='utf-8')
          p=Path('SLICE_PLAN_CURRENT.md'); s=p.read_text(encoding='utf-8')
          s=s.replace('> **STATUS:** APPROVED / FROZEN — IMPLEMENTATION AUTHORIZED / ACTIVE','> **STATUS:** APPROVED / FROZEN — IMPLEMENTED / RELEASE-CANDIDATE TESTED / EXACT-HEAD REVIEW PASS — PR AUTHORIZED / PRE-PR HOLD',1)
          s=s.replace('> **Implementation authority:** YES — bounded to this frozen slice.\n> **Merge / deploy / production config / production smoke authority:** NONE unless separately granted.','> **Implementation/test authority:** CONSUMED — release-candidate phase closed.\n> **PR authority:** GRANTED — bounded native RF v2 release PR only.\n> **Merge / deploy / production config / production smoke authority:** NONE unless separately granted.',1)
          s=s.replace('→ automatically select up to 3 NSAID trials\n→ automatically select up to 3 other analgesic trials','→ deterministically resolve/select exactly 3 NSAID trials\n→ deterministically resolve/select exactly 3 other analgesic trials\n→ fail closed if 3 + 3 cannot be resolved without invention',1)
          s=s.replace('→ persist as `legacy_manual` / retrospective provenance','→ persist as `clinician_manual` actual-procedure provenance',1)
          s=s.replace('4. medication parser selects max 3 NSAIDs + max 3 other analgesics, deduplicates active ingredient and never invents missing dose/duration;','4. medication parser resolves exactly 3 NSAIDs + exactly 3 other analgesics, deduplicates active ingredient, never invents missing dose/duration and fails closed if 3+3 cannot be resolved;',1)
          s=s.replace('6. A.2 lookup supports multiple episodes and legacy manual backfill;','6. A.2 lookup supports multiple episodes and clinician-manual actual-procedure backfill;',1)
          bstart=s.index('# 16. Binary-template constraint'); bend=s.index('\n# 17. Definition of Done',bstart)
          binary=dec('')
          s=s[:bstart]+binary+s[bend:]
          astart=s.index('# 19. Current authorization / exact next action')
          auth=dec('')
          s=s[:astart]+auth
          p.write_text(s,encoding='utf-8')
          p=Path('CURRENT_OPERATIONAL.md'); s=p.read_text(encoding='utf-8')
          s=s.replace('> **STATUS:** RF v2 NATIVE CLINIC UTILITY — IMPLEMENTED / RELEASE-CANDIDATE TESTED / EXACT-HEAD REVIEW PASS / RELEASE HOLD','> **STATUS:** RF v2 NATIVE CLINIC UTILITY — IMPLEMENTED / RELEASE-CANDIDATE TESTED / EXACT-HEAD REVIEW PASS / PR AUTHORIZED — PRE-PR HOLD',1)
          s=s.replace('> **ACTIVE CANONICAL WRITER/LOCK:** ChatGPT — docs-only closeout only until this commit lands.','> **ACTIVE CANONICAL WRITER/LOCK:** NONE — canonical pre-PR closeout complete.',1)
          s=s.replace('> **PR authority:** NONE.','> **PR authority:** GRANTED — bounded native RF v2 release PR only.',1)
          s=s.replace('PR                                   NO','PR                                   AUTHORIZED / NOT YET OPEN',1)
          s=s.replace('Next possible release sequence requires separate product-owner authority:','Product owner has granted authority through opening the bounded native RF v2 release PR. Remaining lifecycle steps remain separately gated:',1)
          s=s.replace('optional final docs-only drift verification\n→ open bounded RF v2 release PR','final docs-only drift verification\n→ open bounded RF v2 release PR',1)
          s=s.replace('The stale docs-only PR #74 predates the authoritative-form change/native ownership replan and must be dispositioned separately; do not use it as release truth.','The stale docs-only PR #74 was closed unmerged as superseded because it predates the authoritative-form change/native ownership replan.',1)
          s=s.replace('NO PR\nNO merge','NO merge',1)
          p.write_text(s,encoding='utf-8')
          p=Path('osteoporosis-change-log.md'); s=p.read_text(encoding='utf-8')
          marker='## 2026-09-05 — Native RF v2 release candidate completed; PR path authorized'
          if marker not in s: s=s.rstrip()+'\n\n'+dec('')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit docs-only canonical closeout
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TODO.md SLICE_PLAN_CURRENT.md CURRENT_OPERATIONAL.md osteoporosis-change-log.md
          git diff --cached --check
          git commit -m 'Close RF v2 canonicals for release PR'
          git push origin HEAD:feat/clinic-utilities-rf-v2-native-2026-09-05
