name: Cockpit Home tests

on:
  push:
    paths:
      - "main.py"
      - "clinical_notion_tasks.py"
      - "clinical_icloud_mail.py"
      - "clinical_icloud_triage_rules.py"
      - "clinical_icloud_actions.py"
      - "test_clinical_icloud_mail.py"
      - "test_clinical_icloud_actions.py"
      - "test_icloud_triage_rules.py"
      - "test_clinical_notion_tasks.py"
      - "static/cockpit/**"
      - "static/baseline-audit/index.html"
      - "static/baseline-audit/g4-workspace-ergonomics.js"
      - "test_cockpit_home.py"
      - "test_cockpit_doctor_shell.js"
      - "test_cockpit_icloud_ui.js"
      - "test_cockpit_shared_navigation.js"
      - "test_cockpit_doctor_browser.py"
      - "test_cockpit_unified_home.js"
      - "test_g4_workspace_ergonomics.js"
      - ".github/workflows/cockpit-home-tests.yml"
  pull_request:
    paths:
      - "main.py"
      - "clinical_notion_tasks.py"
      - "clinical_icloud_mail.py"
      - "clinical_icloud_triage_rules.py"
      - "clinical_icloud_actions.py"
      - "test_clinical_icloud_mail.py"
      - "test_clinical_icloud_actions.py"
      - "test_icloud_triage_rules.py"
      - "test_clinical_notion_tasks.py"
      - "static/cockpit/**"
      - "static/baseline-audit/index.html"
      - "static/baseline-audit/g4-workspace-ergonomics.js"
      - "test_cockpit_home.py"
      - "test_cockpit_doctor_shell.js"
      - "test_cockpit_icloud_ui.js"
      - "test_cockpit_shared_navigation.js"
      - "test_cockpit_doctor_browser.py"
      - "test_cockpit_unified_home.js"
      - "test_g4_workspace_ergonomics.js"
      - ".github/workflows/cockpit-home-tests.yml"

jobs:
  cockpit-home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install Python dependencies
        run: pip install -r requirements.txt pytest
      - name: Python syntax
        run: python -m py_compile main.py clinical_reception_calls.py clinical_icloud_mail.py clinical_icloud_triage_rules.py clinical_icloud_actions.py clinical_notion_tasks.py test_clinical_reception_calls.py test_clinical_icloud_mail.py test_clinical_icloud_actions.py test_icloud_triage_rules.py test_clinical_notion_tasks.py test_cockpit_home.py
      - name: Browser JavaScript syntax
        run: |
          node --check static/cockpit/app.js
          node --check static/cockpit/clinical-workspace.js
          node --check static/cockpit/obligations-view.js
          node --check static/cockpit/doctor-shell.js
          node --check static/cockpit/icloud-inbox.js
          node --check static/cockpit/icloud-triage.js
          node --check static/cockpit/shared-nav.js
          node --check static/baseline-audit/g4-workspace-ergonomics.js
      - name: Cockpit Home deterministic tests
        run: pytest -q test_cockpit_home.py test_clinical_reception_calls.py test_clinical_icloud_mail.py test_clinical_icloud_actions.py test_icloud_triage_rules.py test_clinical_notion_tasks.py
      - name: Cockpit Doctor Shell synthetic workflow
        run: |
          node test_cockpit_doctor_shell.js
          node test_cockpit_icloud_ui.js
      - name: Shared navigation and key login synthetic flow
        run: node test_cockpit_shared_navigation.js
      - name: Install browser smoke dependency
        run: |
          pip install playwright
          if ! command -v google-chrome && ! command -v chromium; then
            python -m playwright install --with-deps chromium
          fi
      - name: Chromium desktop and half-width user-experience smoke
        run: python test_cockpit_doctor_browser.py
      - name: Publish synthetic visual smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cockpit-v4-visual-smoke
          path: cockpit-v4-browser-evidence/
          if-no-files-found: ignore

      - name: Osteoporosis workspace navigation regressions
        run: node test_g4_workspace_ergonomics.js
      - name: Diff hygiene
        run: git diff --check HEAD^ HEAD
