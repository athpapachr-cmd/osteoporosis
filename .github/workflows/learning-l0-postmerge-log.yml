name: Learning L0 post-merge changelog

on:
  push:
    branches:
      - docs/learning-l0-post-merge-2026-09-07

permissions:
  contents: write

jobs:
  append-log:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/learning-l0-post-merge-2026-09-07
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Append changelog
        run: python scripts/append_learning_l0_postmerge.py
      - name: Validate
        run: |
          git diff --check
          grep -q '## 2026-09-07 — Clinical Learning Hub design merged to main' osteoporosis-change-log.md
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add osteoporosis-change-log.md
          git commit -m 'Record Clinical Learning Hub design merge'
          git push origin HEAD:docs/learning-l0-post-merge-2026-09-07
