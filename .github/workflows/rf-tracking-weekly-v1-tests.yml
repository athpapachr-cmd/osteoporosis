name: Native RF Tracking + Week v1 (synthetic)

on:
  pull_request:
    paths:
      - 'clinic_utilities/rf/**'
      - 'static/clinic-utilities/rf/**'
      - 'static/cockpit/doctor-shell.js'
      - 'test_rf_tracking_weekly.py'
      - 'test_rf_v2_ui.js'
      - 'test_rf_tracking_browser.py'
      - 'test_cockpit_attention_summary.js'
      - '.github/workflows/rf-tracking-weekly-v1-tests.yml'
  workflow_dispatch:

jobs:
  rf-tracking-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing project requirements
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Syntax and static owner compatibility
        run: |
          python -m py_compile clinic_utilities/rf/tracking.py clinic_utilities/rf/persistence.py clinic_utilities/rf/api.py test_rf_tracking_weekly.py
          node --check static/clinic-utilities/rf/app.js
          node --check test_rf_v2_ui.js
          node --check static/cockpit/doctor-shell.js
          node --check test_cockpit_attention_summary.js
      - name: Synthetic RF tracking cursor, date-week and correction guards
        run: python -m unittest -v test_rf_tracking_weekly.py
      - name: Inherited immutable PDF, RF outcomes and saved draft regressions
        run: |
          python -m unittest -v test_rf_v2_native.py test_rf_v2_release_hardening.py
          node test_rf_v2_ui.js
      - name: Home RF destination and source-backed semantics
        run: node test_cockpit_attention_summary.js
      - name: Install isolated synthetic browser dependency
        run: |
          pip install playwright
          if ! command -v google-chrome && ! command -v chromium; then
            python -m playwright install --with-deps chromium
          fi
      - name: Chromium protected RF UX at 390, 680 and 1280 pixels
        run: python test_rf_tracking_browser.py
      - name: Verify scoped diff hygiene
        run: git diff --check
