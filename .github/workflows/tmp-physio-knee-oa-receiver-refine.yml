name: Temporary Knee OA receiver refinement builder

on:
  push:
    branches:
      - fix/physio-knee-oa-receiver-compression-chronicity-2026-09-15

permissions:
  contents: write

concurrency:
  group: tmp-knee-oa-receiver-refine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-test-and-squash:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure git identity
        run: |
          git config user.name "athpapachr-cmd"
          git config user.email "athpapachr@gmail.com"

      - name: Verify exact fresh-main ancestry
        run: |
          git fetch origin main
          test "$(git merge-base origin/main HEAD)" = "$(git rev-parse origin/main)"

      - name: Apply bounded receiver refinement
        run: |
          python .github/tmp/physio_knee_oa_receiver_refine.py
          python - <<'PY'
          from pathlib import Path
          path=Path('clinic_utilities/physio_referral_product/prototype/test_v5_1_exam.py')
          text=path.read_text(encoding='utf-8')
          old='self.assertIn("με αρχικές προτεραιότητες",result["text"])'
          new='self.assertIn("με έμφαση σε",result["text"])'
          if text.count(old)!=1:
              raise SystemExit(f'expected one stale expectation, found {text.count(old)}')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY

      - name: Install focused dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'playwright==1.55.0'
          python -m playwright install --with-deps chromium

      - name: Focused syntax and semantic regressions
        run: |
          node --check clinic_utilities/physio_referral_product/prototype/v5_1_exam.js
          node --check static/clinic-utilities/physio-referral/product-v5-1-exam.js
          python -m py_compile \
            clinic_utilities/physio_referral_product/prototype/qualifier_overlay.py \
            clinic_utilities/physio_referral_product/prototype/test_v5_1_exam.py \
            clinic_utilities/physio_referral_product/prototype/test_browser_v5_1.py \
            test_physio_knee_oa_cockpit_browser.py
          python clinic_utilities/physio_referral_product/prototype/test_v5_1_exam.py
          python clinic_utilities/physio_referral_product/prototype/test_server.py
          python clinic_utilities/physio_referral_product/prototype/test_qualifiers.py
          python -m unittest -v test_physio_knee_oa_cockpit_integration.py test_physio_knee_oa_jurisdiction_overlay.py

      - name: Focused Chromium acceptance
        run: |
          python clinic_utilities/physio_referral_product/prototype/test_browser_v5_1.py
          python test_physio_knee_oa_cockpit_browser.py

      - name: Squash to clean candidate
        shell: bash
        run: |
          rm -f .github/workflows/tmp-physio-knee-oa-receiver-refine.yml
          rm -f .github/tmp/physio_knee_oa_receiver_refine.py
          find . -type d -name __pycache__ -prune -exec rm -rf {} + || true
          rm -f osteoporosis.db
          rm -rf artifacts/knee-oa-cockpit
          git reset --mixed origin/main
          allowed=(
            clinic_utilities/physio_referral_product/prototype/qualifier_overlay.py
            clinic_utilities/physio_referral_product/prototype/test_browser_v5_1.py
            clinic_utilities/physio_referral_product/prototype/test_v5_1_exam.py
            clinic_utilities/physio_referral_product/prototype/v5_1_exam.js
            static/clinic-utilities/physio-referral/product-v5-1-exam.js
            test_physio_knee_oa_cockpit_browser.py
          )
          mapfile -t changed < <(git diff --name-only | sort)
          printf '%s\n' "${allowed[@]}" | sort > /tmp/allowed.txt
          printf '%s\n' "${changed[@]}" > /tmp/changed.txt
          diff -u /tmp/allowed.txt /tmp/changed.txt
          git add "${allowed[@]}"
          test -z "$(git diff --cached --name-only | grep -E '(^|/)__pycache__/|\.pyc$|^artifacts/|^osteoporosis\.db$' || true)"
          git commit -m "Refine Knee OA receiver prose and optional chronicity"
          git push --force-with-lease origin HEAD:fix/physio-knee-oa-receiver-compression-chronicity-2026-09-15
