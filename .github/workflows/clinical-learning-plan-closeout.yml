  Signal/Foundation integration
  daily due-state

post-baseline intervention phase
  clinician-facing daily coaching
  adaptive foundation prescriptions
  recurring Signal intervention
  re-measurement
```

REPLAN if implementation would require a second transcript ingestion owner, raw-transcript persistence by default, learning artifacts to become patient truth, or visible daily coaching during the scored baseline without methodology revision.
