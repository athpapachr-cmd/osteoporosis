A challenge is a **learning artifact**, not a patient chart and not a transcript archive.

## 30A.3 Fact Ledger — hard provenance boundary

The progressive-disclosure error demonstrated that case facts require explicit truth/provenance semantics. A later summary must never convert an educational hypothetical into a real patient fact.

Candidate `LearningFactV1`:

```text
fact_id
statement
fact_scope:
  real_deidentified_case_fact
  synthetic_case_fact
  clinician_hypothesis
  ai_inference
  counterfactual_teaching_point
introduced_via:
  initial_case
  progressive_disclosure
  heidi_transcript
  clinician_entry
  evidence_review
authoritative_for_patient: true / false
source
certainty_optional
introduced_at_stage
status: active / corrected / withdrawn
supersedes_fact_id_optional
```

Hard invariant:

```text
REAL PATIENT FACT
!= SYNTHETIC / PROGRESSIVE-DISCLOSURE FACT
!= CLINICIAN HYPOTHESIS
!= AI INFERENCE
!= EDUCATIONAL COUNTERFACTUAL
```

No learning artifact may write a hypothetical/counterfactual fact into authoritative patient data.

## 30A.4 Core object — `DailyCaseReviewV1`

A daily real-case review is a Practice-Review-derived learning artifact for one actual osteoporosis encounter.

Candidate contract:

```text
review_id
schema_version
module
review_date
opaque_encounter_reference_optional
eligibility_state
source_set

clinician_self_review:
  key_decisions[]
  uncertainty_points[]
  what_might_be_done_differently_optional
  confidence_by_decision_optional

decision_reconstruction
practice_observation_ids[]
strengths[]
clear_errors[]
uncertainties[]
evidence_based_disagreements[]
missed_opportunities[]
gap_classes[]
reasoning_patterns[]
communication_patterns[]
evidence_refs[]
learning_actions[]
linked_signal_ids[]
clinician_disposition
created_at
```

The persisted object stores reviewed structured learning evidence. It does **not** persist the raw Heidi transcript by default.

## 30A.5 Daily scheduled procedure

Desired operating cadence:

```text
once per clinic day
→ if at least one eligible osteoporosis encounter has a usable Heidi transcript
→ surface `Daily Case Review due`
→ clinician selects one case or accepts a system recommendation with visible rationale
→ transcript enters the existing protected ephemeral transcript boundary
→ reconstruct actual encounter evidence
→ clinician completes self-review BEFORE seeing AI critique
→ AI/Practice Review evaluates reasoning, decision, safety, communication and close
→ material claims are linked to evidence/standards where applicable
→ clinician Accept / Modify / Dismiss on important observations
→ persist only the structured reviewed learning artifact
→ update candidate Signals / Foundation Map evidence
```

If no eligible real case/transcript exists that day:

```text
state = no_eligible_case
```

The system must not fabricate a case to satisfy a daily quota.

The first scheduling implementation may be a deterministic Cockpit due-state rather than a background cron job. Notification channels are optional later work. No exact clock time is frozen until the product owner chooses one.

## 30A.6 Eligibility and case selection

A Daily Case Review must use a real osteoporosis encounter and an available transcript or another explicitly approved evidence set. Multiple eligible cases may be shown with a recommended review candidate based on learning value, uncertainty, safety relevance or major decision content, but the recommendation must show its reason and retain clinician override.

The selector must not silently equate complexity with poor performance and must not cherry-pick only failures; sustained strengths need evidence too.

## 30A.7 Self-review before AI critique — anti-anchoring requirement

Before the model reveals its debrief, capture a short clinician self-assessment:

```text
What were the 2–3 critical issues?
Which decision was least certain?
Would I change anything now?
Confidence in the main decision(s), if useful
```

This preserves calibration evidence and avoids measuring only agreement with an AI-generated framing.

## 30A.8 Heidi transcript boundary

Daily Case Review must reuse the protected transcript architecture rather than create a second transcript ingestion stack.

Canonical flow:

```text
Heidi transcript
→ protected ephemeral intake
→ semantic evidence/candidates with provenance
→ encounter/decision reconstruction
→ Practice Review
→ reviewed learning artifact
→ raw transcript discarded by default
```

Hard rules:

- no raw transcript in repository, localStorage, routine logs or learning tables by default;
- identifiable transcript use requires the same provider/privacy/data-control gate as PR-1;
- no autonomous patient-record write from the learning review;
- learning review inference is not patient truth;
- transcript absence is not a negative finding;
- exact dates, diagnoses, medication exposure or outcomes are never invented.

## 30A.9 Core object — `FoundationDomainStateV1`

The Foundation Map addresses the pattern where reasoning is often stronger than the clinician's explicitly structured theoretical model.

A domain/concept is not scored simply as pass/fail. Candidate states:

```text
FORMAL_SOLID
  can explain from first principles, apply, identify exceptions and transfer to a novel case

INTUITIVE_UNSTRUCTURED
  usually uses the concept correctly but cannot yet articulate a complete formal model

FRAGMENTED
  knows components but dependencies/causal model are incomplete or inconsistent

UNKNOWN_UNTESTED
  insufficient evidence of current understanding
```

Candidate fields:

```text
foundation_node_id
module
domain
concept
prerequisite_node_ids[]
state
evidence_attempt_ids[]
last_assessed_at
assessment_methods[]
confidence_calibration_optional
strength_or_gap_signal_ids[]
next_review_due_optional
clinician_note_optional
```

State changes require assessment evidence; they are not inferred from one model opinion or one self-rating.

## 30A.10 Module-01 initial Foundation Map

Initial osteoporosis/metabolic-bone domains:

```text
1. Bone remodeling / cell biology / physiology
2. DXA physics, BMD/T-score, artifacts, precision and LSC
3. VFA / vertebral-fracture identification and interpretation
4. Fracture epidemiology, absolute risk and FRAX/FRAXplus reasoning
5. Secondary osteoporosis
6. Glucocorticoid-induced osteoporosis
7. Antiresorptive pharmacology
8. Anabolic pharmacology
9. Sequential / combination treatment
10. Denosumab discontinuation / rebound physiology and management
11. Bone-turnover markers and treatment-response interpretation
12. Treatment safety / contraindications / transitions
13. Evidence appraisal: directness, surrogate endpoints, guideline disagreement and uncertainty
14. Communication / shared decision making / continuity
```

This is a dependency map, not a reading list. Nodes may be split/merged during the design slice if diagnostic assessment shows a better structure.

## 30A.11 Diagnostic mapping before teaching

For each foundation domain, the system should first establish what is already known.

Assessment methods include:

```text
explain the mechanism without notes
explain why the rule works
apply it to a novel clinical case
identify when the rule fails or evidence is indirect
compare competing explanations/options
separate evidence from inference
connect mechanism → evidence → clinical decision
```

The output is a map of:

```text
solid
intuitive but under-structured
fragmented
unknown/untested
```

The default intervention is **not** "read more".

## 30A.12 Foundation prescriptions

When a gap is structural, prescribe a bounded foundation block:

```text
prerequisite concept(s)
→ mechanism / formal model
→ one or two authoritative sources
→ short retrieval test
→ transfer case
→ retention check
```

Example pattern:

```text
clinical denosumab management strong
+ rebound recognition strong
+ osteoclast/RANKL/reversible-suppression model fragmented
→ targeted mechanism block
→ return to timing/CTX/zoledronate case reasoning
```

This converts isolated knowledge islands into a connected model instead of accumulating unrelated papers.

## 30A.13 Mastery evidence

`MASTERED` cannot mean "read" or "answered one question correctly".

Evidence should include several of:

```text
accurate explanation without prompts
mechanistic explanation
novel-case transfer
exception/boundary recognition
evidence-directness calibration
retention on later assessment
consistent real-case execution where observable
```

No fixed numeric mastery threshold is frozen before real data establish a useful denominator/reliability rule.

## 30A.14 Learning Signals from multiple sources

Challenges, Daily Case Reviews, later audit/Practice Review and Foundation assessments feed the existing Signal engine.

Example:

```text
Challenge → overstates indirect evidence
Daily Case Review → same calibration pattern
Later Challenge → repeats the pattern
↓
Candidate recurrent Signal:
EVIDENCE DIRECTNESS / CALIBRATION
↓
root cause = reasoning and/or knowledge
↓
foundation intervention + contrasting cases
↓
spaced reassessment
```

A single error may be clinically important but does not automatically become a stable trait. Recurrent patterns require denominator/reliability context. Positive repeated observations may become `SUSTAINED_STRENGTH`.

## 30A.15 Learning cadence

Target cadence after the relevant runtime exists:

```text
DAILY
one real osteoporosis case review when an eligible transcript-backed case exists

WEEKLY
one deliberately designed Clinical Challenge with progressive disclosure

EVERY 3–4 WEEKS OR AFTER A SMALL BLOCK OF COMPLETED RECORDS
Foundation / progress review:
  what stabilized
  what remains intuitive-unstructured
  what remains fragmented
  recurrent gap/strength signals
  next foundation target

SPACED REPETITION
per-node/per-topic due dates based on prior learning evidence
```

This cadence is a product target, not permission to invent a case when none exists.

## 30A.16 Baseline-methodology protection

Systematic clinician-facing Daily Case Review is an **intervention** and can change practice. It must therefore not silently contaminate the frozen 30-case system-assisted baseline.

Default policy:

```text
before scored baseline:
  design/test the learning machinery and record any learning exposure explicitly

during 30-case scored baseline:
  Practice Review / Daily Case Review may run in shadow to validate machinery
  routine AI critique/coaching is hidden by default
  no daily feedback loop is counted as baseline-neutral

after baseline lock:
  activate clinician-facing daily case review as a formal improvement intervention
```

If the product owner wants visible daily AI case-review coaching **during** the scored baseline, that is a methodology REPLAN and the cohort must be relabelled/redefined before collection continues.

## 30A.17 MVP ingestion from external ChatGPT conversations

The first practical Challenge ingestion path should not require direct cross-service AI write access.

MVP:

```text
assistant produces natural-language debrief
+
validated `ClinicalLearningChallengeV1` JSON
→ Cockpit Import Challenge
→ schema validation
→ PHI/identifier guard
→ duplicate detection by challenge_id
→ preview
→ clinician confirm/edit
→ protected persistence
```

Required user actions:

```text
view record
edit
approve/save
delete
export Markdown / JSON
```

PDF export is optional later and must not be confused with patient documentation.

## 30A.18 Later direct authenticated ingestion

A later connector/API may allow an external ChatGPT agent to write a learning record directly, but it must use a narrowly scoped credential/capability rather than reusing the browser's broad clinical session as an external bearer token.

Candidate scopes:

```text
learning.challenge.write
learning.case_review.write
learning.read_optional
```

Explicitly not implied:

```text
patient.read
patient.write
encounter.write
rf.write
admin/config
```

The server owns schema validation, duplicate handling, PHI checks and persistence. The external agent must not know internal database details.

## 30A.19 PHI firewall and patient/learning separation

Hard boundary:

```text
LEARNING RECORD
!= PATIENT RECORD
```

Challenge imports must reject or block obvious direct identifiers such as patient name, identity/GeSY number, phone/email/address and full DOB unless a future separately approved private linkage design requires them.

De-identified clinical descriptors such as age band/age, sex, diagnosis, medication exposure and fracture phenotype may be retained when they are necessary for the learning case and privacy policy permits.

A real-case learning artifact may carry an internal opaque encounter reference inside protected storage, but the learning object must never become an alternate patient chart or a source of unreviewed clinical truth.

## 30A.20 Clinician-facing progress view

The Learning Hub should answer:

```text
What have I worked on?
What repeatedly fails?
Where do I disagree defensibly with evidence/guidelines?
Which strengths are stable?
What remains intuitive rather than formally understood?
What is due for repetition?
What should the next challenge/foundation block be?
```

Useful displays include topic counts, domain evidence history, recurring Signals, retention-due items and strengths. Do not introduce a stable-looking composite "Clinical Knowledge Score" without adequate denominator, reliability and validated interpretation.

