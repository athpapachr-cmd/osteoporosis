# 30A. Clinical Learning Hub — foundations + challenges + real-case deliberate practice

The learning layer is a reusable **Core** capability. Osteoporosis is the first content module, not the permanent data-model boundary.

The clinician-facing Module-01 surface is named:

```text
Osteoporosis Clinical Learning
```

Core structure:

```text
CLINICAL LEARNING HUB
│
├── Foundation Map
│   ├── concept/dependency map
│   ├── diagnostic assessment
│   └── mastery / retention state
│
├── Clinical Challenges
│   ├── synthetic or de-identified cases
│   ├── progressive disclosure
│   ├── clinician reasoning before debrief
│   └── evidence-calibrated debrief
│
├── Daily Case Review
│   ├── real eligible osteoporosis encounter
│   ├── Heidi transcript as ephemeral evidence source
│   ├── clinician self-review before AI critique
│   ├── Practice Review / evidence review
│   └── reviewed learning artifact
│
├── Signals
│   ├── recurrent gaps
│   ├── strengths
│   ├── uncertainty/calibration patterns
│   └── prompt-dependence / transfer observations where valid
│
└── Learning Plan
    ├── targeted foundation blocks
    ├── papers/guidelines
    ├── deliberate-practice cases
    ├── spaced repetition
    └── re-assessment
```

The purpose is not to collect transcripts or CME activity. It is to convert repeated reasoning/knowledge evidence into a structured map of what the clinician understands, where performance is intuitive but under-theorized, what repeatedly fails, and what intervention should happen next.

## 30A.1 Three different learning instruments

The system must keep these instruments distinct:

```text
FOUNDATION MAP
What do I actually understand and how well is it structurally connected?

CLINICAL CHALLENGE
Can I apply the model to a controlled novel problem without hindsight?

DAILY REAL-CASE REVIEW
Did I apply it correctly in an actual patient encounter under real constraints?
```

They may feed the same Signals but must not be collapsed into one generic score.

