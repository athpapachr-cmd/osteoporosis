## 2026-09-06 — Clinical Learning Hub direction approved for detailed roadmap

The product owner approved expanding the existing Learning/Mastery/Practice-Review architecture into an explicit reusable **Clinical Learning Hub** with Osteoporosis as Module 01 content.

Approved instruments are distinct but connected:

```text
Foundation Map
Clinical Challenges
Daily Heidi-backed Real-Case Review
Signals
Learning Plan / spaced repetition
```

The design specifically addresses two needs:

1. preserve completed weekly case challenges as structured learning artifacts rather than losing them in chat transcripts;
2. add a scheduled daily review of one eligible real osteoporosis encounter from Heidi evidence when such a case exists.

The Daily Case Review requires clinician self-review before AI critique, reuses the protected ephemeral transcript architecture, persists only reviewed structured learning evidence by default and never treats AI inference/hypothetical/counterfactual content as patient truth.

A Fact Ledger is required for Challenge records so real patient facts, synthetic case facts, progressive-disclosure content, clinician hypotheses, AI inference and teaching counterfactuals remain separable.

The Foundation Map is intended to convert strong but sometimes intuitive/fragmented reasoning into a more explicit theoretical structure. Candidate states are:

```text
FORMAL_SOLID
INTUITIVE_UNSTRUCTURED
FRAGMENTED
UNKNOWN_UNTESTED
```

The first osteoporosis map covers bone remodeling, DXA/LSC, VFA, fracture-risk/FRAX reasoning, secondary causes, GIOP, antiresorptive/anabolic pharmacology, sequencing, denosumab rebound, BTMs, safety and evidence calibration.

