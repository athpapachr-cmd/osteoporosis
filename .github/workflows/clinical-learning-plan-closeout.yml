name: Clinical Learning Hub planning reconciliation

on:
  push:
    branches:
      - docs/clinical-learning-hub-rf-post-merge-2026-09-06

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/clinical-learning-hub-rf-post-merge-2026-09-06
          fetch-depth: 0
      - name: Reconcile canonicals
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          dec=lambda x: base64.b64decode(x).decode('utf-8')
          clinical=dec('')
          todo=dec('')
          current=dec('')
          rf=dec('')
          learn=dec('')

          p=Path('CLINICAL_EXCELLENCE_PLAN.md'); s=p.read_text(encoding='utf-8')
          s=s.replace('> **UPDATED:** 2026-08-30 Asia/Nicosia.','> **UPDATED:** 2026-09-06 Asia/Nicosia.',1)
          if '# 30A. Clinical Learning Hub' not in s:
              anchor='\n---\n\n# 31. Patient Voice\n'
              if anchor not in s: raise SystemExit('Clinical plan anchor missing')
              s=s.replace(anchor,'\n'+clinical+anchor,1)
          p.write_text(s,encoding='utf-8')

          p=Path('TODO.md'); s=p.read_text(encoding='utf-8')
          s=s.replace('The replacement native RF v2 Clinic Utility is **implemented / release-candidate tested / exact-head reviewed**, but is not merged, deployed, production-smoke-verified or pilot-validated.','The replacement native RF v2 Clinic Utility is **implemented / tested / merged / deployed** at `51714f9c74e96ec4fdf62493a0772ea07fcc8c1a`; authenticated production smoke is still pending, and it is not pilot-validated.',1)
          s=s.replace('## 1.6 G-4 Workspace ergonomics + RF utility navigation / native RF v2 — RELEASE-CANDIDATE TESTED / PR AUTHORIZED','## 1.6 G-4 Workspace ergonomics + RF utility navigation / native RF v2 — MERGED / DEPLOYED / PRODUCTION SMOKE PENDING',1)
          s=s.replace('- [ ] Open the bounded native RF v2 release PR to `main` under explicit product-owner PR authority.','- [x] Open native RF v2 release PR #75 to `main`.',1)
          s=s.replace('- [ ] Merge only with a separate explicit product-owner decision.','- [x] Product owner separately authorized merge; PR #75 squash-merged as `51714f9c74e96ec4fdf62493a0772ea07fcc8c1a`.',1)
          s=s.replace('- [ ] After merge, allow normal Render auto-deploy and complete authenticated production smoke with separate authority.','- [x] Render auto-deploy `dep-dae8doeq1p3s73csqvbg` reached `LIVE` from merge SHA `51714f9c74e96ec4fdf62493a0772ea07fcc8c1a`.\n- [ ] Complete authenticated native RF v2 production smoke; no production config mutation is implied.',1)
          s=s.replace('Native RF v2 is **implemented / release-candidate tested / exact-head reviewed**, not merged, deployed, production-smoke-verified or pilot-validated.','Native RF v2 is **implemented / tested / merged / deployed**, but is not yet production-smoke-verified or pilot-validated.',1)
          s=s.replace('- [ ] Native RF v2 PR / merge / production config verification / deploy / end-to-end production smoke.','- [x] Native RF v2 PR #75 / merge / Render auto-deploy completed.\n- [ ] Native RF v2 authenticated end-to-end production smoke and any separately authorized production-config verification.',1)
          if '## 1.10A Clinical Learning Hub' not in s:
              anchor='\n## 1.11 Thirty-case scored system-assisted baseline\n'
              if anchor not in s: raise SystemExit('TODO learning anchor missing')
              s=s.replace(anchor,'\n'+todo+anchor,1)
          p.write_text(s,encoding='utf-8')

          p=Path('SLICE_PLAN_CURRENT.md'); s=p.read_text(encoding='utf-8')
          s=s.replace('> **STATUS:** APPROVED / FROZEN — IMPLEMENTED / RELEASE-CANDIDATE TESTED / EXACT-HEAD REVIEW PASS — PR AUTHORIZED / PRE-PR HOLD','> **STATUS:** APPROVED / FROZEN — IMPLEMENTED / TESTED / MERGED / DEPLOYED — PRODUCTION SMOKE PENDING',1)
          s=s.replace('> **Production base:** `8aa8b38e3fa9a8f8ba0618868b452b1835be0d47`.','> **Implementation base:** `8aa8b38e3fa9a8f8ba0618868b452b1835be0d47`.\n> **Released production source:** `51714f9c74e96ec4fdf62493a0772ea07fcc8c1a` via PR #75.\n> **Render deploy:** `dep-dae8doeq1p3s73csqvbg` — LIVE.',1)
          s=s.replace('PR                                OPEN / REVIEWABLE','PR                                #75 MERGED',1)
          s=s.replace('Production config, merge, deploy and smoke require separate product-owner authority.','Merge and auto-deploy are complete. Production config remains separately gated; authenticated production smoke is the remaining release-validation step.',1)
          p.write_text(s,encoding='utf-8')

          Path('CURRENT_OPERATIONAL.md').write_text(current,encoding='utf-8')

          p=Path('osteoporosis-change-log.md'); s=p.read_text(encoding='utf-8').rstrip()
          if '## 2026-09-05 — Native RF v2 merged and Render auto-deployed; smoke pending' not in s: s+='\n\n---\n\n'+rf
          if '## 2026-09-06 — Clinical Learning Hub direction approved' not in s: s+='\n\n---\n\n'+learn
          p.write_text(s+'\n',encoding='utf-8')
          PY
      - name: Commit docs reconciliation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CLINICAL_EXCELLENCE_PLAN.md TODO.md SLICE_PLAN_CURRENT.md CURRENT_OPERATIONAL.md osteoporosis-change-log.md
          git diff --cached --check
          git commit -m 'Plan Clinical Learning Hub and reconcile RF release state'
          git push origin HEAD:docs/clinical-learning-hub-rf-post-merge-2026-09-06
