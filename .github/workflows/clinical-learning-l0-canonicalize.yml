name: Clinical Learning L0 canonicalize

on:
  push:
    branches:
      - docs/clinical-learning-hub-l0-main-2026-09-07

permissions:
  contents: write

jobs:
  canonicalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/clinical-learning-hub-l0-main-2026-09-07
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile canonicals
        run: python scripts/clinical_learning_l0_canonicalize.py
      - name: Validate canonical diff
        run: |
          set -euo pipefail
          git diff --check
          grep -q '## 1.10A Clinical Learning Hub' TODO.md
          grep -q '# 30A. Clinical Learning Hub' CLINICAL_EXCELLENCE_PLAN.md
          grep -q 'L-0 CONTRACT FREEZE ACTIVE' CLINICAL_LEARNING_HUB_DESIGN_V1.md
          grep -q 'RF v2 production smoke closed' osteoporosis-change-log.md
      - name: Commit canonical reconciliation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TODO.md CLINICAL_EXCELLENCE_PLAN.md CLINICAL_LEARNING_HUB_DESIGN_V1.md osteoporosis-change-log.md
          git commit -m 'Reconcile RF closure and Learning Hub roadmap'
          git push origin HEAD:docs/clinical-learning-hub-l0-main-2026-09-07
