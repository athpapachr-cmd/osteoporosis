name: Clinical Learning L1B regression gate

on:
  push:
    branches:
      - feat/clinical-learning-l1b-learning-loop-2026-09-08
  pull_request:
    paths:
      - 'clinical_learning/**'
      - 'static/clinical-learning/**'
      - 'test_clinical_learning_l1b_*.py'
      - 'schemas/clinical_learning_loop_v1.yaml'
      - 'CLINICAL_LEARNING_LOOP_DESIGN_V1.md'
      - '.github/workflows/clinical-learning-l1b-tests.yml'
      - '.github/workflows/clinical-learning-l1-tests.yml'
      - 'SLICE_PLAN_CURRENT.md'
      - 'CURRENT_OPERATIONAL.md'
      - 'TODO.md'
      - 'CLINICAL_EXCELLENCE_PLAN.md'
      - 'osteoporosis-change-log.md'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: L1B Python syntax
        run: |
          python -m py_compile \
            clinical_learning/models.py \
            clinical_learning/privacy.py \
            clinical_learning/contracts.py \
            clinical_learning/persistence.py \
            clinical_learning/service.py \
            clinical_learning/learning_loop.py \
            clinical_learning/ingress.py \
            clinical_learning/l1b_runtime.py \
            clinical_learning/api.py \
            test_clinical_learning_l1b_learning_loop.py

      - name: L1B browser syntax
        run: |
          node --check static/clinical-learning/app.js
          node --check static/clinical-learning/l1b.js

      - name: L1B focused tests
        run: python -m unittest -v test_clinical_learning_l1b_learning_loop.py

      - name: Inherited L1 tests
        run: python -m unittest discover -v -p 'test_clinical_learning_l1_*.py'

      - name: Inherited L0 contracts
        run: python -m unittest -v test_clinical_learning_l0_contract.py test_clinical_learning_l0_boundary.py

      - name: Frozen owner guard
        run: |
          set -euo pipefail
          base="$(git merge-base origin/main HEAD)"
          git diff --quiet "$base" HEAD -- \
            schemas/clinical_learning_core_v1.yaml \
            schemas/clinical_learning_l1_boundary_v1.yaml \
            schemas/clinical_learning_contract_manifest_v1.yaml \
            schemas/clinical_learning_design_fixtures_v1.yaml \
            schemas/osteoporosis_foundation_map_v1.yaml

      - name: Scope guard
        run: |
          set -euo pipefail
          base="$(git merge-base origin/main HEAD)"
          changed="$(git diff --name-only "$base" HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -E '^(clinic_utilities/physio_referral_|clinic_utilities/contracts/cu1_|static/clinic-utilities/physio-referral/|clinic_utilities/rf/|static/clinic-utilities/rf/)' ; then
            echo 'L1B adjacent-owner leak.' >&2
            exit 1
          fi
          if printf '%s\n' "$changed" | grep -Ev '^(clinical_learning/.*|static/clinical-learning/.*|test_clinical_learning_l1b_.*\.py|\.github/workflows/clinical-learning-l1b-tests\.yml|\.github/workflows/clinical-learning-l1-tests\.yml|schemas/clinical_learning_loop_v1\.yaml|CLINICAL_LEARNING_LOOP_DESIGN_V1\.md|SLICE_PLAN_CURRENT\.md|CURRENT_OPERATIONAL\.md|TODO\.md|CLINICAL_EXCELLENCE_PLAN\.md|osteoporosis-change-log\.md)$' ; then
            echo 'Unexpected file outside bounded L1B owners.' >&2
            exit 1
          fi

      - name: Diff hygiene
        run: |
          set -euo pipefail
          base="$(git merge-base origin/main HEAD)"
          git diff --check "$base" HEAD
