name: RF v2 provenance hardening patch

on:
  push:
    branches:
      - feat/clinic-utilities-rf-v2-native-2026-09-05

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/clinic-utilities-rf-v2-native-2026-09-05
          fetch-depth: 0

      - name: Correct manual procedure provenance
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ('clinic_utilities/rf/persistence.py', 'test_rf_v2_native.py'):
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              if 'legacy_manual' not in text:
                  raise SystemExit(f'expected provenance marker missing in {name}')
              path.write_text(text.replace('legacy_manual', 'clinician_manual'), encoding='utf-8')
          PY

      - name: Commit provenance correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add clinic_utilities/rf/persistence.py test_rf_v2_native.py
          git diff --cached --check
          git commit -m 'Correct RF manual procedure provenance'
          git push origin HEAD:feat/clinic-utilities-rf-v2-native-2026-09-05
