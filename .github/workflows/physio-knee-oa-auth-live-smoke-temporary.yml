name: Temporary authenticated Knee OA live smoke

on:
  push:
    branches:
      - ops/physio-knee-oa-auth-live-smoke-2026-09-12

permissions:
  contents: read

jobs:
  authenticated-live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_URL: https://ortho-reception-backend.onrender.com
      CLINICAL_DATA_KEY: ${{ secrets.CLINICAL_DATA_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require pre-existing protected smoke credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLINICAL_DATA_KEY:-}" ]; then
            echo 'CLINICAL_DATA_KEY is not available to GitHub Actions; authenticated live smoke cannot be run from CI.'
            exit 2
          fi
          echo 'Protected smoke credential is available; value will not be printed.'

      - name: Authenticated page and bootstrap smoke
        shell: bash
        run: |
          set -euo pipefail
          page_code=$(curl --retry 3 --retry-delay 2 -sS -o /tmp/page.html -w '%{http_code}' \
            -H "X-Clinical-Key: ${CLINICAL_DATA_KEY}" \
            "$BASE_URL/clinical/clinic-utilities/physio-referral")
          test "$page_code" = '200'
          grep -q 'Οστεοαρθρίτιδα γόνατος' /tmp/page.html
          grep -q 'product-more-v3.js' /tmp/page.html

          bootstrap_code=$(curl --retry 3 --retry-delay 2 -sS -o /tmp/bootstrap.json -w '%{http_code}' \
            -H "X-Clinical-Key: ${CLINICAL_DATA_KEY}" \
            "$BASE_URL/clinical/clinic-utilities/physio-referral/api/product/bootstrap")
          test "$bootstrap_code" = '200'
          jq -e '.synthetic_only == false' /tmp/bootstrap.json >/dev/null
          jq -e '.deployment_context == "clinical_excellence_cockpit"' /tmp/bootstrap.json >/dev/null
          jq -e '.defaults == ["therapeutic_exercise","progressive_strengthening","education_and_self_management"]' /tmp/bootstrap.json >/dev/null
          echo 'AUTHENTICATED LIVE PAGE + BOOTSTRAP PASS'

      - name: Authenticated deterministic Knee OA projection smoke
        shell: bash
        run: |
          set -euo pipefail
          package_version=$(jq -r '.package_version' /tmp/bootstrap.json)
          draft_id=$(python - <<'PY'
          import uuid
          print(uuid.uuid4())
          PY
          )
          jq -n \
            --arg draft_id "$draft_id" \
            --arg package_version "$package_version" \
            '{
              draft_id: $draft_id,
              revision: 0,
              package_version: $package_version,
              synthetic_only: false,
              state: {
                laterality: "right",
                formal_assertion_state: "yes",
                findings: [],
                functional_impairments: [],
                rehab_directions: ["therapeutic_exercise","progressive_strengthening","education_and_self_management"],
                adjunct_options: [],
                goals: [],
                phenotype: {},
                qualifiers: {},
                explicit_restrictions: [],
                clinician_free_text_optional: "",
                safety_flags: []
              },
              dismissed: []
            }' > /tmp/request.json

          project_code=$(curl --retry 3 --retry-delay 2 -sS -o /tmp/project.json -w '%{http_code}' \
            -H "X-Clinical-Key: ${CLINICAL_DATA_KEY}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/request.json \
            "$BASE_URL/clinical/clinic-utilities/physio-referral/api/product/project")
          test "$project_code" = '200'
          jq -e '.gate.allowed == true and .gate.blocked == false' /tmp/project.json >/dev/null
          jq -e '.text | contains("δεξιού γόνατος")' /tmp/project.json >/dev/null
          jq -e '.text | (contains("NICE") | not)' /tmp/project.json >/dev/null
          echo 'AUTHENTICATED LIVE DETERMINISTIC PROJECTION PASS'

      - name: Authenticated safety fail-closed smoke
        shell: bash
        run: |
          set -euo pipefail
          jq '.state.safety_flags = ["infection_or_septic_joint_concern"] | .revision = 1' /tmp/request.json > /tmp/blocked-request.json
          blocked_code=$(curl --retry 3 --retry-delay 2 -sS -o /tmp/blocked.json -w '%{http_code}' \
            -H "X-Clinical-Key: ${CLINICAL_DATA_KEY}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/blocked-request.json \
            "$BASE_URL/clinical/clinic-utilities/physio-referral/api/product/project")
          test "$blocked_code" = '200'
          jq -e '.gate.allowed == false' /tmp/blocked.json >/dev/null
          jq -e '.gate.blocked == true' /tmp/blocked.json >/dev/null
          jq -e '.text == null' /tmp/blocked.json >/dev/null
          echo 'AUTHENTICATED LIVE SAFETY FAIL-CLOSED PASS'

      - name: Assert smoke-data boundary
        run: |
          echo 'Only generated UUID and synthetic/non-identifiable Knee-OA state were sent.'
          echo 'No patient identifiers, patient history, password, session cookie, or secret value were printed.'
