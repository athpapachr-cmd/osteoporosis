name: Temporary accidental branch cleanup

on:
  push:
    branches:
      - chore/atomic-canonical-checkpoints-2026-09-15

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Delete accidental empty branches
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete tmp-placeholder noop2 noop3
