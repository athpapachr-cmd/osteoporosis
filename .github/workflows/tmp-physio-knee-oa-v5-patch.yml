name: Temporary Knee OA v5 patch

on:
  push:
    branches:
      - fix/physio-knee-oa-v5-optional-refinement-prose-2026-09-12
    paths:
      - '.github/workflows/tmp-physio-knee-oa-v5-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/physio-knee-oa-v5-optional-refinement-prose-2026-09-12
          fetch-depth: 0
      - name: Patch remaining v5 files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def rep(path, old, new):
              p=Path(path); text=p.read_text(encoding='utf-8')
              n=text.count(old)
              assert n==1, f'{path}: expected one match, found {n}: {old[:80]!r}'
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          for path in [
              'clinic_utilities/physio_referral_product/prototype/qualifiers.js',
              'static/clinic-utilities/physio-referral/product-qualifiers.js',
          ]:
              rep(path,
                  "  weakness: {objective: 'Αντικειμενική στην εξέταση', quadriceps_exam: 'Τετρακέφαλος στην εξέταση'},\n  weakness_summary: {objective: 'Αντικειμενική', quadriceps_exam: 'Τετρακέφαλος · εξέταση'},\n  atrophy: {quadriceps: 'Τετρακέφαλος', peri_knee_general: 'Περιαρθρικά'},",
                  "  weakness: {objective: 'Μυϊκή αδυναμία στην εξέταση', quadriceps_exam: 'Αδυναμία τετρακεφάλου στην εξέταση'},\n  weakness_summary: {objective: 'Αδυναμία · εξέταση', quadriceps_exam: 'Αδυναμία τετρακεφάλου'},\n  atrophy: {quadriceps: 'Ατροφία τετρακεφάλου', peri_knee_general: 'Γενική περιαρθρική μυϊκή ατροφία'},")

          for path in [
              'clinic_utilities/physio_referral_product/prototype/more_v3.js',
              'static/clinic-utilities/physio-referral/product-more-v3.js',
          ]:
              rep(path,
                  "const V3_DUPLICATED_FINDINGS = new Set(['pain','objective_weakness','quadriceps_weakness','extension_lag','effusion','tenderness']);",
                  "const V3_DUPLICATED_FINDINGS = new Set(['pain','joint_line_pain','anterior_peripatellar_pain','objective_weakness','quadriceps_weakness','extension_lag','effusion','tenderness']);")
              rep(path,
                  "    if(qualifierState.weakness_detail) values.push(QLABELS.weakness_summary[qualifierState.weakness_detail] || 'Αδυναμία στην εξέταση');\n    if(state.findings.includes('extension_lag')) values.push(label('extension_lag'));",
                  "    if(qualifierState.weakness_detail) values.push(QLABELS.weakness_summary[qualifierState.weakness_detail] || 'Αδυναμία στην εξέταση');\n    if(qualifierState.visible_atrophy) values.push(qualifierState.atrophy_location==='quadriceps'?'Ατροφία τετρακεφάλου':'Μυϊκή ατροφία');\n    if(state.findings.includes('extension_lag')) values.push(label('extension_lag'));")
              rep(path,
                  "      make('div',{class:'v3-inline-choices'},[\n        btn(QLABELS.weakness.objective,{class:'v3-qualifier-choice','data-q-weakness':'objective','aria-pressed':String(qualifierState.weakness_detail==='objective')}),\n        btn(QLABELS.weakness.quadriceps_exam,{class:'v3-qualifier-choice','data-q-weakness':'quadriceps_exam','aria-pressed':String(qualifierState.weakness_detail==='quadriceps_exam')}),\n        btn('Ατροφία',{class:'v3-qualifier-choice','data-q-atrophy':'','aria-pressed':String(qualifierState.visible_atrophy)}),\n      ]),\n      make('div',{id:'v3AtrophyLocation',class:'v3-inline-choices v3-nested'},Object.entries(QLABELS.atrophy).map(([id,name])=>btn(name,{class:'v3-qualifier-choice','data-q-atrophy-location':id,'aria-pressed':String(qualifierState.atrophy_location===id)}))),",
                  "      make('div',{class:'v3-inline-choices'},[\n        btn(QLABELS.weakness.objective,{class:'v3-qualifier-choice','data-q-weakness':'objective','aria-pressed':String(qualifierState.weakness_detail==='objective')}),\n        btn(QLABELS.weakness.quadriceps_exam,{class:'v3-qualifier-choice','data-q-weakness':'quadriceps_exam','aria-pressed':String(qualifierState.weakness_detail==='quadriceps_exam')}),\n        btn('Ατροφία τετρακεφάλου',{class:'v3-qualifier-choice','data-v3-atrophy-quadriceps':'','aria-pressed':String(qualifierState.visible_atrophy&&qualifierState.atrophy_location==='quadriceps')}),\n      ]),")
              rep(path,
                  "  const input=$('#v3FfdDegrees');if(input&&document.activeElement!==input)input.value=qualifierState.fixed_flexion_deformity_deg??'';\n  const atrophy=$('#v3AtrophyLocation');if(atrophy)atrophy.hidden=!qualifierState.visible_atrophy;\n  v3SyncFavoriteButtons();",
                  "  const input=$('#v3FfdDegrees');if(input&&document.activeElement!==input)input.value=qualifierState.fixed_flexion_deformity_deg??'';\n  const quadAtrophy=$('#sheet [data-v3-atrophy-quadriceps]');if(quadAtrophy)quadAtrophy.setAttribute('aria-pressed',String(qualifierState.visible_atrophy&&qualifierState.atrophy_location==='quadriceps'));\n  v3SyncFavoriteButtons();")
              rep(path,
                  "  if(b.dataset.v3Category){v3OpenCategorySheet(b.dataset.v3Category,b.dataset.v3Focus||'');return;}\n  if(b.closest('#sheet')&&sheetView?.type==='advanced-v3')queueMicrotask(v3SyncSheetState);",
                  "  if(b.dataset.v3Category){v3OpenCategorySheet(b.dataset.v3Category,b.dataset.v3Focus||'');return;}\n  if(b.hasAttribute('data-v3-atrophy-quadriceps')&&sheetView?.type==='advanced-v3'){\n    const active=qualifierState.visible_atrophy&&qualifierState.atrophy_location==='quadriceps';\n    qualifierState.visible_atrophy=!active;\n    qualifierState.atrophy_location=!active?'quadriceps':null;\n    changed('quadriceps_atrophy_exam');\n    queueMicrotask(v3SyncSheetState);\n    return;\n  }\n  if(b.closest('#sheet')&&sheetView?.type==='advanced-v3')queueMicrotask(v3SyncSheetState);")

          q='clinic_utilities/physio_referral_product/prototype/qualifier_overlay.py'
          rep(q,
              '    findings = list(result.get("findings", []))\n    weakness_detail = q.get("weakness_detail")',
              '    findings = list(result.get("findings", []))\n    if q.get("pain_locations"):\n        findings = [v for v in findings if v not in {"joint_line_pain", "anterior_peripatellar_pain"}]\n        if "pain" not in findings:\n            findings.append("pain")\n    weakness_detail = q.get("weakness_detail")')
          rep(q,
              '    return "πόνο κυρίως " + _join_el([phrases[v] for v in values if v in phrases])',
              '    return "πόνο " + _join_el([phrases[v] for v in values if v in phrases])')

          p='clinic_utilities/physio_referral_product/knee_oa_presentation_v4.py'
          rep(p,
              '    presented["text"] = text\n    return presented',
              '    if " Επιπλέον στόχος: " in text:\n        text = text.replace(" Επιπλέον στόχος: ", " Παράλληλα, στους λειτουργικούς στόχους περιλαμβάνεται και η ", 1)\n    if " Επιπλέον στόχοι: " in text:\n        text = text.replace(" Επιπλέον στόχοι: ", " Παράλληλα, στους λειτουργικούς στόχους περιλαμβάνονται επίσης ", 1)\n\n    if ("Η κλινική εικόνα" in text or "Λειτουργικά," in text) and " Παρακαλώ για φυσιοθεραπευτική αξιολόγηση" in text:\n        text = text.replace(" Παρακαλώ για φυσιοθεραπευτική αξιολόγηση", "\\n\\nΠαρακαλώ για φυσιοθεραπευτική αξιολόγηση", 1)\n\n    presented["text"] = text\n    return presented')
          PY

          node --check clinic_utilities/physio_referral_product/prototype/more_v3.js
          node --check static/clinic-utilities/physio-referral/product-more-v3.js
          node --check clinic_utilities/physio_referral_product/prototype/qualifiers.js
          node --check static/clinic-utilities/physio-referral/product-qualifiers.js
          python -m py_compile clinic_utilities/physio_referral_product/prototype/qualifier_overlay.py clinic_utilities/physio_referral_product/knee_oa_presentation_v4.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add clinic_utilities/physio_referral_product static/clinic-utilities/physio-referral
          git commit -m 'Simplify Knee-OA exam choices and referral prose'
          git push origin HEAD:fix/physio-knee-oa-v5-optional-refinement-prose-2026-09-12
