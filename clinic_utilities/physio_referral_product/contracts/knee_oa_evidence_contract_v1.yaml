    - education_and_self_management
  phenotype_suggestions:
    active_rom_restricted: [mobility_exercise_when_restricted]
    passive_rom_restricted: [mobility_exercise_when_restricted]
    quadriceps_weakness: [progressive_strengthening]
    objective_weakness: [progressive_strengthening]
    balance_deficit: [neuromuscular_proprioceptive_training, balance_stepping_recovery_training]
    subjective_giving_way: [neuromuscular_proprioceptive_training]
    recurrent_instability_episode: [neuromuscular_proprioceptive_training]
    walking_limitation: [graded_activity_exposure, progressive_endurance_or_capacity_work, gait_walking_practice]
    walking_tolerance: [graded_activity_exposure, progressive_endurance_or_capacity_work, gait_walking_practice]
    sport_or_exercise_limitation: [graded_activity_exposure]
    stairs: [functional_task_retraining]
    sit_to_stand: [functional_task_retraining]
    squat: [functional_task_retraining]
    kneeling: [functional_task_retraining]
    patient_priority_activity: [graded_activity_exposure, functional_task_retraining]
