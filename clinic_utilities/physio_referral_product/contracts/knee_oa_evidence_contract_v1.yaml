version: knee_oa_evidence_contract_v1
status: design_candidate_review_hardened
reviewed_on: 2026-09-11
domain: physio_referral_product
profile_id: knee
route_id: knee_osteoarthritis
runtime_authorized: false
patient_data_persistence: false

evidence_state_enum:
  - recommended_or_supported
  - conditional_or_context_dependent
  - limited_or_insufficient_evidence
  - guideline_conflict_or_mixed
  - recommendation_against_routine_use
  - not_yet_assessed

source_direction_enum:
  - strong_for
  - for
  - conditional_for
  - weak_for
  - neutral_or_insufficient
  - conditional_against
  - weak_against
  - against
  - not_addressed

support_scope_enum:
  - direct_item_recommendation
  - named_component_of_broader_recommendation
  - broader_recommendation_only
  - contextual_clinical_mapping

source_registry:
  VA_DOD_OA_2026:
    organization: US Department of Veterans Affairs / Department of Defense
    title: Clinical Practice Guideline for the Non-Surgical Management of Hip & Knee Osteoarthritis
    version: "3.0"
    publication_year: 2026
    evidence_window_through: 2025-07-31
    locator: https://healthquality.va.gov/HEALTHQUALITY/guidelines/CD/OA/index.asp
    methodology: GRADE
    reviewed_on: 2026-09-11
    status: active_reviewed
  ACE_KNEE_OA_2026:
    organization: Singapore Agency for Care Effectiveness
    title: Management of knee osteoarthritis - a joint effort with patients
    version: 2026-04
    publication_year: 2026
    publication_date: 2026-04-24
    locator: https://www.ace-hta.gov.sg/healthcare-professionals/ace-repository-for-clinical-guidelines/management-of-knee-osteoarthritis---a-joint-effort-with-patients-acg/
    reviewed_on: 2026-09-11
    status: active_reviewed
  EULAR_CORE_2023_UPDATE:
    organization: European Alliance of Associations for Rheumatology
    title: EULAR recommendations for the non-pharmacological core management of hip and knee osteoarthritis - 2023 update
    guideline_version: "2023 update"
    publication_year: 2024
    locator: https://pmc.ncbi.nlm.nih.gov/articles/PMC11103326/
    methodology: EULAR recommendations with level of evidence and strength
    reviewed_on: 2026-09-11
    status: active_reviewed
  NICE_NG226_2022:
    organization: National Institute for Health and Care Excellence
    title: Osteoarthritis in over 16s - diagnosis and management
    guideline_id: NG226
    publication_year: 2022
    publication_date: 2022-10-19
    locator: https://www.nice.org.uk/guidance/ng226/chapter/recommendations
    reviewed_on: 2026-09-11
    status: active_reviewed
  AAOS_OAK3_2021:
    organization: American Academy of Orthopaedic Surgeons
    title: Management of Osteoarthritis of the Knee (Non-Arthroplasty), Third Edition
    guideline_version: "3rd edition"
    publication_year: 2021
    publication_date: 2021-08-31
    locator: https://www.aaos.org/OAK3CPG
    reviewed_on: 2026-09-11
    status: active_reviewed
  ACR_AF_2019:
    organization: American College of Rheumatology / Arthritis Foundation
    title: 2019 Guideline for the Management of Osteoarthritis of the Hand, Hip, and Knee
    guideline_version: "2019"
    publication_year: 2020
    locator: https://pmc.ncbi.nlm.nih.gov/articles/PMC10518852/
    methodology: GRADE
    reviewed_on: 2026-09-11
    status: active_reviewed

resolution_policy:
  arithmetic_scoring_forbidden: true
  source_specific_positions_retained: true
  source_claim_scope_retained: true
  framework_conflict_must_surface: true
  insufficient_is_not_against: true
  source_year_distinct_from_reviewed_on: true
  broad_recommendation_must_not_be_relabelled_as_item_specific_strength: true
  rules:
    recommended_or_supported: material_alignment_for_without_material_against
    conditional_or_context_dependent: support_or_clinical_relevance_requires_explicit_context_without_material_direction_conflict
    limited_or_insufficient_evidence: predominant_insufficient_or_uncertain_without_material_for_or_against
    guideline_conflict_or_mixed: material_direction_or_practical_recommendation_conflict_between_reviewed_sources
    recommendation_against_routine_use: explicit_against_position_with_no_material_current_support_for_same_context
    not_yet_assessed: evidence_review_not_completed

default_plan:
  implicit:
    - physiotherapy_assessment_and_individualized_active_rehabilitation
  selected:
    - therapeutic_exercise
    - progressive_strengthening
    - education_and_self_management

items:
  physiotherapy_assessment_and_individualized_active_rehabilitation:
    role: implicit_core_request
    cu1_target_ids: [physiotherapy_assessment_and_individualized_active_rehabilitation]
    app_state: recommended_or_supported
    default_selected: true
    visible_default_row: false
    purpose_summary_el: Εξατομικευμένη δομημένη φυσιοθεραπευτική αποκατάσταση με βάση λειτουργία, προτιμήσεις και κλινικό πλαίσιο.
    positions:
      - {source_id: VA_DOD_OA_2026, direction: weak_for, support_scope: direct_item_recommendation, native_strength: "Weak for", summary: "Structured physical therapy suggested for hip/knee OA."}
      - {source_id: ACE_KNEE_OA_2026, direction: for, support_scope: direct_item_recommendation, native_strength: null, summary: "Allied-health referral may support supervised exercise and other non-pharmacological strategies."}
      - {source_id: EULAR_CORE_2023_UPDATE, direction: for, support_scope: broader_recommendation_only, native_strength: "A; LoE 1a", summary: "Individualised multicomponent non-pharmacological plan."}

  therapeutic_exercise:
    role: core_visible
    cu1_target_ids: [therapeutic_exercise]
    app_state: recommended_or_supported
    default_selected: true
    omission_suggestion: true
    purpose_summary_el: Θεραπευτική άσκηση ως βασικός πυρήνας για βελτίωση πόνου και λειτουργικότητας, προσαρμοσμένη στον ασθενή.
    positions:
      - {source_id: NICE_NG226_2022, direction: for, support_scope: direct_item_recommendation, native_strength: null, summary: "Offer tailored therapeutic exercise to all people with OA."}
      - {source_id: EULAR_CORE_2023_UPDATE, direction: strong_for, support_scope: direct_item_recommendation, native_strength: "A; LoE 1a", summary: "Offer exercise with adequate dosage/progression tailored to function and preferences."}
      - {source_id: AAOS_OAK3_2021, direction: strong_for, support_scope: direct_item_recommendation, native_strength: Strong, summary: "Supervised, unsupervised and/or aquatic exercise recommended over no exercise for pain/function."}
      - {source_id: ACR_AF_2019, direction: strong_for, support_scope: direct_item_recommendation, native_strength: Strong, summary: "Exercise strongly recommended for knee OA."}
      - {source_id: ACE_KNEE_OA_2026, direction: for, support_scope: direct_item_recommendation, native_strength: null, summary: "Exercise programmes are a mainstay strategy."}
      - {source_id: VA_DOD_OA_2026, direction: weak_for, support_scope: broader_recommendation_only, native_strength: "Weak for", summary: "Structured PT and tailored physical activity supported."}

  progressive_strengthening:
    role: core_visible
    cu1_target_ids: [progressive_strengthening]
    app_state: recommended_or_supported
    default_selected: true
    omission_suggestion: true
    purpose_summary_el: Προοδευτική ενδυνάμωση ως μέρος της θεραπευτικής άσκησης, χωρίς επιβολή ενός καθολικού πρωτοκόλλου δόσης.
    positions:
      - {source_id: NICE_NG226_2022, direction: for, support_scope: named_component_of_broader_recommendation, native_strength: null, summary: "Local muscle strengthening is an example of tailored therapeutic exercise."}
      - {source_id: EULAR_CORE_2023_UPDATE, direction: for, support_scope: named_component_of_broader_recommendation, native_strength: "A applies to exercise programme overall", summary: "Strength exercise is explicitly named as one supported exercise mode."}
      - {source_id: ACR_AF_2019, direction: for, support_scope: named_component_of_broader_recommendation, native_strength: "Strong applies to exercise overall", summary: "Strengthening is explicitly listed as one exercise mode; no hierarchy over other exercise modes."}
      - {source_id: AAOS_OAK3_2021, direction: for, support_scope: broader_recommendation_only, native_strength: "Strong applies to exercise overall", summary: "Exercise is strongly recommended; this source does not make progressive strengthening uniquely superior."}
      - {source_id: VA_DOD_OA_2026, direction: neutral_or_insufficient, support_scope: direct_item_recommendation, native_strength: "Neither for nor against", summary: "Insufficient evidence to prefer one structured PT type/mode over another."}

  education_and_self_management:
    role: core_visible
    cu1_target_ids: [education_and_self_management]
    app_state: recommended_or_supported
    default_selected: true
    omission_suggestion: true
    purpose_summary_el: Εκπαίδευση και αυτοδιαχείριση για κατανόηση, συνέπεια στην άσκηση και λειτουργική διαχείριση της οστεοαρθρίτιδας.
    positions:
      - {source_id: EULAR_CORE_2023_UPDATE, direction: strong_for, support_scope: direct_item_recommendation, native_strength: "A; LoE 1a", summary: "Information, education and self-management recommended and prioritised."}
      - {source_id: AAOS_OAK3_2021, direction: strong_for, support_scope: direct_item_recommendation, native_strength: Strong, summary: "Self-management and patient education recommended."}
      - {source_id: ACR_AF_2019, direction: strong_for, support_scope: direct_item_recommendation, native_strength: Strong, summary: "Self-efficacy/self-management strongly recommended."}
      - {source_id: NICE_NG226_2022, direction: for, support_scope: direct_item_recommendation, native_strength: null, summary: "Provide information/support and consider combining exercise with education/behaviour change."}
      - {source_id: ACE_KNEE_OA_2026, direction: for, support_scope: direct_item_recommendation, native_strength: null, summary: "Patient education is a mainstay strategy."}
      - {source_id: VA_DOD_OA_2026, direction: weak_for, support_scope: direct_item_recommendation, native_strength: "Weak for", summary: "Tailored education and physical activity suggested for self-management."}

  graded_activity_exposure:
    role: contextual_rehab
    cu1_target_ids: [graded_activity_exposure]
    app_state: conditional_or_context_dependent
    default_selected: false
    omission_suggestion: false
    suggestion_triggers: [walking_limitation, walking_tolerance, sport_or_exercise_limitation, patient_priority_activity]
    purpose_summary_el: Σταδιακή αύξηση δραστηριότητας όταν υπάρχει συγκεκριμένος περιορισμός ή στόχος, χωρίς να παρουσιάζεται ως ξεχωριστή καθολική guideline απαίτηση.
    positions:
      - {source_id: EULAR_CORE_2023_UPDATE, direction: for, support_scope: named_component_of_broader_recommendation, native_strength: "A applies to exercise programme overall", summary: "Exercise dosage/progression is tailored; exercise is preferably embedded in an individual physical-activity plan. The update found no specific evidence for pacing/maintenance of activity as a standalone element."}
      - {source_id: ACE_KNEE_OA_2026, direction: for, support_scope: broader_recommendation_only, native_strength: null, summary: "Exercise/physical activity is part of mainstay management."}
      - {source_id: VA_DOD_OA_2026, direction: weak_for, support_scope: broader_recommendation_only, native_strength: "Weak for", summary: "Tailored physical activity suggested."}

  progressive_endurance_or_capacity_work:
    role: contextual_rehab
    cu1_target_ids: [progressive_endurance_or_capacity_work]
    app_state: conditional_or_context_dependent
    default_selected: false
    suggestion_triggers: [walking_limitation, walking_tolerance, community_mobility]
    purpose_summary_el: Αερόβια ή λειτουργική εργασία αντοχής όταν η βάδιση ή η γενική ικανότητα είναι σημαντικός περιορισμός.
    positions:
      - {source_id: EULAR_CORE_2023_UPDATE, direction: for, support_scope: named_component_of_broader_recommendation, native_strength: "A applies to exercise programme overall", summary: "Aerobic exercise is explicitly named among supported exercise modes."}
      - {source_id: NICE_NG226_2022, direction: for, support_scope: named_component_of_broader_recommendation, native_strength: null, summary: "General aerobic fitness is an example of therapeutic exercise."}
      - {source_id: ACR_AF_2019, direction: for, support_scope: named_component_of_broader_recommendation, native_strength: "Strong applies to exercise overall", summary: "Walking/aquatic and other exercise modes are included without hierarchy."}

  mobility_exercise_when_restricted:
    role: contextual_rehab
    cu1_target_ids: [mobility_exercise_when_restricted]
    app_state: conditional_or_context_dependent
    default_selected: false
    suggestion_triggers: [active_rom_restricted, passive_rom_restricted]
    purpose_summary_el: Κινητικότητα όταν υπάρχει πραγματικός περιορισμός εύρους κίνησης.
    positions:
      - {source_id: EULAR_CORE_2023_UPDATE, direction: for, support_scope: named_component_of_broader_recommendation, native_strength: "A applies to exercise programme overall", summary: "Flexibility is explicitly named among exercise modes."}
      - {source_id: AAOS_OAK3_2021, direction: for, support_scope: broader_recommendation_only, native_strength: "Strong applies to exercise overall", summary: "Exercise is strongly supported overall; this is not a separate strong recommendation for mobility exercise."}

  neuromuscular_proprioceptive_training:
    role: contextual_rehab
    cu1_target_ids: [neuromuscular_proprioceptive_training]
    app_state: conditional_or_context_dependent
    default_selected: false
    suggestion_triggers: [balance_deficit, subjective_giving_way, recurrent_instability_episode]
    purpose_summary_el: Νευρομυϊκή/ιδιοδεκτική εκπαίδευση όταν η ισορροπία ή ο λειτουργικός έλεγχος είναι σχετικό πρόβλημα.
    positions:
      - {source_id: AAOS_OAK3_2021, direction: for, support_scope: direct_item_recommendation, native_strength: Moderate, summary: "Neuromuscular training with traditional exercise may improve performance function and walking speed."}
      - {source_id: EULAR_CORE_2023_UPDATE, direction: for, support_scope: named_component_of_broader_recommendation, native_strength: "A applies to exercise programme overall", summary: "Neuromotor exercise is explicitly named among recommended exercise modes."}
      - {source_id: ACR_AF_2019, direction: conditional_for, support_scope: direct_item_recommendation, native_strength: Conditional, summary: "Balance exercise conditionally recommended."}

  balance_stepping_recovery_training:
    role: contextual_rehab
    cu1_target_ids: [balance_stepping_recovery_training]
    app_state: conditional_or_context_dependent
    default_selected: false
    suggestion_triggers: [balance_deficit]
    purpose_summary_el: Εκπαίδευση ισορροπίας όταν υπάρχει αξιολογημένο σχετικό έλλειμμα.
    positions:
      - {source_id: ACR_AF_2019, direction: conditional_for, support_scope: direct_item_recommendation, native_strength: Conditional, summary: "Balance exercise conditionally recommended."}
      - {source_id: EULAR_CORE_2023_UPDATE, direction: for, support_scope: named_component_of_broader_recommendation, native_strength: "A applies to exercise programme overall", summary: "Neuromotor exercise includes balance and coordination."}
      - {source_id: AAOS_OAK3_2021, direction: for, support_scope: direct_item_recommendation, native_strength: Moderate, summary: "Neuromuscular training may improve performance function/walking speed."}

  gait_walking_practice:
    role: contextual_rehab
    cu1_target_ids: [gait_walking_practice]
    app_state: conditional_or_context_dependent
    default_selected: false
    suggestion_triggers: [walking_limitation, walking_tolerance]
    purpose_summary_el: Λειτουργική επανεκπαίδευση βάδισης όταν η βάδιση αποτελεί κύριο περιορισμό.
    positions:
      - {source_id: EULAR_CORE_2023_UPDATE, direction: for, support_scope: named_component_of_broader_recommendation, native_strength: "A applies to exercise programme overall", summary: "Neuromotor exercise explicitly includes gait; management is tailored to activity and participation."}
      - {source_id: VA_DOD_OA_2026, direction: weak_for, support_scope: contextual_clinical_mapping, native_strength: "Weak for structured PT", summary: "Structured PT is supported, but this is not a stand-alone gait-training recommendation."}

  functional_task_retraining:
    role: contextual_rehab
    cu1_target_ids: [functional_task_retraining]
    app_state: conditional_or_context_dependent
    default_selected: false
    suggestion_triggers: [stairs, sit_to_stand, squat, kneeling, patient_priority_activity]
    purpose_summary_el: Στοχευμένη λειτουργική επανεκπαίδευση για το συγκεκριμένο task που περιορίζει τον ασθενή.
    positions:
      - {source_id: EULAR_CORE_2023_UPDATE, direction: for, support_scope: contextual_clinical_mapping, native_strength: "A applies to individualised multicomponent plan", summary: "Activity and participation are part of the individualized assessment/plan; no separate task-retraining recommendation is claimed."}
      - {source_id: VA_DOD_OA_2026, direction: weak_for, support_scope: contextual_clinical_mapping, native_strength: "Weak for structured PT", summary: "Structured PT is suggested; task-specific retraining is a clinical mapping, not a source-specific stand-alone recommendation."}

  home_exercise_programme:
    role: contextual_delivery
    cu1_target_ids: [home_exercise_programme]
    app_state: conditional_or_context_dependent
    default_selected: false
    purpose_summary_el: Πρόγραμμα στο σπίτι ως μία αποδεκτή μορφή παράδοσης, ανάλογα με ανάγκες, προτιμήσεις και πρόσβαση.
    positions:
      - {source_id: AAOS_OAK3_2021, direction: for, support_scope: direct_item_recommendation, native_strength: Strong, summary: "Unsupervised exercise is recommended over no exercise; this does not prove it superior to supervised delivery."}
      - {source_id: EULAR_CORE_2023_UPDATE, direction: for, support_scope: direct_item_recommendation, native_strength: "A; LoE 1a", summary: "Supervised/unsupervised and other delivery modes should be selected according to availability/preferences."}
      - {source_id: VA_DOD_OA_2026, direction: neutral_or_insufficient, support_scope: direct_item_recommendation, native_strength: "Neither for nor against", summary: "Insufficient evidence to recommend one structured PT type/mode over another."}

  walking_aid_assessment_and_training:
    role: contextual_support
    cu1_target_ids: [walking_aid_assessment_and_training]
    app_state: conditional_or_context_dependent
    default_selected: false
    current_knee_ui_exposed: false
    integration_status: existing_canonical_id_requires_future_presentation_scope_amendment
    auto_suggestion: false
    purpose_summary_el: Αξιολόγηση/εκπαίδευση βοηθήματος βάδισης σε επιλεγμένους ασθενείς με ουσιαστικό περιορισμό.
    positions:
      - {source_id: EULAR_CORE_2023_UPDATE, direction: for, support_scope: direct_item_recommendation, native_strength: "A; LoE 1b", summary: "Consider walking aids and assistive devices to reduce pain and increase participation."}
      - {source_id: NICE_NG226_2022, direction: conditional_for, support_scope: direct_item_recommendation, native_strength: null, summary: "Consider walking aids for lower-limb OA."}
      - {source_id: ACE_KNEE_OA_2026, direction: conditional_for, support_scope: direct_item_recommendation, native_strength: null, summary: "Walking aids are an example allied-health strategy."}
      - {source_id: ACR_AF_2019, direction: strong_for, support_scope: direct_item_recommendation, native_strength: Strong, summary: "Cane use strongly recommended when ambulation, stability or pain impact warrants it."}

  orthosis_or_brace_context:
    role: contextual_support
    cu1_target_ids: [orthosis_or_brace_context]
    app_state: conditional_or_context_dependent
    default_selected: false
    auto_suggestion: false
    purpose_summary_el: Νάρθηκας/brace μόνο σε επιλεγμένο κλινικό πλαίσιο, όχι ως routine default.
    positions:
      - {source_id: VA_DOD_OA_2026, direction: weak_for, support_scope: direct_item_recommendation, native_strength: "Weak for", summary: "Bracing suggested in select knee-OA patients."}
      - {source_id: ACR_AF_2019, direction: strong_for, support_scope: direct_item_recommendation, native_strength: "Strong TF / Conditional PF", summary: "Tibiofemoral brace strongly and patellofemoral brace conditionally recommended in appropriate patients."}
      - {source_id: NICE_NG226_2022, direction: conditional_for, support_scope: direct_item_recommendation, native_strength: null, summary: "Do not routinely offer; consider only when instability/abnormal loading plus functional criteria apply."}

  taping:
    role: contextual_adjunct
    cu1_target_ids: [taping]
    app_state: conditional_or_context_dependent
    default_selected: false
    auto_suggestion: false
    purpose_summary_el: Taping ως επιλεγμένο συμπληρωματικό μέσο, όχι βασική παρέμβαση.
    positions:
      - {source_id: ACR_AF_2019, direction: conditional_for, support_scope: direct_item_recommendation, native_strength: Conditional, summary: "Kinesiotaping conditionally recommended for knee OA."}
      - {source_id: NICE_NG226_2022, direction: conditional_for, support_scope: direct_item_recommendation, native_strength: null, summary: "Tape/supports are not routine and are restricted to selected biomechanical/functional contexts."}

  manual_therapy:
    role: power_user_adjunct
    cu1_target_ids: [manual_therapy]
    app_state: guideline_conflict_or_mixed
    default_selected: false
    auto_suggestion: false
    selected_bubble_el: Οι οδηγίες διαφέρουν
    purpose_summary_el: Συμπληρωματική manual therapy μόνο μαζί με ενεργητική αποκατάσταση· οι οδηγίες διαφέρουν ως προς το πρόσθετο όφελος.
    positions:
      - {source_id: NICE_NG226_2022, direction: conditional_for, support_scope: direct_item_recommendation, native_strength: null, summary: "Only consider manual therapy for hip/knee OA alongside therapeutic exercise; insufficient evidence for use alone."}
      - {source_id: AAOS_OAK3_2021, direction: conditional_for, support_scope: direct_item_recommendation, native_strength: Limited, summary: "Manual therapy in addition to exercise may improve pain/function."}
      - {source_id: ACR_AF_2019, direction: conditional_against, support_scope: direct_item_recommendation, native_strength: Conditional, summary: "Manual therapy with exercise conditionally recommended against over exercise alone."}

  soft_tissue_techniques:
    role: power_user_adjunct
    cu1_target_ids: [soft_tissue_techniques]
    app_state: guideline_conflict_or_mixed
    default_selected: false
    auto_suggestion: false
    selected_bubble_el: Οι οδηγίες διαφέρουν
    purpose_summary_el: Τεχνικές μαλακών μορίων ως adjunct, με μη ομοιόμορφη guideline υποστήριξη και χωρίς ρόλο ως υποκατάστατο της άσκησης.
    positions:
      - {source_id: NICE_NG226_2022, direction: conditional_for, support_scope: named_component_of_broader_recommendation, native_strength: null, summary: "Soft-tissue techniques are included within manual therapy and should only be considered alongside exercise."}
      - {source_id: AAOS_OAK3_2021, direction: conditional_for, support_scope: direct_item_recommendation, native_strength: Limited, summary: "Massage may be used as adjunct/usual care with limited strength."}
      - {source_id: ACR_AF_2019, direction: conditional_against, support_scope: direct_item_recommendation, native_strength: Conditional, summary: "Massage conditionally recommended against for OA symptom reduction."}

  acupuncture:
    role: power_user_adjunct
    cu1_target_ids: [acupuncture]
    app_state: guideline_conflict_or_mixed
    default_selected: false
    auto_suggestion: false
    selected_bubble_el: Οι οδηγίες διαφέρουν
    purpose_summary_el: Οι μεγάλες οδηγίες διαφέρουν ουσιαστικά για τον ρόλο του acupuncture στην οστεοαρθρίτιδα γόνατος.
    positions:
      - {source_id: NICE_NG226_2022, direction: against, support_scope: direct_item_recommendation, native_strength: null, summary: "Do not offer acupuncture for OA."}
      - {source_id: AAOS_OAK3_2021, direction: conditional_for, support_scope: direct_item_recommendation, native_strength: Limited, summary: "Acupuncture may improve pain/function; recommendation downgraded for inconsistency/blinding concerns."}
      - {source_id: ACR_AF_2019, direction: conditional_for, support_scope: direct_item_recommendation, native_strength: Conditional, summary: "Acupuncture conditionally recommended."}
      - {source_id: ACE_KNEE_OA_2026, direction: conditional_for, support_scope: direct_item_recommendation, native_strength: null, summary: "Consider as adjunct after inadequate conventional response or patient preference."}
      - {source_id: VA_DOD_OA_2026, direction: neutral_or_insufficient, support_scope: direct_item_recommendation, native_strength: "Neither for nor against", summary: "Insufficient evidence for or against acupuncture."}

  dry_needling:
    role: excluded_current_knee_oa_surface
    cu1_target_ids: [dry_needling]
    app_state: recommendation_against_routine_use
    default_selected: false
    product_selectable: false
    integration_status: preserve_existing_knee_v1_1_exclusion
