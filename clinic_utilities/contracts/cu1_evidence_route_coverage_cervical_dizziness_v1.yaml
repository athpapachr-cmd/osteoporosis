claims:
  c4_dizziness_neck_features_not_cervical_causation:
    claim_id: c4_dizziness_neck_features_not_cervical_causation
    evidence_ids: [barany_cervical_dizziness_position_2022]
    applicable_route_evidence_profile_ids: [rep_c4_cervical_dizziness_presentation_v1, rep_c4_clinician_established_cervical_dizziness_v1]
    applicable_route_ids: [cervical_dizziness_presentation]
    domain: diagnostic_definition
    claim_summary: >-
      Coexisting dizziness or imbalance and neck pain/stiffness, including symptoms aggravated by
      head or neck movement, do not by themselves establish cervical causation. Head movement
      aggravates many vestibular disorders, and common alternative explanations include vestibular
      migraine and BPPV; central, cardiovascular and other causes remain clinically relevant by context.
    recommendation_direction: context_only
    output_scope: clinician_ui_only
    certainty_optional: not_applicable
    reviewed_on: 2026-08-29

  c4_barany_no_clinical_diagnostic_criteria:
    claim_id: c4_barany_no_clinical_diagnostic_criteria
    evidence_ids: [barany_cervical_dizziness_position_2022]
    applicable_route_evidence_profile_ids: [rep_c4_cervical_dizziness_presentation_v1, rep_c4_clinician_established_cervical_dizziness_v1]
    applicable_route_ids: [cervical_dizziness_presentation]
    domain: diagnostic_definition
    claim_summary: >-
      The Bárány Society considers the mechanistic evidence for cervical dizziness insufficient and
      refrains from proposing diagnostic criteria for routine clinical use outside research. CU-1 may
      faithfully carry an explicit clinician diagnosis but must not infer it or treat therapeutic
      response as proof of cervical causation.
    recommendation_direction: context_only
    output_scope: clinician_ui_only
    certainty_optional: not_applicable
    reviewed_on: 2026-08-29

  c4_alternative_causes_not_excluded:
    claim_id: c4_alternative_causes_not_excluded
    evidence_ids: [barany_cervical_dizziness_position_2022, dizziness_interdisciplinary_guidance_2025]
    applicable_route_evidence_profile_ids: [rep_c4_cervical_dizziness_presentation_v1, rep_c4_clinician_established_cervical_dizziness_v1]
    applicable_route_ids: [cervical_dizziness_presentation]
    domain: differential
    claim_summary: >-
      Selecting C4 or recording a clinician cervical-dizziness diagnosis does not establish that
      vestibular, migraine-related, neurological, vascular, cardiovascular, otological or other
      causes were excluded. Any such exclusion or completed work-up must come from explicit clinical
      documentation rather than software inference.
    recommendation_direction: context_only
    output_scope: clinician_ui_only
    certainty_optional: not_applicable
    reviewed_on: 2026-08-29

  c4_structured_dizziness_history_and_safety_context:
    claim_id: c4_structured_dizziness_history_and_safety_context
    evidence_ids: [dizziness_interdisciplinary_guidance_2025, barany_cervical_dizziness_position_2022]
    applicable_route_evidence_profile_ids: [rep_c4_cervical_dizziness_presentation_v1, rep_c4_clinician_established_cervical_dizziness_v1]
    applicable_route_ids: [cervical_dizziness_presentation]
    domain: history
    claim_summary: >-
      Dizziness evaluation should preserve timing, episode duration, triggers versus exacerbating
      factors, accompanying neurological/otological/cardiovascular symptoms and relevant medication
      or prior assessment context. Cervical association is one history element and must not replace a
      structured dizziness differential assessment.
    recommendation_direction: recommend
    output_scope: clinician_ui_only
    certainty_optional: not_applicable
    reviewed_on: 2026-08-29

  c4_current_physio_evidence_limited_conflicting_2026:
    claim_id: c4_current_physio_evidence_limited_conflicting_2026
    evidence_ids: [cervical_dizziness_physio_sr_2026]
    applicable_route_evidence_profile_ids: [rep_c4_clinician_established_cervical_dizziness_v1]
    applicable_route_ids: [cervical_dizziness_presentation]
    applicability_conditions_optional: [clinician_diagnosis_cervicogenic_dizziness_yes]
    domain: core_rehabilitation
    claim_summary: >-
      The 2026 systematic review found no specific evidence-based physiotherapy guideline and an
      overall limited or conflicting evidence base for neck-pain presentations with cervicogenic
      dizziness; most included studies were high risk of bias. CU-1 therefore must not claim a
      universally effective physiotherapy package, durable dizziness resolution or a validated
      criteria-based progression model.
    recommendation_direction: context_only
    output_scope: clinician_ui_only
    certainty_optional: not_graded
    reviewed_on: 2026-08-29

  c4_selected_active_cervical_rehabilitation:
    claim_id: c4_selected_active_cervical_rehabilitation
    evidence_ids: [cervical_dizziness_self_exercise_rct_2023, cervical_dizziness_physio_sr_2026]
    applicable_route_evidence_profile_ids: [rep_c4_clinician_established_cervical_dizziness_v1]
    applicable_route_ids: [cervical_dizziness_presentation]
    applicability_conditions_optional: [clinician_diagnosis_cervicogenic_dizziness_yes, nontraumatic_or_trauma_not_primary_context]
    domain: core_rehabilitation
    claim_summary: >-
      In a small non-traumatic randomized trial, a short self-exercise programme improved DHI and NDI
      versus control, while pain, cervical ROM and posturography did not differ between groups; the
      broader 2026 synthesis remains limited and heterogeneous. Individualized active cervical
      rehabilitation may therefore be considered when clinically selected, but the exact exercise
      bundle, frequency and dose are not universal evidence-based physician prescriptions.
    recommendation_direction: may_consider
    output_scope: referral_core
    certainty_optional: not_graded
    reviewed_on: 2026-08-29

  c4_selected_manual_therapy_low_certainty_2025:
    claim_id: c4_selected_manual_therapy_low_certainty_2025
    evidence_ids: [cervical_dizziness_manual_sr_2025, cervical_dizziness_physio_sr_2026]
    applicable_route_evidence_profile_ids: [rep_c4_clinician_established_cervical_dizziness_v1]
    applicable_route_ids: [cervical_dizziness_presentation]
    applicability_conditions_optional: [clinician_diagnosis_cervicogenic_dizziness_yes, manual_therapy_selected_as_adjunct]
    domain: adjunct
    claim_summary: >-
      In cervical-related-dizziness trials, upper-cervical manual therapy has low to very-low
      certainty evidence for improvement in dizziness impact/intensity compared with control or sham.
      The 2026 broader review does not establish a general balance benefit or durable universal
      superiority. Manual therapy may be considered as a selected adjunct but is not mandatory.
    recommendation_direction: may_consider
    output_scope: referral_core
    certainty_optional: low
    reviewed_on: 2026-08-29

  c4_mulligan_rom_not_global_superiority_2026:
    claim_id: c4_mulligan_rom_not_global_superiority_2026
    evidence_ids: [cervical_dizziness_physio_sr_2026]
    applicable_route_evidence_profile_ids: [rep_c4_clinician_established_cervical_dizziness_v1]
    applicable_route_ids: [cervical_dizziness_presentation]
    applicability_conditions_optional: [clinician_diagnosis_cervicogenic_dizziness_yes]
    domain: execution_detail
    claim_summary: >-
      The 2026 review found a short-term cervical-ROM signal favoring Mulligan mobilization in the
      reviewed evidence, while balance was similar to placebo and other outcomes were limited or
      conflicting. This technique-level signal must remain therapist execution context and must not
      become a mandatory technique or proof of cervical causation.
    recommendation_direction: context_only
    output_scope: therapist_execution_detail
    certainty_optional: moderate
    reviewed_on: 2026-08-29

  c4_balance_sensorimotor_only_if_deficit_identified:
    claim_id: c4_balance_sensorimotor_only_if_deficit_identified
    evidence_ids: [cervical_dizziness_physio_sr_2026, cervical_dizziness_self_exercise_rct_2023]
    applicable_route_evidence_profile_ids: [rep_c4_clinician_established_cervical_dizziness_v1]
    applicable_route_ids: [cervical_dizziness_presentation]
    applicability_conditions_optional: [clinician_diagnosis_cervicogenic_dizziness_yes, relevant_balance_or_sensorimotor_deficit_identified]
    domain: execution_detail
    claim_summary: >-
      Balance, oculomotor or sensorimotor exercise may be individualized when a relevant deficit and
      treatment rationale have been identified, but current cervical-dizziness evidence does not
      authorize automatic vestibular rehabilitation, a fixed balance programme or a universal
      physician-prescribed sensorimotor bundle.
    recommendation_direction: may_consider
    output_scope: therapist_execution_detail
    certainty_optional: not_graded
    reviewed_on: 2026-08-29

  c4_dizziness_safety_reassessment:
    claim_id: c4_dizziness_safety_reassessment
    evidence_ids: [dizziness_interdisciplinary_guidance_2025, barany_cervical_dizziness_position_2022]
    applicable_route_evidence_profile_ids: [rep_c4_cervical_dizziness_presentation_v1, rep_c4_clinician_established_cervical_dizziness_v1]
    applicable_route_ids: [cervical_dizziness_presentation]
    domain: safety
    claim_summary: >-
      New acute or materially progressive dizziness/vertigo, new focal neurological or gait findings,
      concerning otological symptoms, vascular/cardiovascular features or other clinician safety
      concern require medical reassessment or the clinician-selected diagnostic pathway rather than
      routine C4 rehabilitation progression. CU-1 does not autonomously determine urgency.
    recommendation_direction: recommend
    output_scope: referral_core
    certainty_optional: not_applicable
    reviewed_on: 2026-08-29

