purpose: >-
  Native schema-conformant evidence extension for the frozen C4 route
  cervical_dizziness_presentation. The route preserves dizziness with cervical musculoskeletal
  features as distinct from an explicitly clinician-entered cervical/cervicogenic-dizziness
  diagnosis. Because the Bárány Society does not endorse clinical diagnostic criteria and current
  treatment evidence is limited and condition-classification dependent, presentation-only C4 has
  explicit reviewed evidence-gap behavior rather than receiving disease-specific treatment claims.
  A cautious one-phase rehabilitation sequence is available only when the clinician explicitly
  records the cervical-dizziness diagnosis and no material unresolved dizziness-safety or primary
  post-traumatic context is present.

sources:
  barany_cervical_dizziness_position_2022:
    evidence_id: barany_cervical_dizziness_position_2022
    source_type: consensus
    title: "The Bárány Society position on 'Cervical Dizziness'"
    authors_or_organization: Seemungal BM et al.; Bárány Society Classification OverSight Committee
    year_or_version: 2022_current_position
    reference: "J Vestib Res. 2022;32(6):487-499. DOI 10.3233/VES-220202"
    doi_optional: 10.3233/VES-220202
    population_scope_optional: patients with dizziness or vertigo and neck symptoms; used for diagnostic-boundary and research-governance semantics, not as a treatment-effect estimate
    reviewed_on: 2026-08-29
    next_review_due: 2027-02-28
    freshness_state: current
    status: active

  cervical_dizziness_physio_sr_2026:
    evidence_id: cervical_dizziness_physio_sr_2026
    source_type: systematic_review
    title: "The effects of physiotherapy on neck pain with associated symptoms, including cervicogenic dizziness and tinnitus: a systematic review"
    authors_or_organization: Canli K, De Greef I, Van Looveren E, Meeus M, Cagnie B, De Meulemeester K
    year_or_version: 2026
    reference: "BMC Musculoskelet Disord. 2026;27(1):244. DOI 10.1186/s12891-026-09664-6"
    doi_optional: 10.1186/s12891-026-09664-6
    population_scope_optional: people with neck pain and concurrent cervicogenic-dizziness and/or tinnitus presentations; 13 studies, 785 participants; most included studies were high risk of bias and evidence was limited or conflicting across outcomes
    reviewed_on: 2026-08-29
    next_review_due: 2027-08-29
    freshness_state: current
    status: active

  cervical_dizziness_manual_sr_2025:
    evidence_id: cervical_dizziness_manual_sr_2025
    source_type: systematic_review
    title: "Is manual therapy effective for cervical dizziness? A systematic review and meta-analysis of randomized controlled trials"
    authors_or_organization: Carrasco-Uribarren A et al.
    year_or_version: 2025
    reference: "BMC Musculoskelet Disord. 2025;26:659. DOI 10.1186/s12891-025-08899-z"
    doi_optional: 10.1186/s12891-025-08899-z
    population_scope_optional: adults classified with cervical-related dizziness in randomized manual-therapy trials; low to very-low certainty for key outcomes
    reviewed_on: 2026-08-29
    next_review_due: 2027-08-29
    freshness_state: current
    status: active

  cervical_dizziness_self_exercise_rct_2023:
    evidence_id: cervical_dizziness_self_exercise_rct_2023
    source_type: randomized_trial
    title: "The efficacy of self-exercise in a patient with cervicogenic dizziness: A randomized controlled trial"
    authors_or_organization: Piromchai P, Toumjaidee N, Srirompotong S, Yimtae K
    year_or_version: 2023
    reference: "Front Neurol. 2023;14:1121101. DOI 10.3389/fneur.2023.1121101"
    doi_optional: 10.3389/fneur.2023.1121101
    population_scope_optional: 32 adults with non-traumatic clinician-classified cervicogenic dizziness; short two-week follow-up; active programme included muscle, mobilization and oculomotor self-exercise
    reviewed_on: 2026-08-29
    next_review_due: 2027-08-29
    freshness_state: current
    status: active

  dizziness_interdisciplinary_guidance_2025:
    evidence_id: dizziness_interdisciplinary_guidance_2025
    source_type: consensus
    title: "Diagnosis and treatment of vertigo and dizziness: Interdisciplinary guidance paper for clinical practice"
    authors_or_organization: Tarnutzer AA et al.
    year_or_version: 2025
    reference: "HNO. 2025;73(Suppl 3):357-369. DOI 10.1007/s00106-025-01599-z"
    doi_optional: 10.1007/s00106-025-01599-z
    population_scope_optional: primary-care and specialist evaluation of acute, episodic and chronic vertigo/dizziness syndromes; used here for history and safety context, not cervical-causation authority
    reviewed_on: 2026-08-29
