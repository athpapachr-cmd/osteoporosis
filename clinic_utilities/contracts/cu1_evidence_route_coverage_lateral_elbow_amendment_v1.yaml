purpose: >-
  Narrow activation-time amendments for the already-existing core LET profile and for grading/direction
  fidelity in the new lateral-elbow route extension. The amendment does not broaden route scope, invent
  a new recommendation, or change the frozen elbow taxonomy. It replaces the incomplete seed sequence
  pointer with the reviewed single-phase evidence-bounded sequence and removes synthetic grading.

claim_amendments:
  let_local_manual_therapy_short_term_B_2022:
    recommendation_direction: recommend
    amendment_reason: >-
      The 2022 CPG wording is a Grade-B should-use recommendation. Optionality is preserved by the
      manual_therapy_selected_as_adjunct and technique_tolerated applicability conditions rather than
      by downgrading the evidence direction.

  let_dry_needling_selected_B_2022:
    recommendation_direction: recommend
    amendment_reason: >-
      The 2022 CPG wording is a Grade-B should-use recommendation. CU-1 still requires explicit adjunct
      selection plus practitioner competence/availability before the claim may render.

  let_rigid_taping_short_term_B_2022:
    recommendation_direction: recommend
    amendment_reason: >-
      The 2022 CPG wording is Grade B for immediate/short-term relief in irritable LET. Selection and
      irritability applicability prevent automatic use; the evidence direction itself is not weakened.

  let_outcome_tracking_not_progression_threshold_2022:
    strength_optional: not_graded
    claim_summary: >-
      PRTEE and/or DASH and PSFS/high-demand activity-specific scales carry Grade-A CPG recommendation
      as outcome/activity measures, while relevant ROM, pressure-pain threshold, pain-free grip and
      maximum grip measures carry Grade-B recommendation. These framework grades remain separate and
      the measures track status over time; none becomes an automatic phase-progression or return-to-
      function threshold.
    amendment_reason: >-
      The original route-extension draft used a synthetic A_B_by_measure_family strength string.
      Normative resolution removes that hybrid and preserves the two framework grades explicitly in
      the claim summary and regression fixture.

