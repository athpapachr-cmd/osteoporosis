version: cu1_route_context_intake_v1
status: active_runtime_authority
runtime_authorized: true
reviewed_on: 2026-08-29
purpose: >-
  Data-driven route-specific clinician context fields that are valid in primary_problem.context.
  These fields may expose already-reviewed route distinctions to the UI and validator, but they do
  not diagnose, infer missing context, or independently authorize rich referral output. Rich output
  remains governed by the separate fail-closed migration matrix and exact variant matching.

rules:
  clinician_entered_only: true
  no_inference_from_findings_or_route_label: true
  unknown_field_for_route_invalid: true
  unknown_enum_value_invalid: true
  omission_does_not_imply_negative: true
  rich_variant_may_require_more_context_than_base_referral: true
  machine_ids_must_not_be_browser_labels: true

routes:
  headache_with_cervical_msk_features:
    fields:
      formal_cervicogenic_headache_diagnosis:
        type: enum
        label_el: Έχει τεθεί ρητά διάγνωση αυχενογενούς κεφαλαλγίας;
        values: ["yes", "no", not_stated]
        value_labels_el:
          "yes": Ναι
          "no": Όχι
          not_stated: Δεν δηλώνεται
        required: false
        show_when:
          wording_modes: [formal_diagnosis]

  cervical_dizziness_presentation:
    fields:
      clinician_diagnosis_cervicogenic_dizziness:
        type: enum
        label_el: Έχει τεθεί ρητά διάγνωση αυχενογενούς / αυχενικής ζάλης;
        values: ["yes", "no", not_stated]
        value_labels_el:
          "yes": Ναι
          "no": Όχι
          not_stated: Δεν δηλώνεται
        required: false
        show_when:
          wording_modes: [formal_diagnosis]

  post_traumatic_neck_pain:
    fields:
      trauma_mechanism_context:
        type: enum
        label_el: Μηχανισμός τραυματισμού
        values: [whiplash_acceleration_deceleration, other_cervical_trauma, not_stated]
        value_labels_el:
          whiplash_acceleration_deceleration: Μηχανισμός επιτάχυνσης–επιβράδυνσης / whiplash
          other_cervical_trauma: Άλλος αυχενικός τραυματισμός
          not_stated: Δεν δηλώνεται
        required: false
        required_for_rich_variant: true
      temporal_phase:
        type: enum
        label_el: Χρονική φάση
        values: [recent_or_acute_within_12_weeks, persistent_over_3_months, not_stated]
        value_labels_el:
          recent_or_acute_within_12_weeks: Πρόσφατο / οξύ, έως 12 εβδομάδες
          persistent_over_3_months: Επίμονο, πάνω από 3 μήνες
          not_stated: Δεν δηλώνεται
        required: false
        required_for_rich_variant: true
        note: >-
          Must be explicitly selected by the clinician; runtime must not infer temporal phase from an approximate duration.
      structural_status:
        type: enum
        label_el: Δομική κατάσταση μετά τον τραυματισμό
        values: [no_material_structural_injury_identified_by_clinician, material_structural_injury_or_restriction_present, structural_status_not_stated]
        value_labels_el:
          no_material_structural_injury_identified_by_clinician: Δεν έχει διαπιστωθεί ουσιώδης δομική κάκωση από τον κλινικό
          material_structural_injury_or_restriction_present: Υπάρχει δομική κάκωση ή ειδικός περιορισμός
          structural_status_not_stated: Δεν έχει δηλωθεί / δεν έχει διευκρινιστεί
        required: false
        required_for_rich_variant: true
      material_neurological_or_other_safety_concern:
        type: enum
        label_el: Υπάρχει ουσιώδης νευρολογική ή άλλη ανησυχία ασφάλειας;
        values: ["yes", "no", not_stated]
        value_labels_el:
          "yes": Ναι
          "no": Όχι
          not_stated: Δεν δηλώνεται
        required: false
        required_for_rich_variant: true
      physiotherapy_considered_appropriate_by_clinician:
        type: enum
        label_el: Έχει κριθεί κατάλληλη η συνήθης φυσιοθεραπευτική αποκατάσταση;
        values: ["yes", "no", not_stated]
        value_labels_el:
          "yes": Ναι
          "no": Όχι
          not_stated: Δεν δηλώνεται
        required: false
        required_for_rich_variant: true
      manual_therapy_selected_as_adjunct:
        type: enum
        label_el: Έχει επιλεγεί χειροθεραπεία ως επικουρικό μέσο;
        values: ["yes", "no", not_stated]
        value_labels_el:
          "yes": Ναι
          "no": Όχι
          not_stated: Δεν δηλώνεται
        required: false

  ulnar_neuropathy_at_elbow:
    fields:
      une_clinician_severity_context:
        type: enum
        label_el: Ρητή κλινική βαρύτητα / πλαίσιο διαχείρισης
        values: [mild, nonmild, not_stated]
        value_labels_el:
          mild: Ήπια / sensory-predominant εικόνα
          nonmild: Μέτρια, σοβαρή ή άλλη μη ήπια εικόνα
          not_stated: Δεν έχει δηλωθεί
        required: false
        required_for_rich_variant: true
      une_objective_ulnar_motor_status:
        type: enum
        label_el: Αντικειμενική κινητική κατάσταση ωλενίου νεύρου
        values: [assessed_without_material_motor_deficit, material_motor_deficit_present, not_assessed]
        value_labels_el:
          assessed_without_material_motor_deficit: Εξετάστηκε — χωρίς ουσιώδες κινητικό έλλειμμα
          material_motor_deficit_present: Υπάρχει ουσιώδες αντικειμενικό κινητικό έλλειμμα
          not_assessed: Δεν αξιολογήθηκε
        required: false
        required_for_rich_variant: true
      une_intrinsic_atrophy_or_clawing:
        type: enum
        label_el: Ενδογενής ατροφία / clawing ή άλλο όψιμο κινητικό σημείο
        values: [absent_when_assessed, present, not_assessed]
        value_labels_el:
          absent_when_assessed: Δεν διαπιστώθηκε κατά την εξέταση
          present: Παρόν
          not_assessed: Δεν αξιολογήθηκε
        required: false
        required_for_rich_variant: true
      une_unresolved_alternative_localization_or_structural_owner:
        type: enum
        label_el: Υπάρχει μη επιλυμένη εναλλακτική εντόπιση ή δομική αιτία / ιδιοκτήτης;
        values: ["yes", "no", not_stated]
        value_labels_el:
          "yes": Ναι
          "no": Όχι
          not_stated: Δεν δηλώνεται
        required: false
        required_for_rich_variant: true

  glenohumeral_instability_dislocation:
    fields:
      shoulder_instability_direction:
        type: enum
        label_el: Κατεύθυνση αστάθειας
        values: [anterior, posterior, multidirectional, not_stated]
        value_labels_el:
          anterior: Πρόσθια
          posterior: Οπίσθια
          multidirectional: Πολυκατευθυντική
          not_stated: Δεν έχει δηλωθεί
        required: false
        required_for_rich_variant: true
      shoulder_instability_cause:
        type: enum
        label_el: Τραυματικό ή ατραυματικό πλαίσιο
        values: [traumatic, atraumatic, not_stated]
        value_labels_el:
          traumatic: Τραυματικό
          atraumatic: Ατραυματικό
          not_stated: Δεν έχει δηλωθεί
        required: false
        required_for_rich_variant: true
      shoulder_instability_recurrence:
        type: enum
        label_el: Πρώτο ή υποτροπιάζον επεισόδιο
        values: [first_time, recurrent, not_stated]
        value_labels_el:
          first_time: Πρώτο επεισόδιο
          recurrent: Υποτροπιάζουσα αστάθεια / εξάρθρημα
          not_stated: Δεν έχει δηλωθεί
        required: false
        required_for_rich_variant: true
      shoulder_instability_management_context:
        type: enum
        label_el: Τρέχουσα στρατηγική αντιμετώπισης
        values: [nonoperative_rehabilitation, preoperative_selected_rehabilitation, pending_specialist_assessment, postoperative_rehabilitation, not_stated]
        value_labels_el:
          nonoperative_rehabilitation: Έχει επιλεγεί συντηρητική αποκατάσταση
          preoperative_selected_rehabilitation: Προεγχειρητική / ρητά επιλεγμένη αποκατάσταση
          pending_specialist_assessment: Εκκρεμεί ειδική αξιολόγηση / απόφαση
          postoperative_rehabilitation: Μετεγχειρητική αποκατάσταση
          not_stated: Δεν έχει δηλωθεί
        required: false
        required_for_rich_variant: true
      shoulder_instability_structural_protocol_context:
        type: enum
        label_el: Υπάρχει μη επιλυμένη δομική βλάβη ή ειδικός περιορισμός / πρωτόκολλο που αλλάζει τη φόρτιση;
        values: [clear_for_selected_rehabilitation, material_restriction_or_unresolved_structural_context, not_stated]
        value_labels_el:
          clear_for_selected_rehabilitation: Όχι — έχει κριθεί κατάλληλη η επιλεγμένη αποκατάσταση χωρίς ειδικό μη επιλυμένο περιορισμό
          material_restriction_or_unresolved_structural_context: Ναι — υπάρχει ειδικός περιορισμός ή μη επιλυμένο δομικό πλαίσιο
          not_stated: Δεν έχει δηλωθεί
        required: false
        required_for_rich_variant: true

  glenohumeral_osteoarthritis:
    fields:
      ghoa_management_context:
        type: enum
        label_el: Τρέχον πλαίσιο αντιμετώπισης της γληνοβραχιόνιας οστεοαρθρίτιδας
        values: [nonoperative, preoperative_TSA, postoperative_arthroplasty, not_stated]
        value_labels_el:
          nonoperative: Συντηρητική / μη χειρουργική αντιμετώπιση
          preoperative_TSA: Προεγχειρητική προετοιμασία για ολική αρθροπλαστική ώμου
          postoperative_arthroplasty: Μετεγχειρητική αποκατάσταση μετά από αρθροπλαστική
          not_stated: Δεν έχει δηλωθεί
        required: false
        required_for_rich_variant: true
