purpose: >-
  Route-specific evidence hardening for posterior_interosseous_nerve_supinator_syndrome. The route preserves
  the frozen distinction between pain-predominant radial-tunnel presentations and motor posterior-interosseous
  neuropathy/palsy, does not infer diagnosis from lateral-forearm pain or provocation alone, and does not convert
  current conservative-management observations into a specific physiotherapy protocol. Spontaneous non-traumatic,
  non-compressive PIN palsy has prospective 2026 support for an initial conservative-management period, but that
  evidence does not define a route-specific PT regimen. Known compressive/space-occupying, traumatic, iatrogenic,
  inflammatory/structural or progressive motor contexts require specialist/correct-owner review rather than a
  generic elbow, LET, radial-tunnel or peripheral-nerve rehabilitation fallback.

