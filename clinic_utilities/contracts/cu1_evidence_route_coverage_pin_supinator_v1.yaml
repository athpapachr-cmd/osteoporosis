claims:
  pin_motor_pattern_supports_localization_not_autodiagnosis:
    claim_id: pin_motor_pattern_supports_localization_not_autodiagnosis
    evidence_ids: [pin_edx_review_2013, pin_motor_ncs_differential_2025]
    applicable_route_evidence_profile_ids: [rep_pin_motor_presentation_unresolved_v1, rep_pin_spontaneous_noncompressive_established_v1, rep_pin_compressive_structural_or_progressive_v1]
    applicable_route_ids: [posterior_interosseous_nerve_supinator_syndrome]
    domain: diagnostic_definition
    claim_summary: >-
      Finger- and thumb-extension weakness with relatively preserved wrist extension can support localization to the
      posterior interosseous/deep radial motor branch, but the pattern does not independently establish etiology or
      a formal PIN/supinator diagnosis. Electrodiagnostic evaluation can assist localization and exclusion of other
      motor disorders; selective radial-pattern weakness can also occur in disorders such as multifocal motor neuropathy.
    recommendation_direction: context_only
    output_scope: clinician_ui_only
    certainty_optional: not_applicable
    reviewed_on: 2026-08-29

  pin_pain_predominant_radial_tunnel_not_motor_PIN_authority:
    claim_id: pin_pain_predominant_radial_tunnel_not_motor_PIN_authority
    evidence_ids: [radial_tunnel_diagnosis_sr_2024, radial_nerve_nomenclature_2025]
    applicable_route_evidence_profile_ids: [rep_pin_pain_only_or_radial_tunnel_mismatch_v1, rep_pin_motor_presentation_unresolved_v1]
    applicable_route_ids: [posterior_interosseous_nerve_supinator_syndrome]
    domain: differential
    claim_summary: >-
      Pain-predominant radial-tunnel presentations have heterogeneous diagnostic definitions and commonly lack the
      objective motor pattern of posterior interosseous palsy. Current nomenclature remains debated. Under the frozen
      CU-1 taxonomy, lateral/proximal radial forearm pain or radial-tunnel provocation without a material PIN-pattern
      motor deficit must not be silently converted into motor PIN/supinator syndrome or used to import a PIN treatment pathway.
    recommendation_direction: context_only
    output_scope: clinician_ui_only
    certainty_optional: not_applicable
    reviewed_on: 2026-08-29

  pin_spontaneous_conservative_management_context_2026:
    claim_id: pin_spontaneous_conservative_management_context_2026
    evidence_ids: [pin_spontaneous_multicenter_2026]
    applicable_route_evidence_profile_ids: [rep_pin_spontaneous_noncompressive_established_v1]
    applicable_route_ids: [posterior_interosseous_nerve_supinator_syndrome]
    applicability_conditions_optional:
      - explicit_clinician_established_spontaneous_PIN_palsy
      - non_traumatic_context
      - no_demonstrable_external_compression_or_entrapment
      - no_space_occupying_lesion
      - no_material_progressive_motor_safety_trigger
    domain: core_rehabilitation
    claim_summary: >-
      In the 2026 prospective multicenter cohort of spontaneous non-traumatic, non-compressive PIN palsy without
      space-occupying lesions, conservative management was advisable initially and good recovery occurred in 31 of
      34 conservatively managed limbs. This is management-course evidence, not evidence for a specific physiotherapy
      intervention, exercise, splint, nerve-gliding technique, visit frequency or treatment duration.
    recommendation_direction: context_only
    output_scope: clinician_ui_only
    certainty_optional: not_graded
    reviewed_on: 2026-08-29

  pin_no_validated_route_specific_physio_sequence:
    claim_id: pin_no_validated_route_specific_physio_sequence
    evidence_ids: [pin_interventions_sr_2006, elbow_nerve_treatment_review_2025, pin_spontaneous_multicenter_2026]
    applicable_route_evidence_profile_ids: [rep_pin_motor_presentation_unresolved_v1, rep_pin_spontaneous_noncompressive_established_v1]
    applicable_route_ids: [posterior_interosseous_nerve_supinator_syndrome]
    domain: progression_criteria
    claim_summary: >-
      Route-specific intervention evidence does not establish a validated criteria-based physiotherapy sequence for
      posterior interosseous motor neuropathy/palsy. The historical systematic review found no randomized or controlled
      clinical trials, and newer literature supports conservative management in selected contexts without defining a
      specific PT programme. CU-1 must therefore preserve an explicit rehabilitation evidence gap rather than generate
      a generic peripheral-nerve protocol.
    recommendation_direction: insufficient_evidence
    output_scope: clinician_ui_only
    certainty_optional: not_graded
    reviewed_on: 2026-08-29

  pin_no_auto_gliding_splint_manual_or_electrical_protocol:
    claim_id: pin_no_auto_gliding_splint_manual_or_electrical_protocol
    evidence_ids: [pin_interventions_sr_2006, elbow_nerve_treatment_review_2025]
    applicable_route_evidence_profile_ids: [rep_pin_motor_presentation_unresolved_v1, rep_pin_spontaneous_noncompressive_established_v1]
    applicable_route_ids: [posterior_interosseous_nerve_supinator_syndrome]
    domain: adjunct
    claim_summary: >-
      Broad elbow-nerve reviews discuss physiotherapy, splinting, nerve-glide and other conservative modalities, but
      current route-specific comparative evidence does not establish any of these as mandatory or superior PIN care.
      CU-1 must not auto-render nerve gliding, splinting, manual therapy, electrical stimulation or a fixed exercise
      programme as literature-authorized PIN referral core.
    recommendation_direction: insufficient_evidence
    output_scope: clinician_ui_only
    certainty_optional: not_graded
    reviewed_on: 2026-08-29

  pin_known_compression_or_structural_cause_correct_owner:
    claim_id: pin_known_compression_or_structural_cause_correct_owner
    evidence_ids: [pin_spontaneous_management_review_2019]
    applicable_route_evidence_profile_ids: [rep_pin_compressive_structural_or_progressive_v1]
    applicable_route_ids: [posterior_interosseous_nerve_supinator_syndrome]
    domain: safety
    claim_summary: >-
      A demonstrable compressive lesion/entrapment, space-occupying lesion, trauma, iatrogenic injury or other material
      structural cause changes management ownership and must not be treated as the spontaneous non-compressive cohort.
      Such context requires clinician/specialist management and any patient-specific restrictions or postoperative plan
      take precedence over generic conservative assumptions.
    recommendation_direction: recommend
    output_scope: referral_core
    certainty_optional: not_applicable
    reviewed_on: 2026-08-29

  pin_progressive_or_nonrecovering_motor_reassessment:
    claim_id: pin_progressive_or_nonrecovering_motor_reassessment
    evidence_ids: [pin_spontaneous_multicenter_2026, pin_spontaneous_management_review_2019]
    applicable_route_evidence_profile_ids: [rep_pin_spontaneous_noncompressive_established_v1, rep_pin_motor_presentation_unresolved_v1, rep_pin_compressive_structural_or_progressive_v1]
    applicable_route_ids: [posterior_interosseous_nerve_supinator_syndrome]
    domain: safety
    claim_summary: >-
      New or progressive objective PIN-pattern motor weakness, worsening motor function or failure of recovery under a
      clinician-directed conservative pathway warrants reassessment of etiology and specialist management rather than
      automatic rehabilitation progression. The 2026 cohort's six-month recovery decision point applies specifically to
      spontaneous PIN palsy and must not become a universal CU-1 surgical threshold, PT course duration or progression rule.
    recommendation_direction: recommend
    output_scope: referral_core
    certainty_optional: not_applicable
    reviewed_on: 2026-08-29

  pin_alternative_localization_motor_differential:
    claim_id: pin_alternative_localization_motor_differential
    evidence_ids: [pin_edx_review_2013, pin_motor_ncs_differential_2025]
    applicable_route_evidence_profile_ids: [rep_pin_motor_presentation_unresolved_v1, rep_pin_compressive_structural_or_progressive_v1]
    applicable_route_ids: [posterior_interosseous_nerve_supinator_syndrome]
    domain: differential
    claim_summary: >-
      A radial/PIN-pattern motor deficit requires localization. Proximal radial neuropathy, cervical or plexus pathology,
      multifocal motor neuropathy and other motor disorders must not be silently excluded merely because the PIN route is
      selected. Sensory findings or a motor pattern inconsistent with an isolated PIN lesion should prompt correct-owner
      evaluation rather than a generic supinator-entrapment assumption.
    recommendation_direction: context_only
    output_scope: clinician_ui_only
    certainty_optional: not_applicable
    reviewed_on: 2026-08-29

