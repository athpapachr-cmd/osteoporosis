      muscle_energy_plus_exercise_auto_selected: false
      soft_tissue_plus_exercise_auto_selected: false
      network_rank_converted_to_universal_superiority: false
      low_certainty_visible: true

  c3_known_primary_headache_context_not_silently_excluded:
