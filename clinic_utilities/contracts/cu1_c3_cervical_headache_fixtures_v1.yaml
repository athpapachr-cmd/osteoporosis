    input:
      upper_cervical_imaging_abnormality: true
      formal_cervicogenic_headache_diagnosis: not_stated
      causal_attribution_by_clinician: not_stated
    expected:
      imaging_alone_establishes_headache_causation: false
      definitive_cervicogenic_headache_generated: false
      diagnostic_boundary_claim_id: c3_ichd_causation_not_single_finding

  c3_formal_cgh_uses_disease_specific_profile_without_false_certainty:
