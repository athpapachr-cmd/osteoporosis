fixture_policy:
  - fixtures_test_design_semantics_not_runtime_formatter_implementation
  - headache_with_cervical_features_is_not_automatically_formal_cervicogenic_headache
  - ICHD_causation_is_not_inferred_from_one_cervical_finding
  - disease_specific_CGH_synthesis_requires_formal_or_clinician_established_CGH_context
  - network_meta_analysis_ranking_is_not_mandatory_protocol_authority
  - missing_safety_or_differential_information_does_not_become_reassuring_negative_information
  - post_traumatic_primary_context_routes_to_C5_review_not_generic_C3_fallback
  - no_fixture_authorizes_runtime_evidence_generation

fixtures:
  c3_presentation_only_does_not_generate_formal_cgh:
    route_id: headache_with_cervical_msk_features
    input:
      formal_cervicogenic_headache_diagnosis: not_stated
      neck_pain_present: true
      cervical_ROM_restricted: true
      headache_aggravated_by_cervical_movement: true
      occipital_tenderness: true
      material_headache_safety_concern: false
      post_traumatic_primary_context: false
    expected:
      evidence_profile_id: rep_c3_cervical_headache_presentation_v1
      rehabilitation_sequence_id: seq_c3_cervical_headache_presentation_v1
      definitive_cervicogenic_headache_generated: false
      diagnostic_boundary_claim_ids:
        - c3_cervical_features_not_formal_cgh
        - c3_ichd_causation_not_single_finding
      formal_CGH_meta_analysis_claims_allowed: false
      generic_cervical_fallback_allowed: false

  c3_rom_and_provocation_are_not_sufficient_diagnosis:
    route_id: headache_with_cervical_msk_features
