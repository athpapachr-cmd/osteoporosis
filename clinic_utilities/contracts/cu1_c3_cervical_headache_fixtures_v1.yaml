          manual_therapy_may_be_rendered_as_selected_adjunct: true
          manual_therapy_claimed_durable_at_12_months: false
          one_manual_technique_mandated: false
      - input:
          formal_cervicogenic_headache_diagnosis: yes
          course: chronic
          manual_therapy_selected_as_adjunct: false
        expected:
          manual_therapy_auto_rendered: false
          active_rehabilitation_remains_available: true

