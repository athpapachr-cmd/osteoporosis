      clinician_diagnosis_may_be_rendered_as_cervicogenic_headache: true
      diagnosis_labelled_as_CU1_inference: false
      current_exercise_uncertainty_claim_id: c3_formal_cgh_exercise_headache_effect_uncertain_2026
      high_certainty_direct_exercise_headache_effect_generated: false
      universal_exercise_programme_generated: false
      progression_criteria_count: 0

