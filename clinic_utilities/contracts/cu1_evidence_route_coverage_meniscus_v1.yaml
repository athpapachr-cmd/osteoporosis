rehabilitation_sequences:
  seq_degenerative_meniscus_conservative_v1:
    sequence_id: seq_degenerative_meniscus_conservative_v1
    route_id: degenerative_meniscal_lesion_conservative_rehabilitation
    applicability_conditions_optional: [symptomatic_degenerative_meniscal_lesion_without_unresolved_structural_surgical_indication]
    sequence_source: route_evidence_profile
    route_evidence_profile_id: rep_degenerative_meniscus_conservative_v1
    phases:
      - phase_id: degenerative_meniscus_restore_function_and_capacity
        order: 1
        clinical_objective: improve knee symptoms, motion, strength, neuromuscular control and functional loading through first-line conservative rehabilitation
        objective_authority:
          authority_type: evidence_claim
          evidence_claim_ids: [degenerative_meniscus_PT_first_line_A, degenerative_meniscus_progressive_rehab_components_B]
        intervention_directions:
          - intervention_direction_id: degenerative_meniscus_progressive_strength_ROM_neuromuscular
            statement: use progressive knee and hip strengthening, range-of-motion restoration when restricted and neuromuscular training, with manual therapy or mobilisation only when clinically indicated
            authority:
              authority_type: evidence_claim
              evidence_claim_ids: [degenerative_meniscus_progressive_rehab_components_B]
        progression_criteria:
          - criterion_id: degenerative_meniscus_criterion_based_reassessment
            criterion_kind: progression
            statement: progress functional loading according to knee symptoms, ROM, effusion, objective quadriceps/hamstring strength and appropriate functional performance rather than elapsed time alone
            authority:
              authority_type: evidence_claim
              evidence_claim_ids: [degenerative_meniscus_criterion_based_monitoring_D]
        precautions_or_do_not_progress_criteria:
          - criterion_id: degenerative_meniscus_mechanical_or_persistent_symptom_reassessment
            criterion_kind: reassessment
            statement: persistent pain, recurrent stiffness or effusion, persistent functional instability, mechanical symptoms or unexpected neurological symptoms should prompt orthopaedic reassessment rather than indefinite progression
            authority:
              authority_type: evidence_claim
              evidence_claim_ids: [degenerative_meniscus_reassessment_mechanical_symptoms_C]
          - criterion_id: degenerative_meniscus_failure_to_meet_milestones
            criterion_kind: failure_to_progress
            statement: inability to achieve clinically relevant knee rehabilitation milestones because of persistent symptoms should prompt orthopaedic reassessment
            authority:
              authority_type: evidence_claim
              evidence_claim_ids: [degenerative_meniscus_milestone_failure_reassessment_D]
        strength_optional: null
        certainty_optional: not_graded
        required_for_route: true

      - phase_id: degenerative_meniscus_return_to_high_demand_activity_when_applicable
        order: 2
        clinical_objective: restore high-demand work or sport function when this is a patient goal
        objective_authority:
          authority_type: evidence_claim
          evidence_claim_ids: [degenerative_meniscus_RTS_criteria_D]
        intervention_directions: []
        progression_criteria:
          - criterion_id: degenerative_meniscus_high_demand_return_criteria
            criterion_kind: progression
            statement: return to high-demand activity should consider subjective and objective knee function, ROM, effusion, quadriceps/hamstring strength, coordination/stability performance and psychological readiness rather than using a routine surgery-derived timeline
            authority:
              authority_type: evidence_claim
              evidence_claim_ids: [degenerative_meniscus_RTS_criteria_D]
            applicability_conditions_optional: [return_to_sport_or_high_demand_activity_goal]
        precautions_or_do_not_progress_criteria: []
        strength_optional: D
        certainty_optional: not_graded
        required_for_route: false
        applicability_conditions_optional: [return_to_sport_or_high_demand_activity_goal]
    clinician_modifications_optional: []
    protocol_overrides_optional: []

coverage_effect:
  route_profiles_added: [rep_degenerative_meniscus_conservative_v1]
  rehabilitation_sequences_added: [seq_degenerative_meniscus_conservative_v1]
  route_history_prompts_added:
    - degenerative_meniscus_true_locking
    - degenerative_meniscus_effusion_course
    - degenerative_meniscus_imaging_and_location
    - degenerative_meniscus_OA_overlap
    - degenerative_meniscus_prior_rehab_response
    - degenerative_meniscus_activity_goal
  route_status_after_review: sequence_complete_evidence_bounded
  routine_route_exclusion_behavior:
    true_locking_or_unresolved_structural_surgical_indication: block_routine_sequence_and_reassess
    postoperative_meniscal_context: route_to_postoperative_knee_rehabilitation
    acute_isolated_traumatic_context: route_to_acute_isolated_meniscal_injury_nonoperative_if_applicable
  runtime_authorized: false
