purpose: >-
  Native schema-conformant evidence extension for the routine degenerative meniscal lesion
  conservative-rehabilitation route. It preserves the distinction from acute isolated meniscal
  injury and from postoperative meniscal rehabilitation, and it blocks routine evidence-aware
  rehabilitation when true locking or another unresolved structural/surgical indication is present.

sources:
  meniscus_rehab_eu_us_consensus_2025:
    evidence_id: meniscus_rehab_eu_us_consensus_2025
    source_type: consensus
    title: The formal EU-US Meniscus Rehabilitation 2024 Consensus — Part II: Prevention, non-operative treatment and return to sport
    authors_or_organization: Prill et al. / ESSKA-AOSSM-AASPT initiative
    year_or_version: 2025
    reference: Knee Surg Sports Traumatol Arthrosc. 2025. DOI 10.1002/ksa.12689
    doi_optional: 10.1002/ksa.12689
    population_scope_optional: acute meniscal tears and degenerative meniscal lesions; this route uses only the statements applicable to non-operated degenerative meniscal lesions and general meniscal rehabilitation assessment
    reviewed_on: 2026-08-29
    next_review_due: 2027-08-29
    freshness_state: current
    status: active

  escape_degenerative_meniscus_5y_2022:
    evidence_id: escape_degenerative_meniscus_5y_2022
    source_type: randomized_trial
    title: Effect of Physical Therapy vs Arthroscopic Partial Meniscectomy in People With Degenerative Meniscal Tears — Five-Year Follow-up of the ESCAPE Randomized Clinical Trial
    authors_or_organization: Noorduyn et al. / ESCAPE Research Group
    year_or_version: 2022
    reference: JAMA Netw Open. 2022;5(7):e2220394
    doi_optional: 10.1001/jamanetworkopen.2022.20394
    population_scope_optional: adults aged 45 to 70 years with degenerative meniscal tear; exercise-based physical therapy compared with arthroscopic partial meniscectomy
    reviewed_on: 2026-08-29
    next_review_due: 2027-08-29
    freshness_state: current
    status: active

  omex_degenerative_meniscus_10y_2025:
    evidence_id: omex_degenerative_meniscus_10y_2025
    source_type: randomized_trial
    title: Arthroscopic partial meniscectomy versus exercise therapy for degenerative meniscal tears — 10-year follow-up of the OMEX randomised controlled trial
    authors_or_organization: Berg et al. / OMEX trial investigators
    year_or_version: 2025
    reference: Br J Sports Med. 2025;59(2):91-98
    doi_optional: 10.1136/bjsports-2024-108644
    population_scope_optional: adults with degenerative meniscal tear and no or minimal radiographic knee osteoarthritis; exercise therapy compared with arthroscopic partial meniscectomy
    reviewed_on: 2026-08-29
    next_review_due: 2027-08-29
    freshness_state: current
    status: active

claims:
  degenerative_meniscus_PT_first_line_A:
    claim_id: degenerative_meniscus_PT_first_line_A
    evidence_ids: [meniscus_rehab_eu_us_consensus_2025, escape_degenerative_meniscus_5y_2022, omex_degenerative_meniscus_10y_2025]
    applicable_route_evidence_profile_ids: [rep_degenerative_meniscus_conservative_v1]
    applicable_route_ids: [degenerative_meniscal_lesion_conservative_rehabilitation]
    applicability_conditions_optional: [symptomatic_degenerative_meniscal_lesion_without_unresolved_structural_surgical_indication]
    domain: core_rehabilitation
    claim_summary: Non-operative management including physical therapy should be the first approach for symptomatic degenerative meniscal lesions without an unresolved structural surgical indication; long-term randomized trials show exercise-based physical therapy provides patient-reported outcomes comparable to arthroscopic partial meniscectomy in common degenerative tears.
    recommendation_direction: recommend
    output_scope: referral_core
    strength_optional: A_consensus
    certainty_optional: not_graded
    reviewed_on: 2026-08-29

  degenerative_meniscus_progressive_rehab_components_B:
    claim_id: degenerative_meniscus_progressive_rehab_components_B
    evidence_ids: [meniscus_rehab_eu_us_consensus_2025]
    applicable_route_evidence_profile_ids: [rep_degenerative_meniscus_conservative_v1]
    applicable_route_ids: [degenerative_meniscal_lesion_conservative_rehabilitation]
    applicability_conditions_optional: [symptomatic_degenerative_meniscal_lesion_without_unresolved_structural_surgical_indication]
    domain: core_rehabilitation
    claim_summary: Rehabilitation may include range-of-motion work, progressive knee and hip muscle strengthening and neuromuscular training; manual therapy or joint mobilisation may be used when clinically indicated, while home exercise should accompany supervised rehabilitation.
    recommendation_direction: recommend
    output_scope: referral_core
    strength_optional: B
    certainty_optional: not_graded
    reviewed_on: 2026-08-29

  degenerative_meniscus_supervised_plus_home_D:
    claim_id: degenerative_meniscus_supervised_plus_home_D
    evidence_ids: [meniscus_rehab_eu_us_consensus_2025]
    applicable_route_evidence_profile_ids: [rep_degenerative_meniscus_conservative_v1]
    applicable_route_ids: [degenerative_meniscal_lesion_conservative_rehabilitation]
    domain: execution_detail
    claim_summary: Supervised rehabilitation addressing ROM, effusion, strength, knee function and neuromuscular control may be combined with a home-exercise programme, but supervised versus home-only programmes have not been directly compared.
    recommendation_direction: consider
    output_scope: therapist_execution_detail
    strength_optional: D
    certainty_optional: not_graded
    reviewed_on: 2026-08-29

  degenerative_meniscus_criterion_based_monitoring_D:
    claim_id: degenerative_meniscus_criterion_based_monitoring_D
    evidence_ids: [meniscus_rehab_eu_us_consensus_2025]
    applicable_route_evidence_profile_ids: [rep_degenerative_meniscus_conservative_v1]
    applicable_route_ids: [degenerative_meniscal_lesion_conservative_rehabilitation]
    domain: progression_criteria
    claim_summary: Meniscal rehabilitation may be monitored with a criterion-based approach using knee range of motion, joint effusion, objective quadriceps and hamstring strength and functional performance measures such as hop testing when appropriate and safe.
    recommendation_direction: consider
    output_scope: referral_core
    strength_optional: D
    certainty_optional: not_graded
    reviewed_on: 2026-08-29

  degenerative_meniscus_RTS_criteria_D:
    claim_id: degenerative_meniscus_RTS_criteria_D
    evidence_ids: [meniscus_rehab_eu_us_consensus_2025]
    applicable_route_evidence_profile_ids: [rep_degenerative_meniscus_conservative_v1]
    applicable_route_ids: [degenerative_meniscal_lesion_conservative_rehabilitation]
    applicability_conditions_optional: [return_to_sport_or_high_demand_activity_goal]
    domain: progression_criteria
    claim_summary: Return to sport or high-demand activity should be criterion based, considering subjective and objective knee function, ROM, effusion, quadriceps and hamstring strength, coordination/stability performance and psychological readiness; surgical healing timelines must not be imported into conservatively managed degenerative lesions.
    recommendation_direction: recommend
    output_scope: referral_core
    strength_optional: D
    certainty_optional: not_graded
    reviewed_on: 2026-08-29

  degenerative_meniscus_reassessment_mechanical_symptoms_C:
    claim_id: degenerative_meniscus_reassessment_mechanical_symptoms_C
    evidence_ids: [meniscus_rehab_eu_us_consensus_2025]
    applicable_route_evidence_profile_ids: [rep_degenerative_meniscus_conservative_v1]
    applicable_route_ids: [degenerative_meniscal_lesion_conservative_rehabilitation]
    domain: safety
    claim_summary: Persistent pain, recurrent stiffness or effusion, persistent functional instability, mechanical symptoms or unexpected neurological symptoms during rehabilitation should prompt orthopaedic reassessment rather than indefinite routine progression.
    recommendation_direction: recommend
    output_scope: referral_core
    strength_optional: C
    certainty_optional: not_graded
    reviewed_on: 2026-08-29

  degenerative_meniscus_milestone_failure_reassessment_D:
    claim_id: degenerative_meniscus_milestone_failure_reassessment_D
    evidence_ids: [meniscus_rehab_eu_us_consensus_2025]
    applicable_route_evidence_profile_ids: [rep_degenerative_meniscus_conservative_v1]
    applicable_route_ids: [degenerative_meniscal_lesion_conservative_rehabilitation]
    domain: safety
    claim_summary: Failure to reach clinically relevant knee rehabilitation milestones because of persistent knee symptoms should prompt orthopaedic reassessment.
    recommendation_direction: recommend
    output_scope: referral_core
    strength_optional: D
    certainty_optional: not_graded
    reviewed_on: 2026-08-29

  degenerative_meniscus_no_prognostic_selector_D:
    claim_id: degenerative_meniscus_no_prognostic_selector_D
    evidence_ids: [meniscus_rehab_eu_us_consensus_2025]
    applicable_route_evidence_profile_ids: [rep_degenerative_meniscus_conservative_v1]
    applicable_route_ids: [degenerative_meniscal_lesion_conservative_rehabilitation]
    domain: differential
    claim_summary: Current evidence does not establish reliable knee-specific or personal factors that identify who will or will not succeed with rehabilitation; higher-grade OA, higher BMI and longer symptom duration may adversely influence outcome but are not deterministic selectors.
    recommendation_direction: context_only
    output_scope: clinician_ui_only
    strength_optional: D
    certainty_optional: not_graded
    reviewed_on: 2026-08-29

