purpose: >-
  Native schema-conformant evidence extension for patellar tendinopathy. The route supports a
  progressive loading/capacity-restoration rehabilitation direction while explicitly preserving
  uncertainty in absolute exercise effects and the absence of a clinically meaningful superiority
  hierarchy among contemporary loading strategies. It must not freeze eccentric, isometric, HSR or
  PTLE as a universal mandatory physician-prescribed protocol.

