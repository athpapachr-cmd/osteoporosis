    year_or_version: 2025
    reference: Cochrane Database Syst Rev. 2025;5:CD013078
    doi_optional: 10.1002/14651858.CD013078.pub2
    population_scope_optional: athletes with chronic patellar tendinopathy in randomized trials of strengthening exercise versus no treatment, injection, surgery or other comparators
