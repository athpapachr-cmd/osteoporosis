claims:
  patellar_progressive_loading_conservative_direction:
    claim_id: patellar_progressive_loading_conservative_direction
    evidence_ids: [patellar_PTLE_rct_2021, patellar_loading_nma_2026, patellar_tendinopathy_exercise_cochrane_2025]
    applicable_route_evidence_profile_ids: [rep_patellar_tendinopathy_v1]
    applicable_route_ids: [patellar_tendinopathy]
    domain: core_rehabilitation
    claim_summary: For a clinician-selected conservative patellar-tendinopathy rehabilitation pathway, progressive tendon and quadriceps loading is a reasonable core direction, but the absolute treatment-effect evidence remains limited and the intervention should not be represented as a certainty of benefit for every patient.
    recommendation_direction: consider
    output_scope: referral_core
    reviewed_on: 2026-08-29

  patellar_PTLE_population_specific_signal:
    claim_id: patellar_PTLE_population_specific_signal
    evidence_ids: [patellar_PTLE_rct_2021]
    applicable_route_evidence_profile_ids: [rep_patellar_tendinopathy_v1]
    applicable_route_ids: [patellar_tendinopathy]
    domain: core_rehabilitation
    claim_summary: In one randomized trial of mostly chronic, previously treated young athletes, a progressive tendon-loading programme improved VISA-P more than eccentric-only exercise at 24 weeks; this population-specific trial signal does not establish PTLE as a universal mandatory protocol.
    recommendation_direction: consider
    output_scope: clinician_ui_only
    reviewed_on: 2026-08-29

  patellar_no_single_loading_protocol_superior_2026:
    claim_id: patellar_no_single_loading_protocol_superior_2026
    evidence_ids: [patellar_loading_nma_2026]
    applicable_route_evidence_profile_ids: [rep_patellar_tendinopathy_v1]
    applicable_route_ids: [patellar_tendinopathy]
    domain: core_rehabilitation
    claim_summary: The 2026 network meta-analysis did not identify a statistically or clinically meaningful superiority hierarchy among contemporary exercise strategies relative to HSR; HSR is a reasonable reference and several progressive loading approaches appear broadly comparable.
    recommendation_direction: context_only
    output_scope: clinician_ui_only
    reviewed_on: 2026-08-29

  patellar_absolute_strengthening_effect_uncertain_2025:
    claim_id: patellar_absolute_strengthening_effect_uncertain_2025
    evidence_ids: [patellar_tendinopathy_exercise_cochrane_2025]
    applicable_route_evidence_profile_ids: [rep_patellar_tendinopathy_v1]
    applicable_route_ids: [patellar_tendinopathy]
    domain: core_rehabilitation
    claim_summary: Cochrane 2025 concluded that the available strengthening-exercise evidence is too uncertain to draw firm conclusions about pain or function versus no treatment or several alternative comparators; all included participants were athletes.
    recommendation_direction: insufficient_evidence
    output_scope: clinician_ui_only
    reviewed_on: 2026-08-29

  patellar_loading_progression_by_response:
    claim_id: patellar_loading_progression_by_response
    evidence_ids: [patellar_PTLE_rct_2021, patellar_loading_nma_2026]
    applicable_route_evidence_profile_ids: [rep_patellar_tendinopathy_v1]
    applicable_route_ids: [patellar_tendinopathy]
    domain: progression_criteria
    claim_summary: Progressive loading should be individualized according to symptom/load tolerance, strength and functional response rather than advanced by elapsed time alone; current comparative evidence does not validate one universal numeric progression threshold.
    recommendation_direction: consider
    output_scope: referral_core
    reviewed_on: 2026-08-29

  patellar_loading_mode_execution_detail:
    claim_id: patellar_loading_mode_execution_detail
    evidence_ids: [patellar_loading_nma_2026, patellar_PTLE_rct_2021]
    applicable_route_evidence_profile_ids: [rep_patellar_tendinopathy_v1]
    applicable_route_ids: [patellar_tendinopathy]
    domain: execution_detail
    claim_summary: Choice and dosing of eccentric, HSR, moderate slow resistance, isometric or other progressive loading strategies are therapist-level execution decisions to individualize; no single mode is a mandatory physician referral prescription.
    recommendation_direction: context_only
    output_scope: therapist_execution_detail
    reviewed_on: 2026-08-29

  patellar_ESWT_no_clear_added_benefit_2021:
    claim_id: patellar_ESWT_no_clear_added_benefit_2021
    evidence_ids: [patellar_management_nma_2021]
    applicable_route_evidence_profile_ids: [rep_patellar_tendinopathy_v1]
    applicable_route_ids: [patellar_tendinopathy]
    domain: adjunct
    claim_summary: In randomized evidence synthesized in 2021, ESWT added to eccentric exercise did not show clear short-term superiority over sham ESWT with the same exercise background for pain or function; ESWT therefore must not be an automatic CU-1 referral adjunct.
    recommendation_direction: insufficient_evidence
    output_scope: clinician_ui_only
    reviewed_on: 2026-08-29

  patellar_RTS_threshold_gap:
    claim_id: patellar_RTS_threshold_gap
    evidence_ids: [patellar_tendinopathy_exercise_cochrane_2025, patellar_loading_nma_2026, patellar_PTLE_rct_2021]
    applicable_route_evidence_profile_ids: [rep_patellar_tendinopathy_v1]
    applicable_route_ids: [patellar_tendinopathy]
    applicability_conditions_optional: [return_to_sport_or_high_demand_activity_goal]
    domain: progression_criteria
    claim_summary: Current reviewed evidence does not establish validated universal return-to-sport thresholds for patellar tendinopathy; trial protocols and older expert frameworks must not be converted into mandatory physician-authored numeric clearance criteria.
    recommendation_direction: insufficient_evidence
    output_scope: clinician_ui_only
    reviewed_on: 2026-08-29

