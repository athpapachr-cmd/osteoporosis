rehabilitation_sequences:
  seq_c3_cervical_headache_presentation_v1:
    sequence_id: seq_c3_cervical_headache_presentation_v1
    route_id: headache_with_cervical_msk_features
    applicability_conditions_optional:
      - headache_with_cervical_msk_features_selected
      - formal_cervicogenic_headache_diagnosis_not_yes
      - no_unresolved_material_headache_safety_concern
      - no_unresolved_post_traumatic_primary_context
    sequence_source: route_evidence_profile
    route_evidence_profile_id: rep_c3_cervical_headache_presentation_v1
    phases:
      - phase_id: c3_presentation_active_function_rehabilitation
        order: 1
        clinical_objective: reduce headache-related and cervical functional impact through individualized active cervical rehabilitation without asserting a cervicogenic-headache diagnosis
        objective_authority:
          authority_type: evidence_claim
          evidence_claim_ids: [c3_apta_active_rehabilitation_context]
        intervention_directions:
          - intervention_direction_id: c3_presentation_active_mobility_exercise
            statement: use individualized active cervical mobility and cervical/scapulothoracic exercise according to symptom course and identified impairments, without a fixed evidence-derived dose
            authority:
              authority_type: evidence_claim
              evidence_claim_ids: [c3_apta_active_rehabilitation_context]
          - intervention_direction_id: c3_presentation_acute_supervised_mobility
            statement: in acute C3 presentations, supervised active mobility instruction may be used under the Grade-B APTA framework
            authority:
              authority_type: evidence_claim
              evidence_claim_ids: [c3_acute_active_mobility_B]
            applicability_conditions_optional: [acute_cervical_headache_presentation]
          - intervention_direction_id: c3_presentation_selected_manual_adjunct
            statement: selected cervical manual therapy may be included when clinically appropriate and explicitly chosen, but it is not an automatic route requirement
            authority:
              authority_type: evidence_claim
              evidence_claim_ids: [c3_selected_manual_therapy_apta_context]
            applicability_conditions_optional: [subacute_or_chronic_cervical_headache_presentation, manual_therapy_selected_as_adjunct]
        progression_criteria: []
        precautions_or_do_not_progress_criteria:
          - criterion_id: c3_presentation_headache_safety_reassessment
            criterion_kind: safety_escalation
            statement: a materially new, markedly changed or progressive headache pattern or neurological/vascular/systemic clinician concern requires reassessment rather than routine progression
            authority:
              authority_type: evidence_claim
              evidence_claim_ids: [c3_headache_safety_reassessment]
        strength_optional: null
        certainty_optional: not_graded
        required_for_route: true
    clinician_modifications_optional: []
    protocol_overrides_optional: []

  seq_c3_formal_cervicogenic_headache_v1:
    sequence_id: seq_c3_formal_cervicogenic_headache_v1
    route_id: headache_with_cervical_msk_features
    applicability_conditions_optional:
      - formal_cervicogenic_headache_diagnosis_yes
      - no_unresolved_material_headache_safety_concern
      - no_unresolved_post_traumatic_primary_context
    sequence_source: route_evidence_profile
    route_evidence_profile_id: rep_c3_formal_cervicogenic_headache_v1
    phases:
      - phase_id: c3_formal_cgh_active_evidence_bounded_rehabilitation
        order: 1
        clinical_objective: reduce headache-related disability and improve relevant cervical function using active rehabilitation with selected adjuncts while preserving current evidence uncertainty
        objective_authority:
          authority_type: evidence_claim
          evidence_claim_ids: [c3_apta_active_rehabilitation_context]
        intervention_directions:
          - intervention_direction_id: c3_formal_cgh_active_mobility_exercise
            statement: use individualized cervical mobility and cervical/scapulothoracic exercise according to identified impairments and activity goals; do not claim one superior programme or high-certainty direct headache effect
            authority:
              authority_type: evidence_claim
              evidence_claim_ids: [c3_apta_active_rehabilitation_context]
          - intervention_direction_id: c3_formal_cgh_acute_supervised_mobility
            statement: in acute formal/clinician-established C3 presentations, supervised active mobility instruction may be used under the Grade-B APTA framework
            authority:
              authority_type: evidence_claim
              evidence_claim_ids: [c3_acute_active_mobility_B]
            applicability_conditions_optional: [acute_cervical_headache_presentation]
          - intervention_direction_id: c3_formal_cgh_selected_manual_adjunct
            statement: selected manual therapy may be considered as an adjunct, particularly for short-term symptom relief, without claiming durable universal benefit or a mandatory manual technique
            authority:
              authority_type: evidence_claim
              evidence_claim_ids: [c3_selected_manual_therapy_apta_context, c3_formal_cgh_manual_short_term_low_2026]
            applicability_conditions_optional: [subacute_or_chronic_cervical_headache_presentation, manual_therapy_selected_as_adjunct]
        progression_criteria: []
