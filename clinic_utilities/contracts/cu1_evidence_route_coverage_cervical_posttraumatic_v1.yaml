rehabilitation_sequences:
  seq_c5_recent_whiplash_wad_v1:
    sequence_id: seq_c5_recent_whiplash_wad_v1
    route_id: post_traumatic_neck_pain
    applicability_conditions_optional:
      - whiplash_acceleration_deceleration_context_explicit
      - recent_or_acute_whiplash_within_12_weeks
      - no_unresolved_fracture_dislocation_instability_or_other_material_structural_injury
      - no_unresolved_material_neurological_or_other_safety_concern
      - physiotherapy_considered_appropriate_by_clinician
    sequence_source: route_evidence_profile
    route_evidence_profile_id: rep_c5_recent_whiplash_wad_v1
    phases:
      - phase_id: c5_recent_wad_active_function_rehabilitation
        order: 1
        clinical_objective: restore function and confidence in normal movement/activity through individualized active rehabilitation while preserving structural and neurological safety context
        objective_authority:
          authority_type: evidence_claim
          evidence_claim_ids: [c5_recent_wad_stay_active_B_SIRA, c5_recent_wad_neck_exercise_B_SIRA]
        intervention_directions:
          - intervention_direction_id: c5_recent_wad_stay_active_and_function
            statement: support continued usual activity with sensible temporary modification as needed and avoid routine prolonged activity restriction when no structural/healing restriction conflicts
            authority:
              authority_type: evidence_claim
              evidence_claim_ids: [c5_recent_wad_stay_active_B_SIRA]
          - intervention_direction_id: c5_recent_wad_active_neck_exercise
            statement: use individualized active cervical ROM, low-load isometric, postural-endurance and strengthening directions without a fixed evidence-derived dose
            authority:
              authority_type: evidence_claim
              evidence_claim_ids: [c5_recent_wad_neck_exercise_B_SIRA]
          - intervention_direction_id: c5_recent_wad_selected_manual_adjunct
            statement: selected manual therapy may be considered and monitored for benefit when clinically appropriate, but it is not automatic core care and no technique or dose is mandated
            authority:
              authority_type: evidence_claim
              evidence_claim_ids: [c5_recent_manual_therapy_optional_C_SIRA]
            applicability_conditions_optional: [manual_therapy_selected_as_adjunct]
        progression_criteria: []
        precautions_or_do_not_progress_criteria:
          - criterion_id: c5_recent_wad_material_safety_reassessment
            criterion_kind: safety_escalation
            statement: new or progressive objective neurological findings, possible cord features, worsening materially new symptoms or unresolved structural traumatic concern require clinician reassessment rather than routine progression
            authority:
              authority_type: evidence_claim
              evidence_claim_ids: [c5_posttraumatic_safety_reassessment]
        strength_optional: null
        certainty_optional: not_graded
        required_for_route: true
    clinician_modifications_optional: []
    protocol_overrides_optional: []

  seq_c5_persistent_whiplash_wad_v1:
    sequence_id: seq_c5_persistent_whiplash_wad_v1
    route_id: post_traumatic_neck_pain
    applicability_conditions_optional:
      - whiplash_acceleration_deceleration_context_explicit
      - persistent_whiplash_over_3_months
      - no_unresolved_fracture_dislocation_instability_or_other_material_structural_injury
      - no_unresolved_material_neurological_or_other_safety_concern
      - physiotherapy_considered_appropriate_by_clinician
    sequence_source: route_evidence_profile
    route_evidence_profile_id: rep_c5_persistent_whiplash_wad_v1
    phases:
      - phase_id: c5_persistent_wad_active_function_rehabilitation
        order: 1
        clinical_objective: improve persistent WAD-related pain/disability and functional tolerance through individualized active rehabilitation without claiming one superior programme or fixed treatment schedule
        objective_authority:
          authority_type: evidence_claim
          evidence_claim_ids: [c5_persistent_wad_exercise_advice_context]
        intervention_directions:
          - intervention_direction_id: c5_persistent_wad_active_exercise_and_self_management
            statement: consider individualized supervised or guided neck-specific/functional exercise with self-management or advice, without a fixed evidence-derived visit frequency, course duration or mandatory technique bundle
            authority:
              authority_type: evidence_claim
              evidence_claim_ids: [c5_persistent_wad_exercise_advice_context]
        progression_criteria: []
        precautions_or_do_not_progress_criteria:
          - criterion_id: c5_persistent_wad_material_safety_reassessment
            criterion_kind: safety_escalation
            statement: new/progressive objective neurological findings or another materially concerning change require clinician reassessment rather than routine progression
            authority:
              authority_type: evidence_claim
              evidence_claim_ids: [c5_posttraumatic_safety_reassessment]
          - criterion_id: c5_persistent_wad_neurological_signs_review
            criterion_kind: reassessment
            statement: persistent objective neurological signs with ongoing disability beyond three months require physician investigation/management rather than being treated as routine rehabilitation nonprogression
            authority:
              authority_type: evidence_claim
              evidence_claim_ids: [c5_persistent_neurological_signs_require_medical_review]
            applicability_conditions_optional: [persistent_objective_neurological_signs_with_disability]
        strength_optional: null
        certainty_optional: not_graded
        required_for_route: true
    clinician_modifications_optional: []
    protocol_overrides_optional: []

