claims:
  c5_whiplash_context_not_generic_posttraumatic_neck_authority:
    claim_id: c5_whiplash_context_not_generic_posttraumatic_neck_authority
    evidence_ids: [neck_pain_apta_cpg_2017, chronic_wad_vs_nontraumatic_neck_sr_2025]
    applicable_route_evidence_profile_ids: [rep_c5_recent_whiplash_wad_v1, rep_c5_persistent_whiplash_wad_v1, rep_c5_whiplash_phase_unresolved_v1, rep_c5_other_posttraumatic_neck_pain_v1, rep_c5_unresolved_posttraumatic_safety_v1]
    applicable_route_ids: [post_traumatic_neck_pain]
    domain: diagnostic_definition
    claim_summary: >-
      Whiplash-associated disorder is a trauma-related neck-pain context with clinical features that
      are not interchangeable with nontraumatic nonspecific neck pain. Conversely, the frozen C5 label
      also includes other cervical trauma, and WAD-specific treatment evidence must not be expanded
      automatically to a different traumatic mechanism or structural injury.
    recommendation_direction: context_only
    output_scope: clinician_ui_only
    certainty_optional: not_applicable
    reviewed_on: 2026-08-29

  c5_structural_status_must_not_be_inferred:
    claim_id: c5_structural_status_must_not_be_inferred
    evidence_ids: [sira_acute_whiplash_guideline_2014_current, optima_nad_cpg_2016]
    applicable_route_evidence_profile_ids: [rep_c5_recent_whiplash_wad_v1, rep_c5_persistent_whiplash_wad_v1, rep_c5_whiplash_phase_unresolved_v1, rep_c5_other_posttraumatic_neck_pain_v1, rep_c5_unresolved_posttraumatic_safety_v1]
    applicable_route_ids: [post_traumatic_neck_pain]
    domain: safety
    claim_summary: >-
      Post-traumatic neck assessment distinguishes routine grades I-III rehabilitation contexts from
      fracture/dislocation and other major structural pathology. CU-1 must not infer that fracture,
      dislocation, instability or another structural injury has been excluded merely because C5 was
      selected or physiotherapy was requested. Known structural/healing restrictions require explicit
      clinician documentation and their own protocol/owner semantics.
    recommendation_direction: recommend
    output_scope: referral_core
    certainty_optional: not_applicable
    reviewed_on: 2026-08-29

  c5_recent_wad_stay_active_B_SIRA:
    claim_id: c5_recent_wad_stay_active_B_SIRA
    evidence_ids: [sira_acute_whiplash_guideline_2014_current]
    applicable_route_evidence_profile_ids: [rep_c5_recent_whiplash_wad_v1]
    applicable_route_ids: [post_traumatic_neck_pain]
    applicability_conditions_optional: [recent_or_acute_whiplash_within_12_weeks]
    domain: core_rehabilitation
    claim_summary: >-
      For acute WAD, SIRA recommends advice to remain active and continue usual activities, with
      function-focused reassurance and self-management rather than prolonged activity restriction.
    recommendation_direction: recommend
    output_scope: referral_core
    strength_optional: B_SIRA_2014
    certainty_optional: not_graded
    reviewed_on: 2026-08-29

  c5_recent_wad_neck_exercise_B_SIRA:
    claim_id: c5_recent_wad_neck_exercise_B_SIRA
    evidence_ids: [sira_acute_whiplash_guideline_2014_current]
    applicable_route_evidence_profile_ids: [rep_c5_recent_whiplash_wad_v1]
    applicable_route_ids: [post_traumatic_neck_pain]
    applicability_conditions_optional: [recent_or_acute_whiplash_within_12_weeks]
    domain: core_rehabilitation
    claim_summary: >-
      For acute WAD, SIRA recommends neck exercise including range-of-motion work, low-load isometric
      exercise, postural endurance and strengthening. CU-1 preserves these as broad active directions
      and does not convert guideline examples into a fixed exercise dose or mandatory technique sequence.
    recommendation_direction: recommend
    output_scope: referral_core
    strength_optional: B_SIRA_2014
    certainty_optional: not_graded
    reviewed_on: 2026-08-29

  c5_persistent_wad_exercise_advice_context:
    claim_id: c5_persistent_wad_exercise_advice_context
    evidence_ids: [wad_nad_cpg_bussieres_2016, wad_exercise_sr_2022, wad_guided_neck_specific_sr_2024]
    applicable_route_evidence_profile_ids: [rep_c5_persistent_whiplash_wad_v1]
    applicable_route_ids: [post_traumatic_neck_pain]
    applicability_conditions_optional: [persistent_whiplash_over_3_months]
    domain: core_rehabilitation
    claim_summary: >-
      For persistent WAD, guideline and systematic-review evidence supports considering active exercise
      and self-management/advice, with some evidence for supervised or guided neck-specific exercise.
      Effect estimates are generally small or limited by the underlying evidence base; no single
      exercise programme, supervision model, session frequency or course duration is established as a
      universal physician-prescribed standard.
    recommendation_direction: may_consider
    output_scope: referral_core
    certainty_optional: not_graded
    reviewed_on: 2026-08-29

  c5_education_plus_exercise_not_required_superior_2025:
    claim_id: c5_education_plus_exercise_not_required_superior_2025
    evidence_ids: [wad_education_exercise_grade_sr_2025]
    applicable_route_evidence_profile_ids: [rep_c5_recent_whiplash_wad_v1, rep_c5_persistent_whiplash_wad_v1]
    applicable_route_ids: [post_traumatic_neck_pain]
    domain: core_rehabilitation
    claim_summary: >-
      The 2025 GRADE meta-analysis found no clinically important advantage for combining education and
      exercise compared with education alone or exercise alone for WAD pain or disability; certainty
      was very low for all pooled comparisons. CU-1 therefore must not represent a combined
      education-plus-exercise package as proven superior or mandatory.
    recommendation_direction: context_only
    output_scope: clinician_ui_only
    certainty_optional: very_low
    reviewed_on: 2026-08-29

  c5_guided_neck_specific_signal_not_fixed_schedule:
    claim_id: c5_guided_neck_specific_signal_not_fixed_schedule
    evidence_ids: [wad_guided_neck_specific_sr_2024]
    applicable_route_evidence_profile_ids: [rep_c5_persistent_whiplash_wad_v1]
    applicable_route_ids: [post_traumatic_neck_pain]
    domain: execution_detail
    claim_summary: >-
      A 2024 meta-analysis reported modest short-term pain and disability advantages for guided
      neck-specific exercise compared with different or unguided neck-specific exercise. Positive
      results were observed mainly in longer and more frequently supervised study programmes, but
      those programme characteristics are not validated universal minimum visit frequency or
      treatment-duration requirements and remain therapist execution context.
    recommendation_direction: context_only
    output_scope: therapist_execution_detail
    certainty_optional: not_graded
    reviewed_on: 2026-08-29

  c5_recent_manual_therapy_optional_C_SIRA:
    claim_id: c5_recent_manual_therapy_optional_C_SIRA
    evidence_ids: [sira_acute_whiplash_guideline_2014_current]
    applicable_route_evidence_profile_ids: [rep_c5_recent_whiplash_wad_v1]
    applicable_route_ids: [post_traumatic_neck_pain]
    applicability_conditions_optional: [recent_or_acute_whiplash_within_12_weeks, manual_therapy_selected_as_adjunct]
    domain: adjunct
    claim_summary: >-
      SIRA classifies manual therapy for acute WAD as limited-evidence Grade C and places it among
      treatments that are not routinely recommended and should be monitored for benefit. Manual therapy
      may be considered as a selected adjunct; CU-1 does not auto-select a technique or dose.
    recommendation_direction: may_consider
    output_scope: referral_core
    strength_optional: C_SIRA_2014
    certainty_optional: not_graded
    reviewed_on: 2026-08-29

  c5_no_prolonged_activity_restriction_consensus_SIRA:
    claim_id: c5_no_prolonged_activity_restriction_consensus_SIRA
    evidence_ids: [sira_acute_whiplash_guideline_2014_current]
    applicable_route_evidence_profile_ids: [rep_c5_recent_whiplash_wad_v1]
    applicable_route_ids: [post_traumatic_neck_pain]
    applicability_conditions_optional: [recent_or_acute_whiplash_within_12_weeks, no_patient_specific_structural_protocol_requiring_restriction_or_immobilization]
    domain: core_rehabilitation
    claim_summary: >-
      SIRA's acute-WAD clinical practice point advises against reduction of usual activities for more
      than four days. This is a consensus recommendation and does not override an explicit structural,
      healing or orthopaedic restriction.
    recommendation_direction: do_not_offer
    output_scope: clinician_ui_only
    strength_optional: consensus_SIRA_2014
    certainty_optional: not_graded
    reviewed_on: 2026-08-29

  c5_no_routine_collar_A_SIRA:
    claim_id: c5_no_routine_collar_A_SIRA
    evidence_ids: [sira_acute_whiplash_guideline_2014_current]
    applicable_route_evidence_profile_ids: [rep_c5_recent_whiplash_wad_v1]
    applicable_route_ids: [post_traumatic_neck_pain]
    applicability_conditions_optional: [recent_or_acute_whiplash_within_12_weeks, no_patient_specific_structural_protocol_requiring_restriction_or_immobilization]
    domain: core_rehabilitation
    claim_summary: >-
      SIRA recommends that immobilisation collars should not be prescribed for uncomplicated acute
      WAD and grades the recommendation as Level A. This does not override an explicit structural,
      healing or orthopaedic restriction requiring immobilisation.
    recommendation_direction: do_not_offer
    output_scope: clinician_ui_only
    strength_optional: A_SIRA_2014
    certainty_optional: not_graded
    reviewed_on: 2026-08-29

  c5_wad_function_and_risk_monitoring:
    claim_id: c5_wad_function_and_risk_monitoring
    evidence_ids: [sira_acute_whiplash_guideline_2014_current, wad_nad_cpg_bussieres_2016]
    applicable_route_evidence_profile_ids: [rep_c5_recent_whiplash_wad_v1, rep_c5_persistent_whiplash_wad_v1]
    applicable_route_ids: [post_traumatic_neck_pain]
    domain: progression_criteria
    claim_summary: >-
      WAD guidance supports serial reassessment of pain, disability, function and recovery trajectory,
      with treatment review or broader assessment when recovery is not progressing. Framework-specific
      review intervals and numeric thresholds may inform clinician review but are not converted by CU-1
      into a universal physiotherapy course duration or automatic phase-transition rule.
    recommendation_direction: recommend
    output_scope: clinician_ui_only
    certainty_optional: not_graded
    reviewed_on: 2026-08-29

  c5_posttraumatic_safety_reassessment:
    claim_id: c5_posttraumatic_safety_reassessment
    evidence_ids: [sira_acute_whiplash_guideline_2014_current, optima_nad_cpg_2016]
    applicable_route_evidence_profile_ids: [rep_c5_recent_whiplash_wad_v1, rep_c5_persistent_whiplash_wad_v1, rep_c5_whiplash_phase_unresolved_v1, rep_c5_other_posttraumatic_neck_pain_v1, rep_c5_unresolved_posttraumatic_safety_v1]
    applicable_route_ids: [post_traumatic_neck_pain]
    domain: safety
    claim_summary: >-
      New or progressive objective neurological findings, possible cord/myelopathic features,
      worsening or materially new symptoms, or unresolved concern for fracture/dislocation/instability
      or other significant traumatic pathology require clinician reassessment or the selected medical/
      structural pathway rather than routine C5 progression. CU-1 does not determine urgency autonomously.
    recommendation_direction: recommend
    output_scope: referral_core
    certainty_optional: not_applicable
    reviewed_on: 2026-08-29

  c5_persistent_neurological_signs_require_medical_review:
    claim_id: c5_persistent_neurological_signs_require_medical_review
    evidence_ids: [optima_nad_cpg_2016]
    applicable_route_evidence_profile_ids: [rep_c5_persistent_whiplash_wad_v1, rep_c5_unresolved_posttraumatic_safety_v1]
    applicable_route_ids: [post_traumatic_neck_pain]
    applicability_conditions_optional: [persistent_whiplash_over_3_months, persistent_objective_neurological_signs_with_disability]
    domain: safety
    claim_summary: >-
      In persistent grade-III/equivalent neck-pain context, ongoing objective neurological signs with
      disability beyond three months warrant physician investigation/management rather than being
      treated only as a routine exercise-progression problem.
    recommendation_direction: recommend
    output_scope: referral_core
    certainty_optional: not_graded
    reviewed_on: 2026-08-29

