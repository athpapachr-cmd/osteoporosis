purpose: >-
  Native schema-conformant evidence extension for the frozen C5 route post_traumatic_neck_pain.
  The route label includes both whiplash-associated and other post-traumatic neck pain, while the
  strongest route-specific rehabilitation evidence is WAD-specific and differs materially between
  recent/acute and persistent presentations. C5 therefore uses separate recent-WAD and persistent-WAD
  evidence profiles/sequences. Unknown WAD temporal phase, other non-WAD cervical trauma and unresolved
  structural/neurological safety context are explicit blocked states rather than recipients of generic
  C1 or cross-phase fallback. Known fracture/dislocation/instability or another structural/healing
  restriction remains clinician-entered context with patient-specific protocol precedence.

