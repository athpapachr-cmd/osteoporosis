purpose: >-
  Native schema-conformant evidence extension for clinician-established symptomatic thumb CMC-1
  osteoarthritis. The route supports education/joint-protection, hand/thumb exercise and optional
  CMC-support orthosis while preserving uncertainty about optimal exercise prescription, orthosis
  type and wear schedule. It does not reuse generalized/interphalangeal hand-OA authority as a
  substitute for thumb-base-specific evidence.

