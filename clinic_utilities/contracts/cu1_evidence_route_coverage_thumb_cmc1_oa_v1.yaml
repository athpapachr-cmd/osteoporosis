claims:
  thumb_cmc_eular_education_joint_protection_A:
    claim_id: thumb_cmc_eular_education_joint_protection_A
    evidence_ids: [hand_oa_eular_2018_update]
    applicable_route_evidence_profile_ids: [rep_thumb_cmc1_oa_v1]
    applicable_route_ids: [thumb_cmc1_osteoarthritis]
    domain: core_rehabilitation
    claim_summary: Education and training in ergonomic principles, pacing of activity and use of assistive devices should be offered as part of hand-OA management and are applicable to symptomatic thumb-base OA.
    recommendation_direction: recommend
    output_scope: referral_core
    strength_optional: A_EULAR
    certainty_optional: not_graded
    reviewed_on: 2026-08-29

  thumb_cmc_eular_exercise_A:
    claim_id: thumb_cmc_eular_exercise_A
    evidence_ids: [hand_oa_eular_2018_update]
    applicable_route_evidence_profile_ids: [rep_thumb_cmc1_oa_v1]
    applicable_route_ids: [thumb_cmc1_osteoarthritis]
    domain: core_rehabilitation
    claim_summary: Exercises to improve function and muscle strength and reduce pain should be considered in hand osteoarthritis; the recommendation does not define one optimal thumb exercise programme or dose.
    recommendation_direction: recommend
    output_scope: referral_core
    strength_optional: A_EULAR
    certainty_optional: not_graded
    reviewed_on: 2026-08-29

  thumb_cmc_acr_exercise_strong:
    claim_id: thumb_cmc_acr_exercise_strong
    evidence_ids: [oa_acr_af_2019_guideline]
    applicable_route_evidence_profile_ids: [rep_thumb_cmc1_oa_v1]
    applicable_route_ids: [thumb_cmc1_osteoarthritis]
    domain: core_rehabilitation
    claim_summary: Exercise is strongly recommended for hand osteoarthritis, while evidence is insufficient to prescribe a single best exercise type or ideal duration, intensity or frequency.
    recommendation_direction: recommend
    output_scope: referral_core
    strength_optional: strong_ACR_AF
    certainty_optional: not_graded
    reviewed_on: 2026-08-29

  thumb_cmc_exercise_shortterm_sr_2024:
    claim_id: thumb_cmc_exercise_shortterm_sr_2024
    evidence_ids: [thumb_cmc_exercise_sr_2024, thumb_cmc_nonoperative_nma_2025]
    applicable_route_evidence_profile_ids: [rep_thumb_cmc1_oa_v1]
    applicable_route_ids: [thumb_cmc1_osteoarthritis]
    domain: core_rehabilitation
    claim_summary: Contemporary syntheses support hand/thumb exercise for short-term pain, disability and/or grip-strength improvement in symptomatic thumb CMC-1 OA, but an optimal exercise programme is not established and benefits are less certain at longer follow-up.
    recommendation_direction: recommend
    output_scope: referral_core
    certainty_optional: moderate
    reviewed_on: 2026-08-29

  thumb_cmc_eular_orthosis_A:
    claim_id: thumb_cmc_eular_orthosis_A
    evidence_ids: [hand_oa_eular_2018_update]
    applicable_route_evidence_profile_ids: [rep_thumb_cmc1_oa_v1]
    applicable_route_ids: [thumb_cmc1_osteoarthritis]
    domain: adjunct
    claim_summary: A thumb-base orthosis should be considered for symptom relief in thumb-base osteoarthritis; the EULAR recommendation advocates longer-term use but does not establish one universal orthosis design or physician-prescribed wear schedule.
    recommendation_direction: consider
    output_scope: referral_core
    strength_optional: A_EULAR
    certainty_optional: not_graded
    reviewed_on: 2026-08-29

  thumb_cmc_acr_orthosis_strong:
    claim_id: thumb_cmc_acr_orthosis_strong
    evidence_ids: [oa_acr_af_2019_guideline]
    applicable_route_evidence_profile_ids: [rep_thumb_cmc1_oa_v1]
    applicable_route_ids: [thumb_cmc1_osteoarthritis]
    domain: adjunct
    claim_summary: Hand orthoses are strongly recommended for first-CMC osteoarthritis, while available data are insufficient for a universal recommendation of one orthosis type over another.
    recommendation_direction: recommend
    output_scope: referral_core
    strength_optional: strong_ACR_AF
    certainty_optional: not_graded
    reviewed_on: 2026-08-29

  thumb_cmc_orthosis_effect_and_type_uncertainty_2024:
    claim_id: thumb_cmc_orthosis_effect_and_type_uncertainty_2024
    evidence_ids: [thumb_cmc_PT_sr_2024, thumb_cmc_nonoperative_nma_2025]
    applicable_route_evidence_profile_ids: [rep_thumb_cmc1_oa_v1]
    applicable_route_ids: [thumb_cmc1_osteoarthritis]
    domain: adjunct
    claim_summary: Orthoses can improve selected pain/strength/function outcomes in thumb CMC-1 OA, but confidence and comparative findings differ across syntheses; exact orthosis type and wear schedule should not be automatically prescribed by CU-1.
    recommendation_direction: consider
    output_scope: clinician_ui_only
    reviewed_on: 2026-08-29

  thumb_cmc_rigid_cmcmp_mediumterm_signal_2025:
    claim_id: thumb_cmc_rigid_cmcmp_mediumterm_signal_2025
    evidence_ids: [thumb_cmc_nonoperative_nma_2025]
    applicable_route_evidence_profile_ids: [rep_thumb_cmc1_oa_v1]
    applicable_route_ids: [thumb_cmc1_osteoarthritis]
    domain: adjunct
    claim_summary: The 2025 network meta-analysis found clinically important medium-term pain and function benefit for a rigid CMC-MCP splint versus control with moderate/high-confidence network evidence, but this does not make that design a universal mandatory orthosis.
    recommendation_direction: consider
    output_scope: therapist_execution_detail
    reviewed_on: 2026-08-29

  thumb_cmc_orthosis_type_schedule_execution_detail:
    claim_id: thumb_cmc_orthosis_type_schedule_execution_detail
    evidence_ids: [thumb_cmc_PT_sr_2024, oa_acr_af_2019_guideline, thumb_cmc_asht_consensus_2023]
    applicable_route_evidence_profile_ids: [rep_thumb_cmc1_oa_v1]
    applicable_route_ids: [thumb_cmc1_osteoarthritis]
    domain: execution_detail
    claim_summary: Selection and fitting of rigid versus soft, short versus longer CMC-support orthoses and the exact activity/night wear schedule are individualized therapist-level implementation decisions rather than automatic physician referral prescriptions.
    recommendation_direction: context_only
    output_scope: therapist_execution_detail
    reviewed_on: 2026-08-29

  thumb_cmc_dynamic_stability_consensus:
    claim_id: thumb_cmc_dynamic_stability_consensus
    evidence_ids: [thumb_cmc_asht_consensus_2023]
    applicable_route_evidence_profile_ids: [rep_thumb_cmc1_oa_v1]
    applicable_route_ids: [thumb_cmc1_osteoarthritis]
    domain: execution_detail
    claim_summary: Expert hand-therapy consensus supports dynamic-stability exercise, joint-protection education, adaptive equipment and functional intervention; the exact programme remains therapist-level execution rather than a universal evidence-derived protocol.
    recommendation_direction: consider
    output_scope: therapist_execution_detail
    strength_optional: expert_consensus
    certainty_optional: not_applicable
    reviewed_on: 2026-08-29

  thumb_cmc_response_measurement_consensus:
    claim_id: thumb_cmc_response_measurement_consensus
    evidence_ids: [thumb_cmc_asht_consensus_2023]
    applicable_route_evidence_profile_ids: [rep_thumb_cmc1_oa_v1]
    applicable_route_ids: [thumb_cmc1_osteoarthritis]
    domain: progression_criteria
    claim_summary: Response to nonsurgical thumb-CMC rehabilitation may be reassessed using pain, thumb range of motion, grip and tripod-pinch measures, a region-specific patient-reported outcome and functional/environmental demands; no universal numeric progression threshold is established.
    recommendation_direction: consider
    output_scope: referral_core
    strength_optional: expert_consensus
    certainty_optional: not_applicable
    reviewed_on: 2026-08-29

