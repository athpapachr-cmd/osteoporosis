rehabilitation_sequences:
  seq_thumb_cmc1_oa_v1:
    sequence_id: seq_thumb_cmc1_oa_v1
    route_id: thumb_cmc1_osteoarthritis
    sequence_source: route_evidence_profile
    route_evidence_profile_id: rep_thumb_cmc1_oa_v1
    phases:
      - phase_id: thumb_cmc1_nonoperative_function_rehabilitation
        order: 1
        clinical_objective: reduce pain and improve thumb-hand function through education, activity/joint-protection strategies, individualized exercise and optional CMC support
        objective_authority:
          authority_type: evidence_claim
          evidence_claim_ids:
            - thumb_cmc_eular_education_joint_protection_A
            - thumb_cmc_eular_exercise_A
            - thumb_cmc_acr_exercise_strong
        intervention_directions:
          - intervention_direction_id: thumb_cmc1_education_joint_protection
            statement: provide education on ergonomic principles, pacing, joint protection, load/activity modification and adaptive strategies according to the patient's functional demands
            authority:
              authority_type: evidence_claim
              evidence_claim_ids: [thumb_cmc_eular_education_joint_protection_A]
          - intervention_direction_id: thumb_cmc1_hand_thumb_exercise
            statement: use individualized thumb/hand exercise to improve function, strength and symptom tolerance without prescribing one universal exercise programme or dose
            authority:
              authority_type: evidence_claim
              evidence_claim_ids: [thumb_cmc_eular_exercise_A, thumb_cmc_acr_exercise_strong, thumb_cmc_exercise_shortterm_sr_2024]
          - intervention_direction_id: thumb_cmc1_support_orthosis_when_appropriate
            statement: consider a CMC-support orthosis for symptom relief and function when clinically appropriate; exact design, fitting and wear schedule remain individualized
            authority:
              authority_type: evidence_claim
              evidence_claim_ids: [thumb_cmc_eular_orthosis_A, thumb_cmc_acr_orthosis_strong]
        progression_criteria:
          - criterion_id: thumb_cmc1_response_based_progression
            criterion_kind: progression
            statement: progress functional loading and exercise according to pain, thumb motion, grip/pinch capacity, patient-reported function and task tolerance rather than elapsed time or a universal numeric threshold
            authority:
              authority_type: evidence_claim
              evidence_claim_ids: [thumb_cmc_response_measurement_consensus]
        precautions_or_do_not_progress_criteria: []
        strength_optional: null
        certainty_optional: not_graded
        required_for_route: true
    clinician_modifications_optional: []
    protocol_overrides_optional: []

