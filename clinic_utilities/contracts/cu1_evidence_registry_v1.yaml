    authors_or_organization: Kizaki et al.
    year_or_version: 2020
    reference: Knee Surg Sports Traumatol Arthrosc. 2020;28(10):3354-3364
    doi_optional: 10.1007/s00167-020-05966-x
    url_optional: https://pubmed.ncbi.nlm.nih.gov/32246173/
    reviewed_on: 2026-08-28
    next_review_due: 2027-08-28
    status: active

  dgs_treatment_mirzaei_2023:
    evidence_id: dgs_treatment_mirzaei_2023
