rehabilitation_sequence_seeds:
  lateral_elbow_sequence_seed_v1:
    route_id: lateral_elbow_tendinopathy
    status: incomplete_seed_not_runtime_authority
    phases:
      - phase_id: tendon_load_capacity
        order: 1
        clinical_objective: restore wrist-extensor load tolerance and strength
        intervention_direction_claim_ids: [lateral_elbow_resisted_wrist_extensor_exercise]
      - phase_id: high_demand_function
        order: 2
        clinical_objective: reintroduce higher stress endurance and motor-control demands when relevant
        intervention_direction_claim_ids: [lateral_elbow_phased_stress_strength_endurance_motor_control]
    missing_before_freeze: [explicit_progression_criteria, low_irritability_vs_high_irritability_branching]

  achilles_midportion_sequence_seed_v1:
    route_id: achilles_tendinopathy
    subtype_ids_optional: [midportion_achilles_tendinopathy]
    status: incomplete_seed_not_runtime_authority
    phases:
      - phase_id: tendon_loading
        order: 1
        clinical_objective: improve pain function and tendon load capacity through tolerated tendon loading
        intervention_direction_claim_ids: [achilles_tendon_loading_first_line_midportion, achilles_loading_mode_not_eccentric_only_midportion]
      - phase_id: impairment_specific_mobility
        order: 2
        clinical_objective: address limited dorsiflexion when present
        intervention_direction_claim_ids: [achilles_stretching_if_dorsiflexion_limited_midportion]
        conditional: limited_ankle_dorsiflexion
    missing_before_freeze: [criteria_for_progressing_load, functional_return_sequence]

