  dgs_beyond_entrapment_2025:
    evidence_id: dgs_beyond_entrapment_2025
    source_type: narrative_review
    title: Beyond Nerve Entrapment — A Narrative Review of Muscle-Tendon Pathologies in Deep Gluteal Syndrome
    authors_or_organization: narrative review authors
