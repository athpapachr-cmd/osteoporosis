version: cu1_evidence_registry_v1
status: design_candidate
reviewed_on: 2026-08-28
runtime_authorized: false

source_schema:
  required: [evidence_id, source_type, title, authors_or_organization, year_or_version, reference, reviewed_on, next_review_due, status]
  source_type_values: [guideline, systematic_review, clinical_practice_guideline, consensus, randomized_trial, cohort, narrative_review, other]
  status_values: [active, superseded, context_only]

claim_schema:
  required: [claim_id, evidence_ids, applicable_profile_ids, applicable_route_ids, domain, claim_summary, recommendation_direction, output_scope, reviewed_on]
  optional: [applicable_subtype_ids, applicability_conditions]
  domain_values: [diagnostic_definition, history, examination, core_rehabilitation, rehab_phase, progression_criteria, adjunct, safety, differential, execution_detail]
  recommendation_direction_values: [recommend, consider, may_consider, do_not_offer, insufficient_evidence, context_only]
  output_scope_values: [referral_core, therapist_execution_detail, clinician_ui_only]
  certainty_values: [high, moderate, low, very_low, not_graded, not_applicable]

sources:
  dgs_definition_kizaki_2020:
    evidence_id: dgs_definition_kizaki_2020
    source_type: systematic_review
