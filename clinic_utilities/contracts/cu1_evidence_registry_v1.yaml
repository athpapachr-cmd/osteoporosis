claims:
  dgs_classical_definition:
    claim_id: dgs_classical_definition
    evidence_ids: [dgs_definition_kizaki_2020]
    applicable_profile_ids: [lumbar]
    applicable_route_ids: [deep_gluteal_piriformis_presentation]
    domain: diagnostic_definition
    claim_summary: Classical DGS is a non-discogenic sciatic nerve disorder caused by entrapment in the deep gluteal space.
    recommendation_direction: context_only
    output_scope: clinician_ui_only
    certainty_optional: not_graded
    reviewed_on: 2026-08-28

  dgs_history_exam_are_central:
    claim_id: dgs_history_exam_are_central
    evidence_ids: [dgs_definition_kizaki_2020]
    applicable_profile_ids: [lumbar]
    applicable_route_ids: [deep_gluteal_piriformis_presentation]
    domain: history
    claim_summary: Diagnostic pathways commonly include history of posterior hip/buttock pain, sciatic-type symptoms or sitting intolerance together with targeted physical examination and selected investigations.
    recommendation_direction: consider
    output_scope: referral_core
    certainty_optional: low
    applicability_conditions: [do_not_infer_syndrome_from_buttock_pain_alone]
    reviewed_on: 2026-08-28

  dgs_no_single_superior_conservative_treatment:
    claim_id: dgs_no_single_superior_conservative_treatment
    evidence_ids: [dgs_treatment_mirzaei_2023]
    applicable_profile_ids: [lumbar]
    applicable_route_ids: [deep_gluteal_piriformis_presentation]
    domain: core_rehabilitation
    claim_summary: Available evidence is low quality and does not establish one conservative treatment as superior to another.
    recommendation_direction: insufficient_evidence
    output_scope: clinician_ui_only
    certainty_optional: low
    reviewed_on: 2026-08-28

  dgs_use_broader_active_physiotherapy_principles_when_applicable:
    claim_id: dgs_use_broader_active_physiotherapy_principles_when_applicable
    evidence_ids: [dgs_treatment_mirzaei_2023, nice_ng59_lbp_sciatica]
    applicable_profile_ids: [lumbar]
    applicable_route_ids: [deep_gluteal_piriformis_presentation]
    domain: core_rehabilitation
    claim_summary: In the absence of a proven superior DGS-specific conservative protocol, active physiotherapy/self-management principles may be used when clinically applicable without implying superiority of a specific DGS technique.
    recommendation_direction: consider
    output_scope: referral_core
    certainty_optional: low
    reviewed_on: 2026-08-28

  nice_lbp_sciatica_self_management_activity:
    claim_id: nice_lbp_sciatica_self_management_activity
    evidence_ids: [nice_ng59_lbp_sciatica]
    applicable_profile_ids: [lumbar]
    applicable_route_ids: [nonspecific_low_back_pain, low_back_pain_with_radiating_leg_symptoms]
    domain: core_rehabilitation
    claim_summary: Advice, self-management and continuation of normal activity are recommended components of care for low-back pain with or without sciatica.
    recommendation_direction: recommend
    output_scope: referral_core
    certainty_optional: not_graded
    reviewed_on: 2026-08-28

  nice_lbp_sciatica_manual_therapy_only_with_exercise_package:
    claim_id: nice_lbp_sciatica_manual_therapy_only_with_exercise_package
    evidence_ids: [nice_ng59_lbp_sciatica]
    applicable_profile_ids: [lumbar]
    applicable_route_ids: [nonspecific_low_back_pain, low_back_pain_with_radiating_leg_symptoms]
    domain: adjunct
    claim_summary: Manual therapy may be considered only as part of a treatment package that includes exercise, with or without psychological therapy.
    recommendation_direction: consider
    output_scope: referral_core
    certainty_optional: not_graded
    applicability_conditions: [core_exercise_direction_present]
    reviewed_on: 2026-08-28

  nice_lbp_sciatica_no_traction:
    claim_id: nice_lbp_sciatica_no_traction
    evidence_ids: [nice_ng59_lbp_sciatica]
    applicable_profile_ids: [lumbar]
    applicable_route_ids: [nonspecific_low_back_pain, low_back_pain_with_radiating_leg_symptoms]
    domain: adjunct
    claim_summary: Traction should not be offered for low-back pain with or without sciatica.
    recommendation_direction: do_not_offer
    output_scope: clinician_ui_only
    certainty_optional: not_graded
    reviewed_on: 2026-08-28

  lateral_elbow_resisted_wrist_extensor_exercise:
    claim_id: lateral_elbow_resisted_wrist_extensor_exercise
    evidence_ids: [lateral_elbow_cpg_2022]
    applicable_profile_ids: [elbow]
    applicable_route_ids: [lateral_elbow_tendinopathy]
    domain: core_rehabilitation
    claim_summary: For subacute or chronic lateral elbow tendinopathy, therapeutic resisted wrist-extensor exercise may use isometric, concentric and/or eccentric loading.
    recommendation_direction: recommend
    output_scope: referral_core
    strength_optional: B
    certainty_optional: not_graded
    reviewed_on: 2026-08-28

  lateral_elbow_phased_stress_strength_endurance_motor_control:
    claim_id: lateral_elbow_phased_stress_strength_endurance_motor_control
    evidence_ids: [lateral_elbow_cpg_2022]
    applicable_profile_ids: [elbow]
    applicable_route_ids: [lateral_elbow_tendinopathy]
    domain: rehab_phase
    claim_summary: A phased reintroduction of stress, strength, endurance and motor-control demands may be used for patients with high-demand occupational, hobby, performing-arts or athletic requirements.
    recommendation_direction: may_consider
    output_scope: referral_core
    strength_optional: F
    certainty_optional: not_graded
    reviewed_on: 2026-08-28

  achilles_tendon_loading_first_line_midportion:
    claim_id: achilles_tendon_loading_first_line_midportion
    evidence_ids: [achilles_midportion_cpg_2024]
    applicable_profile_ids: [ankle_foot]
    applicable_route_ids: [achilles_tendinopathy]
    applicable_subtype_ids: [midportion_achilles_tendinopathy]
    domain: core_rehabilitation
    claim_summary: Tendon-loading exercise, with load as high as tolerated, is first-line treatment for midportion Achilles tendinopathy when tendon-structure frailty is not presumed.
    recommendation_direction: recommend
    output_scope: referral_core
    strength_optional: A
    certainty_optional: not_graded
    reviewed_on: 2026-08-28

  achilles_loading_mode_not_eccentric_only_midportion:
    claim_id: achilles_loading_mode_not_eccentric_only_midportion
    evidence_ids: [achilles_midportion_cpg_2024]
    applicable_profile_ids: [ankle_foot]
    applicable_route_ids: [achilles_tendinopathy]
    applicable_subtype_ids: [midportion_achilles_tendinopathy]
    domain: rehab_phase
    claim_summary: Effective midportion Achilles loading is not limited to eccentric exercise; multiple loading approaches may improve pain and function, so progression should be individualized to tolerance and functional demand.
    recommendation_direction: recommend
    output_scope: referral_core
    strength_optional: A_context
    certainty_optional: not_graded
    reviewed_on: 2026-08-28

  achilles_stretching_if_dorsiflexion_limited_midportion:
    claim_id: achilles_stretching_if_dorsiflexion_limited_midportion
    evidence_ids: [achilles_midportion_cpg_2024]
    applicable_profile_ids: [ankle_foot]
    applicable_route_ids: [achilles_tendinopathy]
    applicable_subtype_ids: [midportion_achilles_tendinopathy]
    domain: adjunct
    claim_summary: Plantar-flexor stretching may be used for midportion Achilles tendinopathy when ankle dorsiflexion is limited.
    recommendation_direction: may_consider
    output_scope: referral_core
    strength_optional: C
    certainty_optional: not_graded
    applicability_conditions: [limited_ankle_dorsiflexion]
    reviewed_on: 2026-08-28

  achilles_loading_frequency_midportion:
    claim_id: achilles_loading_frequency_midportion
    evidence_ids: [achilles_midportion_cpg_2024]
    applicable_profile_ids: [ankle_foot]
    applicable_route_ids: [achilles_tendinopathy]
    applicable_subtype_ids: [midportion_achilles_tendinopathy]
    domain: execution_detail
    claim_summary: The CPG includes exercise-frequency guidance for tendon-loading programmes.
    recommendation_direction: recommend
    output_scope: therapist_execution_detail
    strength_optional: E
    certainty_optional: not_graded
    reviewed_on: 2026-08-28

