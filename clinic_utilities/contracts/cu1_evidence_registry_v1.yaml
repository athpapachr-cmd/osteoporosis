claims:
  dgs_classical_definition:
    claim_id: dgs_classical_definition
    evidence_ids: [dgs_definition_kizaki_2020]
    applicable_route_evidence_profile_ids: [rep_deep_gluteal_piriformis_v1]
    applicable_route_ids: [deep_gluteal_piriformis_presentation]
    domain: diagnostic_definition
    claim_summary: Classical DGS is a non-discogenic sciatic nerve disorder involving entrapment in the deep gluteal space; the software must not infer it from buttock pain alone.
    recommendation_direction: context_only
    output_scope: clinician_ui_only
    certainty_optional: not_graded
    reviewed_on: 2026-08-28

  dgs_history_exam_pathway:
    claim_id: dgs_history_exam_pathway
    evidence_ids: [dgs_definition_kizaki_2020]
    applicable_route_evidence_profile_ids: [rep_deep_gluteal_piriformis_v1]
    applicable_route_ids: [deep_gluteal_piriformis_presentation]
    domain: history
    claim_summary: Published DGS diagnostic pathways commonly include posterior hip/buttock pain, sciatic-type symptoms or sitting intolerance together with targeted physical examination and selected investigations.
    recommendation_direction: consider
    output_scope: referral_core
    certainty_optional: low
    applicability_conditions: [do_not_infer_syndrome_from_buttock_pain_alone]
    reviewed_on: 2026-08-28

  dgs_no_superior_specific_conservative_protocol:
    claim_id: dgs_no_superior_specific_conservative_protocol
    evidence_ids: [dgs_conservative_hopayian_2023]
    applicable_route_evidence_profile_ids: [rep_deep_gluteal_piriformis_v1]
    applicable_route_ids: [deep_gluteal_piriformis_presentation]
    domain: core_rehabilitation
    claim_summary: Available conservative-treatment evidence is low quality and does not establish one DGS-specific conservative treatment as superior to another.
    recommendation_direction: insufficient_evidence
    output_scope: clinician_ui_only
    certainty_optional: low
    reviewed_on: 2026-08-28

  dgs_broad_first_line_physiotherapy_only:
    claim_id: dgs_broad_first_line_physiotherapy_only
    evidence_ids: [dgs_conservative_hopayian_2023]
    applicable_route_evidence_profile_ids: [rep_deep_gluteal_piriformis_v1]
    applicable_route_ids: [deep_gluteal_piriformis_presentation]
    domain: core_rehabilitation
    claim_summary: In the absence of a proven superior DGS-specific conservative technique, first-line care may remain physiotherapy-based without claiming superiority of a specific exercise or manual technique.
    recommendation_direction: consider
    output_scope: referral_core
    certainty_optional: low
    reviewed_on: 2026-08-28

  lbp_chronic_exercise_core:
    claim_id: lbp_chronic_exercise_core
    evidence_ids: [lbp_cpg_2021]
    applicable_route_evidence_profile_ids: [rep_nonspecific_lbp_v1]
    applicable_route_ids: [nonspecific_low_back_pain]
    domain: core_rehabilitation
    claim_summary: For chronic low back pain, exercise training including strengthening/endurance, multimodal, aerobic, aquatic or general exercise is recommended; no single exercise type is established as universally superior.
    recommendation_direction: recommend
    output_scope: referral_core
    strength_optional: A
    certainty_optional: not_graded
    applicability_conditions: [chronic_low_back_pain]
    reviewed_on: 2026-08-28

  lbp_activity_self_management_core:
    claim_id: lbp_activity_self_management_core
    evidence_ids: [nice_ng59_lbp_sciatica]
    applicable_route_evidence_profile_ids: [rep_nonspecific_lbp_v1, rep_lbp_radiating_leg_v1]
    applicable_route_ids: [nonspecific_low_back_pain, low_back_pain_with_radiating_leg_symptoms]
    domain: core_rehabilitation
    claim_summary: Advice, self-management and continuation of normal activity are recommended components of care for low-back pain with or without sciatica.
    recommendation_direction: recommend
    output_scope: referral_core
    certainty_optional: not_graded
    reviewed_on: 2026-08-28

  lbp_leg_pain_exercise:
    claim_id: lbp_leg_pain_exercise
    evidence_ids: [lbp_cpg_2021]
    applicable_route_evidence_profile_ids: [rep_lbp_radiating_leg_v1]
    applicable_route_ids: [low_back_pain_with_radiating_leg_symptoms]
    domain: core_rehabilitation
    claim_summary: Exercise may be used for low back pain with leg pain; chronic presentations may include specific trunk activation and movement-control exercise.
    recommendation_direction: consider
    output_scope: referral_core
    certainty_optional: not_graded
    applicability_conditions: [leg_pain_or_radiating_symptoms]
    reviewed_on: 2026-08-28

  lbp_leg_pain_neural_mobilization:
    claim_id: lbp_leg_pain_neural_mobilization
    evidence_ids: [lbp_cpg_2021]
    applicable_route_evidence_profile_ids: [rep_lbp_radiating_leg_v1]
    applicable_route_ids: [low_back_pain_with_radiating_leg_symptoms]
    domain: adjunct
    claim_summary: Neural mobilization may be used with other treatments for short-term improvement in pain and disability in chronic low back pain with leg pain.
    recommendation_direction: may_consider
    output_scope: referral_core
    strength_optional: B
    certainty_optional: not_graded
    applicability_conditions: [chronic_leg_pain_neural_context]
    reviewed_on: 2026-08-28

  lbp_leg_pain_no_mechanical_traction:
    claim_id: lbp_leg_pain_no_mechanical_traction
    evidence_ids: [lbp_cpg_2021, nice_ng59_lbp_sciatica]
    applicable_route_evidence_profile_ids: [rep_lbp_radiating_leg_v1]
    applicable_route_ids: [low_back_pain_with_radiating_leg_symptoms]
    domain: adjunct
    claim_summary: Mechanical traction should not be used for chronic low back pain with leg pain and NICE also recommends against traction for low back pain with or without sciatica.
    recommendation_direction: do_not_offer
    output_scope: clinician_ui_only
    strength_optional: B
    certainty_optional: not_graded
    reviewed_on: 2026-08-28

  lateral_elbow_resisted_wrist_extensor_exercise:
    claim_id: lateral_elbow_resisted_wrist_extensor_exercise
    evidence_ids: [lateral_elbow_cpg_2022]
    applicable_route_evidence_profile_ids: [rep_lateral_elbow_tendinopathy_v1]
    applicable_route_ids: [lateral_elbow_tendinopathy]
    domain: core_rehabilitation
    claim_summary: For subacute or chronic lateral elbow tendinopathy, therapeutic resisted wrist-extensor exercise may use isometric, concentric and/or eccentric loading.
    recommendation_direction: recommend
    output_scope: referral_core
    strength_optional: B
    certainty_optional: not_graded
    applicability_conditions: [subacute_or_chronic_lateral_elbow_tendinopathy]
    reviewed_on: 2026-08-28

  lateral_elbow_high_demand_phased_reintroduction:
    claim_id: lateral_elbow_high_demand_phased_reintroduction
    evidence_ids: [lateral_elbow_cpg_2022]
    applicable_route_evidence_profile_ids: [rep_lateral_elbow_tendinopathy_v1]
    applicable_route_ids: [lateral_elbow_tendinopathy]
    domain: rehab_phase
    claim_summary: A phased approach may be used to reintroduce stress, increase strength, improve endurance and restore motor control when high-demand occupational, hobby, performing-arts or athletic requirements exist.
    recommendation_direction: may_consider
    output_scope: referral_core
    strength_optional: F
    certainty_optional: not_graded
    applicability_conditions: [high_demand_upper_limb_context]
    reviewed_on: 2026-08-28

  achilles_midportion_tendon_loading_first_line:
    claim_id: achilles_midportion_tendon_loading_first_line
    evidence_ids: [achilles_midportion_cpg_2024]
    applicable_route_evidence_profile_ids: [rep_achilles_midportion_v1]
    applicable_route_ids: [achilles_tendinopathy]
    applicable_subtype_ids: [midportion_achilles_tendinopathy]
    domain: core_rehabilitation
    claim_summary: Tendon-loading exercise, with load as high as tolerated, is first-line treatment for midportion Achilles tendinopathy when tendon-structure frailty is not presumed.
    recommendation_direction: recommend
    output_scope: referral_core
    strength_optional: A
    certainty_optional: not_graded
    reviewed_on: 2026-08-28

  achilles_midportion_multiple_loading_modes:
    claim_id: achilles_midportion_multiple_loading_modes
    evidence_ids: [achilles_midportion_cpg_2024]
    applicable_route_evidence_profile_ids: [rep_achilles_midportion_v1]
    applicable_route_ids: [achilles_tendinopathy]
    applicable_subtype_ids: [midportion_achilles_tendinopathy]
    domain: core_rehabilitation
    claim_summary: Effective midportion Achilles loading is not restricted to eccentric exercise; multiple loading approaches may improve pain and function.
    recommendation_direction: recommend
    output_scope: referral_core
    strength_optional: A_context
    certainty_optional: not_graded
    reviewed_on: 2026-08-28

  achilles_midportion_stretch_if_dorsiflexion_limited:
    claim_id: achilles_midportion_stretch_if_dorsiflexion_limited
    evidence_ids: [achilles_midportion_cpg_2024]
    applicable_route_evidence_profile_ids: [rep_achilles_midportion_v1]
    applicable_route_ids: [achilles_tendinopathy]
    applicable_subtype_ids: [midportion_achilles_tendinopathy]
    domain: adjunct
    claim_summary: Plantar-flexor stretching may be used for midportion Achilles tendinopathy when ankle dorsiflexion is limited.
    recommendation_direction: may_consider
    output_scope: referral_core
    strength_optional: C
    certainty_optional: not_graded
    applicability_conditions: [limited_ankle_dorsiflexion]
    reviewed_on: 2026-08-28

  achilles_midportion_loading_frequency_execution_detail:
    claim_id: achilles_midportion_loading_frequency_execution_detail
    evidence_ids: [achilles_midportion_cpg_2024]
    applicable_route_evidence_profile_ids: [rep_achilles_midportion_v1]
    applicable_route_ids: [achilles_tendinopathy]
    applicable_subtype_ids: [midportion_achilles_tendinopathy]
    domain: execution_detail
    claim_summary: The CPG recommends tendon-loading exercise at least three times per week at an intensity as high as tolerated.
    recommendation_direction: recommend
    output_scope: therapist_execution_detail
    strength_optional: E
    certainty_optional: not_graded
    reviewed_on: 2026-08-28

  achilles_midportion_rts_criteria_not_well_operationalized:
    claim_id: achilles_midportion_rts_criteria_not_well_operationalized
    evidence_ids: [achilles_midportion_rts_systematic_review_2018]
    applicable_route_evidence_profile_ids: [rep_achilles_midportion_v1]
    applicable_route_ids: [achilles_tendinopathy]
    applicable_subtype_ids: [midportion_achilles_tendinopathy]
    domain: progression_criteria
    claim_summary: Return-to-sport criteria reported in midportion Achilles studies span pain, functional recovery, strength, ROM and endurance, but most criteria were poorly operationalized; exact thresholds should not be invented from this review.
    recommendation_direction: context_only
    output_scope: clinician_ui_only
    certainty_optional: low
    reviewed_on: 2026-08-28

  achilles_insertional_low_compression_bundle:
    claim_id: achilles_insertional_low_compression_bundle
    evidence_ids: [achilles_insertional_low_compression_rct_2025]
    applicable_route_evidence_profile_ids: [rep_achilles_insertional_v1]
    applicable_route_ids: [achilles_tendinopathy]
    applicable_subtype_ids: [insertional_achilles_tendinopathy]
    domain: core_rehabilitation
    claim_summary: In a small trial of sport-active adults with chronic insertional Achilles tendinopathy, a progressive low-tendon-compression rehabilitation programme produced greater pain/function improvement than a high-compression programme; this supports considering a low-compression strategy but does not establish universal component-specific effects.
    recommendation_direction: consider
    output_scope: referral_core
    certainty_optional: low
    applicability_conditions: [chronic_insertional_achilles, sport_active_population_evidence]
    reviewed_on: 2026-08-28

  achilles_insertional_low_compression_components_not_independently_causal:
    claim_id: achilles_insertional_low_compression_components_not_independently_causal
    evidence_ids: [achilles_insertional_low_compression_rct_2025]
    applicable_route_evidence_profile_ids: [rep_achilles_insertional_v1]
    applicable_route_ids: [achilles_tendinopathy]
    applicable_subtype_ids: [insertional_achilles_tendinopathy]
    domain: execution_detail
    claim_summary: The successful low-compression intervention was a bundle involving limited dorsiflexion during exercise, removal of calf stretching, heel lifts and progressive loading; the trial does not isolate the causal contribution of each component.
    recommendation_direction: context_only
    output_scope: clinician_ui_only
    certainty_optional: low
    reviewed_on: 2026-08-28

