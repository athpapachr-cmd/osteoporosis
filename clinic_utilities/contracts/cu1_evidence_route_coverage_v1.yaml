rehabilitation_sequences:
  seq_calcific_rotator_cuff_v1:
    sequence_id: seq_calcific_rotator_cuff_v1
    route_id: calcific_rotator_cuff_tendinopathy
    sequence_source: route_evidence_profile
    route_evidence_profile_id: rep_calcific_rotator_cuff_v1
    phases:
      - phase_id: calcific_rc_active_rehabilitation
        order: 1
        clinical_objective: reduce pain and disability and restore shoulder load tolerance through individualized active rehabilitation and self-management
        objective_authority:
          authority_type: evidence_claim
          evidence_claim_ids: [calcific_rc_active_rehabilitation_core, calcific_rc_patient_centered_education]
        intervention_directions:
          - intervention_direction_id: calcific_rc_active_exercise
            statement: use an individualized active rehabilitation program that may include motor-control and/or resistance exercise with appropriate loads
            authority:
              authority_type: evidence_claim
              evidence_claim_ids: [calcific_rc_active_rehabilitation_core]
          - intervention_direction_id: calcific_rc_education_self_management
            statement: provide individualized education, activity modification and self-management support
            authority:
              authority_type: evidence_claim
              evidence_claim_ids: [calcific_rc_patient_centered_education]
        progression_criteria: []
        precautions_or_do_not_progress_criteria:
          - criterion_id: calcific_rc_persistent_severe_specialist_reassessment
            criterion_kind: reassessment
            statement: severe persistent pain and/or disability despite up to 12 weeks of appropriate nonsurgical care should trigger specialist reassessment rather than indefinite routine progression
            authority:
              authority_type: evidence_claim
              evidence_claim_ids: [calcific_rc_persistent_severe_reassessment]
        strength_optional: null
        certainty_optional: not_graded
        required_for_route: true

      - phase_id: calcific_rc_return_to_sport_when_applicable
        order: 2
        clinical_objective: restore sport-specific shoulder capacity and load tolerance when return to sport is a patient goal
        objective_authority:
          authority_type: evidence_claim
          evidence_claim_ids: [calcific_rc_return_sport_capacity, calcific_rc_return_sport_measures]
