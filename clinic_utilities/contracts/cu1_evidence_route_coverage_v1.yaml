    applicable_route_ids: [calcific_rotator_cuff_tendinopathy]
    domain: diagnostic_definition
    claim_summary: Rotator-cuff calcific tendinopathy denotes a rotator-cuff tendinopathy with a calcific deposit confirmed by imaging; an imaging deposit alone is not to be inferred by the utility from symptoms or examination findings.
