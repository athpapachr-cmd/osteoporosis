version: cu1_evidence_route_coverage_v1_2
status: active_design_authority_route_coverage_extension
runtime_authorized: false
reviewed_on: 2026-08-29
normative_schema: clinic_utilities/contracts/cu1_history_timeline_schema_v1.yaml
identity_mode: explicit_payload_id
review_record: clinic_utilities/contracts/CU1_ROUTE_COVERAGE_REVIEW_2026-08-29.md

purpose: >-
  Native schema-conformant evidence extension for route-by-route CU-1 coverage after tranche2 and
  tranche3 promotion. Every object carries its explicit canonical identity. New routes may be added
  only after exact source/reference/applicability/output-scope review and must not create generic
  cross-route rehabilitation fallbacks or silently hybridize conflicting frameworks.

external_source_dependencies:
  - rotator_cuff_tendinopathy_cpg_2025

sources:
  nice_eswt_calcific_shoulder_htg645_2022:
    evidence_id: nice_eswt_calcific_shoulder_htg645_2022
    source_type: guideline
    title: Extracorporeal shockwave therapy for calcific tendinopathy in the shoulder
    authors_or_organization: National Institute for Health and Care Excellence
    year_or_version: 2022_HTG645_migrated_2026_recommendations_unchanged
    reference: NICE HealthTech guidance HTG645, originally IPG742; published 2022-11-09; migrated January 2026 without recommendation change
    population_scope_optional: adults with calcific tendinopathy in the shoulder considered for extracorporeal shockwave therapy
    reviewed_on: 2026-08-29
    next_review_due: 2027-02-28
    freshness_state: current
    status: active

  glenohumeral_oa_apta_cpg_2023:
    evidence_id: glenohumeral_oa_apta_cpg_2023
    source_type: clinical_practice_guideline
    title: Physical Therapist Management of Glenohumeral Joint Osteoarthritis — A Clinical Practice Guideline from the American Physical Therapy Association
    authors_or_organization: Michener et al. / American Physical Therapy Association guideline development group
    year_or_version: 2023
    reference: Phys Ther. 2023;103(6):pzad041
    doi_optional: 10.1093/ptj/pzad041
    population_scope_optional: adults with primary glenohumeral joint osteoarthritis managed nonoperatively, preoperatively for total shoulder arthroplasty, or after total shoulder arthroplasty; postoperative reverse-TSA rehabilitation is outside the CPG scope
    reviewed_on: 2026-08-29
    next_review_due: 2027-08-29
    freshness_state: current
    status: active

  glenohumeral_oa_pt_sr_2026:
    evidence_id: glenohumeral_oa_pt_sr_2026
    source_type: systematic_review
    title: The effectiveness of physiotherapy-led non-surgical and perioperative interventions for glenohumeral osteoarthritis — a systematic review
    authors_or_organization: systematic review authors
    year_or_version: 2026
    reference: Shoulder Elbow. 2026; online publication. PMID 42186453
    doi_optional: 10.1177/17585732261450961
    population_scope_optional: adults aged 45 years and older with glenohumeral osteoarthritis including rotator-cuff arthropathy; physiotherapist-led nonsurgical and perioperative interventions; evidence search through June 2025
    reviewed_on: 2026-08-29
    next_review_due: 2027-08-29
    freshness_state: current
    status: active

claims:
  calcific_rc_imaging_defined:
    claim_id: calcific_rc_imaging_defined
    evidence_ids: [rotator_cuff_tendinopathy_cpg_2025]
    applicable_route_evidence_profile_ids: [rep_calcific_rotator_cuff_v1]
    applicable_route_ids: [calcific_rotator_cuff_tendinopathy]
    domain: diagnostic_definition
    claim_summary: Rotator-cuff calcific tendinopathy denotes a rotator-cuff tendinopathy with a calcific deposit confirmed by imaging; the utility must not infer a calcific deposit from symptoms or examination findings.
    recommendation_direction: context_only
    output_scope: clinician_ui_only
    certainty_optional: not_applicable
    reviewed_on: 2026-08-29

  calcific_rc_patient_centered_education:
    claim_id: calcific_rc_patient_centered_education
    evidence_ids: [rotator_cuff_tendinopathy_cpg_2025]
    applicable_route_evidence_profile_ids: [rep_calcific_rotator_cuff_v1]
    applicable_route_ids: [calcific_rotator_cuff_tendinopathy]
    domain: core_rehabilitation
    claim_summary: Provide individualized education about the condition, pain-management options, activity modification and self-management while considering health literacy, beliefs, goals and relevant psychosocial factors.
    recommendation_direction: recommend
    output_scope: referral_core
    strength_optional: C
    certainty_optional: not_graded
    reviewed_on: 2026-08-29

  calcific_rc_active_rehabilitation_core:
    claim_id: calcific_rc_active_rehabilitation_core
    evidence_ids: [rotator_cuff_tendinopathy_cpg_2025]
    applicable_route_evidence_profile_ids: [rep_calcific_rotator_cuff_v1]
    applicable_route_ids: [calcific_rotator_cuff_tendinopathy]
    domain: core_rehabilitation
    claim_summary: Active rehabilitation exercise, including motor-control and/or resistance exercise with individualized loads, is recommended as initial treatment to reduce pain and disability in rotator-cuff tendinopathy including the calcific presentation.
    recommendation_direction: recommend
    output_scope: referral_core
    strength_optional: A
    certainty_optional: not_graded
    reviewed_on: 2026-08-29

  calcific_rc_eswt_jospt_optional:
    claim_id: calcific_rc_eswt_jospt_optional
    evidence_ids: [rotator_cuff_tendinopathy_cpg_2025]
    applicable_route_evidence_profile_ids: [rep_calcific_rotator_cuff_v1]
    applicable_route_ids: [calcific_rotator_cuff_tendinopathy]
    domain: adjunct
    claim_summary: The 2025 rotator-cuff CPG states that extracorporeal shock-wave therapy may be used or recommended to reduce pain and disability in adults with calcific rotator-cuff tendinopathy.
    recommendation_direction: may_consider
    output_scope: clinician_ui_only
    strength_optional: C
    certainty_optional: not_graded
    conflicts_with_claim_ids_optional: [calcific_rc_eswt_nice_research_only]
    reviewed_on: 2026-08-29

  calcific_rc_eswt_nice_research_only:
    claim_id: calcific_rc_eswt_nice_research_only
    evidence_ids: [nice_eswt_calcific_shoulder_htg645_2022]
    applicable_route_evidence_profile_ids: [rep_calcific_rotator_cuff_v1]
    applicable_route_ids: [calcific_rotator_cuff_tendinopathy]
    domain: adjunct
    claim_summary: NICE HTG645 states that short-term safety shows no major concern but efficacy evidence is inadequate, so ESWT for calcific shoulder tendinopathy should only be used in the context of research.
    recommendation_direction: do_not_offer
    output_scope: clinician_ui_only
    certainty_optional: not_graded
    applicability_conditions_optional: [routine_clinical_use_outside_research]
    conflicts_with_claim_ids_optional: [calcific_rc_eswt_jospt_optional]
    reviewed_on: 2026-08-29

  calcific_rc_lavage_refractory:
    claim_id: calcific_rc_lavage_refractory
    evidence_ids: [rotator_cuff_tendinopathy_cpg_2025]
    applicable_route_evidence_profile_ids: [rep_calcific_rotator_cuff_v1]
    applicable_route_ids: [calcific_rotator_cuff_tendinopathy]
    domain: adjunct
    claim_summary: Calcific lavage is recommended for adults with calcific rotator-cuff tendinopathy that remains symptomatic despite initial treatment; evidence does not establish lavage as an initial treatment for acute presentations.
    recommendation_direction: recommend
    output_scope: clinician_ui_only
    strength_optional: B
    certainty_optional: not_graded
    applicability_conditions_optional: [refractory_to_initial_treatment]
    reviewed_on: 2026-08-29

  calcific_rc_laser_optional_context:
    claim_id: calcific_rc_laser_optional_context
    evidence_ids: [rotator_cuff_tendinopathy_cpg_2025]
    applicable_route_evidence_profile_ids: [rep_calcific_rotator_cuff_v1]
    applicable_route_ids: [calcific_rotator_cuff_tendinopathy]
    domain: adjunct
    claim_summary: The 2025 CPG states that laser therapy may reduce pain and disability in adults with calcific rotator-cuff tendinopathy, but laser is not added to the frozen CU-1 selectable adjunct taxonomy by this evidence-curation slice.
    recommendation_direction: may_consider
    output_scope: clinician_ui_only
    strength_optional: C
    certainty_optional: not_graded
    reviewed_on: 2026-08-29

  calcific_rc_therapeutic_ultrasound_do_not_offer:
    claim_id: calcific_rc_therapeutic_ultrasound_do_not_offer
    evidence_ids: [rotator_cuff_tendinopathy_cpg_2025]
    applicable_route_evidence_profile_ids: [rep_calcific_rotator_cuff_v1]
    applicable_route_ids: [calcific_rotator_cuff_tendinopathy]
    domain: adjunct
    claim_summary: Therapeutic ultrasound should not be used or recommended, alone or with active rehabilitation, to reduce pain and disability in calcific rotator-cuff tendinopathy.
    recommendation_direction: do_not_offer
    output_scope: clinician_ui_only
    strength_optional: C
    certainty_optional: not_graded
    reviewed_on: 2026-08-29

  calcific_rc_persistent_severe_reassessment:
    claim_id: calcific_rc_persistent_severe_reassessment
    evidence_ids: [rotator_cuff_tendinopathy_cpg_2025]
    applicable_route_evidence_profile_ids: [rep_calcific_rotator_cuff_v1]
    applicable_route_ids: [calcific_rotator_cuff_tendinopathy]
    domain: safety
    claim_summary: Severe persistent pain and/or disability despite up to 12 weeks of appropriate nonsurgical care warrants musculoskeletal specialist reassessment rather than indefinite routine progression.
    recommendation_direction: recommend
    output_scope: referral_core
    strength_optional: F
    certainty_optional: not_graded
    reviewed_on: 2026-08-29

  calcific_rc_return_sport_capacity:
    claim_id: calcific_rc_return_sport_capacity
    evidence_ids: [rotator_cuff_tendinopathy_cpg_2025]
    applicable_route_evidence_profile_ids: [rep_calcific_rotator_cuff_v1]
    applicable_route_ids: [calcific_rotator_cuff_tendinopathy]
    domain: progression_criteria
    claim_summary: When return to sport is relevant, rotator-cuff and associated shoulder capacity and load tolerance may be used to develop the return-to-sport program.
    recommendation_direction: may_consider
    output_scope: referral_core
    strength_optional: F
    certainty_optional: not_graded
    applicability_conditions_optional: [athletic_return_to_sport_goal]
    reviewed_on: 2026-08-29

  calcific_rc_return_sport_measures:
    claim_id: calcific_rc_return_sport_measures
    evidence_ids: [rotator_cuff_tendinopathy_cpg_2025]
    applicable_route_evidence_profile_ids: [rep_calcific_rotator_cuff_v1]
    applicable_route_ids: [calcific_rotator_cuff_tendinopathy]
    domain: progression_criteria
    claim_summary: Patient-rated pain/disability/readiness measures and functional performance measures may guide the return-to-sport continuum rather than elapsed time alone.
    recommendation_direction: may_consider
    output_scope: referral_core
    strength_optional: F
    certainty_optional: not_graded
    applicability_conditions_optional: [athletic_return_to_sport_goal]
    reviewed_on: 2026-08-29

  ghoa_nonoperative_PT_best_practice_2023:
    claim_id: ghoa_nonoperative_PT_best_practice_2023
    evidence_ids: [glenohumeral_oa_apta_cpg_2023]
    applicable_route_evidence_profile_ids: [rep_glenohumeral_oa_nonoperative_v1]
    applicable_route_ids: [glenohumeral_osteoarthritis]
    applicability_conditions_optional: [established_primary_GHOA_nonoperative_management]
    domain: core_rehabilitation
    claim_summary: For primary glenohumeral osteoarthritis not undergoing total shoulder arthroplasty, the APTA guideline development group states as a best-practice recommendation that physical therapist services may benefit pain and functional outcomes despite insufficient comparative evidence.
    recommendation_direction: consider
    output_scope: referral_core
    strength_optional: best_practice_APTA
    certainty_optional: not_applicable
    reviewed_on: 2026-08-29

  ghoa_individualized_PT_selection_2023:
    claim_id: ghoa_individualized_PT_selection_2023
    evidence_ids: [glenohumeral_oa_apta_cpg_2023]
    applicable_route_evidence_profile_ids: [rep_glenohumeral_oa_nonoperative_v1]
    applicable_route_ids: [glenohumeral_osteoarthritis]
    applicability_conditions_optional: [established_primary_GHOA_nonoperative_management]
    domain: core_rehabilitation
    claim_summary: Nonoperative physical therapist intervention selection should be individualized to examination findings, associated impairments, tissue irritability, patient goals and values; the guideline does not identify one specific physical therapist intervention as superior to another.
    recommendation_direction: consider
    output_scope: referral_core
    strength_optional: best_practice_APTA
    certainty_optional: not_applicable
    reviewed_on: 2026-08-29

  ghoa_no_specific_PT_superior_2023:
    claim_id: ghoa_no_specific_PT_superior_2023
    evidence_ids: [glenohumeral_oa_apta_cpg_2023]
    applicable_route_evidence_profile_ids: [rep_glenohumeral_oa_nonoperative_v1]
    applicable_route_ids: [glenohumeral_osteoarthritis]
    applicability_conditions_optional: [established_primary_GHOA_nonoperative_management]
    domain: core_rehabilitation
    claim_summary: The 2023 APTA CPG found no high- or moderate-quality evidence comparing nonoperative physical therapist interventions and therefore does not support representing any one specific PT intervention as superior for GHOA.
    recommendation_direction: insufficient_evidence
    output_scope: clinician_ui_only
    strength_optional: best_practice_APTA
    certainty_optional: not_applicable
    reviewed_on: 2026-08-29

  ghoa_nonoperative_RCT_gap_2026:
    claim_id: ghoa_nonoperative_RCT_gap_2026
    evidence_ids: [glenohumeral_oa_pt_sr_2026]
    applicable_route_evidence_profile_ids: [rep_glenohumeral_oa_nonoperative_v1]
    applicable_route_ids: [glenohumeral_osteoarthritis]
    applicability_conditions_optional: [established_primary_GHOA_nonoperative_management]
    domain: core_rehabilitation
    claim_summary: A 2026 systematic review found no published randomized trials evaluating physiotherapist-led interventions for people with glenohumeral osteoarthritis receiving nonsurgical care, so comparative efficacy remains unestablished.
    recommendation_direction: insufficient_evidence
    output_scope: clinician_ui_only
    certainty_optional: not_applicable
    reviewed_on: 2026-08-29

  ghoa_patient_reported_reassessment_2023:
    claim_id: ghoa_patient_reported_reassessment_2023
    evidence_ids: [glenohumeral_oa_apta_cpg_2023]
    applicable_route_evidence_profile_ids: [rep_glenohumeral_oa_nonoperative_v1]
    applicable_route_ids: [glenohumeral_osteoarthritis]
    applicability_conditions_optional: [established_primary_GHOA_nonoperative_management]
    domain: progression_criteria
    claim_summary: Patient-reported function and disability outcomes together with repeated clinical evaluation may be used to judge effectiveness of nonoperative physical therapist management; no universal numeric progression threshold is supplied.
    recommendation_direction: consider
    output_scope: referral_core
    strength_optional: best_practice_APTA
    certainty_optional: not_applicable
    reviewed_on: 2026-08-29

  ghoa_preop_PT_best_practice_2023:
    claim_id: ghoa_preop_PT_best_practice_2023
    evidence_ids: [glenohumeral_oa_apta_cpg_2023]
    applicable_route_evidence_profile_ids: [rep_glenohumeral_oa_preop_TSA_v1]
    applicable_route_ids: [glenohumeral_osteoarthritis]
    applicability_conditions_optional: [established_primary_GHOA_scheduled_for_TSA_preoperative]
    domain: core_rehabilitation
    claim_summary: In the absence of high- or moderate-quality evidence, the APTA guideline development group states as best practice that preoperative physical therapist services may benefit postoperative outcomes in people with GHOA scheduled for total shoulder arthroplasty.
    recommendation_direction: consider
    output_scope: referral_core
    strength_optional: best_practice_APTA
    certainty_optional: not_applicable
    reviewed_on: 2026-08-29

  ghoa_postoperative_context_separate_owner:
    claim_id: ghoa_postoperative_context_separate_owner
    evidence_ids: [glenohumeral_oa_apta_cpg_2023]
    applicable_route_evidence_profile_ids: [rep_glenohumeral_oa_nonoperative_v1, rep_glenohumeral_oa_preop_TSA_v1]
    applicable_route_ids: [glenohumeral_osteoarthritis]
    applicability_conditions_optional: [post_TSA_or_other_shoulder_arthroplasty_context]
    domain: safety
    claim_summary: Postoperative total shoulder arthroplasty rehabilitation has procedure- and time-sensitive evidence and restrictions and must be routed to postoperative shoulder rehabilitation rather than generated from the nonoperative or preoperative GHOA sequence.
    recommendation_direction: context_only
    output_scope: clinician_ui_only
    certainty_optional: not_applicable
    reviewed_on: 2026-08-29

