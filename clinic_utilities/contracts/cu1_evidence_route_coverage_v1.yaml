  Native schema-conformant evidence extension for route-by-route CU-1 coverage after tranche2 and
  tranche3 promotion. Every object carries its explicit canonical identity. New routes may be added
  only after exact source/reference/applicability/output-scope review and must not create generic
  cross-route rehabilitation fallbacks.

