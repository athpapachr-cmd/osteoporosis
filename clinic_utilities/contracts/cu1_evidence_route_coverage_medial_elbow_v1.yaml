purpose: >-
  Route-specific evidence hardening for the frozen elbow route medial_elbow_tendinopathy. Unlike the
  lateral-elbow route, no current medial-specific clinical practice guideline with equivalent graded
  rehabilitation recommendations was identified. This shard therefore uses a 2026 medial-specific
  systematic review as low-certainty treatment-effect authority and preserves 2023/2024 review evidence
  as clinical-context and differential authority only. It deliberately does not borrow lateral-elbow
  CPG grades or convert narrative phase descriptions into validated progression thresholds.

