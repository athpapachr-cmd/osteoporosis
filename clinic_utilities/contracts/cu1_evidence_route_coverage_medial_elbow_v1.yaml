claims:
  met_diagnostic_boundary_not_single_finding:
    claim_id: met_diagnostic_boundary_not_single_finding
    evidence_ids: [medial_elbow_clinical_overview_2023, medial_elbow_differential_ultrasound_2024]
    applicable_route_evidence_profile_ids: [rep_medial_elbow_tendinopathy_v1]
    applicable_route_ids: [medial_elbow_tendinopathy]
    domain: diagnostic_definition
    claim_summary: >-
      Medial epicondylitis/tendinopathy is a clinical diagnosis based on a compatible history and
      examination. Medial-epicondyle tenderness, pain with resisted wrist flexion or forearm pronation,
      gripping pain, or an imaging common-flexor abnormality may support the presentation but no single
      finding may be converted by CU-1 into an autonomous tendinopathy diagnosis.
    recommendation_direction: context_only
    output_scope: clinician_ui_only
    certainty_optional: not_applicable
    reviewed_on: 2026-08-29

  met_history_load_course_and_function_context:
    claim_id: met_history_load_course_and_function_context
    evidence_ids: [medial_elbow_clinical_overview_2023]
    applicable_route_evidence_profile_ids: [rep_medial_elbow_tendinopathy_v1]
    applicable_route_ids: [medial_elbow_tendinopathy]
    domain: history
    claim_summary: >-
      Relevant history includes onset/course, repetitive gripping or flexor-pronator loading, work or
      sport exposure including throwing/valgus-load context where relevant, symptom behavior and the
      functional task that matters to the patient. Missing context remains unknown rather than negative.
    recommendation_direction: consider
    output_scope: clinician_ui_only
    certainty_optional: not_graded
    reviewed_on: 2026-08-29

  met_activity_load_modification_context:
    claim_id: met_activity_load_modification_context
    evidence_ids: [medial_elbow_clinical_overview_2023]
    applicable_route_evidence_profile_ids: [rep_medial_elbow_tendinopathy_v1]
    applicable_route_ids: [medial_elbow_tendinopathy]
    domain: core_rehabilitation
    claim_summary: >-
      Conservative management may include temporary modification of repeatedly aggravating gripping,
      wrist-flexion/pronation or sport/work loading while maintaining useful activity and preparing for
      graded re-exposure. This is clinical-context guidance from a narrative review, not a comparative
      treatment-effect estimate or a fixed rest prescription.
    recommendation_direction: consider
    output_scope: referral_core
    certainty_optional: not_graded
    reviewed_on: 2026-08-29

  met_eccentric_flexor_pronator_loading_low_certainty_2026:
    claim_id: met_eccentric_flexor_pronator_loading_low_certainty_2026
    evidence_ids: [medial_elbow_eccentric_sr_2026]
    applicable_route_evidence_profile_ids: [rep_medial_elbow_tendinopathy_v1]
    applicable_route_ids: [medial_elbow_tendinopathy]
    domain: core_rehabilitation
    claim_summary: >-
      A 2026 medial-specific systematic review found that eccentric flexor-pronator loading may reduce
      pain and improve function when used within conservative rehabilitation, but the evidence base was
      small and heterogeneous and overall certainty remained low. Eccentric loading may therefore be
      considered without representing it as a universally superior or mandatory loading mode.
    recommendation_direction: consider
    output_scope: referral_core
    certainty_optional: low
    reviewed_on: 2026-08-29

  met_no_optimal_loading_protocol_or_threshold_2026:
    claim_id: met_no_optimal_loading_protocol_or_threshold_2026
    evidence_ids: [medial_elbow_eccentric_sr_2026, medial_elbow_clinical_overview_2023]
    applicable_route_evidence_profile_ids: [rep_medial_elbow_tendinopathy_v1]
    applicable_route_ids: [medial_elbow_tendinopathy]
    domain: progression_criteria
    claim_summary: >-
      Current medial-elbow evidence does not establish one optimal exercise dose, one superior loading
      mode, a validated numeric progression criterion, a universal return-to-work/sport threshold, or a
      fixed physiotherapy course duration. Narrative staged descriptions must not be converted into
      evidence-validated phase transitions.
    recommendation_direction: context_only
    output_scope: clinician_ui_only
    certainty_optional: not_graded
    reviewed_on: 2026-08-29

  met_ulnar_and_medial_elbow_differential_reassessment:
    claim_id: met_ulnar_and_medial_elbow_differential_reassessment
    evidence_ids: [medial_elbow_differential_ultrasound_2024, medial_elbow_clinical_overview_2023]
    applicable_route_evidence_profile_ids: [rep_medial_elbow_tendinopathy_v1]
    applicable_route_ids: [medial_elbow_tendinopathy]
    domain: safety
    claim_summary: >-
      Medial elbow pain requires preservation of alternative-owner possibilities including ulnar
      neuropathy, UCL/valgus instability, snapping triceps, medial antebrachial cutaneous neuropathy,
      intra-articular disease and material traumatic injury. Progressive objective ulnar motor deficit,
      established instability/major trauma, substantial mechanical block or other discordant findings
      require clinician reassessment or the correct route rather than routine tendinopathy reassurance.
    recommendation_direction: recommend
    output_scope: referral_core
    certainty_optional: not_applicable
    reviewed_on: 2026-08-29

  met_adjuncts_not_medial_evidence_core:
    claim_id: met_adjuncts_not_medial_evidence_core
    evidence_ids: [medial_elbow_eccentric_sr_2026, medial_elbow_clinical_overview_2023]
    applicable_route_evidence_profile_ids: [rep_medial_elbow_tendinopathy_v1]
    applicable_route_ids: [medial_elbow_tendinopathy]
    domain: adjunct
    claim_summary: >-
      The reviewed medial-specific evidence does not justify automatically importing lateral-elbow CPG
      grades for manual therapy, dry needling, rigid taping, orthoses or ESWT. Such interventions may
      remain available only through separately reviewed evidence or clinician instruction and must not
      be relabelled as medial-route evidence by analogy.
    recommendation_direction: context_only
    output_scope: clinician_ui_only
    certainty_optional: not_graded
    reviewed_on: 2026-08-29

