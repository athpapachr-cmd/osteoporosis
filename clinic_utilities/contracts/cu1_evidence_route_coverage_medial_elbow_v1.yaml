    title: "Eccentric exercise therapy for medial epicondylitis: A systematic review of clinical outcomes"
    authors_or_organization: See ZH, Loo CE, Jaafar Z
    year_or_version: 2026
    published_on_optional: 2026-03-24
    reference: "Complement Ther Med. 2026;98:103364"
    doi_optional: 10.1016/j.ctim.2026.103364
    url_optional: https://pubmed.ncbi.nlm.nih.gov/41887339/
    population_scope_optional: clinically diagnosed medial epicondylitis / flexor-pronator tendinopathy in five small clinical studies totaling 143 patients
    setting_scope_optional: eccentric exercise as a primary component of conservative rehabilitation; heterogeneous protocols; no meta-analysis
    reviewed_on: 2026-08-29
    next_review_due: 2027-02-28
