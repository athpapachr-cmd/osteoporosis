    route_id: medial_elbow_tendinopathy
    route_evidence_profile_id: rep_medial_elbow_tendinopathy_v1
    sequence_source: route_evidence_profile
    status: sequence_complete_evidence_bounded
    phases:
      - phase_id: medial_elbow_active_load_rehabilitation
        order: 1
        clinical_objective: improve symptom-limited function and flexor-pronator load tolerance through individualized conservative rehabilitation without importing a lateral-elbow protocol or fixed schedule
        objective_authority:
          authority_type: evidence_claim
          evidence_claim_ids: [met_activity_load_modification_context, met_eccentric_flexor_pronator_loading_low_certainty_2026]
        intervention_directions:
          - intervention_direction_id: met_activity_and_load_modification
            statement: identify and temporarily modify repeatedly aggravating grip/flexor-pronator/work/sport loading while maintaining useful activity and preparing for graded re-exposure
            authority:
              authority_type: evidence_claim
              evidence_claim_ids: [met_activity_load_modification_context]
          - intervention_direction_id: met_consider_eccentric_flexor_pronator_loading
            statement: consider individualized eccentric flexor-pronator loading as one conservative rehabilitation option while preserving low certainty and avoiding a mandatory loading mode or universal dose
            authority:
              authority_type: evidence_claim
              evidence_claim_ids: [met_eccentric_flexor_pronator_loading_low_certainty_2026]
        progression_criteria: []
        precautions_or_do_not_progress_criteria:
          - criterion_id: met_ulnar_instability_or_other_owner_reassessment
