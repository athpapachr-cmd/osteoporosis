            statement: progressive objective ulnar motor deficit, material valgus/UCL instability or trauma, substantial mechanical block, or another discordant medial-elbow presentation should trigger clinician reassessment or the correct route rather than routine tendinopathy progression
            authority:
              authority_type: evidence_claim
              evidence_claim_ids: [met_ulnar_and_medial_elbow_differential_reassessment]
        strength_optional: null
        certainty_optional: not_graded
        required_for_route: true
    clinician_modifications_optional: []
    protocol_overrides_optional: []
