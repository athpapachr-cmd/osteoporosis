version: cu1_evidence_tranche2_promotion_v1
status: normalized_promotion_projection
runtime_authorized: false
reviewed_on: 2026-08-28
source_shard: clinic_utilities/contracts/cu1_evidence_tranche2_v1.yaml
normative_schema: clinic_utilities/contracts/cu1_history_timeline_schema_v1.yaml
promotion_review: clinic_utilities/contracts/CU1_TRANCHE2_PROMOTION_REVIEW_2026-08-28.md

purpose: >-
  Deterministic normalization and semantic-correction projection for the immutable tranche2 staging
  shard. The normative logical tranche2 authority is source_shard + this projection. The staging file
  remains preserved for audit history and is not independently authoritative after promotion.

normalization_order:
  - materialize_map_key_identity
  - populate_required_non_optional_fields
  - apply_source_metadata_corrections
  - drop_superseded_or_hybrid_claims
  - add_reviewed_replacement_sources_and_claims
  - apply_profile_corrections
  - apply_sequence_corrections
  - resolve_and_validate_references
  - validate_route_and_subtype_applicability
  - validate_output_scope
  - validate_freshness
  - validate_cross_shard_id_uniqueness

identity_materialization:
  sources:
    canonical_field: evidence_id
    rule: evidence_id_equals_source_map_key
  claims:
    canonical_field: claim_id
    rule: claim_id_equals_claim_map_key
  route_history_prompts:
    canonical_field: prompt_id
    rule: prompt_id_equals_prompt_map_key
  route_evidence_profiles:
    canonical_field: route_evidence_profile_id
    rule: route_evidence_profile_id_equals_profile_map_key
  rehabilitation_sequences:
    canonical_field: sequence_id
    rule: sequence_id_equals_sequence_map_key

required_field_defaults:
  route_evidence_profiles:
    diagnostic_claim_ids: []
    history_claim_ids: []
    examination_claim_ids: []
    adjunct_claim_ids: []
    safety_claim_ids: []
  rehabilitation_sequences:
    sequence_source: route_evidence_profile
    clinician_modifications_optional: []
    protocol_overrides_optional: []

source_metadata_corrections:
  knee_hip_oa_eular_2023_update:
    authors_or_organization: Moseng et al. / EULAR multidisciplinary task force
    reference: Ann Rheum Dis. 2024;83(6):730-740
    doi_optional: 10.1136/ard-2023-225041
  lss_neurogenic_claudication_cpg_2021:
    authors_or_organization: Bussières et al.
    reference: J Pain. 2021;22(9):1015-1039
    doi_optional: 10.1016/j.jpain.2021.03.147
  de_quervain_nma_2025:
    authors_or_organization: Cuenca-Zaldívar et al.
    reference: J Hand Ther. 2025 Nov 25; online ahead of print. PMID 41298159
    doi_optional: 10.1016/j.jht.2025.09.001

additional_sources:
  pfp_dutch_multidisciplinary_cpg_2025:
    evidence_id: pfp_dutch_multidisciplinary_cpg_2025
    source_type: clinical_practice_guideline
    title: "Dutch multidisciplinary guideline on anterior knee pain: Patellofemoral pain and patellar tendinopathy"
    authors_or_organization: Ophey et al.
    year_or_version: 2025
    reference: Knee Surg Sports Traumatol Arthrosc. 2025;33(2):457-469
    doi_optional: 10.1002/ksa.12367
    population_scope_optional: clinically diagnosed patellofemoral pain or patellar tendinopathy; only the PFP module is applied to the PFP route
    reviewed_on: 2026-08-28
    next_review_due: 2027-08-28
    freshness_state: current
    status: active

