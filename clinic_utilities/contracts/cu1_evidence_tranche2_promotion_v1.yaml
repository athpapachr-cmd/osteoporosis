    applicable_route_ids: [plantar_heel_pain_plantar_fasciitis]
    domain: adjunct
    claim_summary: Foot orthoses should not be used as an isolated treatment for short-term pain relief in plantar heel pain or plantar fasciitis.
    recommendation_direction: do_not_offer
    output_scope: clinician_ui_only
    strength_optional: B
    certainty_optional: not_graded
    reviewed_on: 2026-08-28
  plantar_orthosis_combined:
    claim_id: plantar_orthosis_combined
    evidence_ids: [plantar_fasciitis_cpg_2023]
