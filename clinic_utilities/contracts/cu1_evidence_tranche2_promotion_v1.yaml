profile_field_overrides:
  rep_plantar_heel_pain_v1:
    adjunct_claim_ids:
      - plantar_taping_short_term_adjunct
      - plantar_orthosis_not_isolated
      - plantar_orthosis_combined
      - plantar_night_splint_execution_detail
  rep_rotator_cuff_related_pain_v1:
    safety_claim_ids: [rc_persistent_severe_reassessment]
  rep_knee_oa_v1:
    adjunct_claim_ids: [knee_oa_neuromuscular_adjunct]
  rep_patellofemoral_pain_v1:
    primary_source_ids: [patellofemoral_pain_cpg_2019, pfp_dutch_multidisciplinary_cpg_2025]
    adjunct_claim_ids: [pfp_running_gait_retraining, pfp_dutch_adjunct_after_no_change]
    evidence_gaps:
      - frameworks_are_preserved_separately
      - exact_transition_to_running_specific_work_not_defined_by_current_sources
  rep_carpal_tunnel_v1:
    adjunct_claim_ids: [cts_long_term_injection_limit]
  rep_de_quervain_v1:
    adjunct_claim_ids: [de_quervain_injection_spica_first_line_evidence]

sequence_overrides:
  seq_lumbar_stenosis_claudication_v1:
    remove_rendered_authority_claim_ids: [lss_no_false_strong_recommendation]
    objective_authority_after_projection: [lss_multimodal_nonpharmacological_care]
    invariant: clinician_ui_only_claim_must_not_authorize_rendered_objective

  seq_knee_oa_v1:
    replace_authority_claim_ids:
      knee_oa_exercise_core: [knee_oa_exercise_aaos, knee_oa_exercise_eular]
      knee_oa_self_management_education: [knee_oa_self_management_aaos, knee_oa_patient_education_aaos, knee_oa_self_management_eular]
    phase_strength_optional_after_projection: null
    invariant: framework_specific_strength_is_not_projected_as_hybrid_phase_strength

  seq_patellofemoral_pain_v1:
    phase_1_id_after_projection: pfp_exercise_core
    phase_1_objective_after_projection: reduce patellofemoral pain and improve function using individualized quadriceps and/or hip-focused exercise with education and load-management principles
    phase_1_objective_authority_after_projection:
      - pfp_combined_hip_knee_exercise
      - pfp_dutch_exercise_first_line
      - pfp_load_management_education
    phase_1_strength_optional_after_projection: null
    phase_1_certainty_optional_after_projection: low
    add_intervention_directions:
      - intervention_direction_id: pfp_2019_combined_hip_knee_exercise
        statement: within the 2019 APTA framework, use combined hip- and knee-targeted exercise as the overall exercise strategy
        authority: {authority_type: evidence_claim, evidence_claim_ids: [pfp_combined_hip_knee_exercise]}
      - intervention_direction_id: pfp_2025_individualized_exercise
        statement: within the 2025 Dutch framework, use individualized quadriceps- and/or hip-focused exercise with pain-guided volume/intensity and prioritized education
        authority: {authority_type: evidence_claim, evidence_claim_ids: [pfp_dutch_exercise_first_line, pfp_dutch_pain_guided_structured_program]}
    add_reassessment_criteria:
      - criterion_id: pfp_dutch_structured_reassessment
        criterion_kind: reassessment
        statement: within the 2025 Dutch framework, reassess exercise progression, pain and function after 6 and 12 weeks; time alone does not mean progression succeeded
        authority: {authority_type: evidence_claim, evidence_claim_ids: [pfp_dutch_reassessment_6_12_weeks]}
    invariant: 2019_APTA_and_2025_Dutch_frameworks_remain_distinguishable

post_projection_validation_assertions:
  identity:
    every_source_has_explicit_evidence_id: true
    every_claim_has_explicit_claim_id: true
    every_history_prompt_has_explicit_prompt_id: true
    every_route_profile_has_explicit_route_evidence_profile_id: true
    every_sequence_has_explicit_sequence_id: true
  required_fields:
    every_route_profile_has_required_claim_arrays: true
    every_sequence_has_sequence_source: true
    every_sequence_has_clinician_modifications_optional: true
    every_sequence_has_protocol_overrides_optional: true
  references:
    all_source_references_resolve: true
    all_claim_references_resolve: true
    all_profile_references_resolve: true
    all_sequence_references_resolve: true
    all_history_prompt_evidence_references_resolve: true
  applicability:
    all_claim_route_ids_exist_in_frozen_registry: true
    no_tranche2_claim_crosses_material_subtype_boundary: true
    rotator_cuff_tendinopathy_authority_does_not_cover_full_thickness_tear: true
  output_scope:
    rendered_authorities_use_only_referral_core_compatible_claims: true
    clinician_ui_only_claims_used_as_rendered_authority: false
    therapist_execution_detail_claims_used_as_rendered_authority: false
  evidence_governance:
    plantar_orthosis_B_and_C_hybrid_removed: true
    knee_OA_AAOS_EULAR_strength_hybrid_removed: true
    patellofemoral_2019_2025_frameworks_kept_separate: true
    de_quervain_2025_metadata_refreshed: true
    LSS_2021_metadata_refreshed: true
  cross_shard_identity:
    duplicate_ids_against_active_core_registry: false
  runtime_authorized: false

promotion_result:
  logical_shard_id: high_frequency_tranche2
  state: active_design_authority
  source_staging_file_retained: true
  promotion_projection_required_for_normative_read: true
  route_profiles_promoted: 8
