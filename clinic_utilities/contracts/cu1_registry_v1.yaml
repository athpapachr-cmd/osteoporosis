    [meniscus_repair, partial_meniscectomy, acl_reconstruction, mcl_repair_or_reconstruction, mpfl_reconstruction_or_patellar_stabilization, total_knee_arthroplasty_tka, unicompartmental_knee_arthroplasty, pcl_or_multiligament_reconstruction, cartilage_or_osteochondral_procedure, patellar_or_quadriceps_tendon_repair, other_knee_operation]
  digital_tendon_injury_rehabilitation:
    [mallet_finger, central_slip_injury, boutonniere_injury_or_deformity, extensor_tendon_injury_nonoperative, extensor_tendon_repair_postoperative, flexor_tendon_injury_nonoperative, flexor_tendon_repair_postoperative, other_established_digit_tendon_injury]
