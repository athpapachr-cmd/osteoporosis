    [midportion_achilles_tendinopathy, insertional_achilles_tendinopathy, other_established_achilles_tendinopathy]
  greater_trochanteric_lateral_hip_pain_pathway:
    [formal_gtps_diagnosis, formal_gluteal_tendinopathy_diagnosis, formal_trochanteric_bursitis_diagnosis, other_established_greater_trochanteric_disorder]
  nonarthritic_intraarticular_hip_pain:
    [formal_fais_diagnosis, symptomatic_acetabular_labral_tear, other_established_nonarthritic_intraarticular_hip_condition]

