    target_route: acute_muscle_myotendinous_injury_rehabilitation
    target_subtype_or_site: quadriceps_rectus_femoris_muscle_injury
  hip_asis_avulsion:
    source_profile: hip_groin
    source_route_alias: asis_avulsion
    target_profile: shared_fracture
    target_route: fracture_rehabilitation_post_immobilization
    target_subtype_or_site: asis_apophyseal_avulsion
  hip_aiis_avulsion:
    source_profile: hip_groin
    source_route_alias: aiis_avulsion
    target_profile: shared_fracture
    target_route: fracture_rehabilitation_post_immobilization
    target_subtype_or_site: aiis_apophyseal_avulsion
  hip_ischial_tuberosity_avulsion:
    source_profile: hip_groin
    source_route_alias: ischial_tuberosity_avulsion
    target_profile: shared_fracture
    target_route: fracture_rehabilitation_post_immobilization
    target_subtype_or_site: ischial_tuberosity_apophyseal_avulsion
  hip_lesser_trochanter_avulsion:
    source_profile: hip_groin
    source_route_alias: lesser_trochanter_avulsion
    target_profile: shared_fracture
    target_route: fracture_rehabilitation_post_immobilization
    target_subtype_or_site: lesser_trochanter_apophyseal_avulsion
  knee_gastrocnemius_injury:
    source_profile: knee
    source_route_alias: gastrocnemius_strain_myotendinous_injury
    target_profile: shared_muscle_myotendinous
    target_route: acute_muscle_myotendinous_injury_rehabilitation
    target_subtype_or_site: calf_muscle_myotendinous_injury
  ankle_calf_injury:
    source_profile: ankle_foot
    source_route_alias: gastrocnemius_soleus_calf_myotendinous_injury
    target_profile: shared_muscle_myotendinous
    target_route: acute_muscle_myotendinous_injury_rehabilitation
    target_subtype_or_site: calf_muscle_myotendinous_injury
  ankle_fracture:
    source_profile: ankle_foot
    source_route_alias: ankle_foot_fracture_gateway
    target_profile: shared_fracture
    target_route: fracture_rehabilitation_post_immobilization
  fragility_fracture_functional_rehab:
    source_profile: shared_fracture
    source_route_alias: fragility_fracture_deconditioning_gateway
    target_profile: shared_deconditioning_balance_gait
    target_route: functional_deconditioning_balance_gait_rehabilitation

precedence:
  global:
    [urgent_safety_disposition, exact_written_or_surgeon_protocol, shared_structural_primary, dedicated_postoperative_or_structural_primary, regional_established_structural_route, regional_presentation_route, secondary_modifier, adjunct]
  wrist_hand:
    flexor_extensor_tendon_repair: digital_tendon_injury_rehabilitation
    thumb_ucl_rcl_repair: thumb_mcp_collateral_ligament_injury_rehabilitation
    sagittal_band_repair: sagittal_band_injury_extensor_tendon_instability
    generic_other_operation: postoperative_wrist_hand_rehabilitation
  knee:
    acl_nonoperative_or_preoperative: acl_injury_instability_rehabilitation
    acl_reconstruction: postoperative_knee_rehabilitation
    mcl_nonoperative: mcl_injury_rehabilitation
    mcl_repair_or_reconstruction: postoperative_knee_rehabilitation
  fracture:
    any_established_fracture_rehabilitation: fracture_rehabilitation_post_immobilization

aliases:
  ACL_injury_instability_rehabilitation: acl_injury_instability_rehabilitation
  MCL_injury_rehabilitation: mcl_injury_rehabilitation
  ACL_reconstruction: acl_reconstruction
  MCL_repair_or_reconstruction: mcl_repair_or_reconstruction
  Osgood_Schlatter_disease: osgood_schlatter_disease
  Sinding_Larsen_Johansson_syndrome: sinding_larsen_johansson_syndrome
  formal_GTPS_diagnosis: formal_gtps_diagnosis
  formal_FAIS_diagnosis: formal_fais_diagnosis
  formal_CRPS_upper_limb_diagnosis: crps_upper_limb
  ASIS_apophyseal_avulsion: asis_apophyseal_avulsion
  AIIS_apophyseal_avulsion: aiis_apophyseal_avulsion
  MRI_or_ultrasound_confirmed: mri_or_ultrasound_confirmed
  SPPB_total_optional: sppb_total_optional

common_adjunct_ids:
  [manual_therapy, soft_tissue_techniques, neurodynamic_techniques, traction, dry_needling, acupuncture, eswt, taping, heel_lift, orthosis_or_brace_context]
