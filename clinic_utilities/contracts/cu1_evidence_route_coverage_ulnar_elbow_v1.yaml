claims:
  une_symptoms_and_provocation_not_formal_diagnosis:
    claim_id: une_symptoms_and_provocation_not_formal_diagnosis
    evidence_ids: [cubital_diagnostic_delphi_2025, une_ultrasound_aanem_2022]
    applicable_route_evidence_profile_ids: [rep_une_mild_sensory_predominant_v1, rep_une_nonmild_or_severity_unresolved_v1, rep_une_progressive_motor_or_structural_safety_v1]
    applicable_route_ids: [ulnar_neuropathy_at_elbow]
    domain: diagnostic_definition
    claim_summary: >-
      Ulnar-distribution paresthesia, symptoms provoked by elbow flexion, medial-elbow Tinel sign and related
      findings may support a suspected ulnar-neuropathy/cubital-tunnel presentation but do not independently
      create a formal diagnosis. The 2025 Delphi criteria are expert-consensus candidates that still require
      weighting and validation before use as a formal diagnostic scale. Definitive diagnostic wording in CU-1
      therefore requires an explicit clinician assertion.
    recommendation_direction: context_only
    output_scope: clinician_ui_only
    certainty_optional: not_applicable
    reviewed_on: 2026-08-29

  une_ultrasound_diagnostic_adjunct_level_B:
    claim_id: une_ultrasound_diagnostic_adjunct_level_B
    evidence_ids: [une_ultrasound_aanem_2022]
    applicable_route_evidence_profile_ids: [rep_une_mild_sensory_predominant_v1, rep_une_nonmild_or_severity_unresolved_v1, rep_une_progressive_motor_or_structural_safety_v1]
    applicable_route_ids: [ulnar_neuropathy_at_elbow]
    domain: examination
    claim_summary: >-
      For patients with symptoms and signs suggestive of ulnar neuropathy, the AANEM guideline recommends
      offering neuromuscular ultrasound measurement of ulnar-nerve cross-sectional area or diameter to help
      confirm the diagnosis and localize compression. Ultrasound is an adjunct and is not sufficient to replace
      clinical examination or electrodiagnostic evaluation.
    recommendation_direction: recommend
    output_scope: clinician_ui_only
    strength_optional: AANEM_Level_B
    certainty_optional: not_applicable
    reviewed_on: 2026-08-29

  une_mild_position_education_small_rct:
    claim_id: une_mild_position_education_small_rct
    evidence_ids: [une_cochrane_2025]
    applicable_route_evidence_profile_ids: [rep_une_mild_sensory_predominant_v1]
    applicable_route_ids: [ulnar_neuropathy_at_elbow]
    applicability_conditions_optional:
      - explicit_mild_clinical_context
      - objective_ulnar_motor_status_assessed_without_material_deficit
      - no_intrinsic_atrophy_or_clawing
      - no_unresolved_alternative_localization_or_structural_owner
    domain: core_rehabilitation
    claim_summary: >-
      In a small randomized trial summarized by the 2025 Cochrane review, people with mild ulnar neuropathy
      may have less subjective discomfort after information about movements or positions to avoid. This supports
      cautious education and individualized reduction of documented provoking positions/movements, but it does
      not establish a universal splint, exercise, nerve-gliding, visit-frequency or treatment-duration protocol.
    recommendation_direction: consider
    output_scope: referral_core
    certainty_optional: not_graded
    reviewed_on: 2026-08-29

  une_night_splint_very_low_uncertain:
    claim_id: une_night_splint_very_low_uncertain
    evidence_ids: [une_night_splint_sr_2025, une_cochrane_2025]
    applicable_route_evidence_profile_ids: [rep_une_mild_sensory_predominant_v1, rep_une_nonmild_or_severity_unresolved_v1]
    applicable_route_ids: [ulnar_neuropathy_at_elbow]
    domain: adjunct
    claim_summary: >-
      The 2025 night-splint systematic review found very-low-certainty evidence and insufficient evidence to
      determine whether night splints provide benefit over advice alone. Night splinting therefore must not be
      auto-rendered as evidence-backed core care or assigned a universal device type, elbow angle, nightly
      duration or course length.
    recommendation_direction: insufficient_evidence
    output_scope: clinician_ui_only
    certainty_optional: very_low
    reviewed_on: 2026-08-29

  une_no_best_physiotherapy_modality:
    claim_id: une_no_best_physiotherapy_modality
    evidence_ids: [une_physiotherapy_sr_2022, une_cochrane_2025]
    applicable_route_evidence_profile_ids: [rep_une_mild_sensory_predominant_v1, rep_une_nonmild_or_severity_unresolved_v1]
    applicable_route_ids: [ulnar_neuropathy_at_elbow]
    domain: adjunct
    claim_summary: >-
      Current physiotherapy evidence is heterogeneous and does not establish a best physiotherapy method for
      cubital tunnel syndrome. Nerve gliding/neurodynamic techniques, manual therapy, electrical modalities or
      other physiotherapy techniques must not be auto-promoted to mandatory or superior route core without a
      separately reviewed applicable claim.
    recommendation_direction: insufficient_evidence
    output_scope: clinician_ui_only
    certainty_optional: not_graded
    reviewed_on: 2026-08-29

  une_nonmild_conservative_sequence_not_established:
    claim_id: une_nonmild_conservative_sequence_not_established
    evidence_ids: [une_cochrane_2025, une_night_splint_sr_2025, une_physiotherapy_sr_2022]
    applicable_route_evidence_profile_ids: [rep_une_nonmild_or_severity_unresolved_v1]
    applicable_route_ids: [ulnar_neuropathy_at_elbow]
    domain: progression_criteria
    claim_summary: >-
      Current evidence does not establish a complete criteria-based physiotherapy sequence for an explicitly
      moderate/nonmild or severity-unclear UNE presentation. Mild-case education evidence must not be expanded
      across severity, and uncertainty about splinting or physiotherapy modalities must not be filled by a generic
      peripheral-nerve rehabilitation protocol.
    recommendation_direction: insufficient_evidence
    output_scope: clinician_ui_only
    certainty_optional: not_graded
    reviewed_on: 2026-08-29

  une_progressive_motor_or_atrophy_reassessment:
    claim_id: une_progressive_motor_or_atrophy_reassessment
    evidence_ids: [une_cochrane_2025, cubital_diagnostic_delphi_2025]
    applicable_route_evidence_profile_ids: [rep_une_progressive_motor_or_structural_safety_v1, rep_une_mild_sensory_predominant_v1, rep_une_nonmild_or_severity_unresolved_v1]
    applicable_route_ids: [ulnar_neuropathy_at_elbow]
    domain: safety
    claim_summary: >-
      Progressive objective ulnar motor weakness, intrinsic-hand atrophy, clawing/late motor signs, or materially
      worsening objective neurological deficit should trigger clinician/specialist reassessment rather than routine
      progression of a mild conservative sequence. This is a safety/management-context boundary and is not a
      universal autonomous surgical threshold generated by CU-1.
    recommendation_direction: recommend
    output_scope: referral_core
    certainty_optional: not_applicable
    reviewed_on: 2026-08-29

  une_alternative_localization_or_structural_owner:
    claim_id: une_alternative_localization_or_structural_owner
    evidence_ids: [une_ultrasound_aanem_2022, cubital_diagnostic_delphi_2025]
    applicable_route_evidence_profile_ids: [rep_une_progressive_motor_or_structural_safety_v1, rep_une_nonmild_or_severity_unresolved_v1, rep_une_mild_sensory_predominant_v1]
    applicable_route_ids: [ulnar_neuropathy_at_elbow]
    domain: differential
    claim_summary: >-
      Ulnar-distribution symptoms may overlap with cervical radiculopathy, brachial-plexus/lower-trunk pathology,
      or ulnar neuropathy at another site. Material trauma, nerve instability/subluxation, structural compression,
      or discordant localization requires explicit evaluation/correct ownership rather than silent cubital-tunnel
      or medial-elbow fallback.
    recommendation_direction: context_only
    output_scope: clinician_ui_only
    certainty_optional: not_applicable
    reviewed_on: 2026-08-29

