purpose: >-
  Route-specific evidence hardening for ulnar_neuropathy_at_elbow. The route preserves the frozen
  presentation-vs-formal-diagnosis distinction and does not infer cubital tunnel syndrome from paresthesia,
  Tinel sign, elbow-flexion provocation, or an imaging finding. Current conservative evidence supports only
  a narrow mild-case education/position-modification direction. Night splinting, nerve gliding, manual therapy,
  electrical modalities and other physiotherapy techniques are not promoted to routine route core because
  current evidence is insufficient or inconclusive. Nonmild, severity-unclear, progressive motor, structural,
  or alternative-localization contexts fail closed rather than receiving a generic peripheral-nerve sequence.

