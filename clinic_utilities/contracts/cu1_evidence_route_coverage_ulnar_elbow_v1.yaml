              evidence_claim_ids: [une_mild_position_education_small_rct]
        progression_criteria: []
        precautions_or_do_not_progress_criteria:
          - criterion_id: une_progressive_motor_atrophy_reassess
            criterion_kind: safety_escalation
            statement: progressive objective ulnar motor weakness, intrinsic-hand atrophy, clawing or another materially worsening objective neurological deficit requires clinician or specialist reassessment rather than routine progression
