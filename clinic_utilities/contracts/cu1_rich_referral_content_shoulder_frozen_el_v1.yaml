routes:
  adhesive_capsulitis_frozen_shoulder:
    profile_ids: [shoulder]
    variants:
      - variant_id: clinician_established_primary_frozen_shoulder
        match:
          wording_modes: [formal_diagnosis]
          context_equals:
            frozen_shoulder_scope: primary_frozen_shoulder
        evidence_profile_ids: [rep_adhesive_capsulitis_v1]
        authority_mode: reviewed_primary_frozen_shoulder_single_phase_evidence_bounded
        context_referral_phrases_el:
          frozen_shoulder_irritability:
            high: Κλινική ερεθιστικότητα: υψηλή
            moderate: Κλινική ερεθιστικότητα: μέτρια
            low: Κλινική ερεθιστικότητα: χαμηλή
        short_flow_el:
          - >-
            Σε κλινικά τεκμηριωμένο πρωτοπαθή παγωμένο ώμο προτείνεται εξατομικευμένη αποκατάσταση κινητικότητας
            και λειτουργίας με ασκήσεις εύρους κίνησης και, όταν ενδείκνυται, χειροθεραπεία/κινητοποίηση. Η ένταση
            προσαρμόζεται στα συμπτώματα, στην κλινική ερεθιστικότητα όταν αυτή έχει αξιολογηθεί και στο διαθέσιμο εύρος κίνησης.
          - >-
            Η πορεία καθοδηγείται από τη βελτίωση του πόνου, της λειτουργικής χρήσης και της κινητικότητας, χωρίς
            προκαθορισμένο χρονοδιάγραμμα ή καθολικό αριθμητικό κριτήριο μετάβασης.
        stages:
          - stage_id: individualized_mobility_function
            label_el: ΣΤΑΔΙΟ 1 — ΚΙΝΗΤΙΚΟΤΗΤΑ / ΛΕΙΤΟΥΡΓΙΑ / ΑΥΤΟΔΙΑΧΕΙΡΙΣΗ
            goals_el:
              - βελτίωση πόνου και λειτουργικής χρήσης του άνω άκρου
              - βελτίωση του διαθέσιμου εύρους κίνησης σύμφωνα με την κλινική ανοχή
              - υποστήριξη αυτοδιαχείρισης χωρίς επιβολή καθολικού χρονοδιαγράμματος
            intervention_directions_el:
              - εξατομικευμένες ασκήσεις εύρους κίνησης και λειτουργικής χρήσης με ένταση προσαρμοσμένη στα συμπτώματα, στην κλινική ερεθιστικότητα όταν αυτή έχει αξιολογηθεί και στην κινητικότητα
              - χειροθεραπεία/κινητοποίηση μπορεί να χρησιμοποιηθεί επιλεκτικά μαζί με την ενεργητική αποκατάσταση όταν κρίνεται κατάλληλη
            progress_markers_el:
              - βελτίωση συμπτωμάτων, λειτουργίας και κινητικότητας χωρίς καθολικό αριθμητικό κριτήριο ή προκαθορισμένο κανόνα μετάβασης
            evidence_claim_ids:
              - adhesive_capsulitis_manual_ROM_cpg2025
              - adhesive_capsulitis_exercise_and_mobilization
            organization_authority: clinical_rehabilitation_organization
        adjunct_boundary_el: >-
          Η αυτοδιάταση και η ακριβής επιλογή ή δοσολογία των ασκήσεων και των τεχνικών κινητοποίησης αποτελούν λεπτομέρειες εκτέλεσης και εξατομικεύονται από τον φυσιοθεραπευτή σύμφωνα με την κλινική ανταπόκριση.
        reassessment_el: >-
          Ιατρική επανεκτίμηση όταν η εικόνα παύει να είναι συμβατή με πρωτοπαθή παγωμένο ώμο, εμφανίζεται νέο τραυματικό ή δομικό στοιχείο ή η πορεία απαιτεί αλλαγή της στρατηγικής αντιμετώπισης.
