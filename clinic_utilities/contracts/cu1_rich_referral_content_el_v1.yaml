version: cu1_rich_referral_content_el_v1
status: active_runtime_authority
runtime_authorized: true
reviewed_on: 2026-08-29
language: el
max_referral_chars: 2000
standard_detailed_target_chars: 1850

purpose: >-
  Human-reviewed Greek content projection for the shared CU-1 RichReferralPlan renderer. Route-specific
  clinical content is data; the renderer is shared. The presence of stages is clinical/document
  organization and must not be presented as a universal evidence-validated phase protocol unless a
  route-specific source explicitly establishes such a protocol.

governance:
  no_generic_cross_route_fallback: true
  therapist_execution_remains_therapist_owned: true
  patient_specific_protocol_precedence: true
  evidence_gap_must_remain_explicit: true
  exact_dose_or_universal_numeric_thresholds_forbidden: true
  passive_only_routine_plan_forbidden_unless_protocol_exception: true
  stage_3_function_and_self_management_when_applicable: true

route_shards:
  - clinic_utilities/contracts/cu1_rich_referral_content_knee_el_v1.yaml
  - clinic_utilities/contracts/cu1_rich_referral_content_wrist_hand_el_v1.yaml
  - clinic_utilities/contracts/cu1_rich_referral_content_elbow_el_v1.yaml
  - clinic_utilities/contracts/cu1_rich_referral_content_shoulder_el_v1.yaml

routes:
  lateral_elbow_tendinopathy:
    profile_ids: [elbow]
    evidence_profile_ids: [rep_lateral_elbow_tendinopathy_v1]
    authority_mode: reviewed_product_shape_plus_route_specific_evidence
    short_flow_el:
      - >-
        Αρχικά έλεγχος ερεθιστικότητας/φορτίου, ενεργητική κινητοποίηση και ανεκτή ισομετρική φόρτιση
        εκτεινόντων καρπού· στη συνέχεια προοδευτική ομόκεντρη/έκκεντρη φόρτιση, δύναμη λαβής και αντοχή.
      - >-
        Τέλος λειτουργική/επαγγελματική επανένταξη και μείωση κινδύνου υποτροπής με διαχείριση φορτίου,
        εργονομικές/τεχνικές προσαρμογές και πρόγραμμα διατήρησης δύναμης/αντοχής. Παθητικά μέσα μόνο
        επικουρικά· όχι αντί ενεργητικής αποκατάστασης. Πρόοδος βάσει κλινικής/λειτουργικής ανταπόκρισης,
        χωρίς καθολικά αριθμητικά κριτήρια.
    stages:
      - stage_id: early_irritability_initial_load
        label_el: ΣΤΑΔΙΟ 1 — ΕΡΕΘΙΣΤΙΚΟΤΗΤΑ / ΑΡΧΙΚΗ ΦΟΡΤΙΣΗ
        goals_el:
          - μείωση πόνου/ερεθιστικότητας
          - λειτουργική κινητικότητα
          - έναρξη φόρτισης εκτεινόντων καρπού
        intervention_directions_el:
          - εκπαίδευση/διαχείριση φορτίου, εργονομική προσαρμογή όπου χρειάζεται, ενεργητική κινητοποίηση, ανεκτή ισομετρική φόρτιση
          - Επικουρικά κρυοθεραπεία/TENS ή αναλγητικές/κινητοποιητικές τεχνικές
        progress_markers_el:
          - μικρότερη ερεθιστικότητα, καλύτερη ανοχή σε κίνηση, σύλληψη και αρχική φόρτιση
        evidence_claim_ids:
          - let_irritability_guided_load_management_2022
          - let_ergonomic_education_load_modification_E_2022
          - lateral_elbow_resisted_wrist_extensor_exercise
        organization_authority: clinical_rehabilitation_organization
      - stage_id: capacity_restoration
        label_el: ΣΤΑΔΙΟ 2 — ΔΥΝΑΜΗ / ΑΝΤΟΧΗ / ΦΟΡΤΙΣΗ
        goals_el:
          - δύναμη λαβής
          - μυϊκή αντοχή
          - ανοχή σε επαναλαμβανόμενη χρήση
        intervention_directions_el:
          - προοδευτική αντιστασιακή φόρτιση εκτεινόντων με ισομετρική, ομόκεντρη και έκκεντρη κατεύθυνση· σταδιακή αύξηση μηχανικής απαίτησης
          - Ώμος/ωμοπλάτη μόνο αν υπάρχει σχετικό έλλειμμα
        progress_markers_el:
          - καλύτερη δύναμη/αντοχή, φόρτιση και λειτουργία χωρίς παρατεταμένη έξαρση
        evidence_claim_ids:
          - lateral_elbow_resisted_wrist_extensor_exercise
          - let_proximal_strength_if_impairment_C_2022
          - let_no_validated_universal_dose_or_transition_2022_2024
        organization_authority: clinical_rehabilitation_organization
      - stage_id: functional_return_self_management
        label_el: ΣΤΑΔΙΟ 3 — ΛΕΙΤΟΥΡΓΙΚΗ ΕΠΑΝΕΝΤΑΞΗ / ΠΡΟΛΗΨΗ ΥΠΟΤΡΟΠΗΣ
        goals_el:
          - επάνοδος στις καθημερινές, επαγγελματικές/αθλητικές απαιτήσεις
          - αυτοδιαχείριση και μείωση κινδύνου υποτροπής
        intervention_directions_el:
          - προοδευτική έκθεση στις πραγματικές απαιτήσεις, λειτουργική χρήση/λαβή, διαχείριση φορτίου, εργονομικές/τεχνικές προσαρμογές όπου χρειάζονται και πρόγραμμα διατήρησης δύναμης/αντοχής
        progress_markers_el:
          - ουσιαστική λειτουργική βελτίωση, ανοχή στο συνήθες φορτίο και ικανότητα αυτοδιαχείρισης, χωρίς καθολικά αριθμητικά κριτήρια
        evidence_claim_ids:
          - lateral_elbow_high_demand_phased_reintroduction
          - let_ergonomic_education_load_modification_E_2022
          - let_no_validated_universal_dose_or_transition_2022_2024
        organization_authority: clinical_rehabilitation_organization
    adjunct_boundary_el: >-
      Παθητικά μέσα μόνο επικουρικά· όχι ως υποκατάστατο ενεργητικής προοδευτικής αποκατάστασης.
    reassessment_el: >-
      Ιατρική επανεκτίμηση σε άτυπη πορεία ή νέο/προοδευτικό νευρολογικό, ριζιτικό, μηχανικό ή τραυματικό/ασταθές εύρημα.
    reassessment_evidence_claim_ids: [let_atypical_differential_reassessment_2022]

  nonspecific_neck_pain:
    profile_ids: [cervical]
    evidence_profile_ids: [rep_nonspecific_neck_pain_v1]
    authority_mode: reviewed_route_sequence_plus_clinical_rehabilitation_organization
    short_flow_el:
      - >-
        Προτείνεται ενεργητική αποκατάσταση με εκπαίδευση, διατήρηση ή σταδιακή επάνοδο στη φυσική δραστηριότητα
        και εξατομικευμένη άσκηση ανάλογα με τη φάση και τη λειτουργική εικόνα.
      - >-
        Στόχος είναι η αποκατάσταση της καθημερινής και εργασιακής λειτουργίας και η μακροχρόνια αυτοδιαχείριση.
        Κινητοποιήσεις/χειρισμοί μπορούν να χρησιμοποιηθούν επιλεκτικά ως επικουρικά μέσα και όχι ως υποκατάστατο
        της ενεργητικής προσέγγισης.
    stages:
      - stage_id: activation_self_management
        label_el: ΣΤΑΔΙΟ 1 — ΕΝΕΡΓΟΠΟΙΗΣΗ / ΑΥΤΟΔΙΑΧΕΙΡΙΣΗ
        goals_el:
          - διατήρηση ή αποκατάσταση δραστηριότητας και λειτουργικής κινητικότητας
          - κατανόηση και ενεργή αυτοδιαχείριση των συμπτωμάτων
          - έναρξη κατάλληλης εξατομικευμένης άσκησης
        intervention_directions_el:
          - εκπαίδευση και ενεργοποίηση με αποφυγή αδικαιολόγητης ακινητοποίησης ή παθητικής εξάρτησης
          - διατήρηση ή σταδιακή επάνοδος στη συνήθη δραστηριότητα και εξατομικευμένη άσκηση, ιδίως σε χρόνιο μη ειδικό αυχενικό πόνο
          - επιλεκτικά κινητοποιήσεις/χειρισμοί ως συμπλήρωμα της ενεργητικής αποκατάστασης όταν ενδείκνυνται
        progress_markers_el:
          - καλύτερη ανοχή σε κίνηση και δραστηριότητα, λειτουργική βελτίωση και αυξανόμενη ικανότητα αυτοδιαχείρισης
        evidence_claim_ids:
          - nsnp_physical_activity_activation_A
          - nsnp_patient_education_B
          - nsnp_chronic_exercise_A
          - nsnp_acute_exercise_consensus
          - nsnp_manual_mobilization_optional
        organization_authority: clinical_rehabilitation_organization
      - stage_id: functional_return_self_management
        label_el: ΣΤΑΔΙΟ 2 — ΛΕΙΤΟΥΡΓΙΚΗ ΕΠΑΝΕΝΤΑΞΗ / ΔΙΑΤΗΡΗΣΗ
        goals_el:
          - επάνοδος στις σχετικές καθημερινές και επαγγελματικές απαιτήσεις
          - διατήρηση φυσικής δραστηριότητας και ανεξάρτητης αυτοδιαχείρισης
        intervention_directions_el:
          - προοδευτική επάνοδος στις πραγματικές λειτουργικές απαιτήσεις με συνέχιση κατάλληλης άσκησης και στρατηγικών αυτοδιαχείρισης
        progress_markers_el:
          - ουσιαστική λειτουργική βελτίωση και ανοχή στο συνήθες επίπεδο δραστηριότητας χωρίς καθολικά αριθμητικά κριτήρια
        evidence_claim_ids:
          - nsnp_physical_activity_activation_A
          - nsnp_patient_education_B
          - nsnp_chronic_exercise_A
        organization_authority: clinical_rehabilitation_organization
    adjunct_boundary_el: >-
      Παθητικά μέσα δεν αποτελούν τον πυρήνα της αποκατάστασης· η ενεργοποίηση, η δραστηριότητα και η αυτοδιαχείριση παραμένουν κεντρικές.
    reassessment_el: >-
      Ιατρική επανεκτίμηση σε επίμονο λειτουργικά περιοριστικό ή προοδευτικό πόνο παρά την κατάλληλη αντιμετώπιση, και νωρίτερα σε σοβαρή επιδείνωση ή νέο/προοδευτικό νευρολογικό εύρημα.
    reassessment_evidence_claim_ids: [nsnp_persistent_progressive_reassessment]
