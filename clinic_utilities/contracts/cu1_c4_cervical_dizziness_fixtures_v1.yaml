    route_id: cervical_dizziness_presentation
    scenarios:
      - input:
          clinician_diagnosis_cervicogenic_dizziness: yes
          manual_therapy_selected_as_adjunct: true
          material_dizziness_safety_concern: false
        expected:
          claim_id: c4_selected_manual_therapy_low_certainty_2025
