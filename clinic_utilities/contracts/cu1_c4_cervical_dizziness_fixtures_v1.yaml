      rehabilitation_sequence_id: null
      sequence_state: blocked_evidence_gap
      definitive_cervical_or_cervicogenic_dizziness_generated: false
      cervical_causation_inferred: false
      disease_specific_treatment_claims_allowed: false
      generic_cervical_fallback_allowed: false

  c4_presentation_only_does_not_inherit_treatment_effect_claims:
