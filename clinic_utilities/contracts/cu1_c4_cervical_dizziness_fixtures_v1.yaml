    route_id: cervical_dizziness_presentation
    input:
      clinician_diagnosis_cervicogenic_dizziness: not_stated
      neck_pain_or_stiffness: true
      dizziness_or_imbalance: true
      symptoms_aggravated_by_head_or_neck_movement: true
      material_dizziness_safety_concern: false
      post_traumatic_primary_context: false
    expected:
