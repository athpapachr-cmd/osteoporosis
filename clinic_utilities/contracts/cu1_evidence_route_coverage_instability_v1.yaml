rehabilitation_sequences:
  seq_shoulder_instability_anterior_traumatic_v1:
    sequence_id: seq_shoulder_instability_anterior_traumatic_v1
    route_id: glenohumeral_instability_dislocation
    applicability_conditions_optional: [traumatic_anterior_instability_with_explicit_rehabilitation_pathway]
    sequence_source: route_evidence_profile
    route_evidence_profile_id: rep_shoulder_instability_anterior_traumatic_v1
    phases:
      - phase_id: anterior_traumatic_initial_rehabilitation
        order: 1
        clinical_objective: restore pain-controlled motion and direction-specific shoulder motor control and strength within the explicitly selected rehabilitation pathway
        objective_authority:
          authority_type: evidence_claim
          evidence_claim_ids: [anterior_traumatic_selected_rehab_framework_2024]
        intervention_directions:
          - intervention_direction_id: anterior_first_time_esska_progression
            statement: after first-time traumatic anterior dislocation, progress from pain-controlled passive motion to active-assisted exercise and begin periscapular and rotator-cuff strengthening when pain allows, after concomitant injury context has been considered
            authority:
              authority_type: evidence_claim
              evidence_claim_ids: [anterior_first_time_rehab_esska_2026]
            applicability_conditions_optional: [first_time_traumatic_anterior_dislocation]
          - intervention_direction_id: anterior_recurrent_selected_rehabilitation
            statement: in recurrent traumatic anterior instability with an explicit preoperative or selected rehabilitation pathway, use pain-tolerated passive/active-assisted motion followed by proprioceptive and rotator-cuff, deltoid and periscapular strengthening
            authority:
              authority_type: evidence_claim
              evidence_claim_ids: [anterior_recurrent_rehab_esska_2026]
            applicability_conditions_optional: [recurrent_traumatic_anterior_preoperative_or_selected_rehabilitation]
        progression_criteria:
          - criterion_id: anterior_traumatic_functional_progression
            criterion_kind: progression
            statement: advance toward higher-demand dynamic rehabilitation when pain-free motor control, strength/endurance and functional milestones support progression rather than by elapsed time alone
            authority:
              authority_type: evidence_claim
              evidence_claim_ids: [anterior_traumatic_criterion_progression_2024]
        precautions_or_do_not_progress_criteria: []
        strength_optional: null
        certainty_optional: not_graded
        required_for_route: true

      - phase_id: anterior_traumatic_return_to_sport_when_applicable
        order: 2
        clinical_objective: restore safe sport-specific function after conservative traumatic anterior instability care when return to sport is a patient goal
        objective_authority:
          authority_type: evidence_claim
          evidence_claim_ids: [anterior_shoulder_instability_RTS_criteria]
        intervention_directions: []
        progression_criteria:
          - criterion_id: anterior_conservative_rts_criteria
            criterion_kind: progression
            statement: return to sport only when full pain-free range of motion, clinical stability without apprehension, adequate strength/endurance and sport-specific readiness are present rather than using time alone
            authority:
              authority_type: evidence_claim
              evidence_claim_ids: [anterior_shoulder_instability_RTS_criteria]
            applicability_conditions_optional: [traumatic_anterior_instability_return_to_sport]
        precautions_or_do_not_progress_criteria: []
        strength_optional: C
        certainty_optional: not_graded
        required_for_route: false
    clinician_modifications_optional: []
    protocol_overrides_optional: []

  seq_shoulder_instability_posterior_nonoperative_v1:
    sequence_id: seq_shoulder_instability_posterior_nonoperative_v1
    route_id: glenohumeral_instability_dislocation
    applicability_conditions_optional: [posterior_instability_with_explicit_nonoperative_management_decision]
    sequence_source: route_evidence_profile
    route_evidence_profile_id: rep_shoulder_instability_posterior_v1
    phases:
      - phase_id: posterior_nonoperative_direction_specific_rehabilitation
        order: 1
        clinical_objective: restore posterior-direction shoulder motor control, strength and dynamic stability in a patient explicitly selected for nonoperative management
        objective_authority:
          authority_type: evidence_claim
          evidence_claim_ids: [posterior_nonoperative_rehab_framework_2024]
        intervention_directions:
          - intervention_direction_id: posterior_rotator_cuff_scapular_control
            statement: use direction-specific posterior rotator-cuff and scapular motor-control/strength work and progress to dynamic stability tasks according to symptoms and identified deficits
            authority:
              authority_type: evidence_claim
              evidence_claim_ids: [posterior_nonoperative_rehab_framework_2024]
        progression_criteria:
          - criterion_id: posterior_nonoperative_functional_progression
            criterion_kind: progression
            statement: progress when motor control, strength/endurance and symptom-free functional milestones support higher-demand dynamic or perturbation work rather than by calendar time alone
            authority:
              authority_type: evidence_claim
              evidence_claim_ids: [posterior_nonoperative_progression_2024]
          - criterion_id: posterior_nonoperative_return_readiness
            criterion_kind: progression
            statement: before full sport or high-demand return, confirm prior rehabilitation milestones plus direction-specific physical performance, psychological readiness and sport/endurance demands
            authority:
              authority_type: evidence_claim
              evidence_claim_ids: [posterior_nonoperative_return_readiness_2024]
            applicability_conditions_optional: [posterior_instability_return_to_activity_nonoperative]
        precautions_or_do_not_progress_criteria: []
        strength_optional: null
        certainty_optional: not_graded
        required_for_route: true
    clinician_modifications_optional: []
    protocol_overrides_optional: []

  seq_shoulder_instability_anterior_atraumatic_v1:
    sequence_id: seq_shoulder_instability_anterior_atraumatic_v1
    route_id: glenohumeral_instability_dislocation
    applicability_conditions_optional: [atraumatic_anterior_instability_with_explicit_nonoperative_management_decision]
    sequence_source: route_evidence_profile
    route_evidence_profile_id: rep_shoulder_instability_anterior_atraumatic_v1
    phases:
      - phase_id: anterior_atraumatic_direction_specific_rehabilitation
        order: 1
        clinical_objective: improve dynamic anterior shoulder control and function through direction- and impairment-specific nonoperative rehabilitation
        objective_authority:
          authority_type: evidence_claim
          evidence_claim_ids: [anterior_atraumatic_rehab_framework_2024]
        intervention_directions:
          - intervention_direction_id: anterior_atraumatic_motor_control_strength
            statement: use individualized anterior rotator-cuff/scapular motor-control and strengthening work and progress dynamic loading according to identified deficits
            authority:
              authority_type: evidence_claim
              evidence_claim_ids: [anterior_atraumatic_rehab_framework_2024]
        progression_criteria:
          - criterion_id: anterior_atraumatic_functional_progression
            criterion_kind: progression
            statement: progress according to pain-free motor control, strength/endurance and functional performance rather than a universal elapsed-time sequence
            authority:
              authority_type: evidence_claim
              evidence_claim_ids: [anterior_atraumatic_progression_2024]
        precautions_or_do_not_progress_criteria: []
        strength_optional: null
        certainty_optional: not_graded
        required_for_route: true
    clinician_modifications_optional: []
    protocol_overrides_optional: []

  seq_shoulder_instability_multidirectional_v1:
    sequence_id: seq_shoulder_instability_multidirectional_v1
    route_id: glenohumeral_instability_dislocation
    applicability_conditions_optional: [multidirectional_instability_with_explicit_nonoperative_management_decision]
    sequence_source: route_evidence_profile
    route_evidence_profile_id: rep_shoulder_instability_multidirectional_v1
    phases:
      - phase_id: mdi_cautious_nonoperative_rehabilitation
        order: 1
        clinical_objective: provide cautious individualized dynamic-stability rehabilitation without overstating uncertain comparative efficacy
        objective_authority:
          authority_type: evidence_claim
          evidence_claim_ids: [mdi_nonoperative_rehab_cautious_2024_2026]
        intervention_directions:
          - intervention_direction_id: mdi_motor_control_cocontraction_dynamic_stability
            statement: when nonoperative rehabilitation is explicitly selected, consider individualized motor-control, co-contraction/scapular-control and dynamic-stability work while preserving the current uncertainty in comparative benefit
            authority:
              authority_type: evidence_claim
              evidence_claim_ids: [mdi_nonoperative_rehab_cautious_2024_2026]
        progression_criteria: []
        precautions_or_do_not_progress_criteria: []
        strength_optional: null
        certainty_optional: very_low
        required_for_route: true
    clinician_modifications_optional: []
    protocol_overrides_optional: []

