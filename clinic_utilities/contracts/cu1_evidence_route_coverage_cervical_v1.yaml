rehabilitation_sequences:
  seq_nonspecific_neck_pain_v1:
    sequence_id: seq_nonspecific_neck_pain_v1
    route_id: nonspecific_neck_pain
    sequence_source: route_evidence_profile
    route_evidence_profile_id: rep_nonspecific_neck_pain_v1
    phases:
      - phase_id: nsnp_activation_self_management_rehabilitation
        order: 1
        clinical_objective: restore activity and function through activation, education, self-management and individualized exercise when appropriate
        objective_authority:
          authority_type: evidence_claim
          evidence_claim_ids: [nsnp_physical_activity_activation_A, nsnp_patient_education_B]
        intervention_directions:
          - intervention_direction_id: nsnp_activity_self_management
            statement: emphasize physical activity, graded return to normal function and self-management rather than passive care as the central strategy
            authority:
              authority_type: evidence_claim
              evidence_claim_ids: [nsnp_physical_activity_activation_A]
          - intervention_direction_id: nsnp_education
            statement: provide patient education that supports understanding, activity and self-management
            authority:
              authority_type: evidence_claim
              evidence_claim_ids: [nsnp_patient_education_B]
          - intervention_direction_id: nsnp_chronic_exercise
            statement: for chronic nonspecific neck pain, use individualized exercise therapy without prescribing one universal exercise type, dose or fixed course
            authority:
              authority_type: evidence_claim
              evidence_claim_ids: [nsnp_chronic_exercise_A]
            applicability_conditions_optional: [chronic_nonspecific_neck_pain]
          - intervention_direction_id: nsnp_acute_exercise_when_selected
            statement: in acute nonspecific neck pain, exercise may be used as part of an activating approach without overstating the expert-consensus evidence level
            authority:
              authority_type: evidence_claim
              evidence_claim_ids: [nsnp_acute_exercise_consensus]
            applicability_conditions_optional: [acute_nonspecific_neck_pain]
          - intervention_direction_id: nsnp_manual_therapy_adjunct_when_selected
            statement: manual mobilization/manipulation may be included as a selected adjunct but must not replace active rehabilitation and self-management
            authority:
              authority_type: evidence_claim
              evidence_claim_ids: [nsnp_manual_mobilization_optional]
            applicability_conditions_optional: [manual_therapy_selected_as_adjunct]
        progression_criteria: []
        precautions_or_do_not_progress_criteria:
          - criterion_id: nsnp_persistent_progressive_reassessment
            criterion_kind: reassessment
            statement: persistent activity-limiting or progressive symptoms despite appropriate care, or severe progression/neurological deficit, should prompt medical reassessment rather than indefinite routine progression
            authority:
              authority_type: evidence_claim
              evidence_claim_ids: [nsnp_persistent_progressive_reassessment]
        strength_optional: null
        certainty_optional: not_graded
        required_for_route: true
    clinician_modifications_optional: []
    protocol_overrides_optional: []

