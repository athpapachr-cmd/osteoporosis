version: cu1_evidence_route_coverage_cervical_v1
status: active_design_authority_route_coverage_extension
runtime_authorized: false
reviewed_on: 2026-08-29
normative_schema: clinic_utilities/contracts/cu1_history_timeline_schema_v1.yaml
identity_mode: explicit_payload_id
review_record: clinic_utilities/contracts/CU1_CERVICAL_ROUTE_REVIEW_2026-08-29.md

purpose: >-
  Native schema-conformant evidence extension for cervical routes. The first reviewed route is
  nonspecific_neck_pain. Generic nonspecific neck pain uses the current DEGAM/AWMF S3 guideline as
  primary route authority. The older APTA/JOSPT 2017 neck-pain CPG remains classification-specific
  supporting context and must not automatically import its chronic mobility-deficit passive-modality
  bundle into every nonspecific-neck-pain referral.

sources:
  nonspecific_neck_degam_awmd_2025:
    evidence_id: nonspecific_neck_degam_awmd_2025
    source_type: clinical_practice_guideline
    title: Clinical Practice Guideline: Nonspecific Neck Pain
    authors_or_organization: El-Allawy A, Hecht N, Luedtke K, Schleicher P, Weidner N, Koetter T / DEGAM-AWMF S3 guideline
    year_or_version: 2025_S3_version_3_0
    reference: Dtsch Arztebl Int. 2025;122(20):552-557
    doi_optional: 10.3238/arztebl.m2025.0119
    population_scope_optional: nonspecific neck pain without history/examination evidence of a structural cause; acute, subacute and chronic presentations addressed
    reviewed_on: 2026-08-29
    next_review_due: 2027-08-29
    freshness_state: current
    status: active

  neck_pain_apta_cpg_2017:
    evidence_id: neck_pain_apta_cpg_2017
    source_type: clinical_practice_guideline
    title: Neck Pain: Revision 2017
    authors_or_organization: Blanpied PR, Gross AR, Elliott JM, Devaney LL, Clewley D, Walton DM, Sparks C, Robertson EK / Academy of Orthopaedic Physical Therapy APTA
    year_or_version: 2017
    reference: J Orthop Sports Phys Ther. 2017;47(7):A1-A83
    doi_optional: 10.2519/jospt.2017.0302
    population_scope_optional: neck pain classified as mobility deficits, movement-coordination impairments including WAD, headache/cervicogenic headache, or radiating/radicular pain
    reviewed_on: 2026-08-29
    next_review_due: 2027-02-28
    freshness_state: current
    status: active
    note: APTA Orthopedics still lists this as the published Neck Pain CPG at review date; shortened review interval because the evidence search underlying the guideline is older and newer route-specific guidance exists.

  neck_manual_exercise_cochrane_2025:
    evidence_id: neck_manual_exercise_cochrane_2025
    source_type: systematic_review
    title: Manual therapy with exercise for neck pain
    authors_or_organization: Cochrane Back and Neck Group
    year_or_version: 2025
    reference: Cochrane Database Syst Rev. 2025;12:CD011225
    doi_optional: 10.1002/14651858.CD011225.pub2
    population_scope_optional: adults with neck pain; evidence predominantly chronic; manual therapy combined with exercise compared with placebo, no treatment or other care
    reviewed_on: 2026-08-29
    next_review_due: 2027-08-29
    freshness_state: current
    status: active

claims:
  nsnp_physical_activity_activation_A:
    claim_id: nsnp_physical_activity_activation_A
    evidence_ids: [nonspecific_neck_degam_awmd_2025]
    applicable_route_evidence_profile_ids: [rep_nonspecific_neck_pain_v1]
    applicable_route_ids: [nonspecific_neck_pain]
    domain: core_rehabilitation
    claim_summary: Physical activity and activating self-management should be central to nonspecific neck-pain care when history and examination do not indicate a structural cause.
    recommendation_direction: recommend
    output_scope: referral_core
    strength_optional: A_DEGAM
    certainty_optional: not_graded
    reviewed_on: 2026-08-29

  nsnp_chronic_exercise_A:
    claim_id: nsnp_chronic_exercise_A
    evidence_ids: [nonspecific_neck_degam_awmd_2025]
    applicable_route_evidence_profile_ids: [rep_nonspecific_neck_pain_v1]
    applicable_route_ids: [nonspecific_neck_pain]
    applicability_conditions_optional: [chronic_nonspecific_neck_pain]
    domain: core_rehabilitation
    claim_summary: Exercise therapy is recommended for chronic nonspecific neck pain; available evidence does not support one universal exercise form for self-management or one physician-prescribed dose.
    recommendation_direction: recommend
    output_scope: referral_core
    strength_optional: A_DEGAM
    certainty_optional: not_graded
    reviewed_on: 2026-08-29

  nsnp_acute_exercise_consensus:
    claim_id: nsnp_acute_exercise_consensus
    evidence_ids: [nonspecific_neck_degam_awmd_2025]
    applicable_route_evidence_profile_ids: [rep_nonspecific_neck_pain_v1]
    applicable_route_ids: [nonspecific_neck_pain]
    applicability_conditions_optional: [acute_nonspecific_neck_pain]
    domain: core_rehabilitation
    claim_summary: Exercise therapy may be offered in acute nonspecific neck pain as an activating treatment, but this specific acute recommendation is expert consensus rather than a graded comparative treatment-effect recommendation.
    recommendation_direction: consider
    output_scope: referral_core
    strength_optional: expert_consensus
    certainty_optional: not_applicable
    reviewed_on: 2026-08-29

  nsnp_patient_education_B:
    claim_id: nsnp_patient_education_B
    evidence_ids: [nonspecific_neck_degam_awmd_2025]
    applicable_route_evidence_profile_ids: [rep_nonspecific_neck_pain_v1]
    applicable_route_ids: [nonspecific_neck_pain]
    domain: core_rehabilitation
    claim_summary: Patient education is recommended in acute and chronic nonspecific neck pain to support understanding, activity and self-management.
    recommendation_direction: recommend
    output_scope: referral_core
    strength_optional: B_DEGAM
    certainty_optional: not_graded
    reviewed_on: 2026-08-29

  nsnp_manual_mobilization_optional:
    claim_id: nsnp_manual_mobilization_optional
    evidence_ids: [nonspecific_neck_degam_awmd_2025, neck_manual_exercise_cochrane_2025]
    applicable_route_evidence_profile_ids: [rep_nonspecific_neck_pain_v1]
    applicable_route_ids: [nonspecific_neck_pain]
    applicability_conditions_optional: [manual_therapy_selected_as_adjunct]
    domain: adjunct
    claim_summary: Mobilization or manipulation may be offered as an adjunct in nonspecific neck pain, but passive treatment must not replace activation/self-management and current evidence does not justify making manual therapy mandatory in every referral.
    recommendation_direction: may_consider
    output_scope: referral_core
    strength_optional: zero_DEGAM
    certainty_optional: not_graded
    reviewed_on: 2026-08-29

  nsnp_soft_tissue_chronic_only_with_activation:
    claim_id: nsnp_soft_tissue_chronic_only_with_activation
    evidence_ids: [nonspecific_neck_degam_awmd_2025]
    applicable_route_evidence_profile_ids: [rep_nonspecific_neck_pain_v1]
    applicable_route_ids: [nonspecific_neck_pain]
    applicability_conditions_optional: [chronic_nonspecific_neck_pain, soft_tissue_adjunct_selected]
    domain: adjunct
    claim_summary: Soft-tissue treatment may be offered for chronic nonspecific neck pain only in combination with activating methods and should not become the core rehabilitation strategy.
    recommendation_direction: may_consider
    output_scope: referral_core
    strength_optional: zero_DEGAM
    certainty_optional: not_graded
    reviewed_on: 2026-08-29

  nsnp_immobilization_do_not_recommend:
    claim_id: nsnp_immobilization_do_not_recommend
    evidence_ids: [nonspecific_neck_degam_awmd_2025]
    applicable_route_evidence_profile_ids: [rep_nonspecific_neck_pain_v1]
    applicable_route_ids: [nonspecific_neck_pain]
    domain: safety
    claim_summary: Routine immobilization should not be recommended for nonspecific neck pain because it conflicts with the guideline's activating treatment strategy and may promote medicalization and deconditioning.
    recommendation_direction: do_not_offer
    output_scope: clinician_ui_only
    strength_optional: expert_consensus
    certainty_optional: not_applicable
    reviewed_on: 2026-08-29

  nsnp_mechanical_traction_negative_2025:
    claim_id: nsnp_mechanical_traction_negative_2025
    evidence_ids: [nonspecific_neck_degam_awmd_2025]
    applicable_route_evidence_profile_ids: [rep_nonspecific_neck_pain_v1]
    applicable_route_ids: [nonspecific_neck_pain]
    domain: adjunct
    claim_summary: Mechanical traction is not recommended for generic nonspecific neck pain in the 2025 DEGAM/AWMF guideline.
    recommendation_direction: do_not_offer
    output_scope: clinician_ui_only
    strength_optional: B_DEGAM_negative
    certainty_optional: not_graded
    reviewed_on: 2026-08-29

  nsnp_passive_modalities_negative_2025:
    claim_id: nsnp_passive_modalities_negative_2025
    evidence_ids: [nonspecific_neck_degam_awmd_2025]
    applicable_route_evidence_profile_ids: [rep_nonspecific_neck_pain_v1]
    applicable_route_ids: [nonspecific_neck_pain]
    domain: adjunct
    claim_summary: Laser therapy, electrotherapy and ultrasound are not recommended for generic nonspecific neck pain in the current DEGAM/AWMF guideline; kinesiotaping is also negatively recommended.
    recommendation_direction: do_not_offer
    output_scope: clinician_ui_only
    strength_optional: B_or_consensus_DEGAM_negative
    certainty_optional: not_graded
    reviewed_on: 2026-08-29

  nsnp_apta_2017_mobility_deficit_bundle_context:
    claim_id: nsnp_apta_2017_mobility_deficit_bundle_context
    evidence_ids: [neck_pain_apta_cpg_2017]
    applicable_route_evidence_profile_ids: [rep_nonspecific_neck_pain_v1]
    applicable_route_ids: [nonspecific_neck_pain]
    applicability_conditions_optional: [APTA_chronic_neck_pain_with_mobility_deficits_classification]
    domain: core_rehabilitation
    claim_summary: The 2017 APTA CPG gives a Grade-B multimodal recommendation for chronic neck pain specifically classified with mobility deficits; that bundle included manual therapy, mixed cervical/scapulothoracic exercise and selected passive modalities. Because it is classification-specific and predates the 2025 generic nonspecific-neck-pain guideline, it must not be auto-applied to every C1 referral or used to override newer negative generic recommendations for passive modalities.
    recommendation_direction: context_only
    output_scope: clinician_ui_only
    strength_optional: B_APTA_2017
    certainty_optional: not_graded
    reviewed_on: 2026-08-29

  nsnp_persistent_progressive_reassessment:
    claim_id: nsnp_persistent_progressive_reassessment
    evidence_ids: [nonspecific_neck_degam_awmd_2025]
    applicable_route_evidence_profile_ids: [rep_nonspecific_neck_pain_v1]
    applicable_route_ids: [nonspecific_neck_pain]
    domain: safety
    claim_summary: Persistent activity-limiting or progressive neck pain despite guideline-concordant care warrants medical reassessment, with earlier reassessment when there is very severe progression or neurological deficit; this is not a routine physiotherapy-course duration rule.
    recommendation_direction: recommend
    output_scope: referral_core
    strength_optional: expert_consensus
    certainty_optional: not_applicable
    reviewed_on: 2026-08-29

  nsnp_imaging_reconsideration_window_ui:
    claim_id: nsnp_imaging_reconsideration_window_ui
    evidence_ids: [nonspecific_neck_degam_awmd_2025]
    applicable_route_evidence_profile_ids: [rep_nonspecific_neck_pain_v1]
    applicable_route_ids: [nonspecific_neck_pain]
    domain: execution_detail
    claim_summary: The DEGAM/AWMF guideline discusses reconsidering imaging for persistent activity-limiting or progressive nonspecific neck pain after approximately 4-6 weeks of guideline-concordant treatment, or earlier for very severe progression/neurological deficits; this source-defined medical review window must not be converted into a fixed PT frequency or total-course duration.
    recommendation_direction: context_only
    output_scope: clinician_ui_only
    strength_optional: expert_consensus
    certainty_optional: not_applicable
    reviewed_on: 2026-08-29

