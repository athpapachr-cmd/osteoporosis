    output_scope: referral_core
    strength_optional: C
    certainty_optional: not_graded
    reviewed_on: 2026-08-29

  nonarthritic_hip_fais_avoid_impingement_range:
    claim_id: nonarthritic_hip_fais_avoid_impingement_range
    evidence_ids: [nonarthritic_hip_cpg_2023]
    applicable_route_evidence_profile_ids: [rep_nonarthritic_intraarticular_hip_v1]
    applicable_route_ids: [nonarthritic_intraarticular_hip_pain]
    applicable_subtype_ids_optional: [formal_FAIS_diagnosis]
    applicability_conditions_optional: [FAIS_or_impingement_presentation]
    domain: safety
    claim_summary: In FAIS or an applicable impingement presentation, exercise and activity should avoid repeatedly symptom-provoking ranges that create hip impingement.
    recommendation_direction: recommend
    output_scope: referral_core
    certainty_optional: not_graded
    reviewed_on: 2026-08-29

  nonarthritic_hip_instability_avoid_capsuloligamentous_stress:
