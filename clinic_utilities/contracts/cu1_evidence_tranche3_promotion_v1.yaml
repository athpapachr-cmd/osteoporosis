version: cu1_evidence_tranche3_promotion_v1
status: normalized_promotion_projection
runtime_authorized: false
reviewed_on: 2026-08-29
source_shard: clinic_utilities/contracts/cu1_evidence_tranche3_v1.yaml
normative_schema: clinic_utilities/contracts/cu1_history_timeline_schema_v1.yaml
promotion_review: clinic_utilities/contracts/CU1_TRANCHE3_PROMOTION_REVIEW_2026-08-29.md

purpose: >-
  Deterministic normalization, freshness correction and clinical-scope correction projection for
  the immutable tranche3 staging shard. The normative logical tranche3 authority is source_shard
  plus this reviewed projection. Promotion does not imply route completion or runtime authorization.

normalization_order:
  - materialize_map_key_identity
  - populate_required_non_optional_fields
  - apply_source_metadata_corrections
  - drop_invalid_or_scope_unsafe_claims
  - add_reviewed_replacement_sources_and_claims
  - apply_profile_corrections
  - apply_sequence_corrections
  - resolve_and_validate_references
  - validate_route_and_subtype_applicability
  - validate_output_scope
  - validate_freshness
  - validate_cross_shard_id_uniqueness

identity_materialization:
  sources:
    canonical_field: evidence_id
    rule: evidence_id_equals_source_map_key
  claims:
    canonical_field: claim_id
    rule: claim_id_equals_claim_map_key
  route_history_prompts:
    canonical_field: prompt_id
    rule: prompt_id_equals_prompt_map_key
  route_evidence_profiles:
    canonical_field: route_evidence_profile_id
    rule: route_evidence_profile_id_equals_profile_map_key
  rehabilitation_sequences:
    canonical_field: sequence_id
    rule: sequence_id_equals_sequence_map_key

required_field_defaults:
  route_evidence_profiles:
    diagnostic_claim_ids: []
    history_claim_ids: []
    examination_claim_ids: []
    adjunct_claim_ids: []
    safety_claim_ids: []
  rehabilitation_sequences:
    sequence_source: route_evidence_profile
    clinician_modifications_optional: []
    protocol_overrides_optional: []

