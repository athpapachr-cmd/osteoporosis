    applicable_subtype_ids_optional: [formal_gluteal_tendinopathy_diagnosis]
    domain: core_rehabilitation
    claim_summary: For clinically diagnosed gluteal tendinopathy, exercise plus education can be cautiously recommended as the core approach for pain and function; the review reports moderate-strength evidence for benefit.
