    recommendation_direction: recommend
    output_scope: referral_core
    certainty_optional: not_graded
    reviewed_on: 2026-08-29

  gtps_exercise_first_line_sr2024:
    claim_id: gtps_exercise_first_line_sr2024
    evidence_ids: [gtps_exercise_sr_2024]
    applicable_route_evidence_profile_ids: [rep_gtps_gluteal_tendinopathy_v1]
