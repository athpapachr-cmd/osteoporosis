    claim_id: adhesive_capsulitis_strengthening_inconclusive_cpg2025
    evidence_ids: [primary_frozen_shoulder_cpg_2025_korea]
    applicable_route_evidence_profile_ids: [rep_adhesive_capsulitis_v1]
