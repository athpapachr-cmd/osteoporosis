profile_field_overrides:
  rep_full_thickness_cuff_nonoperative_v1:
    safety_claim_ids: [full_thickness_cuff_structural_progression_context]

  rep_nonarthritic_intraarticular_hip_v1:
    applicability_conditions_optional:
      - default_nonarthritic_presentation_or_formal_FAIS_or_symptomatic_labral_pathology
    adjunct_claim_ids: [nonarthritic_hip_movement_pattern_training]
    safety_claim_ids:
      - nonarthritic_hip_fais_avoid_impingement_range
      - nonarthritic_hip_instability_avoid_capsuloligamentous_stress
    evidence_gaps:
      - multimodal_recommendation_is_strongest_for_FAIS_and_labral_presentations
      - other_established_nonarthritic_intraarticular_conditions_require_specific_applicability_review
      - current_CPG_does_not_supply_validated_route_wide_progression_thresholds

  rep_gtps_gluteal_tendinopathy_v1:
    subtype_ids_optional: [formal_GTPS_diagnosis, formal_gluteal_tendinopathy_diagnosis]
    evidence_gaps:
      - exact_progression_thresholds_not_established
      - formal_trochanteric_bursitis_diagnosis_not_covered_by_this_profile
      - other_established_greater_trochanteric_disorder_not_covered_by_this_profile

  rep_acute_isolated_meniscus_nonoperative_v1:
    safety_claim_ids: [acute_meniscus_displaced_ROM_block_consensus_reassessment]
    evidence_gaps:
      - nonoperative_PT_statement_is_workgroup_clinical_opinion
      - no_validated_route_specific_rehabilitation_progression_sequence

  rep_shoulder_instability_anterior_traumatic_v1:
    evidence_gaps:
      - evidence_profile_is_traumatic_anterior_only
      - first_time_vs_recurrent_age_bone_loss_and_soft_tissue_context_materially_change_management
      - route_level_initial_rehabilitation_sequence_not_curated
      - operative_and_nonoperative_rehabilitation_must_not_be_collapsed

  rep_shoulder_instability_posterior_v1:
    primary_source_ids:
      - posterior_shoulder_instability_consensus_part1_2025
      - posterior_shoulder_instability_consensus_2025
    evidence_gaps:
      - evidence_is_expert_consensus
      - nonoperative_indications_are_defined_but_one_universal_initial_rehabilitation_sequence_is_not
      - postoperative_and_nonoperative_rehabilitation_must_not_be_collapsed

  rep_adhesive_capsulitis_v1:
    primary_source_ids:
      - primary_frozen_shoulder_cpg_2025_korea
      - bess_frozen_shoulder_pathway_2025
      - adhesive_capsulitis_exercise_mobilization_sr_2023
    adjunct_claim_ids:
      - adhesive_capsulitis_self_stretching_cpg2025
      - adhesive_capsulitis_strengthening_inconclusive_cpg2025
    evidence_gaps:
      - current_2025_frameworks_do_not_define_one_universal_criteria_based_phase_progression_sequence
      - primary_frozen_shoulder_specific_claims_must_not_be_applied_to_secondary_or_other_stiff_shoulder_presentations_without_review
      - BESS_does_not_establish_supervised_physiotherapy_as_superior_to_natural_history

sequence_overrides:
  seq_full_thickness_cuff_nonoperative_v1:
    invariant: >-
      Nonoperative physical therapy may improve patient-reported outcomes, but the sequence remains
      intentionally single-phase because the AAOS CPG does not provide one universal PT progression
      protocol; structural progression context remains clinician-facing rather than a promise of stability.

  seq_nonarthritic_intraarticular_hip_v1:
    applicability_conditions_optional:
      - default_nonarthritic_presentation_or_formal_FAIS_or_symptomatic_labral_pathology
    replace_claim_ids:
      nonarthritic_hip_impairment_specific_exercise: nonarthritic_hip_therapeutic_exercise_C
    remove_progression_criterion_ids:
      - nonarthritic_hip_objective_reassessment_guides_progression
    add_intervention_directions:
      - intervention_direction_id: nonarthritic_hip_impairment_specific_exercise_C
        statement: use therapeutic exercise to address identified hip mobility, flexibility and strength deficits when clinically applicable
        authority: {authority_type: evidence_claim, evidence_claim_ids: [nonarthritic_hip_therapeutic_exercise_C]}
    replace_precautions_or_do_not_progress_criteria:
      - criterion_id: nonarthritic_hip_FAIS_avoid_impingement_range
        criterion_kind: do_not_progress
        statement: in FAIS or an applicable impingement presentation, avoid repeatedly progressing into symptom-provoking impingement ranges
        authority: {authority_type: evidence_claim, evidence_claim_ids: [nonarthritic_hip_fais_avoid_impingement_range]}
        applicability_conditions_optional: [FAIS_or_impingement_presentation]
      - criterion_id: nonarthritic_hip_instability_avoid_capsular_stress
        criterion_kind: do_not_progress
        statement: in a hip-instability presentation, avoid progression that places excessive stress on capsuloligamentous structures
        authority: {authority_type: evidence_claim, evidence_claim_ids: [nonarthritic_hip_instability_avoid_capsuloligamentous_stress]}
        applicability_conditions_optional: [established_or_suspected_hip_instability_context]
    status_after_projection: evidence_bounded_single_phase_pending_progression_and_other_subtype_review
    missing_before_freeze:
      - validated_route_wide_progression_criteria
      - evidence_profile_for_other_established_nonarthritic_intraarticular_conditions

  seq_gtps_gluteal_tendinopathy_v1:
    replace_objective_authority_claim_ids:
      - gtps_exercise_first_line_sr2024
      - gluteal_tendinopathy_exercise_education_core_sr2025
    replace_intervention_directions:
      - intervention_direction_id: gtps_exercise_first_line
        statement: for formal GTPS, use individualized exercise as first-line conservative care
        authority: {authority_type: evidence_claim, evidence_claim_ids: [gtps_exercise_first_line_sr2024]}
        applicability_conditions_optional: [formal_GTPS_diagnosis]
      - intervention_direction_id: gluteal_tendinopathy_exercise_education_core
        statement: for formal gluteal tendinopathy, use individualized exercise with education as the core conservative approach
        authority: {authority_type: evidence_claim, evidence_claim_ids: [gluteal_tendinopathy_exercise_education_core_sr2025]}
        applicability_conditions_optional: [formal_gluteal_tendinopathy_diagnosis]
    phase_strength_optional_after_projection: null
    status_after_projection: evidence_bounded_single_phase_pending_progression_semantics

  seq_acute_isolated_meniscus_nonoperative_v1:
    replace_claim_ids:
      acute_meniscus_PT_may_benefit_nondisplaced_nonoperative: acute_meniscus_PT_consensus_nonoperative
      acute_meniscus_displaced_ROM_block_early_surgical_context: acute_meniscus_displaced_ROM_block_consensus_reassessment
    phase_strength_optional_after_projection: consensus_AAOS
    phase_certainty_optional_after_projection: not_applicable
    status_after_projection: blocked_consensus_only_sequence_evidence
    invariant: >-
      AAOS clinical opinion may authorize cautious nonoperative PT wording for the selected
      non-displaced acute isolated tear, but it does not authorize an invented staged progression protocol.

  seq_adhesive_capsulitis_evidence_bounded_v1:
    add_intervention_directions:
      - intervention_direction_id: adhesive_capsulitis_primary_manual_ROM
        statement: for primary frozen shoulder, manual therapy including range-of-motion exercise may be considered according to symptoms and mobility findings
        authority: {authority_type: evidence_claim, evidence_claim_ids: [adhesive_capsulitis_manual_ROM_cpg2025]}
        applicability_conditions_optional: [primary_frozen_shoulder]
      - intervention_direction_id: adhesive_capsulitis_post_injection_PT
        statement: when glenohumeral injection therapy has been used, physiotherapy may be considered within the BESS 2025 pathway
        authority: {authority_type: evidence_claim, evidence_claim_ids: [adhesive_capsulitis_BESS_PT_after_injection]}
        applicability_conditions_optional: [after_glenohumeral_injection_therapy]
    status_after_projection: evidence_bounded_single_phase_current_authority_no_validated_progression
    missing_before_freeze:
      - validated_criteria_based_phase_progression_sequence
      - secondary_frozen_shoulder_or_other_stiff_shoulder_applicability_review

post_projection_validation_assertions:
  identity:
    every_source_has_explicit_evidence_id: true
    every_claim_has_explicit_claim_id: true
    every_history_prompt_has_explicit_prompt_id: true
    every_route_profile_has_explicit_route_evidence_profile_id: true
    every_sequence_has_explicit_sequence_id: true
  required_fields:
