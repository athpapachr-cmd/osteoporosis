    title: Management of Rotator Cuff Injuries Evidence-Based Clinical Practice Guideline
    authors_or_organization: American Academy of Orthopaedic Surgeons
    year_or_version: 2025
    published_on_optional: 2025-08-18
    reference: AAOS Rotator Cuff Injuries CPG 2025
    url_optional: https://www.aaos.org/rccpg2025
    population_scope_optional: adults with rotator cuff injuries
    reviewed_on: 2026-08-28
    next_review_due: 2027-08-28
    freshness_state: current
    status: active

  nonarthritic_hip_cpg_2023:
    source_type: clinical_practice_guideline
    title: Hip Pain and Movement Dysfunction Associated With Nonarthritic Hip Joint Pain - Revision 2023
    authors_or_organization: Academy of Orthopaedic Physical Therapy + American Academy of Sports Physical Therapy / APTA
