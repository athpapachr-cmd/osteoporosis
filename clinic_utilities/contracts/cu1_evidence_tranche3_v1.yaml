rehabilitation_sequences:
  seq_full_thickness_cuff_nonoperative_v1:
    route_id: confirmed_full_thickness_rotator_cuff_tear_nonoperative
    route_evidence_profile_id: rep_full_thickness_cuff_nonoperative_v1
    status: evidence_bounded_single_phase_pending_progression_semantics
    phases:
      - phase_id: full_thickness_cuff_nonoperative_rehabilitation
        order: 1
        clinical_objective: improve patient-reported pain and function through individualized physical therapy while preserving structural follow-up context
        objective_authority: {authority_type: evidence_claim, evidence_claim_ids: [full_thickness_cuff_PT_improves_PROs]}
        intervention_directions:
          - {intervention_direction_id: individualized_PT_full_thickness_cuff, statement: provide individualized physical therapy as the selected nonoperative management pathway, authority: {authority_type: evidence_claim, evidence_claim_ids: [full_thickness_cuff_PT_improves_PROs]}}
        progression_criteria: []
        precautions_or_do_not_progress_criteria: []
        strength_optional: strong_AAOS
        certainty_optional: high
        required_for_route: true
    missing_before_freeze: [route_specific_PT_progression_criteria]

  seq_nonarthritic_intraarticular_hip_v1:
    route_id: nonarthritic_intraarticular_hip_pain
    route_evidence_profile_id: rep_nonarthritic_intraarticular_hip_v1
    status: evidence_bounded_sequence_pending_condition_applicability_review
    phases:
      - phase_id: nonarthritic_hip_multimodal_impairment_rehab
        order: 1
        clinical_objective: improve pain and function using impairment-specific multimodal nonoperative rehabilitation
        objective_authority: {authority_type: evidence_claim, evidence_claim_ids: [nonarthritic_hip_multimodal_rehab]}
        intervention_directions:
          - {intervention_direction_id: nonarthritic_hip_activity_modification_strengthening, statement: combine activity modification with hip/trunk/lower-extremity strengthening and selected additional interventions according to identified impairments, authority: {authority_type: evidence_claim, evidence_claim_ids: [nonarthritic_hip_multimodal_rehab]}}
          - {intervention_direction_id: nonarthritic_hip_movement_pattern_optional, statement: use movement-pattern training when a reproducible painful movement dysfunction is identified, authority: {authority_type: evidence_claim, evidence_claim_ids: [nonarthritic_hip_movement_pattern_training]}, applicability_conditions_optional: [movement_dysfunction_identified]}
        progression_criteria:
          - {criterion_id: nonarthritic_hip_objective_reassessment_guides_progression, criterion_kind: progression, statement: use repeated objective impairment and performance measures to guide treatment response and activity progression rather than a fixed calendar sequence, authority: {authority_type: evidence_claim, evidence_claim_ids: [nonarthritic_hip_impairment_specific_exercise]}}
        precautions_or_do_not_progress_criteria:
          - {criterion_id: nonarthritic_hip_avoid_symptom_provoking_ranges, criterion_kind: do_not_progress, statement: do not progress into symptom-provoking ranges that create impingement in FAIS or excessive capsuloligamentous stress in instability presentations, authority: {authority_type: evidence_claim, evidence_claim_ids: [nonarthritic_hip_avoid_symptom_provoking_impingement_or_instability_load]}}
        strength_optional: B
        certainty_optional: not_graded
        required_for_route: true
    missing_before_freeze: [subtype_applicability_split_for_non_FAIS_non_labral_conditions]

  seq_gtps_gluteal_tendinopathy_v1:
    route_id: greater_trochanteric_lateral_hip_pain_pathway
    subtype_ids_optional: [formal_gtps_diagnosis, formal_gluteal_tendinopathy_diagnosis]
    route_evidence_profile_id: rep_gtps_gluteal_tendinopathy_v1
    status: evidence_bounded_single_phase_pending_progression_semantics
    phases:
      - phase_id: gtps_exercise_education_core
        order: 1
        clinical_objective: improve lateral-hip pain and function using exercise-based rehabilitation with education when appropriate
        objective_authority: {authority_type: evidence_claim, evidence_claim_ids: [gtps_exercise_first_line]}
        intervention_directions:
          - {intervention_direction_id: gtps_exercise_core, statement: use individualized exercise as core/first-line conservative care for clinically diagnosed GTPS or gluteal tendinopathy, authority: {authority_type: evidence_claim, evidence_claim_ids: [gtps_exercise_first_line]}}
        progression_criteria: []
        precautions_or_do_not_progress_criteria: []
        strength_optional: null
        certainty_optional: moderate
        required_for_route: true
    missing_before_freeze: [exact_progression_criteria, isolated_bursitis_and_other_greater_trochanteric_subtype_handling]

  seq_acute_isolated_meniscus_nonoperative_v1:
    route_id: acute_isolated_meniscal_injury_nonoperative
    route_evidence_profile_id: rep_acute_isolated_meniscus_nonoperative_v1
    status: blocked_low_strength_sequence_evidence
    phases:
      - phase_id: acute_isolated_meniscus_conservative_rehab
        order: 1
        clinical_objective: provide conservative rehabilitation when an acute isolated non-displaced tear is judged appropriate for nonoperative care
        objective_authority: {authority_type: evidence_claim, evidence_claim_ids: [acute_meniscus_PT_may_benefit_nondisplaced_nonoperative]}
        intervention_directions:
          - {intervention_direction_id: acute_meniscus_PT_nonoperative, statement: physical therapy may be used as the nonoperative option in the selected acute isolated non-displaced presentation, authority: {authority_type: evidence_claim, evidence_claim_ids: [acute_meniscus_PT_may_benefit_nondisplaced_nonoperative]}}
