claims:
  full_thickness_cuff_PT_improves_PROs:
    evidence_ids: [aaos_rotator_cuff_injuries_2025]
    applicable_route_evidence_profile_ids: [rep_full_thickness_cuff_nonoperative_v1]
    applicable_route_ids: [confirmed_full_thickness_rotator_cuff_tear_nonoperative]
    domain: core_rehabilitation
    claim_summary: In symptomatic full-thickness rotator cuff tears selected for nonoperative management, physical therapy improves patient-reported outcomes.
    recommendation_direction: recommend
    output_scope: referral_core
    strength_optional: strong_AAOS
    certainty_optional: high
    reviewed_on: 2026-08-28

  full_thickness_cuff_structural_progression_context:
    evidence_ids: [aaos_rotator_cuff_injuries_2025]
    applicable_route_evidence_profile_ids: [rep_full_thickness_cuff_nonoperative_v1]
    applicable_route_ids: [confirmed_full_thickness_rotator_cuff_tear_nonoperative]
    domain: safety
    claim_summary: Nonoperative symptom/function improvement does not imply structural stability; tear size, muscle atrophy and fatty infiltration may progress over longer follow-up.
    recommendation_direction: context_only
    output_scope: clinician_ui_only
    strength_optional: strong_AAOS
    certainty_optional: high
    reviewed_on: 2026-08-28

  nonarthritic_hip_multimodal_rehab:
    evidence_ids: [nonarthritic_hip_cpg_2023]
    applicable_route_evidence_profile_ids: [rep_nonarthritic_intraarticular_hip_v1]
    applicable_route_ids: [nonarthritic_intraarticular_hip_pain]
    domain: core_rehabilitation
    claim_summary: Multimodal nonoperative rehabilitation should combine activity modification and strengthening of hip, trunk and lower-extremity musculature with selected manual therapy, movement/postural correction, stretching or balance work when applicable, particularly for FAIS and labral presentations.
    recommendation_direction: recommend
    output_scope: referral_core
    strength_optional: B
    certainty_optional: not_graded
    applicability_conditions: [FAIS_or_labral_or_applicable_nonarthritic_intraarticular_presentation]
    reviewed_on: 2026-08-28

  nonarthritic_hip_impairment_specific_exercise:
    evidence_ids: [nonarthritic_hip_cpg_2023]
    applicable_route_evidence_profile_ids: [rep_nonarthritic_intraarticular_hip_v1]
    applicable_route_ids: [nonarthritic_intraarticular_hip_pain]
    domain: core_rehabilitation
    claim_summary: Therapeutic exercise may address identified joint mobility, muscle flexibility and strength deficits; objective impairment and performance measures should guide treatment response and progression rather than a universal protocol.
    recommendation_direction: may_consider
    output_scope: referral_core
    strength_optional: C_or_lower_context
    certainty_optional: not_graded
    reviewed_on: 2026-08-28

  nonarthritic_hip_movement_pattern_training:
    evidence_ids: [nonarthritic_hip_cpg_2023]
    applicable_route_evidence_profile_ids: [rep_nonarthritic_intraarticular_hip_v1]
    applicable_route_ids: [nonarthritic_intraarticular_hip_pain]
    domain: adjunct
    claim_summary: Movement-pattern training may be used to optimize painful lower-extremity movement patterns during activities of daily living when movement dysfunction is identified.
    recommendation_direction: may_consider
    output_scope: referral_core
    strength_optional: C
    certainty_optional: not_graded
    applicability_conditions: [movement_dysfunction_identified]
    reviewed_on: 2026-08-28

  nonarthritic_hip_avoid_symptom_provoking_impingement_or_instability_load:
    evidence_ids: [nonarthritic_hip_cpg_2023]
    applicable_route_evidence_profile_ids: [rep_nonarthritic_intraarticular_hip_v1]
    applicable_route_ids: [nonarthritic_intraarticular_hip_pain]
    domain: safety
    claim_summary: Exercise/activity selection should avoid symptom-provoking ranges that create impingement in FAIS or excessive capsuloligamentous stress in hip-instability presentations.
    recommendation_direction: recommend
    output_scope: referral_core
    certainty_optional: not_graded
    reviewed_on: 2026-08-28

  gtps_exercise_first_line:
    evidence_ids: [gtps_exercise_sr_2024, gluteal_tendinopathy_sr_2025]
    applicable_route_evidence_profile_ids: [rep_gtps_gluteal_tendinopathy_v1]
    applicable_route_ids: [greater_trochanteric_lateral_hip_pain_pathway]
    applicable_subtype_ids: [formal_gtps_diagnosis, formal_gluteal_tendinopathy_diagnosis]
    domain: core_rehabilitation
    claim_summary: For clinically diagnosed GTPS or gluteal tendinopathy, exercise is supported as first-line/core care and exercise plus education improves pain/function compared with minimal intervention.
    recommendation_direction: recommend
    output_scope: referral_core
    certainty_optional: moderate
    reviewed_on: 2026-08-28

  gtps_no_bursitis_extrapolation:
    evidence_ids: [gtps_exercise_sr_2024, gluteal_tendinopathy_sr_2025]
    applicable_route_evidence_profile_ids: [rep_gtps_gluteal_tendinopathy_v1]
    applicable_route_ids: [greater_trochanteric_lateral_hip_pain_pathway]
    domain: diagnostic_definition
    claim_summary: Exercise evidence synthesized for GTPS/gluteal tendinopathy must not be silently treated as subtype-specific authority for isolated formal trochanteric bursitis or another established greater-trochanteric disorder without applicability review.
    recommendation_direction: context_only
    output_scope: clinician_ui_only
    certainty_optional: not_applicable
    reviewed_on: 2026-08-28

  acute_meniscus_PT_may_benefit_nondisplaced_nonoperative:
    evidence_ids: [aaos_acute_isolated_meniscus_2024]
    applicable_route_evidence_profile_ids: [rep_acute_isolated_meniscus_nonoperative_v1]
    applicable_route_ids: [acute_isolated_meniscal_injury_nonoperative]
    domain: core_rehabilitation
    claim_summary: Physical therapy/rehabilitation may benefit acute non-displaced isolated meniscal tears being managed nonoperatively, but this AAOS statement is consensus/clinical opinion rather than a high-strength evidence-based sequence.
    recommendation_direction: may_consider
    output_scope: referral_core
    certainty_optional: low
    applicability_conditions: [acute_isolated_nondisplaced_not_repair_candidate_nonoperative]
    reviewed_on: 2026-08-28

  acute_meniscus_displaced_ROM_block_early_surgical_context:
    evidence_ids: [aaos_acute_isolated_meniscus_2024]
    applicable_route_evidence_profile_ids: [rep_acute_isolated_meniscus_nonoperative_v1]
    applicable_route_ids: [acute_isolated_meniscal_injury_nonoperative]
    domain: safety
    claim_summary: A displaced or displacing acute meniscal tear restricting knee range of motion may benefit from early surgical intervention and should not be silently routed into unrestricted routine rehabilitation.
    recommendation_direction: context_only
    output_scope: clinician_ui_only
    certainty_optional: low
    reviewed_on: 2026-08-28

  anterior_shoulder_instability_RTS_criteria:
    evidence_ids: [traumatic_anterior_shoulder_instability_esska_esa_2026]
    applicable_route_evidence_profile_ids: [rep_shoulder_instability_anterior_traumatic_v1]
    applicable_route_ids: [glenohumeral_instability_dislocation]
    domain: progression_criteria
    claim_summary: In traumatic anterior shoulder instability, return-to-sport decisions should consider pain-free full ROM, shoulder stability, strength and sport-specific readiness rather than elapsed time alone.
    recommendation_direction: recommend
    output_scope: referral_core
    certainty_optional: not_graded
    applicability_conditions: [traumatic_anterior_instability_return_to_sport]
    reviewed_on: 2026-08-28

  posterior_shoulder_instability_RTS_criteria:
    evidence_ids: [posterior_shoulder_instability_consensus_2025]
    applicable_route_evidence_profile_ids: [rep_shoulder_instability_posterior_v1]
    applicable_route_ids: [glenohumeral_instability_dislocation]
    domain: progression_criteria
    claim_summary: For posterior instability return to play, expert consensus supports restoration of strength, ROM, proprioception, sport-specific skills and absence of symptoms; no minimum time point alone is required.
    recommendation_direction: recommend
    output_scope: referral_core
    certainty_optional: very_low
    applicability_conditions: [posterior_instability_return_to_play]
    reviewed_on: 2026-08-28

  adhesive_capsulitis_exercise_and_mobilization:
    evidence_ids: [adhesive_capsulitis_exercise_mobilization_sr_2023]
    applicable_route_evidence_profile_ids: [rep_adhesive_capsulitis_v1]
    applicable_route_ids: [adhesive_capsulitis_frozen_shoulder]
    domain: core_rehabilitation
    claim_summary: Exercise and exercise combined with joint mobilization improve ROM and subjective outcomes in adhesive capsulitis, but intervention intensity should be individualized to patient symptoms and ROM rather than a fixed stage/timeline.
    recommendation_direction: consider
    output_scope: referral_core
    certainty_optional: low
    reviewed_on: 2026-08-28

