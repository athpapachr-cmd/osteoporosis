    thumb_mcp_collateral_ligament_injury_rehabilitation: {status: pending, structural_restrictions_apply: true}
    sagittal_band_injury_extensor_tendon_instability: {status: pending, structural_restrictions_apply: true}
    digital_tendon_injury_rehabilitation: {status: pending, material_subtype_or_protocol_split_required: true}
    post_traumatic_wrist_hand_pain_stiffness: {status: pending}
    postoperative_wrist_hand_rehabilitation: {status: pending, material_subtype_or_protocol_split_required: true}

  knee:
    knee_osteoarthritis: {status: pending}
    degenerative_meniscal_lesion_conservative_rehabilitation: {status: pending}
    acute_isolated_meniscal_injury_nonoperative: {status: pending}
    patellofemoral_pain: {status: pending}
    patellar_tendinopathy: {status: pending}
    quadriceps_tendinopathy: {status: pending}
