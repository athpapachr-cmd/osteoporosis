    mechanical_metatarsalgia_forefoot_overload: {status: pending}
    post_traumatic_ankle_foot_pain_stiffness: {status: pending}

shared_owners:
  fracture_rehabilitation_post_immobilization:
    profile_id: shared_fracture
    status: pending
    note: evidence_sequence_must_remain_subordinate_to_healing_weight_bearing_rom_and_written_orthopaedic_restrictions
  acute_muscle_myotendinous_injury_rehabilitation:
    profile_id: shared_muscle_myotendinous
    status: pending
  functional_deconditioning_balance_gait_rehabilitation:
    profile_id: shared_deconditioning_balance_gait
    status: pending

readiness_gate:
  runtime_evidence_aware_generation: blocked
  requirements:
    - all_routine_routes_and_material_subtypes_have_applicable_profiles
    - all_routine_route_variants_have_complete_sequences_or_explicit_blocked_evidence_gap_with_safe_noninvented_output
    - all_profile_sources_current_or_reviewed
    - all_rendered_recommendations_traceable_to_active_applicable_claims
    - no_route_level_source_is_applied_to_a_noncovered_subtype
    - exact_design_completeness_review_passed
