version: cu1_evidence_coverage_matrix_v1
status: design_candidate
runtime_authorized: false
source_registry: cu1_registry_v1.yaml
coverage_rule: every_routine_route_and_material_subtype_requires_current_applicable_evidence_profile_and_complete_rehabilitation_sequence

status_values:
  - pending
  - evidence_seeded
  - profile_complete
  - sequence_complete
  - ready_for_review
  - blocked_evidence_gap

profiles:
  cervical:
    nonspecific_neck_pain: {status: pending}
    neck_pain_with_radiating_upper_limb_symptoms: {status: pending}
    headache_with_cervical_msk_features: {status: pending}
    cervical_dizziness_presentation: {status: pending}
    post_traumatic_neck_pain: {status: pending}

  lumbar:
    nonspecific_low_back_pain: {status: evidence_seeded, sequence_status: pending}
    low_back_pain_with_radiating_leg_symptoms: {status: evidence_seeded, sequence_status: pending}
    lumbar_spinal_stenosis_neurogenic_claudication: {status: pending}
    deep_gluteal_piriformis_presentation: {status: evidence_seeded, sequence_status: blocked_evidence_gap}

  shoulder:
    rotator_cuff_related_shoulder_pain: {status: pending}
    confirmed_full_thickness_rotator_cuff_tear_nonoperative: {status: pending}
    calcific_rotator_cuff_tendinopathy: {status: pending}
    adhesive_capsulitis_frozen_shoulder: {status: pending}
    glenohumeral_instability_dislocation: {status: pending}
    glenohumeral_osteoarthritis: {status: pending}
    post_traumatic_shoulder_pain: {status: pending}
    acromioclavicular_joint_disorder: {status: pending}
    sternoclavicular_joint_disorder: {status: pending}
    postoperative_shoulder_rehabilitation: {status: pending, material_subtype_or_protocol_split_required: true}

  elbow:
    lateral_elbow_tendinopathy: {status: evidence_seeded, sequence_status: pending}
    medial_elbow_tendinopathy: {status: pending}
    ulnar_neuropathy_at_elbow: {status: pending}
    posterior_interosseous_nerve_supinator_syndrome: {status: pending}
    distal_biceps_tendon_disorder_nonoperative: {status: pending}
    elbow_osteoarthritis_degenerative_stiffness: {status: pending}
    elbow_ligament_instability_rehabilitation: {status: pending}
    post_traumatic_elbow_pain_stiffness: {status: pending}

  wrist_hand:
    de_quervain_first_dorsal_compartment_disorder: {status: pending}
    thumb_cmc1_osteoarthritis: {status: pending}
    interphalangeal_hand_osteoarthritis: {status: pending}
    median_neuropathy_at_wrist_carpal_tunnel: {status: pending}
    ulnar_sided_wrist_tfcc_presentation: {status: pending}
