version: cu1_evidence_coverage_matrix_v1_1
status: active_route_by_route_work_queue
runtime_authorized: false
route_registry: cu1_registry_v1.yaml
evidence_registry: cu1_evidence_registry_v1.yaml
normative_schema: cu1_history_timeline_schema_v1.yaml
coverage_rule: every_routine_route_and_material_subtype_requires_unique_current_applicable_evidence_profile_and_complete_element_traceable_rehabilitation_sequence_or_explicit_blocked_evidence_gap

status_values:
  - pending
  - evidence_seeded
  - profile_curated
  - sequence_incomplete
  - sequence_complete
  - ready_for_review
  - blocked_evidence_gap

object_contract_status:
  referral_history_v2: frozen_v1_1
  rehabilitation_sequence_v1: frozen_v1_1
  rehabilitation_phase_v1: frozen_v1_1
  goal_plan_v2: frozen_v1_1
  reassessment_plan_v2: frozen_v1_1
  evidence_source_v1: frozen_v1_1
  evidence_claim_v1: frozen_v1_1
  route_evidence_profile_v1: frozen_v1_1
  element_level_provenance_required: true
  patient_specific_protocol_override_modeled: true
  clinician_modification_distinct_from_evidence: true

