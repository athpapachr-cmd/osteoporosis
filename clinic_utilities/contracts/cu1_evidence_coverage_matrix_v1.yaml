research_queue_priority:
  rationale: prioritize_high_frequency_routes_with_current_route_specific_CPGs_or_high_quality_guidelines_before_weaker_long_tail_routes
  next:
    - lateral_ankle_sprain_rehabilitation
    - plantar_heel_pain_plantar_fasciitis
    - rotator_cuff_related_shoulder_pain
    - knee_osteoarthritis
    - patellofemoral_pain
    - median_neuropathy_at_wrist_carpal_tunnel
    - de_quervain_first_dorsal_compartment_disorder
    - lumbar_spinal_stenosis_neurogenic_claudication
  then: remaining_routine_routes_in_registry_order

readiness_gate:
  runtime_evidence_aware_generation: blocked
  object_semantics_gate: passed_for_v1_1_design
  route_coverage_gate: failed
  exact_design_completeness_review: not_yet_authorized_to_pass
  requirements:
    - all_routine_routes_and_material_subtypes_have_unique_applicable_route_evidence_profiles
    - all_nonblocked_routine_route_variants_have_complete_sequences
    - every_evidence_derived_rendered_phase_objective_intervention_progression_precaution_and_reassessment_element_is_traceable_to_active_applicable_claim
    - patient_specific_protocol_overrides_are_machine_distinct_from_literature_authority
    - all_profile_sources_current_or_explicitly_reviewed
    - evidence_gaps_and_conflicts_are_explicit
    - no_route_level_source_is_applied_to_a_noncovered_subtype
    - route_specific_history_prompts_are_defined
    - synthetic_composition_and_evidence_fixtures_pass
    - exact_design_completeness_review_passed
