    pes_anserine_region_pain_or_tendinobursitis: {status: pending}
    post_traumatic_knee_pain_stiffness: {status: pending}
    postoperative_knee_rehabilitation: {status: pending, material_subtype_or_protocol_split_required: true}

  hip_groin:
    greater_trochanteric_lateral_hip_pain_pathway: {status: pending, material_subtype_split_review_required: true}
    nonarthritic_intraarticular_hip_pain: {status: pending, material_subtype_split_review_required: true}
    adductor_related_groin_pain: {status: pending}
    post_traumatic_hip_groin_pain_stiffness: {status: pending}

  ankle_foot:
    lateral_ankle_sprain_rehabilitation: {status: pending}
    achilles_tendinopathy:
      status: pending
      variants:
        midportion_achilles_tendinopathy: {status: evidence_seeded, sequence_status: pending}
        insertional_achilles_tendinopathy: {status: blocked_evidence_gap, sequence_status: pending}
