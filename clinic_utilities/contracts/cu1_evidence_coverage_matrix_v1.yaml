integration_state:
  canonical_registry_complete: false
  staged_tranche2_requires_consolidation_before_design_complete: true
  fixtures_catalog_created: true
  route_specific_history_prompt_catalog_complete: false

readiness_gate:
  runtime_evidence_aware_generation: blocked
  object_semantics_gate: passed_for_v1_1_design
  route_coverage_gate: failed
  integration_gate: failed
  exact_design_completeness_review: not_yet_passed
  requirements:
    - all_routine_routes_and_material_subtypes_have_unique_applicable_route_evidence_profiles
    - all_nonblocked_routine_route_variants_have_complete_sequences_or_a_reviewed_safe_evidence_gap_behavior
    - every_evidence_derived_rendered_phase_objective_intervention_progression_precaution_and_reassessment_element_is_traceable_to_active_applicable_claim
    - patient_specific_protocol_overrides_are_machine_distinct_from_literature_authority
    - all_profile_sources_current_or_explicitly_reviewed
    - evidence_gaps_and_conflicts_are_explicit
    - no_route_level_source_is_applied_to_a_noncovered_subtype
    - route_specific_history_prompts_are_defined
    - staged_evidence_is_consolidated_into_the_canonical_registry_or_a_reviewed_manifested_shard_architecture
    - synthetic_composition_and_evidence_fixtures_pass_exact_review
    - exact_design_completeness_review_passed
