rehabilitation_sequences:
  seq_lateral_ankle_sprain_v1:
    route_id: lateral_ankle_sprain_rehabilitation
    route_evidence_profile_id: rep_lateral_ankle_sprain_v1
    status: ready_for_exact_review
    phases:
      - phase_id: las_protection_optimal_loading
        order: 1
        clinical_objective: restore safe supported weight bearing, pain-free mobility and early neuromuscular control according to injury severity and healing status
        objective_authority: {authority_type: evidence_claim, evidence_claim_ids: [las_external_support_progressive_weight_bearing, las_structured_exercise]}
        intervention_directions:
          - {intervention_direction_id: las_supported_progressive_weight_bearing, statement: progressively restore weight bearing with external support selected to severity and protection needs, authority: {authority_type: evidence_claim, evidence_claim_ids: [las_external_support_progressive_weight_bearing]}}
          - {intervention_direction_id: las_structured_therapeutic_exercise, statement: use protected ROM plus impairment-specific neuromuscular and balance exercise, authority: {authority_type: evidence_claim, evidence_claim_ids: [las_structured_exercise]}}
        progression_criteria:
          - {criterion_id: las_ready_for_higher_function_measurement, criterion_kind: progression, statement: advance functional loading when activity measures can be performed safely and objective functional recovery can be reassessed, authority: {authority_type: evidence_claim, evidence_claim_ids: [las_function_measure_progression]}}
        precautions_or_do_not_progress_criteria: []
        strength_optional: A
        certainty_optional: not_graded
        required_for_route: true
      - phase_id: las_function_work_sport_return
        order: 2
        clinical_objective: restore activity and participation demands for work or sport while monitoring objective functional recovery
        objective_authority: {authority_type: evidence_claim, evidence_claim_ids: [las_return_work_sport_training, las_function_measure_progression]}
        intervention_directions:
          - {intervention_direction_id: las_work_sport_specific_training, statement: use occupational or sport-related training matched to residual participation restrictions, authority: {authority_type: evidence_claim, evidence_claim_ids: [las_return_work_sport_training]}}
        progression_criteria:
          - {criterion_id: las_functional_measures_support_progression, criterion_kind: progression, statement: base further return progression on repeated objective activity/participation measures and appropriate functional tests rather than elapsed time alone, authority: {authority_type: evidence_claim, evidence_claim_ids: [las_function_measure_progression]}}
        precautions_or_do_not_progress_criteria: []
        strength_optional: B
        certainty_optional: not_graded
        required_for_route: true

  seq_plantar_heel_pain_v1:
    route_id: plantar_heel_pain_plantar_fasciitis
    route_evidence_profile_id: rep_plantar_heel_pain_v1
    status: evidence_bounded_single_phase_pending_progression_semantics
    phases:
      - phase_id: plantar_active_multimodal_rehabilitation
        order: 1
        clinical_objective: reduce pain and improve standing/walking function through active and impairment-specific plantar-heel rehabilitation
        objective_authority: {authority_type: evidence_claim, evidence_claim_ids: [plantar_fascia_stretch_core, plantar_foot_ankle_resistance]}
        intervention_directions:
          - {intervention_direction_id: plantar_specific_stretching, statement: use plantar-fascia-specific and calf stretching as clinically indicated, authority: {authority_type: evidence_claim, evidence_claim_ids: [plantar_fascia_stretch_core]}}
          - {intervention_direction_id: plantar_foot_ankle_resistance, statement: include foot/ankle resistance exercise, authority: {authority_type: evidence_claim, evidence_claim_ids: [plantar_foot_ankle_resistance]}}
          - {intervention_direction_id: plantar_taping_optional, statement: taping may be used as a short-term adjunct with active care, authority: {authority_type: evidence_claim, evidence_claim_ids: [plantar_taping_short_term_adjunct]}}
        progression_criteria: []
        precautions_or_do_not_progress_criteria: []
        strength_optional: null
        certainty_optional: not_graded
        required_for_route: true
    missing_before_freeze: [evidence_supported_phase_transition_or_explicit_one_phase_completion_rule]

  seq_rotator_cuff_related_pain_v1:
    route_id: rotator_cuff_related_shoulder_pain
    route_evidence_profile_id: rep_rotator_cuff_related_pain_v1
    status: ready_for_exact_review
    phases:
      - phase_id: rc_active_rehabilitation
        order: 1
        clinical_objective: reduce pain/disability and restore shoulder load tolerance through individualized active rehabilitation and self-management
        objective_authority: {authority_type: evidence_claim, evidence_claim_ids: [rc_active_rehabilitation_core, rc_patient_centered_education]}
        intervention_directions:
          - {intervention_direction_id: rc_motor_control_resistance_rehab, statement: use an individualized active program that may include motor-control and/or resistance exercise with appropriate loads, authority: {authority_type: evidence_claim, evidence_claim_ids: [rc_active_rehabilitation_core]}}
          - {intervention_direction_id: rc_education_self_management, statement: provide individualized education, activity modification and self-management support, authority: {authority_type: evidence_claim, evidence_claim_ids: [rc_patient_centered_education]}}
        progression_criteria: []
        precautions_or_do_not_progress_criteria: []
        strength_optional: A
        certainty_optional: not_graded
        required_for_route: true
      - phase_id: rc_return_to_sport_when_applicable
        order: 2
        clinical_objective: restore sport-specific shoulder capacity and load tolerance when return to sport is a patient goal
        objective_authority: {authority_type: evidence_claim, evidence_claim_ids: [rc_return_sport_capacity_load_tolerance]}
        intervention_directions: []
        progression_criteria:
          - {criterion_id: rc_rts_capacity_and_function_measures, criterion_kind: progression, statement: guide return using rotator-cuff/shoulder capacity and load tolerance together with patient-rated and functional performance measures, authority: {authority_type: evidence_claim, evidence_claim_ids: [rc_return_sport_capacity_load_tolerance]}}
        precautions_or_do_not_progress_criteria: []
        strength_optional: F
        certainty_optional: not_graded
        required_for_route: false
        applicability_conditions_optional: [athletic_return_to_sport_goal]

  seq_knee_oa_v1:
    route_id: knee_osteoarthritis
    route_evidence_profile_id: rep_knee_oa_v1
    status: evidence_bounded_single_phase_pending_progression_semantics
    phases:
      - phase_id: knee_oa_active_self_management
        order: 1
        clinical_objective: improve pain and function through individualized exercise, education and self-management
        objective_authority: {authority_type: evidence_claim, evidence_claim_ids: [knee_oa_exercise_core, knee_oa_self_management_education]}
        intervention_directions:
          - {intervention_direction_id: knee_oa_exercise, statement: use supervised, unsupervised and/or aquatic exercise according to individual needs and access, authority: {authority_type: evidence_claim, evidence_claim_ids: [knee_oa_exercise_core]}}
          - {intervention_direction_id: knee_oa_education_self_management, statement: integrate patient education and self-management support, authority: {authority_type: evidence_claim, evidence_claim_ids: [knee_oa_self_management_education]}}
          - {intervention_direction_id: knee_oa_neuromuscular_when_relevant, statement: neuromuscular balance/agility/coordination work may supplement traditional exercise when functional deficits warrant it, authority: {authority_type: evidence_claim, evidence_claim_ids: [knee_oa_neuromuscular_adjunct]}}
        progression_criteria: []
        precautions_or_do_not_progress_criteria: []
        strength_optional: strong_AAOS
        certainty_optional: not_graded
        required_for_route: true
    missing_before_freeze: [evidence_supported_phase_transition_or_explicit_one_phase_completion_rule]

  seq_patellofemoral_pain_v1:
    route_id: patellofemoral_pain
    route_evidence_profile_id: rep_patellofemoral_pain_v1
    status: sequence_incomplete_exact_transition_criteria
    phases:
      - phase_id: pfp_combined_exercise_core
        order: 1
        clinical_objective: reduce patellofemoral pain and improve function using combined hip- and knee-targeted exercise with load-management education
        objective_authority: {authority_type: evidence_claim, evidence_claim_ids: [pfp_combined_hip_knee_exercise, pfp_load_management_education]}
        intervention_directions:
          - {intervention_direction_id: pfp_hip_knee_exercise, statement: use combined posterolateral-hip and knee-targeted exercise; early hip emphasis may be considered while retaining combined rehabilitation as the overall strategy, authority: {authority_type: evidence_claim, evidence_claim_ids: [pfp_combined_hip_knee_exercise]}}
          - {intervention_direction_id: pfp_load_management, statement: include individualized load-management and active-treatment adherence education, authority: {authority_type: evidence_claim, evidence_claim_ids: [pfp_load_management_education]}}
        progression_criteria: []
        precautions_or_do_not_progress_criteria: []
        strength_optional: A
        certainty_optional: not_graded
        required_for_route: true
      - phase_id: pfp_running_specific_when_applicable
        order: 2
        clinical_objective: address running-specific contributors when running is a relevant patient goal
        objective_authority: {authority_type: evidence_claim, evidence_claim_ids: [pfp_running_gait_retraining]}
        intervention_directions:
          - {intervention_direction_id: pfp_running_gait_retraining, statement: gait retraining may be used for runners when clinically applicable, authority: {authority_type: evidence_claim, evidence_claim_ids: [pfp_running_gait_retraining]}}
        progression_criteria: []
        precautions_or_do_not_progress_criteria: []
        strength_optional: C
        certainty_optional: not_graded
        required_for_route: false
        applicability_conditions_optional: [runner_with_patellofemoral_pain]
    missing_before_freeze: [evidence_linked_transition_criterion_to_running_specific_phase]

  seq_lumbar_stenosis_claudication_v1:
    route_id: lumbar_spinal_stenosis_neurogenic_claudication
    route_evidence_profile_id: rep_lumbar_stenosis_claudication_v1
    status: evidence_bounded_single_phase_pending_progression_semantics
    phases:
      - phase_id: lss_multimodal_conservative_rehab
        order: 1
        clinical_objective: improve walking/function using individualized multimodal nonpharmacological care while preserving conditional evidence language
        objective_authority: {authority_type: evidence_claim, evidence_claim_ids: [lss_multimodal_nonpharmacological_care, lss_no_false_strong_recommendation]}
        intervention_directions:
          - {intervention_direction_id: lss_multimodal_rehab, statement: consider education/advice and rehabilitation combining exercise with manual therapy and/or behavioral/lifestyle strategies according to presentation, authority: {authority_type: evidence_claim, evidence_claim_ids: [lss_multimodal_nonpharmacological_care]}}
        progression_criteria: []
        precautions_or_do_not_progress_criteria: []
        strength_optional: conditional_weak
        certainty_optional: moderate
        required_for_route: true
    missing_before_freeze: [evidence_supported_progression_criteria, explicit_neurological_escalation_claims_from_route_specific_authority]

