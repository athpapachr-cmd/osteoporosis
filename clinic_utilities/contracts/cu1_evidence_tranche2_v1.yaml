claims:
  las_external_support_progressive_weight_bearing:
    applicable_route_evidence_profile_ids: [rep_lateral_ankle_sprain_v1]
    applicable_route_ids: [lateral_ankle_sprain_rehabilitation]
    evidence_ids: [lateral_ankle_las_cpg_2021]
    domain: core_rehabilitation
    claim_summary: Acute lateral ankle sprain rehabilitation should use external support selected according to severity/healing/protection needs and progressively restore weight bearing.
    recommendation_direction: recommend
    output_scope: referral_core
    strength_optional: A
    certainty_optional: not_graded
    reviewed_on: 2026-08-28

  las_structured_exercise:
    applicable_route_evidence_profile_ids: [rep_lateral_ankle_sprain_v1]
    applicable_route_ids: [lateral_ankle_sprain_rehabilitation]
    evidence_ids: [lateral_ankle_las_cpg_2021]
    domain: core_rehabilitation
    claim_summary: Structured exercise may include protected active ROM, stretching, neuromuscular training, postural re-education and balance training, individualized to injury severity and identified impairments.
    recommendation_direction: recommend
    output_scope: referral_core
    strength_optional: A
    certainty_optional: not_graded
    reviewed_on: 2026-08-28

  las_function_measure_progression:
    applicable_route_evidence_profile_ids: [rep_lateral_ankle_sprain_v1]
    applicable_route_ids: [lateral_ankle_sprain_rehabilitation]
    evidence_ids: [lateral_ankle_las_cpg_2021]
    domain: progression_criteria
    claim_summary: Repeated objective activity/participation measures should guide recovery assessment; timed single-limb hopping is included when appropriate and safe after suitable progression.
    recommendation_direction: recommend
    output_scope: referral_core
    strength_optional: B
    certainty_optional: not_graded
    reviewed_on: 2026-08-28

  las_return_work_sport_training:
    applicable_route_evidence_profile_ids: [rep_lateral_ankle_sprain_v1]
    applicable_route_ids: [lateral_ankle_sprain_rehabilitation]
    evidence_ids: [lateral_ankle_las_cpg_2021]
    domain: rehab_phase
    claim_summary: Occupational/sport-related training and a graded return-to-work or sport plan should address remaining activity and participation restrictions after lateral ankle sprain.
    recommendation_direction: recommend
    output_scope: referral_core
    strength_optional: B
    certainty_optional: not_graded
    reviewed_on: 2026-08-28

  plantar_fascia_stretch_core:
    applicable_route_evidence_profile_ids: [rep_plantar_heel_pain_v1]
    applicable_route_ids: [plantar_heel_pain_plantar_fasciitis]
    evidence_ids: [plantar_fasciitis_cpg_2023]
    domain: core_rehabilitation
    claim_summary: Plantar-fascia-specific and gastrocnemius/soleus stretching are recommended exercise components for plantar heel pain/plantar fasciitis.
    recommendation_direction: recommend
    output_scope: referral_core
    strength_optional: A
    certainty_optional: not_graded
    reviewed_on: 2026-08-28

  plantar_foot_ankle_resistance:
    applicable_route_evidence_profile_ids: [rep_plantar_heel_pain_v1]
    applicable_route_ids: [plantar_heel_pain_plantar_fasciitis]
    evidence_ids: [plantar_fasciitis_cpg_2023]
    domain: core_rehabilitation
    claim_summary: Resistance training for foot and ankle musculature may be included in rehabilitation.
    recommendation_direction: recommend
    output_scope: referral_core
    strength_optional: B
    certainty_optional: not_graded
    reviewed_on: 2026-08-28

  plantar_taping_short_term_adjunct:
    applicable_route_evidence_profile_ids: [rep_plantar_heel_pain_v1]
    applicable_route_ids: [plantar_heel_pain_plantar_fasciitis]
    evidence_ids: [plantar_fasciitis_cpg_2023]
    domain: adjunct
    claim_summary: Rigid or elastic foot taping can be used with other physiotherapy treatment for short-term improvement in pain and function.
    recommendation_direction: recommend
    output_scope: referral_core
    strength_optional: A
    certainty_optional: not_graded
    reviewed_on: 2026-08-28

  plantar_orthosis_not_standalone:
    applicable_route_evidence_profile_ids: [rep_plantar_heel_pain_v1]
    applicable_route_ids: [plantar_heel_pain_plantar_fasciitis]
    evidence_ids: [plantar_fasciitis_cpg_2023]
    domain: adjunct
    claim_summary: Foot orthoses should not be represented as isolated treatment; they may be combined with other treatment when selected.
    recommendation_direction: consider
    output_scope: clinician_ui_only
    strength_optional: B_and_C
    certainty_optional: not_graded
    reviewed_on: 2026-08-28

  plantar_night_splint_execution_detail:
    applicable_route_evidence_profile_ids: [rep_plantar_heel_pain_v1]
    applicable_route_ids: [plantar_heel_pain_plantar_fasciitis]
    evidence_ids: [plantar_fasciitis_cpg_2023]
    domain: execution_detail
    claim_summary: Night splint treatment is recommended for persistent first-step morning pain; the CPG specifies a 1-3 month program.
    recommendation_direction: recommend
    output_scope: therapist_execution_detail
    strength_optional: A
    certainty_optional: not_graded
    reviewed_on: 2026-08-28

  rc_patient_centered_education:
    applicable_route_evidence_profile_ids: [rep_rotator_cuff_related_pain_v1]
    applicable_route_ids: [rotator_cuff_related_shoulder_pain]
    evidence_ids: [rotator_cuff_tendinopathy_cpg_2025]
    domain: core_rehabilitation
    claim_summary: Provide individualized education about the condition, pain-management options, activity modification and self-management while considering goals, beliefs and psychosocial context.
    recommendation_direction: recommend
    output_scope: referral_core
    strength_optional: C
    certainty_optional: not_graded
    reviewed_on: 2026-08-28

  rc_active_rehabilitation_core:
    applicable_route_evidence_profile_ids: [rep_rotator_cuff_related_pain_v1]
    applicable_route_ids: [rotator_cuff_related_shoulder_pain]
    evidence_ids: [rotator_cuff_tendinopathy_cpg_2025]
    domain: core_rehabilitation
    claim_summary: An active rehabilitation program including motor-control and/or resistance exercise with individualized loads is recommended as initial treatment.
    recommendation_direction: recommend
    output_scope: referral_core
    strength_optional: A
    certainty_optional: not_graded
    reviewed_on: 2026-08-28

  rc_return_sport_capacity_load_tolerance:
    applicable_route_evidence_profile_ids: [rep_rotator_cuff_related_pain_v1]
    applicable_route_ids: [rotator_cuff_related_shoulder_pain]
    evidence_ids: [rotator_cuff_tendinopathy_cpg_2025]
    domain: progression_criteria
    claim_summary: For athletes, rotator-cuff and associated shoulder capacity/load tolerance plus patient-rated and functional performance measures may guide the return-to-sport continuum.
    recommendation_direction: may_consider
    output_scope: referral_core
    strength_optional: F
    certainty_optional: not_graded
    applicability_conditions: [athletic_return_to_sport_goal]
    reviewed_on: 2026-08-28

  rc_persistent_severe_reassessment:
    applicable_route_evidence_profile_ids: [rep_rotator_cuff_related_pain_v1]
    applicable_route_ids: [rotator_cuff_related_shoulder_pain]
    evidence_ids: [rotator_cuff_tendinopathy_cpg_2025]
    domain: safety
    claim_summary: Severe persistent pain and/or disability despite an adequate nonsurgical-care trial warrants specialist reassessment; the CPG specifies a maximum 12-week adequate-care threshold for this referral recommendation.
    recommendation_direction: recommend
    output_scope: clinician_ui_only
    strength_optional: not_copied
    certainty_optional: not_graded
    reviewed_on: 2026-08-28

  knee_oa_exercise_core:
    applicable_route_evidence_profile_ids: [rep_knee_oa_v1]
    applicable_route_ids: [knee_osteoarthritis]
    evidence_ids: [knee_oa_aaos_cpg_2021, knee_hip_oa_eular_2023_update]
    domain: core_rehabilitation
    claim_summary: Exercise is core nonpharmacological management for knee OA; supervised, unsupervised and aquatic exercise are preferable to no exercise for pain and function.
    recommendation_direction: recommend
    output_scope: referral_core
    strength_optional: strong_AAOS
    certainty_optional: not_graded
    reviewed_on: 2026-08-28

  knee_oa_self_management_education:
    applicable_route_evidence_profile_ids: [rep_knee_oa_v1]
    applicable_route_ids: [knee_osteoarthritis]
    evidence_ids: [knee_oa_aaos_cpg_2021, knee_hip_oa_eular_2023_update]
    domain: core_rehabilitation
    claim_summary: Self-management and patient education should accompany exercise-based care.
    recommendation_direction: recommend
    output_scope: referral_core
    strength_optional: strong_AAOS
    certainty_optional: not_graded
    reviewed_on: 2026-08-28

  knee_oa_neuromuscular_adjunct:
    applicable_route_evidence_profile_ids: [rep_knee_oa_v1]
    applicable_route_ids: [knee_osteoarthritis]
    evidence_ids: [knee_oa_aaos_cpg_2021]
    domain: adjunct
    claim_summary: Neuromuscular training involving balance, agility or coordination may be combined with traditional exercise to improve performance-based function and walking speed.
    recommendation_direction: consider
    output_scope: referral_core
    strength_optional: moderate_AAOS
    certainty_optional: not_graded
    reviewed_on: 2026-08-28

  pfp_combined_hip_knee_exercise:
    applicable_route_evidence_profile_ids: [rep_patellofemoral_pain_v1]
    applicable_route_ids: [patellofemoral_pain]
    evidence_ids: [patellofemoral_pain_cpg_2019]
    domain: core_rehabilitation
    claim_summary: Combined hip- and knee-targeted exercise is recommended to reduce pain and improve patient-reported and functional outcomes; early emphasis on hip-targeted exercise may be used, but combined treatment is preferred overall.
    recommendation_direction: recommend
    output_scope: referral_core
    strength_optional: A
    certainty_optional: not_graded
    reviewed_on: 2026-08-28

  pfp_load_management_education:
    applicable_route_evidence_profile_ids: [rep_patellofemoral_pain_v1]
    applicable_route_ids: [patellofemoral_pain]
    evidence_ids: [patellofemoral_pain_cpg_2019]
    domain: core_rehabilitation
    claim_summary: Education may address load management, adherence to active treatment, relevant biomechanics, weight management where appropriate and kinesiophobia.
    recommendation_direction: may_consider
    output_scope: referral_core
    strength_optional: F
    certainty_optional: not_graded
    reviewed_on: 2026-08-28

  pfp_running_gait_retraining:
    applicable_route_evidence_profile_ids: [rep_patellofemoral_pain_v1]
    applicable_route_ids: [patellofemoral_pain]
    evidence_ids: [patellofemoral_pain_cpg_2019]
    domain: adjunct
    claim_summary: For runners, gait retraining may be used when clinically applicable.
    recommendation_direction: may_consider
    output_scope: referral_core
    strength_optional: C
    certainty_optional: not_graded
    applicability_conditions: [runner_with_patellofemoral_pain]
    reviewed_on: 2026-08-28

  lss_multimodal_nonpharmacological_care:
    applicable_route_evidence_profile_ids: [rep_lumbar_stenosis_claudication_v1]
    applicable_route_ids: [lumbar_spinal_stenosis_neurogenic_claudication]
    evidence_ids: [lss_neurogenic_claudication_cpg_2021]
    domain: core_rehabilitation
    claim_summary: For lumbar spinal stenosis causing neurogenic claudication, initial nonpharmacological multimodal care may combine education/advice/lifestyle or behavioral strategies with home exercise, manual therapy and/or rehabilitation.
    recommendation_direction: consider
    output_scope: referral_core
    strength_optional: conditional_weak
    certainty_optional: moderate
    reviewed_on: 2026-08-28

  lss_no_false_strong_recommendation:
    applicable_route_evidence_profile_ids: [rep_lumbar_stenosis_claudication_v1]
    applicable_route_ids: [lumbar_spinal_stenosis_neurogenic_claudication]
    evidence_ids: [lss_neurogenic_claudication_cpg_2021]
    domain: core_rehabilitation
    claim_summary: All overarching nonsurgical CPG recommendations are conditional/weak and must not be rendered as strong universal prescriptions.
    recommendation_direction: context_only
    output_scope: clinician_ui_only
    certainty_optional: not_graded
    reviewed_on: 2026-08-28

  cts_long_term_injection_limit:
    applicable_route_evidence_profile_ids: [rep_carpal_tunnel_v1]
    applicable_route_ids: [median_neuropathy_at_wrist_carpal_tunnel]
    evidence_ids: [carpal_tunnel_aaos_cpg_2024]
    domain: adjunct
    claim_summary: Corticosteroid injection does not provide long-term CTS improvement and should not be represented as a durable disease-modifying rehabilitation strategy.
    recommendation_direction: context_only
    output_scope: clinician_ui_only
    strength_optional: strong_AAOS
    certainty_optional: not_graded
    reviewed_on: 2026-08-28

  cts_rehab_sequence_gap:
    applicable_route_evidence_profile_ids: [rep_carpal_tunnel_v1]
    applicable_route_ids: [median_neuropathy_at_wrist_carpal_tunnel]
    evidence_ids: [carpal_tunnel_aaos_cpg_2024]
    domain: core_rehabilitation
    claim_summary: The 2024 AAOS guideline is current medical-treatment authority but does not by itself establish the exact therapist-facing criteria-based rehabilitation sequence required by CU-1.
    recommendation_direction: insufficient_evidence
    output_scope: clinician_ui_only
    certainty_optional: not_applicable
    reviewed_on: 2026-08-28

  de_quervain_injection_spica_first_line_evidence:
    applicable_route_evidence_profile_ids: [rep_de_quervain_v1]
    applicable_route_ids: [de_quervain_first_dorsal_compartment_disorder]
    evidence_ids: [de_quervain_nma_2023, de_quervain_nma_2025]
    domain: adjunct
    claim_summary: Comparative conservative evidence favors corticosteroid injection, often combined with thumb-spica immobilization; benefits of added immobilization are modest and newer evidence remains low certainty.
    recommendation_direction: consider
    output_scope: clinician_ui_only
    certainty_optional: low
    reviewed_on: 2026-08-28

  de_quervain_active_rehab_gap:
    applicable_route_evidence_profile_ids: [rep_de_quervain_v1]
    applicable_route_ids: [de_quervain_first_dorsal_compartment_disorder]
    evidence_ids: [de_quervain_nma_2025]
    domain: core_rehabilitation
    claim_summary: Current comparative evidence does not establish a sufficiently validated active progressive-loading sequence for De Quervain rehabilitation; active loading and education require further high-quality study.
    recommendation_direction: insufficient_evidence
    output_scope: clinician_ui_only
    certainty_optional: low
    reviewed_on: 2026-08-28

