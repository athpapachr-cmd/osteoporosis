version: cu1_evidence_tranche2_v1
status: staged_design_evidence_for_consolidation
runtime_authorized: false
reviewed_on: 2026-08-28
normative_schema: cu1_history_timeline_schema_v1.yaml
consolidation_target: cu1_evidence_registry_v1.yaml

purpose: >-
  Evidence curation tranche for high-frequency routine routes after the v1.1 evidence-authority
  schema freeze. This file is design evidence only and does not independently authorize runtime
  generation. Before DESIGN-COMPLETE its accepted content must be consolidated into the canonical
  evidence registry or explicitly incorporated by a reviewed registry manifest.

