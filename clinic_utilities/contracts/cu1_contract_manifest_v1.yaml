  - clinic_utilities/physio_profiles/shared_deconditioning_balance_gait_v1_1.md
normative_machine_artifacts:
  core_contract: clinic_utilities/contracts/CU1_CORE_CONTRACT_V1.md
  formatter_language_contract: clinic_utilities/contracts/CU1_FORMATTER_LANGUAGE_EL_V1.md
  referral_language_el: clinic_utilities/contracts/cu1_referral_language_el_v1.yaml
  referral_language_el_corrections: clinic_utilities/contracts/cu1_referral_language_el_corrections_v1.yaml
  route_labels_el: clinic_utilities/contracts/cu1_route_labels_el_v1.yaml
  typed_supplement: clinic_utilities/contracts/cu1_typed_supplement_v1.yaml
  route_registry: clinic_utilities/contracts/cu1_registry_v1.yaml
  route_detail_catalog: clinic_utilities/contracts/cu1_route_detail_catalog_v1.yaml
  option_and_safety_catalog: clinic_utilities/contracts/cu1_option_catalog_v1.yaml
  structured_option_scope: clinic_utilities/contracts/cu1_structured_option_scope_v1.yaml
  id_normalization: clinic_utilities/contracts/cu1_id_normalization_v1.yaml
  context_value_sets: clinic_utilities/contracts/cu1_context_value_sets_v1.yaml
  rule_catalog: clinic_utilities/contracts/cu1_rule_catalog_v1.yaml
  route_requirements: clinic_utilities/contracts/cu1_route_requirements_v1.yaml
  route_requirements_correction: clinic_utilities/contracts/cu1_route_requirements_correction_v1.yaml
  validation_error_policy: clinic_utilities/contracts/cu1_validation_error_policy_v1.yaml
  semantic_fixtures: clinic_utilities/contracts/cu1_design_fixtures_v1.yaml
  r1_r2_semantic_fixtures: clinic_utilities/contracts/cu1_r1_r2_design_fixtures_v1.yaml
precedence:
  clinical_content: frozen_profile_markdown
  machine_identity_routing_safety_formatter: normative_machine_artifacts
  formatter_language_resolution: referral_language_el_then_corrections_is_authoritative_for_generated_greek_phrases; route_labels_el_is_authoritative_for_generated_and_contract_route_display; formatter_language_contract_is_authoritative_for_short_vs_detailed_prose_structure
  typed_omission_resolution: typed_supplement_completes_core_contract_without_clinical_change
  long_tail_identity_resolution: route_detail_catalog_refines_registry_aggregate_navigation
  structured_option_boundary: structured_option_scope_defines_v1_control_coverage
  context_enum_resolution: context_value_sets_is_authoritative_for_route_context_enum_values_after_alias_normalization
  safety_trigger_resolution: rule_catalog_is_authoritative_for_machine_evaluated_trigger_expressions
  route_validation_resolution: route_requirements_is_authoritative_for_required_conditional_assertion_and_context_value_validation
  route_validation_correction_resolution: route_requirements_correction_overrides_only_its_exact_listed_paths_before_validation
  validation_behavior_resolution: validation_error_policy_is_authoritative_for_hard_block_vs_safety_managed_behavior
  semantic_fixture_resolution: r1_r2_semantic_fixtures_add_full_route_validation_and_trigger_oracles_without_reopening_clinical_taxonomy
fixture_policy:
  clinic_utilities/contracts/cu1_design_fixtures_v1.yaml:
    default_mode: partial_semantic_oracle
    meaning: omitted_fields_are_out_of_fixture_scope_and_do_not_assert_full_draft_validity
    still_normative_for: [routing, precedence, forbidden_inference, formatter_structure, safety_behavior_explicitly_named_in_fixture]
  clinic_utilities/contracts/cu1_r1_r2_design_fixtures_v1.yaml:
    default_mode: route_and_rule_validation_oracle
    meaning: route_required_conditional_context_enum_and_rule_validation_is_in_scope_for_the_fields_and_route_under_test; unrelated_core_draft_fields_may_be_omitted
  implementation_test_rule: full_runtime_validation_tests_must_construct_complete_referral_drafts_and_apply_all_normative_artifacts
conflict_rule: machine_artifact_must_not_change_clinical_meaning; if_conflict_found_block_and_replan
id_policy: lowercase_snake_case_with_explicit_aliases
normalization_order: alias_normalization_then_context_value_normalization_then_registry_and_requirement_validation
unknown_selectable_ids: invalid
unknown_context_enum_values: invalid
unknown_safety_input_flags: invalid
unknown_rule_ids: invalid
runtime_may_read_profile_markdown_for_trigger_or_validation_logic: false
runtime_may_read_profile_markdown_for_display_labels: true
profile_markdown_display_labels_are_formatter_authority: false
final_generated_referral_may_expose_machine_id: false
free_text_policy: allowed_only_in_explicit_free_text_fields
persistence: out_of_scope_for_cu1_v1
