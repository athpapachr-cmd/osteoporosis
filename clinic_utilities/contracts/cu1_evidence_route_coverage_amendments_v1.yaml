      - recurrent_instability_often_requires_surgical_management_context_and_rehabilitation_must_not_be_assumed_definitive
      - bone_loss_soft_tissue_lesions_age_and_sport_demands_materially_change_management
      - postoperative_rehabilitation_is_excluded_and_belongs_to_postoperative_shoulder_rehabilitation
