      - shoulder_instability_nonoperative_clinical_concepts_2024
    safety_claim_ids: []
    evidence_gaps:
      - nonoperative_candidate_selection_is_expert_consensus_Level_V
      - detailed_nonoperative_rehabilitation_framework_is_current_clinical_concepts_not_high_level_comparative_evidence
      - postoperative_Part_II_rehabilitation_and_RTS_consensus_is_not_nonoperative_authority
      - structural_pathology_primary_vs_recurrent_status_and_patient_preference_materially_change_management
      - no_universal_numeric_return_threshold_is_authorized

  rep_c5_whiplash_wad_v1:
    applicability_conditions_optional:
      - post_traumatic_neck_pain_selected
      - whiplash_acceleration_deceleration_context_explicit
      - whiplash_phase_recent_or_persistent_known
      - no_unresolved_fracture_dislocation_instability_or_other_material_structural_injury
      - no_unresolved_material_neurological_or_other_safety_concern
      - physiotherapy_considered_appropriate_by_clinician
    amendment_reason: >-
      The single C5 WAD sequence contains recent and persistent intervention directions with distinct
      source applicability. Temporal phase must therefore be sufficiently known before the profile can
      resolve; unknown phase must not leave the phase objective backed only by nonapplicable claims.

rehabilitation_sequence_amendments:
