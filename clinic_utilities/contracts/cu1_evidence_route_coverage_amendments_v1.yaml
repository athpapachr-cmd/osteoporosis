version: cu1_evidence_route_coverage_amendments_v1
status: reviewed_logical_registry_amendments
runtime_authorized: false
reviewed_on: 2026-08-29
review_record: clinic_utilities/contracts/CU1_ROUTE_COVERAGE_REVIEW_2026-08-29.md
applies_after:
  - core_seed_registry
  - high_frequency_tranche2
  - shoulder_hip_meniscus_tranche3
  - route_coverage_extension
  - shoulder_instability_route_coverage_extension

purpose: >-
  Narrow post-merge amendments required when route-by-route evidence review discovers that an older
  active design profile or claim is too broad, or that a newly curated object's grading needs a
  stricter evidence-preserving correction. Amendments may only narrow applicability, attach a newly
  reviewed sequence, refresh source linkage, correct grading without upgrading evidence, or suppress
  a scope-unsafe claim. They must not rewrite historical staging or promotion artifacts.

claim_amendments:
  anterior_shoulder_instability_RTS_criteria:
    applicable_route_ids: [glenohumeral_instability_dislocation]
    applicable_route_evidence_profile_ids: [rep_shoulder_instability_anterior_traumatic_v1]
    applicability_conditions_optional: [traumatic_anterior_instability_conservative_return_to_sport]
    claim_summary: In conservatively treated traumatic anterior shoulder instability, return-to-sport decisions should require full pain-free range of motion, clinical stability without apprehension, adequate strength/endurance and sport-specific readiness rather than elapsed time alone.
    amendment_reason: ESSKA_ESA_Question_23_is_explicitly_conservative_treatment_RTS

  posterior_shoulder_nonoperative_indication_consensus:
    applicability_conditions_optional: [posterior_instability_with_explicit_nonoperative_management_decision]
    amendment_reason: nonoperative_consensus_must_not_be_used_before_management_context_is_explicit

  mdi_nonoperative_rehab_cautious_2024_2026:
    certainty_optional: not_graded
    amendment_reason: >-
      The rehabilitation framework is clinical-concepts guidance while the Cochrane review found no
      eligible randomized control/usual-care comparisons; assigning very_low certainty would falsely
      imply a GRADE body of comparative effect evidence.

  mdi_exercise_efficacy_uncertain_cochrane_2026:
    certainty_optional: not_applicable
    amendment_reason: Cochrane_found_no_eligible_control_RCTs_so_there_is_no_effect_estimate_to_grade

claim_suppressions:
  posterior_shoulder_instability_RTS_consensus:
    suppress_from_logical_registry_for_route_ids: [glenohumeral_instability_dislocation]
    reason: >-
      The 2025 Posterior Shoulder Instability Part II rehabilitation/return-to-play Delphi consensus
      addresses postoperative rehabilitation and return to play. The companion editorial explicitly
      notes that rehabilitation/return to play after conservative treatment was not addressed. This
      claim therefore cannot authorize generic nonoperative posterior-instability output. The source
      remains available for later postoperative_shoulder_rehabilitation curation.

