  rep_shoulder_instability_anterior_traumatic_v1:
    applicability_conditions_optional: [traumatic_anterior_instability_with_explicit_rehabilitation_pathway]
    rehabilitation_sequence_id: seq_shoulder_instability_anterior_traumatic_v1
    primary_source_ids:
