version: cu1_history_rehab_sequence_schema_v1
status: design_candidate
runtime_authorized: false

referral_history_v2:
  fields:
    onset_date_optional:
      type: date_or_null
      rule: exact_date_only_if_explicitly_known
    duration_value_optional:
      type: nonnegative_number_or_null
    duration_unit_optional:
      enum: [days, weeks, months, years]
      nullable: true
    onset_pattern:
      enum: [sudden, gradual, post_traumatic, postoperative, post_immobilization, recurrent_episode, other, not_stated]
    mechanism_or_trigger_optional:
      type: string_or_null
      rule: history_only_not_causal_diagnosis
    course:
      enum: [improving, stable, fluctuating, worsening, recurrent, not_stated]
    prior_episode_state:
      enum: [yes, no, not_stated]
    prior_treatment_summary_optional:
      type: string_or_null
    prior_treatment_response_optional:
      enum: [improved, partial_response, no_change, worse, mixed, not_stated]
      nullable: true
    relevant_investigation_summary_optional:
      type: string_or_null
    aggravating_factors_optional:
      type: list_of_strings
    easing_factors_optional:
      type: list_of_strings
    work_sport_activity_context_optional:
      type: string_or_null
    patient_priority_activity_optional:
      type: string_or_null
    route_history_items:
      type: list_of_route_history_selection
  cross_field_rules:
    - if_duration_value_present_duration_unit_required
    - onset_date_and_approximate_duration_may_coexist_only_if_both_explicitly_supplied
    - never_infer_exact_onset_date_from_duration
    - missing_history_does_not_generate_negative_history

route_history_selection:
  fields:
    history_item_id: canonical_route_history_id
    state_or_value: scalar_or_canonical_enum
    unit_optional: string_or_null
    free_text_optional: string_or_null
    source:
      enum: [clinician_entered, patient_reported, documented_record]
  rules:
    - route_history_item_must_be_allowed_for_current_route
    - not_selected_does_not_mean_absent

rehabilitation_sequence_v1:
  fields:
    route_id: canonical_route_id
    sequence_source:
      enum: [route_evidence_profile]
    phases:
      type: ordered_list_of_rehabilitation_phase_v1
    clinician_modifications_optional:
      type: list_of_strings
  rules:
    - route_must_have_its_own_evidence_profile
    - route_must_have_its_own_rehabilitation_sequence
    - generic_cross_route_sequence_is_forbidden
    - written_postoperative_or_fracture_protocol_overrides_route_sequence

rehabilitation_phase_v1:
  fields:
    phase_id: canonical_route_scoped_phase_id
    order: positive_integer
    clinical_objective: string
    intervention_direction_ids:
      type: list_of_canonical_intervention_direction_ids
    progression_criteria:
      type: list_of_criteria
    precautions_or_do_not_progress_criteria:
      type: list_of_criteria
    evidence_claim_ids:
      type: list_of_evidence_claim_ids
    strength_or_certainty_optional: string_or_null
    required_for_route: boolean
  rules:
    - every_phase_requires_at_least_one_active_route_applicable_evidence_claim
    - progression_is_criteria_based_unless_authoritative_protocol_explicitly_uses_time
    - elapsed_time_alone_does_not_advance_phase
    - unsupported_phase_is_not_rendered
    - phase_vocabulary_does_not_imply_universal_phase_order

goal_plan_v2:
  fields:
    phase_id: canonical_route_scoped_phase_id
    goal_ids:
      type: list_of_canonical_goal_ids
    patient_priority_goal_optional: string_or_null
    progression_criteria:
      type: list_of_criteria
    evidence_claim_ids:
      type: list_of_evidence_claim_ids
  rules:
    - goals_are_attached_to_rehabilitation_phases
    - goal_completion_is_not_inferred_from_elapsed_time
    - patient_priority_goal_is_never_inferred

reassessment_plan_v2:
  fields:
    phase_progression_checks:
      type: list_of_criteria
    failure_to_progress_criteria:
      type: list_of_criteria
    safety_escalation_criteria:
      type: list_of_criteria
    clinician_requested_review_optional: string_or_null
    evidence_claim_ids:
      type: list_of_evidence_claim_ids
  rules:
    - progression_review_is_criteria_triggered_by_default
    - physiotherapy_frequency_is_not_a_required_physician_output
    - total_course_duration_is_not_a_required_physician_output
    - calendar_time_may_be_used_only_for_authoritative_protocol_healing_followup_or_explicit_clinician_review
    - safety_triggered_reassessment_precedes_routine_progression

route_evidence_profile_v1:
  fields:
    profile_id: canonical_profile_id
    route_id: canonical_route_id
    diagnostic_claim_ids: list_of_evidence_claim_ids
    history_claim_ids: list_of_evidence_claim_ids
    examination_claim_ids: list_of_evidence_claim_ids
    rehabilitation_sequence_id: canonical_rehabilitation_sequence_id
    adjunct_claim_ids: list_of_evidence_claim_ids
    safety_claim_ids: list_of_evidence_claim_ids
    evidence_gaps: list_of_strings
    primary_source_ids: list_of_evidence_source_ids
    last_reviewed_on: date
    next_review_due: date
    freshness_state:
      enum: [current, review_due, stale, superseded]
  rules:
    - every_routine_route_requires_profile_before_evidence_aware_generation
    - every_rendered_recommendation_requires_active_route_applicable_claim
    - missing_evidence_is_explicit_gap_not_generic_fill
    - stale_or_superseded_profile_cannot_be_labelled_current_guideline_based

formatter_semantics:
  detailed_section_order:
    - clinical_impression_or_presentation
    - history
    - relevant_examination_findings
    - functional_impact
    - referral_request
    - staged_goals_and_progression_criteria
    - disease_specific_rehabilitation_directions
    - reassessment_or_escalation_criteria
    - evidence_basis
  short_history_rule: include_duration_and_mechanism_when_supplied_and_material
  short_rehab_rule: compress_route_specific_sequence_without_replacing_it_with_generic_goals
  empty_history_rule: omit_section
  evidence_basis_required:
    short: compact_route_specific_source_footer
    detailed: route_specific_source_section
  bibliography_source_priority:
    - current_route_specific_cpg
    - current_route_specific_systematic_review
    - high_quality_consensus_or_other_best_available_source
  no_unrelated_general_source_when_route_specific_source_exists: true
