purpose: >-
  Native schema-conformant evidence extension for neck pain with radiating upper-limb symptoms or
  radicular-type features. The route preserves subjective radiating symptoms, objective neurological
  findings and a formal cervical-radiculopathy diagnosis as distinct concepts. APTA/JOSPT 2017
  provides broad neck-pain-with-radiating-pain route authority; newer cervical-radiculopathy-specific
  synthesis is used only under its narrower applicability conditions and cannot turn every C2
  presentation into a formal radiculopathy diagnosis or a mandatory multimodal protocol.

external_source_dependencies:
  - neck_pain_apta_cpg_2017
  - nonspecific_neck_degam_awmd_2025

sources:
  cervical_radiculopathy_component_nma_2025:
    evidence_id: cervical_radiculopathy_component_nma_2025
    source_type: systematic_review
    title: What components and formats of rehabilitation interventions are more effective to reduce pain in patients with cervical radiculopathy? A systematic review and component network meta-analysis
    authors_or_organization: Nunez de Arenas-Arroyo et al.
    year_or_version: 2025
    reference: Clin Rehabil. 2025;39(10). DOI 10.1177/02692155251365193
    doi_optional: 10.1177/02692155251365193
    population_scope_optional: adults with cervical radiculopathy in randomized rehabilitation trials; search through 2025-07-01; this evidence is narrower than the full C2 symptom-presentation route
    reviewed_on: 2026-08-29
    next_review_due: 2027-08-29
    freshness_state: current
    status: active

claims:
  c2_radiating_presentation_not_formal_radiculopathy:
    claim_id: c2_radiating_presentation_not_formal_radiculopathy
    evidence_ids: [neck_pain_apta_cpg_2017]
    applicable_route_evidence_profile_ids: [rep_neck_radiating_upper_limb_v1]
    applicable_route_ids: [neck_pain_with_radiating_upper_limb_symptoms]
    domain: diagnostic_definition
    claim_summary: Neck pain with radiating arm pain, paresthesia or numbness is a clinical presentation; objective motor, sensory or reflex findings may or may not coexist, and provocation tests such as Spurling, distraction or neurodynamic testing support classification only in context rather than independently establishing a formal cervical-radiculopathy diagnosis.
    recommendation_direction: context_only
    output_scope: clinician_ui_only
    certainty_optional: not_applicable
    reviewed_on: 2026-08-29

  c2_active_rehabilitation_backbone:
    claim_id: c2_active_rehabilitation_backbone
    evidence_ids: [neck_pain_apta_cpg_2017]
    applicable_route_evidence_profile_ids: [rep_neck_radiating_upper_limb_v1]
    applicable_route_ids: [neck_pain_with_radiating_upper_limb_symptoms]
    domain: core_rehabilitation
    claim_summary: Active rehabilitation is a common component of care for neck pain with radiating pain: acute guidance includes mobilizing/stabilizing exercise and chronic guidance includes stretching/strengthening within multimodal rehabilitation, without defining one universal exercise dose or criteria-based progression threshold.
    recommendation_direction: recommend
    output_scope: referral_core
    certainty_optional: not_graded
    reviewed_on: 2026-08-29

  c2_acute_mobilizing_stabilizing_exercise_C:
    claim_id: c2_acute_mobilizing_stabilizing_exercise_C
    evidence_ids: [neck_pain_apta_cpg_2017]
    applicable_route_evidence_profile_ids: [rep_neck_radiating_upper_limb_v1]
    applicable_route_ids: [neck_pain_with_radiating_upper_limb_symptoms]
    applicability_conditions_optional: [acute_radiating_pain_presentation]
    domain: core_rehabilitation
    claim_summary: For acute neck pain with radiating pain, mobilizing and stabilizing exercises may be used; this is a Grade-C APTA recommendation and must not be relabelled as high-certainty treatment-effect evidence.
    recommendation_direction: may_consider
    output_scope: referral_core
    strength_optional: C_APTA_2017
    certainty_optional: not_graded
    reviewed_on: 2026-08-29

  c2_chronic_education_activity_B:
    claim_id: c2_chronic_education_activity_B
    evidence_ids: [neck_pain_apta_cpg_2017]
    applicable_route_evidence_profile_ids: [rep_neck_radiating_upper_limb_v1]
    applicable_route_ids: [neck_pain_with_radiating_upper_limb_symptoms]
    applicability_conditions_optional: [chronic_radiating_pain_presentation]
    domain: core_rehabilitation
    claim_summary: For chronic neck pain with radiating pain, education and counseling should encourage participation in occupational and exercise activities.
    recommendation_direction: recommend
    output_scope: referral_core
    strength_optional: B_APTA_2017
    certainty_optional: not_graded
    reviewed_on: 2026-08-29

  c2_apta_chronic_intermit_traction_B:
    claim_id: c2_apta_chronic_intermit_traction_B
    evidence_ids: [neck_pain_apta_cpg_2017]
    applicable_route_evidence_profile_ids: [rep_neck_radiating_upper_limb_v1]
    applicable_route_ids: [neck_pain_with_radiating_upper_limb_symptoms]
    applicability_conditions_optional: [chronic_radiating_pain_presentation, traction_selected_as_adjunct]
    domain: adjunct
    claim_summary: The 2017 APTA CPG recommends mechanical intermittent cervical traction for chronic neck pain with radiating pain when combined with other rehabilitation interventions; CU-1 keeps traction conditional on clinician/therapist selection rather than auto-prescribing it for every C2 referral.
    recommendation_direction: recommend
    output_scope: referral_core
    strength_optional: B_APTA_2017
    certainty_optional: not_graded
    reviewed_on: 2026-08-29

  c2_radiculopathy_nma_traction_component:
    claim_id: c2_radiculopathy_nma_traction_component
    evidence_ids: [cervical_radiculopathy_component_nma_2025]
    applicable_route_evidence_profile_ids: [rep_neck_radiating_upper_limb_v1]
    applicable_route_ids: [neck_pain_with_radiating_upper_limb_symptoms]
    applicability_conditions_optional: [formal_or_clinician_established_radicular_classification]
    domain: adjunct
    claim_summary: In a 2025 component network meta-analysis restricted to cervical radiculopathy trials, cervical traction was one component associated with pain reduction; this narrower evidence supports selective use but does not by itself authorize traction in every broad C2 symptom presentation.
    recommendation_direction: may_consider
    output_scope: clinician_ui_only
    certainty_optional: moderate_network_confidence_context
    reviewed_on: 2026-08-29

  c2_radiculopathy_nma_neurodynamic_component:
    claim_id: c2_radiculopathy_nma_neurodynamic_component
    evidence_ids: [cervical_radiculopathy_component_nma_2025]
    applicable_route_evidence_profile_ids: [rep_neck_radiating_upper_limb_v1]
    applicable_route_ids: [neck_pain_with_radiating_upper_limb_symptoms]
    applicability_conditions_optional: [formal_or_clinician_established_radicular_classification]
    domain: execution_detail
    claim_summary: Neurodynamic techniques were associated with pain reduction in the 2025 cervical-radiculopathy component network meta-analysis; exact technique selection and dosing remain therapist execution details and are not physician-mandated referral content.
    recommendation_direction: may_consider
    output_scope: therapist_execution_detail
    certainty_optional: moderate_network_confidence_context
    reviewed_on: 2026-08-29

  c2_radiculopathy_nma_articular_component:
    claim_id: c2_radiculopathy_nma_articular_component
    evidence_ids: [cervical_radiculopathy_component_nma_2025]
    applicable_route_evidence_profile_ids: [rep_neck_radiating_upper_limb_v1]
    applicable_route_ids: [neck_pain_with_radiating_upper_limb_symptoms]
    applicability_conditions_optional: [formal_or_clinician_established_radicular_classification]
    domain: execution_detail
    claim_summary: Articular/manual treatment was associated with pain reduction in the 2025 cervical-radiculopathy component network meta-analysis; this does not make one manual technique or dose mandatory.
    recommendation_direction: may_consider
    output_scope: therapist_execution_detail
    certainty_optional: moderate_network_confidence_context
    reviewed_on: 2026-08-29

  c2_nma_combination_not_mandatory_bundle:
    claim_id: c2_nma_combination_not_mandatory_bundle
    evidence_ids: [cervical_radiculopathy_component_nma_2025]
    applicable_route_evidence_profile_ids: [rep_neck_radiating_upper_limb_v1]
    applicable_route_ids: [neck_pain_with_radiating_upper_limb_symptoms]
    applicability_conditions_optional: [formal_or_clinician_established_radicular_classification]
    domain: core_rehabilitation
    claim_summary: The 2025 component network meta-analysis identified a promising combination of articular treatment, analgesic electrotherapy, neurodynamic techniques, strengthening and cervical traction for pain reduction with moderate confidence; this comparative network finding must not be converted into a mandatory physician-prescribed bundle or assumed applicable to symptom-only C2 cases.
    recommendation_direction: context_only
    output_scope: clinician_ui_only
    certainty_optional: moderate_network_confidence_context
    reviewed_on: 2026-08-29

  c2_progressive_neurological_or_cord_reassessment:
    claim_id: c2_progressive_neurological_or_cord_reassessment
    evidence_ids: [neck_pain_apta_cpg_2017, nonspecific_neck_degam_awmd_2025]
    applicable_route_evidence_profile_ids: [rep_neck_radiating_upper_limb_v1]
    applicable_route_ids: [neck_pain_with_radiating_upper_limb_symptoms]
    domain: safety
    claim_summary: New or progressive objective motor deficit, expanding sensory deficit, gait/upper-motor-neuron or possible cord features require medical reassessment rather than routine rehabilitation progression; subjective radiating symptoms alone must remain distinct from these objective safety findings.
    recommendation_direction: recommend
    output_scope: referral_core
    certainty_optional: not_applicable
    reviewed_on: 2026-08-29

