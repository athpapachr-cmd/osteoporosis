            applicability_conditions_optional: [chronic_radiating_pain_presentation]
          - intervention_direction_id: c2_selected_chronic_intermit_traction
            statement: when specifically selected for chronic radiating pain, intermittent mechanical cervical traction may be included with active/multimodal rehabilitation rather than used as isolated or universal treatment
            authority:
