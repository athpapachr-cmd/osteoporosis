rehabilitation_sequences:
  seq_lateral_elbow_evidence_bounded_v1:
    sequence_id: seq_lateral_elbow_evidence_bounded_v1
    route_id: lateral_elbow_tendinopathy
    sequence_source: route_evidence_profile
    route_evidence_profile_id: rep_lateral_elbow_tendinopathy_v1
    phases:
      - phase_id: let_irritability_guided_active_rehabilitation
        order: 1
        clinical_objective: support function and progressively restore wrist-extensor and grip load tolerance using irritability- and task-informed active rehabilitation without a fixed universal treatment schedule
        objective_authority:
          authority_type: evidence_claim
          evidence_claim_ids: [let_irritability_guided_load_management_2022]
        intervention_directions:
          - intervention_direction_id: let_education_and_load_modification
            statement: use individualized education, self-management and relevant activity/workstation/load modification to reduce unnecessary aggravating extensor load while preserving useful activity
            authority:
              authority_type: evidence_claim
              evidence_claim_ids: [let_ergonomic_education_load_modification_E_2022]
          - intervention_direction_id: let_subacute_chronic_resisted_extensor_loading
            statement: for subacute or chronic LET, use individualized resisted wrist-extensor loading that may include isometric, concentric and/or eccentric exercise without prescribing one universal dose
            authority:
              authority_type: evidence_claim
              evidence_claim_ids: [lateral_elbow_resisted_wrist_extensor_exercise]
            applicability_conditions_optional: [subacute_or_chronic_lateral_elbow_tendinopathy]
          - intervention_direction_id: let_proximal_training_if_impairment
            statement: add shoulder or scapular stabilizer training only when a relevant proximal impairment has actually been identified
            authority:
              authority_type: evidence_claim
              evidence_claim_ids: [let_proximal_strength_if_impairment_C_2022]
            applicability_conditions_optional: [actual_shoulder_or_scapular_stabilizer_impairment_identified]
          - intervention_direction_id: let_high_demand_gradual_reintroduction
            statement: when high-demand work, sport, tools, performing arts or similar requirements exist, gradually reintroduce stress, strength, endurance and motor-control demands without an invented numeric clearance threshold
            authority:
              authority_type: evidence_claim
              evidence_claim_ids: [lateral_elbow_high_demand_phased_reintroduction]
            applicability_conditions_optional: [high_demand_upper_limb_context]
        progression_criteria: []
        precautions_or_do_not_progress_criteria:
          - criterion_id: let_atypical_or_neurological_reassessment
            criterion_kind: safety_escalation
            statement: objective progressive motor deficit, substantial mechanical block, material trauma/instability concern or another atypical presentation requiring a different diagnosis/owner should trigger clinician reassessment rather than routine LET progression
            authority:
              authority_type: evidence_claim
              evidence_claim_ids: [let_atypical_differential_reassessment_2022]
        strength_optional: null
        certainty_optional: not_graded
        required_for_route: true
    clinician_modifications_optional: []
    protocol_overrides_optional: []

