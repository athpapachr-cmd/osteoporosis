version: cu1_rich_referral_migration_matrix_v1
status: active_runtime_rollout_control
runtime_authorized: true
reviewed_on: 2026-08-29
registry: clinic_utilities/contracts/cu1_registry_v1.yaml
evidence_coverage_matrix: clinic_utilities/contracts/cu1_evidence_coverage_matrix_v1.yaml
rich_content: clinic_utilities/contracts/cu1_rich_referral_content_el_v1.yaml

purpose: >-
  Exhaustive registry-level rollout control for the shared CU-1 rich referral model. Every registry
  route is classified before rich rendering. A route may render through the shared rich model only
  when this matrix marks it rich_ready or when a context-gated branch resolves to a rich-ready
  evidence context. Missing or incomplete evidence never authorizes a generic cross-route fallback.

state_values:
  - rich_ready
  - context_gated
  - evidence_limited
  - pending_evidence
  - protocol_owned

rules:
  every_registry_route_must_be_listed: true
  rich_ready_requires_applicable_structured_authority: true
  evidence_limited_is_not_generic_fallback_permission: true
  pending_evidence_is_not_generic_fallback_permission: true
  context_gated_requires_explicit_context_resolution: true
  protocol_owned_requires_patient_or_procedure_specific_restriction_precedence: true
  therapist_execution_detail_cannot_authorize_referral_prose: true
  clinician_ui_only_cannot_authorize_referral_prose: true

profiles:
  cervical:
    nonspecific_neck_pain: {state: rich_ready, evidence_profile_ids: [rep_nonspecific_neck_pain_v1]}
    neck_pain_with_radiating_upper_limb_symptoms: {state: rich_ready, evidence_profile_ids: [rep_neck_radiating_upper_limb_v1]}
    headache_with_cervical_msk_features: {state: context_gated, evidence_profile_ids: [rep_c3_cervical_headache_presentation_v1, rep_c3_formal_cervicogenic_headache_v1], reason: presentation_and_formal_CGH_authority_must_remain_distinct}
    cervical_dizziness_presentation: {state: context_gated, evidence_profile_ids: [rep_c4_cervical_dizziness_presentation_v1, rep_c4_clinician_established_cervical_dizziness_v1], reason: presentation_only_is_blocked_and_only_clinician_established_context_has_a_complete_sequence}
    post_traumatic_neck_pain: {state: context_gated, evidence_profile_ids: [rep_c5_recent_whiplash_wad_v1, rep_c5_persistent_whiplash_wad_v1, rep_c5_whiplash_phase_unresolved_v1, rep_c5_other_posttraumatic_neck_pain_v1, rep_c5_unresolved_posttraumatic_safety_v1], reason: recent_and_persistent_explicit_WAD_are_supported_but_unresolved_or_nonWAD_contexts_are_blocked}

  lumbar:
    nonspecific_low_back_pain: {state: evidence_limited, evidence_profile_ids: [rep_nonspecific_lbp_v1], reason: sequence_incomplete_no_universal_progression_semantics}
    low_back_pain_with_radiating_leg_symptoms: {state: evidence_limited, evidence_profile_ids: [rep_lbp_radiating_leg_v1], reason: acute_chronic_branching_and_progression_semantics_incomplete}
    lumbar_spinal_stenosis_neurogenic_claudication: {state: evidence_limited, evidence_profile_ids: [rep_lumbar_stenosis_claudication_v1], reason: conditional_multimodal_authority_without_complete_progression_sequence}
    deep_gluteal_piriformis_presentation: {state: evidence_limited, evidence_profile_ids: [rep_deep_gluteal_piriformis_v1], reason: low_quality_evidence_does_not_authorize_specific_sequence}

  shoulder:
    rotator_cuff_related_shoulder_pain: {state: evidence_limited, evidence_profile_ids: [rep_rotator_cuff_related_pain_v1], reason: evidence_profile_ready_for_review_but_not_yet_runtime_rich_content}
    confirmed_full_thickness_rotator_cuff_tear_nonoperative: {state: evidence_limited, evidence_profile_ids: [rep_full_thickness_cuff_nonoperative_v1], reason: PT_outcome_authority_without_universal_criteria_based_sequence}
    calcific_rotator_cuff_tendinopathy: {state: rich_ready, evidence_profile_ids: [rep_calcific_rotator_cuff_v1]}
    adhesive_capsulitis_frozen_shoulder: {state: evidence_limited, evidence_profile_ids: [rep_adhesive_capsulitis_v1], reason: selected_interventions_supported_but_no_universal_progression_sequence}
    glenohumeral_instability_dislocation: {state: context_gated, evidence_profile_ids: [rep_shoulder_instability_anterior_traumatic_v1, rep_shoulder_instability_posterior_v1, rep_shoulder_instability_anterior_atraumatic_v1, rep_shoulder_instability_multidirectional_v1], reason: direction_cause_management_context_must_be_resolved}
    glenohumeral_osteoarthritis: {state: context_gated, evidence_profile_ids: [rep_glenohumeral_oa_nonoperative_v1, rep_glenohumeral_oa_preop_TSA_v1], reason: nonoperative_and_preoperative_TSA_are_supported_but_postoperative_has_separate_owner_and_unspecified_context_blocks}
    post_traumatic_shoulder_pain: {state: pending_evidence}
    acromioclavicular_joint_disorder: {state: pending_evidence}
