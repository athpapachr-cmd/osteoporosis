<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Clinical Pending — Synthetic One-Tap</title>
<style>
  body{font-family:system-ui,-apple-system,sans-serif;background:#f7f8fa;color:#202936;margin:0;padding:24px}
  main{max-width:720px;margin:auto} h1{font-size:1.45rem;margin-bottom:.3rem}
  p{line-height:1.5} .muted{color:#697587;font-size:.92rem}
  section{background:white;border:1px solid #dce2ea;border-radius:16px;padding:20px;margin:18px 0}
  label{display:block;font-weight:650;margin-top:10px}
  input{padding:12px;border-radius:10px;border:1px solid #bac5d3;width:100%;box-sizing:border-box;margin-top:7px}
  button{padding:11px 16px;border-radius:11px;border:1px solid #acb8c8;background:#fff;cursor:pointer;margin:8px 6px 0 0;font:inherit}
  button.primary{background:#243e66;color:white;border-color:#243e66}
  button:disabled{opacity:.5;cursor:not-allowed}
  #message{min-height:1.6em} .question{font-size:1.15rem;font-weight:650}
  .row{display:flex;gap:10px;flex-wrap:wrap}.hidden{display:none}
  pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.85rem}
</style>
</head>
<body>
<main>
  <h1>Clinical Pending · One-Tap</h1>
  <p class="muted">Μόνο synthetic demo (#162). Δεν συνδέεται με πραγματικές κλινικές επιβεβαιώσεις. Η λειτουργία είναι κλειστή στην παραγωγή.</p>
  <section>
    <label for="staffKey">Κωδικός synthetic clinician</label>
    <input id="staffKey" type="password" autocomplete="off">
    <button id="signIn" type="button">Σύνδεση</button>
    <button id="signOut" type="button">Αποσύνδεση</button>
    <label for="patientId">Synthetic patient ID</label>
    <input id="patientId" autocomplete="off" placeholder="SYN-CD">
    <button id="load" class="primary" type="button">Άνοιγμα εκκρεμότητας</button>
    <p id="message" role="status" aria-live="polite"></p>
  </section>
  <section id="checkpoint" class="hidden" aria-label="Επιβεβαίωση εκκρεμότητας">
    <p class="muted" id="itemStatus"></p>
    <p class="question" id="question"></p>
    <div class="row">
      <button id="yes" class="primary" type="button">Ναι</button>
      <button id="notYet" type="button">Όχι ακόμη</button>
    </div>
    <p class="muted" id="verified"></p>
  </section>
  <section>
    <strong>Κοινή κατάσταση · Patient & Daily Brief</strong>
    <p class="muted">Οι δύο προβολές διαβάζουν το ίδιο pending ID/revision.</p>
    <pre id="comparison">Δεν έχουν φορτωθεί δεδομένα.</pre>
  </section>
</main>
<script src="/static/cockpit/pending-one-tap-synthetic.js" defer></script>
</body>
</html>
