schema: baseline_osteoporosis_audit_v1
status: draft_v1_1
module: osteoporosis
purpose: >-
  Establish a reproducible prospective baseline of real osteoporosis clinical practice
  when no reliable historical osteoporosis registry or complete visit record exists.
  The baseline must distinguish what actually happened in the consultation from what
  was documented in GeSY or captured by an AI documentation tool.
principles:
  - baseline_before_improvement_claims
  - prospective_consecutive_capture_preferred_when_historical_records_are_incomplete
  - clinical_action_and_documentation_are_separate_measurement_axes
  - clinician_validated_postvisit_capture_is_primary_baseline_source
  - gesy_is_supplementary_documentation_evidence_not_assumed_complete_clinical_truth
  - heidi_or_other_ai_capture_is_supplementary_and_must_be_clinician_reviewed
  - no_performance_feedback_during_locked_baseline_collection_except_safety_critical_signals
  - not_applicable_requires_explicit_rule
  - safety_signals_act_even_with_small_denominators
  - no_identifiable_patient_data_in_public_github
baseline_phases:
  pilot:
    target_n: 5
    design: prospective_consecutive_eligible_encounters
    purpose: >-
      Test form usability, branching, missing fields and time burden. Pilot cases are
      not included in the locked baseline because the form may still change.
    allowed_changes:
      - wording
      - field order
      - branching
      - missing required fields
    exit_gate: >-
      Freeze the case form and KPI applicability rules before starting the scored baseline.
  scored_baseline:
    target_n: 30
    design: prospective_consecutive_unique_patients
    start: after_form_freeze
    feedback_rule: >-
      Do not show KPI scores, gap coaching, targeted learning or workflow prompts until
      the baseline is locked. A safety-critical finding may still trigger immediate action.
    hawthorne_note: >-
      This is an observed prospective baseline, not a claim about completely unobserved
      historical practice. The no-feedback period reduces but cannot eliminate measurement effects.
cohorts:
  core_clinical:
    design: prospective_consecutive_unique_patients
    target_n: 30
    sampling: >-
      Starting on the declared baseline start date, capture every consecutive eligible
      osteoporosis-related encounter using the post-visit form until 30 unique patients
      are accrued. Use one index encounter per patient for the core baseline; subsequent
      encounters may contribute to continuity/safety analyses but do not duplicate the
      patient in the core denominator.
    inclusion:
      - adult encounter in which osteoporosis, osteopenia, fragility-fracture risk, or osteoporosis treatment was materially assessed or managed
      - new assessment, follow-up, post-fracture review, treatment review, or treatment transition
    exclusion:
      - purely administrative contact with no clinical osteoporosis assessment or decision
      - duplicate patient already represented in the core baseline
      - encounter outside the intended osteoporosis clinical scope
    patient_identity: >-
      Use only a local/private pseudonymous token sufficient to recognize duplicate baseline
      patients. Never commit identifiers, GeSY IDs, names or dates of birth to the public repo.
    special_populations: >-
      Include but flag patients outside a guideline framework's normal population;
      framework-specific KPIs are marked not applicable unless the declared framework applies.
  safety_continuity:
    design: prospective_census_from_activation
    include:
      - every denosumab dose due after baseline capture activation
      - every denosumab discontinuation or clinically important delay identified after activation
      - every anabolic or romosozumab completion/transition identified after activation
      - every incident fragility fracture during active osteoporosis therapy identified after activation
    optional_historical_lookback: >-
      Historical GeSY or Heidi material may be used to identify additional safety cases when
      found, but absence from those sources must not be interpreted as proof that no event occurred.
    rationale: >-
      Rare safety-critical events should not wait for a 30-case sample.
  decision_quality:
    design: stratified_subaudit
    target_n: 10
    source: scored_baseline
    selection: >-
      Select cases spanning new assessment, follow-up, high/very-high risk,
      fracture-on-treatment and treatment-transition scenarios where available.
    review_axes:
      - data_sufficiency
      - declared_framework_concordance
      - rationale_quality
      - uncertainty_and_override_documentation
    categories:
      - concordant
      - reasoned_override
      - potentially_improvable
      - unsafe_or_requires_review
  patient_voice:
    design: prospective_consecutive
    target_n: 20
    start: after_patient_feedback_instrument_is_activated
    domains:
      - understanding_condition
      - understanding_plan
      - understanding_rationale
      - concerns_and_preferences_addressed
      - free_text
capture_sources:
  primary:
    clinician_postvisit_form:
      role: clinician_validated_account_of_what_occurred
      timing: immediately_after_encounter_preferred
  supplementary:
    gesy_note:
      role: formal_record_documentation_evidence
      caveat: may_be_incomplete_and_must_not_be_treated_as_full_consultation_truth
    heidi_ai:
      role: optional_documentation_capture_assist
      fields_to_track:
        - used_yes_no
        - output_available_yes_no
        - clinician_reviewed_yes_no
        - material_correction_required_yes_no_unknown
      caveats:
        - ai_output_never_overrides_clinician_validation
        - ai_use_itself_is_not_a_quality_success_metric
        - baseline_comparisons_with_vs_without_ai_are_observational_not_causal
      privacy: >-
        Do not place transcript, patient-identifiable Heidi content or exported clinical notes
        in the public repository. Any clinical use must follow the applicable privacy/consent
        and data-processing requirements.
measurement_axes:
  clinical_process:
    question: what_was_actually_assessed_discussed_decided_or_arranged
    source_priority:
      - clinician_validated_postvisit_form
      - clinician_reviewed_heidi_capture_when_used
      - gesy_note
  documentation_process:
    question: what_is_traceably_present_in_the_formal_clinical_record
    source_priority:
      - gesy_note
      - other_declared_formal_record
  capture_quality:
    question: how_complete_and_reliable_is_the_available_evidence_about_the_encounter
case_classification:
  encounter_type:
    - new_assessment
    - routine_follow_up
    - post_fragility_fracture
    - treatment_start
    - treatment_continuation
    - treatment_transition
    - adverse_effect_or_intolerance
    - fracture_on_treatment
    - other
kpi_case_status:
  allowed:
    - met
    - not_met
    - not_applicable
    - not_assessable
  rules:
    not_applicable: >-
      Exclude from the KPI denominator only when a predefined applicability rule
      shows that the KPI genuinely does not apply.
    not_documented: >-
      For a documentation KPI, if the required item cannot be demonstrated in the formal
      record, classify as not_met. For a clinical-process KPI, a clinician-validated
      post-visit entry may establish that the action occurred even if GeSY documentation is absent.
    not_assessable: >-
      Use only when the relevant information is genuinely inaccessible or cannot be
      verified. Keep it visible as a data-quality/system signal and never count it as met.
target_tiers:
  S:
    label: safety_critical
    provisional_local_target_percent: 100
  A:
    label: essential_core_process
    provisional_local_target_percent: 95
  B:
    label: quality_process
    provisional_local_target_percent: 90
  P:
    label: patient_reported
    provisional_local_target_percent: 85
  note: >-
    These are internal quality targets for this system, not claims that professional
    guidelines mandate these exact percentage thresholds.
reliability_display:
  - denominator: '<5'
    label: descriptive_only
    rule: no_stable_percentage_or_colour_claim
  - denominator: '5-9'
    label: low
  - denominator: '10-19'
    label: provisional
  - denominator: '20-29'
    label: moderate
  - denominator: '>=30'
    label: stronger_baseline_estimate
  safety_exception: >-
    A single safety-critical failure can generate an immediate signal regardless of denominator.
baseline_lock:
  core_requirement: 30 consecutive unique eligible prospectively captured cases after form freeze
  rule_freeze: KPI definitions, form version and sampling logic must be version-frozen before locking
  no_rewriting_history: >-
    Do not recalculate a historical baseline after an intervention merely because a later KPI definition changed;
    version the KPI and preserve the original baseline.
  composite_score: disabled_in_v1
reaudit:
  core: >-
    Re-audit after a material intervention when at least 20 new eligible cases are available,
    aiming for approximately 8-12 weeks; if volume is lower, continue accrual and show denominator.
  safety: continuous
  patient_voice: rolling_blocks_of_20_or_monthly_when_volume_allows
  annual: full_review_of_kpi_dictionary_sources_and_targets
run_chart:
  preferred_unit: monthly_or_rolling_20_eligible_cases
  annotate:
    - intervention_dates
    - guideline_or_kpi_definition_changes
    - major_workflow_changes
    - systematic_ai_documentation_adoption_if_later_introduced
privacy:
  repository: public
  rule: >-
    Commit only schemas, synthetic examples and aggregate/anonymized outputs.
    Real case-level audit data, GeSY content and Heidi outputs must remain in an appropriate
    private/local clinical data store and must not be committed to the public repository.
