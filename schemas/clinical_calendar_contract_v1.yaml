version: clinical-calendar-v1
status: implementation_slice
purpose: >-
  Normalize external appointment sources into the Clinical Excellence system
  without mixing appointment scheduling with clinical CareTasks/reminders.

source_of_truth:
  clinical_feed_source: Cal.com upcoming-booking snapshot normalized by the Digital Secretary backend
  operational_mirror: Setmore may remain a separate Reception sync/mirror; it is not the reason source for this clinical feed
  availability_system: Cal.com
  integration_owner: Digital Secretary backend
  clinical_calendar_owner: Osteoporosis Clinical Excellence system

appointment_categories:
  - osteoporosis_first
  - osteoporosis_review
  - osteoporosis_unspecified
  - prolia
  - aclasta
  - other

relevant_calendar_categories:
  - osteoporosis_first
  - osteoporosis_review
  - osteoporosis_unspecified
  - prolia
  - aclasta

duration_expectations_minutes:
  note: current Digital Secretary behavior; review may be changed later by product owner
  osteoporosis_first: 60
  osteoporosis_review: 40
  aclasta: 60
  prolia: 10

appointment_object:
  required:
    - source
    - source_appointment_id
    - start_at
    - end_at
  optional:
    - clinic
    - category
    - patient_display_name
    - phone_e164
    - linked_patient_id
    - label
    - comment
    - status
  derived_output:
    - reason

classification_rules:
  - explicit medication/service text outranks duration
  - explicit first/review wording outranks duration
  - the visit reason may be recovered from the source comment/notes field
  - duration may refine an already established osteoporosis context only
  - current Secretary mapping: osteoporosis first 60 minutes; osteoporosis review 40 minutes
  - duration alone never establishes osteoporosis because other visit types can share the same duration
  - ambiguous osteoporosis appointments remain osteoporosis_unspecified
  - unknown/unrelated appointments remain other

snapshot_reconciliation:
  endpoint: POST /clinical/calendar/appointments/snapshot
  identity: source + source_appointment_id
  window:
    required:
      - source
      - window_start
      - window_end
    nominal_local_days: 31
    maximum_elapsed: 31d1h
    timezone_compatibility: Asia/Nicosia autumn DST fallback may add one elapsed UTC hour
  maximum_appointments: 2000
  producer_contract:
    - send the complete source view for the declared window, not a partial page
    - include unrelated source appointments in the snapshot so absence has one meaning: no longer present in source truth
    - do not send a snapshot when provider retrieval is partial, failed, or completeness is unknown
    - all appointment rows must use the exact same canonical source as the snapshot
    - every appointment start must be inside the declared window
  consumer_contract:
    - reuse the existing appointment classifier and normalized storage schema
    - upsert relevant rows by source appointment identity
    - remove a previously relevant row if the same source appointment is now unrelated
    - remove stored same-source rows in the declared window when their source appointment id is absent from a complete snapshot
    - never create, cancel, reschedule, authorize, or otherwise mutate a booking
  failure_semantics:
    - invalid or ambiguous snapshot scope is rejected before stale-row reconciliation
    - provider payload completeness remains the producer responsibility
    - an empty complete snapshot is allowed and removes all stored rows for that source/window

reason_transport:
  normalized_field: comment
  clinician_output: reason
  rule: >-
    The Digital Secretary producer places only the normalized human visit reason
    in the existing comment field. Raw Cal.com bookingFieldsResponses are not
    persisted in the Clinical Excellence database.
  field_discovery: >-
    The configured Cal.com identifier/slug for the human visit-reason booking
    field must be inspected from provider configuration/runtime evidence and
    must not be guessed from its display label.
  out_of_scope:
    - changing Reception reason triage
    - changing duration allocation
    - writing canonical visit_reason into Cal.com booking fields
    - AC-4B booking mutation/provider propagation

data_minimization:
  - clinician-facing Calendar returns only relevant_calendar_categories
  - new unrelated appointments are not persisted in the clinical appointment store
  - if a previously relevant source appointment is later classified as unrelated, its stale clinical copy is removed on ingest
  - transport metadata such as clinic/source/cal_uid is not shown as the human visit reason

separation_of_concerns:
  appointment:
    meaning: a scheduled visit or treatment attendance
    examples:
      - osteoporosis consultation
      - Prolia administration appointment
      - Aclasta infusion appointment
  care_task:
    meaning: a clinical action that may exist without an appointment
    examples:
      - pre-treatment laboratory tests due
      - post-treatment monitoring due
      - results review
      - patient notification
      - treatment due/overdue follow-up

security:
  clinician_read_access: CLINICAL_DATA_KEY browser-session authentication
  external_ingest: CLINICAL_INGEST_KEY server-to-server header
  public_repo_rule: never commit appointment/patient data or secret values

next_integration_slice:
  - add the Digital Secretary producer only after this snapshot consumer contract is fixed
  - reuse the existing Cal.com read/normalization path; do not add a second provider reader
  - discover the configured visit-reason booking-field identifier without guessing
  - post only complete bounded snapshots and fail closed on partial provider retrieval
  - add optional patient linking by stable identifier/phone matching with clinician review
  - add CareTask engine separately after appointment feed is live
